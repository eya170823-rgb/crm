# 2026-11-25 대표 지시 — 브리즈 이실장(재등록 + ERP 연결) exe 를 윈도우에서 자동으로 만든다(tools/isj-exe 가 바뀔 때만)
name: isj-exe
on:
  push:
    paths: ['tools/isj-exe/**', '.github/workflows/isj-exe.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller playwright pandas openpyxl lxml
      - run: pyinstaller --noconfirm --onefile --windowed --name BreezeIsj --icon tools/isj-exe/icon.ico --collect-all playwright tools/isj-exe/breeze_isj.py
      - name: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete isj-exe --yes --cleanup-tag || true
          gh release create isj-exe dist/BreezeIsj.exe --title "BreezeIsj" --notes "auto build" --latest=false
