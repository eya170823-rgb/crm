  { key:'문자',    label:'문자 안내문',  auto:false, note:'🔴 발송하지 않습니다' }
];
function mkFacts(o){
  /* 🔴 매물에 실제로 있는 값만 쓴다 */
  var f = [];
  if(o.kind) f.push(['유형', o.kind]);
  if(o.type) f.push(['거래', o.type]);
  var money = adMoney(o); if(money) f.push(['가격', money + '만']);
  if(o.feeAmt) f.push(['관리비', o.feeAmt + '만']);
  if(o.area) f.push(['면적', o.area]);
  if(o.rooms) f.push(['방', o.rooms]);
  if(o.baths) f.push(['욕실', o.baths]);
  if(o.floor) f.push(['층', o.floor + (o.totalFloor ? ('/' + o.totalFloor) : '')]);
  if(o.direction) f.push(['향', o.direction]);
  if(o.parking) f.push(['주차', o.parking]);
  if(o.pets) f.push(['반려동물', o.pets]);
  if(o.options) f.push(['옵션', String(o.options)]);
  if(o.availDate) f.push(['입주', o.availDate]);
  return f;
}
function mkContent(o, ch){
  var nl = String.fromCharCode(10);
  var head = [o.apt, o.addr2].filter(Boolean).join(' ');
  var facts = mkFacts(o);
  var line = facts.map(function(x){ return x[0] + ' ' + x[1]; }).join(' · ');
  var addr = String(o.addr||'').trim();
  var out = {};
  if(ch === '블로그'){
    out.title = head + ' ' + (o.type||'') + ' ' + (adMoney(o)||'') + ' 매물 안내';
    out.body = [
      head + (addr ? (' (' + addr + ')') : ''), '',
      '■ 매물 정보',
      facts.map(function(x){ return '· ' + x[0] + ' : ' + x[1]; }).join(nl), '',
      '■ 안내',
      '· 확인된 내용만 적었습니다. 더 필요한 정보는 문의 주시면 확인해 드립니다.',
      '', '브리즈부동산중개'
    ].join(nl);
  } else if(ch === '인스타'){
    out.title = head + ' ' + (adMoney(o)||'');
    out.body = [
      '[' + head + ']', (o.type||'') + ' ' + (adMoney(o)||'') + '만',
      line, '', '· 자세한 조건은 프로필 링크·문의로',
      '#제주원룸 #' + String(o.apt||'').replace(/\s/g,'') + ' #브리즈부동산중개'
    ].filter(Boolean).join(nl);
    out.cards = facts.slice(0, 5).map(function(x, i){
      return (i+1) + '. ' + x[0] + ' — ' + x[1]; }).join(nl);
  } else if(ch === '릴스'){
    out.title = head + ' ' + (adMoney(o)||'') + ' 둘러보기';
    out.body = [
      '[0~2초] ' + head + ' ' + (o.type||'') + ' ' + (adMoney(o)||'') + '만',
      '[2~6초] ' + (facts[0] ? (facts[0][0] + ' ' + facts[0][1]) : '내부 모습'),
      '[6~12초] ' + facts.slice(1, 4).map(function(x){ return x[0] + ' ' + x[1]; }).join(', '),
      '[12~15초] 문의는 브리즈부동산중개',
      '', '🔴 촬영 전이라면 먼저 사진·영상이 필요합니다.'
    ].join(nl);
    out.thumb = head + nl + (adMoney(o)||'') + '만';
  } else {
    out.title = head + ' 안내';
    out.body = [
      '[브리즈부동산중개]', head + ' ' + (o.type||'') + ' ' + (adMoney(o)||'') + '만',
      line, '자세한 내용 문의 주세요.'
    ].filter(Boolean).join(nl);
  }
  out.missing = [];
  ['area','rooms','baths','floor','direction','availDate'].forEach(function(k){
    if(!String(o[k]||'').trim()) out.missing.push(
      ({area:'면적',rooms:'방 수',baths:'욕실 수',floor:'층',direction:'향',availDate:'입주일'})[k]);
  });
  return out;
}

/* ── 그룹웨어: 오늘 한 일(실데이터) · 할 일 · 결재 ────────────── */
function gwToday(){
  var t = todayStr();
  var inb = DB.inbox || [];
  var L = DB.listings || [];
  var rows = [];
  var todayIn = inb.filter(function(r){ return String(r.when||'').indexOf(t) === 0; });
  if(todayIn.length){
    var by = {};
    todayIn.forEach(function(r){ var s = srcOf(r.kind, r.text); by[s] = (by[s]||0) + 1; });
    rows.push({ when: t, what: '인입 ' + todayIn.length + '건 들어옴',
                detail: Object.keys(by).map(function(k){ return k + ' ' + by[k]; }).join(' · '),
                go: "go('crm','inbox')" });
  }
  L.forEach(function(o){
    if(String(o.recvDate||'').indexOf(t) === 0)
      rows.push({ when: t, what: '매물 접수 ' + o.id,
                  detail: (o.apt||'') + ' ' + (o.addr2||'') + ' · ' + (o.type||'') + ' ' + (adMoney(o)||''),
                  go: "AD_SEL='" + o.id + "';go('ad','admgr')" });
    if(String(o.updatedAt||'').indexOf(t) === 0 && String(o.recvDate||'').indexOf(t) !== 0)
      rows.push({ when: String(o.updatedAt).slice(11,16), what: '매물 수정 ' + o.id,
                  detail: (o.apt||'') + ' ' + (o.addr2||''), go: '' });
  });
  (DB.contracts||[]).forEach(function(c){
    if(String(c.start||'').indexOf(t) === 0)
      rows.push({ when: t, what: '계약 ' + c.id, detail: (c.apt||'') + ' ' + (c.addr2||''),
                  go: "CT_SEL='" + c.id + "';go('deal','contract')" });
  });
  rows.sort(function(a,b){ return String(b.when).localeCompare(String(a.when)); });
  return rows;
}
function gwTodo(){
  var out = [];
  var un = (DB.inbox||[]).filter(function(r){ return !r.reg; }).length;
  if(un) out.push({ n:un, what:'인입 미처리 확인', go:"go('crm','inbox')", cls:'p-warn' });
  var sh = photoTasks().length;
  if(sh) out.push({ n:sh, what:'촬영 필요 매물', go:"go('ops','photo')", cls:'p-bad' });
  var ar = adAll().filter(function(r){ return adLive(r.o); });
  var blocked = ar.filter(function(r){ return r.worst === 'DATA_REQUIRED'; }).length;
  if(blocked) out.push({ n:blocked, what:'광고 필수값 채우기', go:"AD_FILT='';go('ad','admgr')", cls:'p-warn' });
  var ready = ar.filter(function(r){ return r.worst === 'AD_READY'; }).length;
  if(ready) out.push({ n:ready, what:'광고 올릴 수 있는 매물', go:"AD_FILT='ready';go('ad','admgr')", cls:'p-ok' });
  var wait = (APPR||[]).filter(function(a){ return String(a.status||'') === '대기'; }).length;
  if(wait) out.push({ n:wait, what:'결재 대기', go:"go('group','gw')", cls:'p-warn' });
  var ct = DB.contracts || [];
  var bal = ct.filter(function(c){
    var d = ctDaysTo(c.balanceDue);
    return !String(c.balancePaidAt||'').trim() && d !== null && d <= 7; }).length;
  if(bal) out.push({ n:bal, what:'잔금 임박', go:"go('deal','settle')", cls:'p-bad' });
  var dq = 0;
  try{ dq = dqCheck().items.reduce(function(s,x){ return s + x.n; }, 0); }catch(e){}
  if(dq) out.push({ n:dq, what:'손볼 자료', go:"go('data','stat')", cls:'p-warn' });
  return out;
}

/* ── 담당자는 이름이 아니라 staffId(agent 칸) 로 다룬다 ─────────── */
function staffNameOf(id){
  var k = String(id||'').trim();
  if(!k) return '(담당 없음)';
  var s = (STAFF || []).filter(function(x){ return String(x.id) === k; })[0];
  return s ? (String(s.name||'').trim() || k) : k;
}
/* 대표는 전체를 본다. 직원 화면을 붙이기 전까지 ME.id 는 비어 있다. */
function inMyScope(o){
  if(ME.role === 'admin' || !String(ME.id||'').trim()) return true;
  return String(o.agent||'').trim() === String(ME.id).trim();
}

/* ── 고객 조건 매칭 — 🔴 기존 매칭의 네 가지 문제를 고쳤다 ───────
   ① 조건을 안 적었으면 만점을 주지 않는다 → 그 항목을 분모에서 뺀다
   ② 예산을 실제로 본다 (기존에는 가격 비교가 아예 없었다)
   ③ 주거를 찾는 고객에게 상가·사무실·토지를 섞지 않는다
   ④ 지역을 적었는데 주소가 안 맞으면 후보로 올리지 않는다
   그리고 조건이 하나도 없는 고객에게는 아무것도 추천하지 않는다
   (예전에는 조건이 비어 있을수록 점수가 높아져 엉뚱한 매물이 1등이었다). */
var CU_BIZ_KIND = ['상가','사무실','건물','공장','창고','토지'];
function cuIsBiz(kind){
  var s = String(kind||'');
  return CU_BIZ_KIND.some(function(k){ return s.indexOf(k) >= 0; });
}
function cuNum(v){
  var s = String(v==null?'':v).replace(/[^0-9.]/g, '');
  return s ? Number(s) : 0;
}
function cuRentish(t){
  var s = String(t||'');
  return s.indexOf('월세') >= 0 || s.indexOf('연세') >= 0 || s.indexOf('단기') >= 0;
}
/* 임대는 보증금 + 월세×12 로 견준다. 같은 잣대를 매물·예산 양쪽에 똑같이 쓴다. */
function cuCost(o){
  var p = cuNum(o.price), r = cuNum(o.rentAmt);
  return String(o.type||'') === '매매' ? p : (p + r * 12);
}
function cuRegions(c){
  return String(c.region||'').split(/[,\/\s]+/).map(function(s){ return s.trim(); })
    .filter(function(s){ return s.length >= 2; });
}
/* 고객이 실제로 적어 둔 조건이 몇 개인지 — 0이면 추천하지 않는다 */
function cuSpecs(c){
  var n = 0;
  if(String(c.type||'').trim()) n++;
  if(String(c.propType||'').trim()) n++;
  if(cuRegions(c).length) n++;
  if(cuNum(c.budget)) n++;
  return n;
}
function cuMatch(c){
  var wantType = String(c.type||'').trim();
  var wantKind = String(c.propType||'').trim();
  var regions  = cuRegions(c);
  var budget   = cuNum(c.budget);
  if(!cuSpecs(c)) return [];            /* 🔴 조건이 없으면 빈 손으로 돌려준다 */

  return (DB.listings || []).map(function(l){
    /* ── 하드 필터: 여기서 걸리면 후보가 아니다 ── */
    if(!adLive(l)) return null;                                 /* 계약완료·임대중·보류 */
    if(String(l.status||'') !== '접수') return null;            /* 거래 가능한 것만 */
    if(wantType){
      var same = (String(l.type||'') === wantType);
      var both = cuRentish(wantType) && cuRentish(l.type);
      if(!same && !both) return null;                           /* 매매↔임대 교차 금지 */
    }
    /* ③ 주거를 찾는 고객에게 상가·토지를 섞지 않는다 */
    if(!cuIsBiz(wantKind) && cuIsBiz(l.kind)) return null;
    /* 종류를 적었으면 그 종류만 — '원룸'은 '오픈형 원룸'에 들어가므로 통과한다 */
    if(wantKind && String(l.kind||'').indexOf(wantKind) < 0) return null;
    /* ④ 지역을 적었으면 그 지역만 */
    if(regions.length){
      var addr = String(l.addr||'') + ' ' + String(l.apt||'') + ' ' + String(l.addr2||'');
      var hit = regions.some(function(r){ return addr.indexOf(r) >= 0; });
      if(!hit) return null;
    }

    /* ── 점수: 🔴 고객이 적은 조건만 분모에 넣는다 ── */
    var got = 0, max = 0, why = [];
    if(wantType){ max += 30; got += 30; why.push('거래유형 ' + wantType); }
    if(wantKind){ max += 20; got += 20; why.push('종류 ' + wantKind); }
    if(regions.length){ max += 25; got += 25; why.push('지역 맞음'); }
    if(budget){
      max += 25;
      var cost = cuCost(l);
      if(!cost){ got += 6; why.push('🔴 가격이 비어 있어 예산을 못 봅니다'); }
      else if(cost <= budget){ got += 25; why.push('예산 안'); }
      else if(cost <= budget * 1.2){ got += 12; why.push('예산보다 조금 비쌈'); }
      else return null;                    /* ② 20% 넘게 비싸면 제안하지 않는다 */
    }
    return { l:l, pct: Math.round(got * 100 / max), why: why };
  }).filter(Boolean).sort(function(a, b){
    if(b.pct !== a.pct) return b.pct - a.pct;
    return cuCost(a.l) - cuCost(b.l);       /* 같은 점수면 싼 것 먼저 */
  });
}
/* 왜 추천이 없는지 사람 말로 */
function cuWhyNone(c){
  if(!cuSpecs(c)) return '희망 조건(거래유형·종류·지역·예산)이 한 칸도 없습니다 — ' +
    '조건이 없으면 추천하지 않습니다. 아무 매물이나 1등으로 올라오던 옛 방식을 막았습니다.';
  var live = (DB.listings||[]).filter(function(l){
    return adLive(l) && String(l.status||'') === '접수'; }).length;
  if(!live) return '지금 거래 가능한(접수) 매물이 없습니다.';
  return '조건에 맞는 매물이 없습니다 — 조건을 넓히거나 매물을 더 확보해야 합니다.';
}

/* ── 재접촉 대상 ─────────────────────────────────────────────────
   종료 고객 제외 · 연락금지 제외 · 담당 밖 제외. */
function cuBlocked(c){
  var t = String(c.note||'') + ' ' + String(c.progressStatus||'');
  return t.indexOf('연락금지') >= 0 || t.indexOf('수신거부') >= 0;
}
function reContact(){
  return (DB.customers || []).filter(function(c){
    if(String(c.progressStatus||'').trim() === '종료') return false;
    if(cuBlocked(c)) return false;
    if(!inMyScope(c)) return false;
    return true;
  }).map(function(c){
    var d = ctDaysTo(c.nextAction);
    var ms = cuMatch(c);
    return { c:c, d:d,
             due: (d !== null && d <= 0),
             noPlan: !String(c.nextAction||'').trim(),
             top: ms.slice(0, 3), n: ms.length };
  }).sort(function(a, b){
    var ka = (a.d === null ? 9000 : a.d), kb = (b.d === null ? 9000 : b.d);
    if(ka !== kb) return ka - kb;
    return b.n - a.n;
  });
}

/* ═══ 월요일 실행 도구 ═══════════════════════════════════════════
   🔴 여기 있는 어느 것도 전화를 걸거나 문자를 보내지 않는다.

/* ── ① 🔴 '계약완료 문자' 와 매물장이 어긋나는 것 ────────────────
   서버가 임대완료 문자를 알아보고 인입함에 ⚠️ 로 넣어 둔다.
   그 호실이 우리 매물장에 아직 '접수' 로 있으면 헛걸음하게 된다. */
var DONE_MARK = '임대완료 문자';
/* 🔴 한 문자에 호실이 여럿 나오면 **호실마다 그 뒤 문구를 따로** 본다.
   "301호는 계약됐구요! 402호는 남아있어요~" 에서 402호까지 계약완료로 보면
   아직 살아 있는 방을 죽인다(2026-09-12 실측으로 잡은 오판). */
var DONE_SAY = ['계약완료', '계약 완료', '계약됐', '계약 됐', '계약되었', '계약 되었',
                '나갔', '마감', '임대완료', '임대 완료', '계약이 진행', '계약진행중'];
var STILL_SAY = ['남아', '남았', '있어요', '있습니다', '가능', '공실', '비어', '퇴실 예정',
                 '퇴실예정', '입주'];
/* 🔴 한 문장을 호실마다 쪼개는 일은 **여기 한 곳에서만** 한다.
   doneUnits(계약완료 목록) 와 statusHintOf(호실별 최신상태) 가 같은 결과를 쓴다 —
   두 군데서 따로 판정하면 언젠가 서로 어긋난다. */
function unitSpans(t){
  var s2 = String(t || ''), pos = [], i = 0;
  while(i < s2.length){
    var j = s2.indexOf('호', i);
    if(j < 0) break;
    var k = j - 1, num = '';
    while(k >= 0){
      var c = s2.charCodeAt(k);
      if(c >= 48 && c <= 57){ num = s2.charAt(k) + num; k--; }
      else break;
    }
    if(num.length >= 3 && num.length <= 4) pos.push({ u:num + '호', at:k + 1, end:j + 1 });
    i = j + 1;
  }
  for(var m = 0; m < pos.length; m++){
    pos[m].seg = s2.slice(pos[m].end, (m + 1 < pos.length) ? pos[m + 1].at : s2.length);
  }
  return pos;
}
function sayHas(seg, list){
  for(var n = 0; n < list.length; n++) if(String(seg || '').indexOf(list[n]) >= 0) return true;
  return false;
}
/* 그 호실 한 칸만 보고 'DONE'(계약완료) · 'STILL'(아직 있음) · '' 를 돌려준다 */
function unitSay(t, unit){
  var s2 = String(t || ''), pos = unitSpans(s2), u = sq(unit);
  for(var m = 0; m < pos.length; m++){
    if(sq(pos[m].u) !== u) continue;
    var isDone = sayHas(pos[m].seg, DONE_SAY), isStill = sayHas(pos[m].seg, STILL_SAY);
    /* 그 호실 뒤에 아무 말이 없으면(앞에 몰아서 쓴 문장) 문장 전체를 본다 */
    if(!isDone && !isStill) isDone = sayHas(s2, DONE_SAY);
    if(isStill) return 'STILL';
    return isDone ? 'DONE' : '';
  }
  return '';
}
function doneUnits(t){
  var s2 = String(t || ''), pos = unitSpans(s2), out = [];
  for(var m = 0; m < pos.length; m++){
    if(unitSay(s2, pos[m].u) === 'DONE' && out.indexOf(pos[m].u) < 0) out.push(pos[m].u);
  }
  return out;
}
/* 같은 호실에 여러 문자가 있을 때 **가장 최근 직접근거** 만 쓴다.
   rows 는 {when, text} 꼴. 🔴 문장 전체 상태를 한 번에 적용하지 않는다. */
function statusHintOf(rows, unit){
  var best = null;
  (rows || []).forEach(function(r){
    var say = unitSay(r.text, unit);
    if(!say) return;
    var wn = String(r.when || '');
    if(!best || wn > best.when) best = { when:wn, say:say, text:String(r.text || '') };
  });
  if(!best) return { code:'UNKNOWN', when:'', text:'', why:'그 호실을 직접 말한 문자가 없습니다' };
  if(best.say === 'DONE')
    return { code:'CONTRACT_DONE', when:best.when, text:best.text,
             why:'가장 최근 직접근거가 계약완료이고 그 뒤에 "있다"는 말이 없습니다' };
  var soon = sayHas(best.text, ['퇴실 예정', '퇴실예정']);
  return { code: soon ? 'MOVEOUT_SOON' : 'AVAILABLE', when:best.when, text:best.text,
           why:'가장 최근 직접근거가 ' + (soon ? '퇴실 예정' : '아직 있다') + ' 입니다' };
}
function doneAlerts(){
  var inb = DB.inbox || [], seen = {}, out = [];
  inb.forEach(function(r){
    var t = String(r.text || '');
    if(t.indexOf(DONE_MARK) < 0) return;
    var when = String(r.when || '');
    var key = when.slice(0, 16) + '|' + sq(t).slice(0, 40);
    if(seen[key]) return;
    seen[key] = 1;
    var ph = phDigits(r.phone);
    /* 🔴 칸에 번호가 여러 개면 그 중 하나만 맞아도 같은 사람이다 */
    var ld = (DB.landlords || []).filter(function(l){ return phHas(l.phone, r.phone); })[0] || null;
    var units = doneUnits(t);
    var hits = [];
    (DB.listings || []).forEach(function(o){
      if(String(o.status || '') !== '접수' && String(o.status || '') !== '상담중') return;
      var u = sq(o.addr2);
      if(!u || units.indexOf(u) < 0 && units.map(sq).indexOf(u) < 0) return;
      var apt = sq(o.apt), lapt = sq((ld || {}).apt);
      var same = !!lapt && (apt === lapt || apt.indexOf(lapt) >= 0 || lapt.indexOf(apt) >= 0);
      var inbody = !!apt && sq(t).indexOf(apt) >= 0;
      if(same || inbody)
        hits.push({ o:o, why: same ? '임대인 건물이 같습니다' : '문자에 건물 이름이 있습니다' });
    });
    if(hits.length)
      out.push({ when:when, mask:phMask(r.phone), land:(ld || {}).name || '',
                 units:units, hits:hits, text:t, reg:String(r.reg || '') });
  });
  return out.sort(function(a, b){ return String(b.when).localeCompare(String(a.when)); });
}
/* 그 매물이 '계약완료 문자' 와 어긋나는가 */
function doneConflict(o){
  var id = String(o && o.id || '');
  var all = doneAlerts();
  for(var i = 0; i < all.length; i++)
    for(var j = 0; j < all[i].hits.length; j++)
      if(String(all[i].hits[j].o.id) === id) return all[i];
  return null;
}

function monArea2(o){
  var a = String(o.addr || '') + String(o.apt || '');

function shootTop(n){

  var out = photoTasks().filter(function(x){ return inMyScope(x.o); }).map(function(x){
    var o = x.o, miss = adMissingAll(o), sc = 0, det = [];
    if(!miss.length){ sc += 40; det.push('🔴 사진만 있으면 바로 광고 가능'); }
    else if(miss.length === 1){ sc += 25; det.push('빠진 칸이 ' + miss[0] + ' 하나뿐'); }
    else if(miss.length === 2){ sc += 12; det.push('빠진 칸 2개'); }
    if(String(o.price || '').trim() && String(o.addr2 || '').trim()){
      sc += 15; det.push('가격·호실 명확'); }
    var ld = ldOfListing(o);
    if(ld && phDigits(ld.phone)){ sc += 15; det.push('임대인 연락처 있음'); }
    var ar = monArea2(o);
    if(ar){ sc += 15; det.push(ar); }
    if(monRoom(o)){ sc += 10; det.push('원·투룸'); }
    var ago = monDaysSince(o.recvDate);
    if(ago !== null && ago <= 14){ sc += 10; det.push('접수 ' + ago + '일'); }
    var cf = conf[String(o.id)];
    if(cf){ sc -= 70; det.push('🔴 임대인이 “계약완료” 문자를 보냈습니다'); }
    return { o:o, ph:x.ph, score:sc, det:det, miss:miss, conflict:cf || null,
             ld:ld, ago:ago, readyAfter: miss.length === 0 };
  }).filter(function(x){ return !x.conflict; });
  out.sort(function(a, b){ return b.score - a.score; });
  return out.slice(0, n || 5);
}

/* 매물의 임대인 — 건물 이름으로 찾고, 가장 최근에 연락한 사람을 쓴다 */
function ldOfListing(o){

}

/* ═══ 재오픈 검토 ═══════════════════════════════════════════════
   종료된 고객에게 **그 뒤로** 새 연락이 오면, 종료를 풀지 않고 '검토 후보'로만 올린다.
   🔴 자동으로 종료를 해제하지 않는다 · 🔴 고객을 새로 만들지 않는다 · 🔴 문자를 보내지 않는다.
   실제 상태 변경은 [다시 상담 시작] 을 눌렀을 때만 일어난다. */
function phDigits(v){
  var t = String(v == null ? '' : v), out = '';
  for(var i = 0; i < t.length; i++){
    var c = t.charCodeAt(i);
    if(c >= 48 && c <= 57) out += t.charAt(i);
  }
  if(out.length >= 11 && out.slice(0, 2) === '82') out = '0' + out.slice(2);
  return out;
}
/* 🔴 전화 칸에 번호가 여러 개 들어 있는 일이 흔하다
   (실측 2026-09-12: 임대인 4,075명 중 433명 = 10.6%).
     예) 한 칸에 "010-****-**36, 010-****-**66, 010-****-**71, 010-****-**89" 처럼 넷이 적혀 있다
   숫자를 다 이어붙여 비교하면 **한 번호도 못 맞춘다.** 실제로 에코 드 파리 218호
   계약완료 문자가 임대인과 못 이어져 '어긋남' 목록에서 빠졌다.
   그래서 칸에서 번호를 하나하나 뽑아 쓴다. */
var PH_RE = /0\d{1,2}[-.\s]?\d{3,4}[-.\s]?\d{4}/g;
function phAll(v){
  var t = String(v == null ? '' : v), out = [], m;
  PH_RE.lastIndex = 0;
  while((m = PH_RE.exec(t)) !== null){
    var d = phDigits(m[0]);
    if(d.length >= 9 && d.length <= 11 && out.indexOf(d) < 0) out.push(d);
  }
  if(!out.length){
    var d2 = phDigits(t);
    if(d2.length >= 9 && d2.length <= 11) out.push(d2);
  }
  return out;
}
function phFirst(v){ var a = phAll(v); return a.length ? a[0] : ''; }
/* 맞추는 기준은 뒤 8자리 — 시트가 010 의 앞 0 을 떨구기 때문이다(1026010110).
   GAS inboxPhoneKey_ 가 쓰는 규칙과 같게 맞췄다. */
function phKey(v){
  var d = phDigits(v);
  return d.length >= 8 ? d.slice(-8) : '';
}
function phHas(cell, target){
  var t = phKey(target);
  if(!t) return false;
  var a = phAll(cell);
  for(var i = 0; i < a.length; i++) if(phKey(a[i]) === t) return true;
  return false;
}
function phMask(v){
  var d = phFirst(v) || phDigits(v);
  return d.length >= 4 ? ('***' + d.slice(-4)) : '***';
}
/* 고객이 무언가를 원한다는 신호 */
var RO_WANT = ['방문', '보러', '보고싶', '방 보', '이사', '퇴실', '위약금', '해지', '계약',
               '입주', '월세', '전세', '보증금', '구하', '알아보', '문의', '연장', '재계약',
               '전화', '통화', '가능할까', '될까요', '있을까요'];
/* 광고·안내 문자는 고객 의도가 아니다 */
var RO_AD = ['[Web발신]', '광고', '무료체험', '수신거부', '이벤트', '할인행사', '가입',
             '인증번호', '승인번호', '결제', '고객센터', '안내드립니다', '스팸'];
function reopenIntent(kind, t){
  var k = String(kind || '');
  if(k === '통화녹음') return '전화가 왔습니다';
  if(k === '부재중전화') return '부재중 전화가 있었습니다';
  var v = String(t || '');
  if(!v.trim()) return '';
  for(var i = 0; i < RO_AD.length; i++)
    if(v.indexOf(RO_AD[i]) >= 0) return '';                 /* 광고성 — 재오픈 아님 */
  for(var j = 0; j < RO_WANT.length; j++)
    if(v.indexOf(RO_WANT[j]) >= 0)
      return '“' + RO_WANT[j] + '” 이야기가 나왔습니다';
  return '';
}
function reopenReview(){
  var cs = (DB.customers || []).filter(function(c){
    return String(c.progressStatus || '').trim() === '종료'; });
  if(!cs.length) return [];
  var inb = DB.inbox || [];
  return cs.map(function(c){
    var ph = phDigits(c.phone);
    if(!ph) return null;
    /* 🔴 '종료 이후' 의 기준 — 시트에 종료한 날이 없어 접수일(recvDate)을 쓴다.
       같은 날 것은 상담 중에 오간 것이므로 넣지 않는다. */
    var base = String(c.recvDate || '').slice(0, 10);
    var hits = [], seen = {};
    inb.forEach(function(r){
      if(!phHas(c.phone, r.phone)) return;   /* 🔴 고객 칸에도 번호가 여러 개일 수 있다 */
      var when = String(r.when || '');
      if(base && when.slice(0, 10) <= base) return;
      var t = String(r.text || '');
      /* '문자수신' 과 '문자수신(백업)' 이 같은 것을 두 줄로 넣는다 — 하나로 본다 */
      var key = when.slice(0, 16) + '|' + sq(t).slice(0, 40);
      if(seen[key]) return;
      seen[key] = 1;
      var kind = srcOf(r.kind, t);
      var why = reopenIntent(kind, t);
      if(!why) return;
      hits.push({ when:when, kind:kind, text:t, why:why, bld:String(r.bld || '') });
    });
    if(!hits.length) return null;
    hits.sort(function(a, b){ return String(b.when).localeCompare(String(a.when)); });
    var bld = '';
    for(var i = 0; i < hits.length; i++){ if(hits[i].bld){ bld = hits[i].bld; break; } }
    return { c:c, hits:hits, last:hits[0], bld:bld, blocked:cuBlocked(c),
             days:(function(){ var d = ctDaysTo(String(hits[0].when).slice(0, 10));
                               return d === null ? null : -d; })() };
  }).filter(Boolean).sort(function(a, b){
    return String(b.last.when).localeCompare(String(a.last.when)); });
}

    '🔴 다른 칸(조건·예산·메모)은 건드리지 않습니다.',
    '', '이대로 바꿀까요?'].filter(function(x){ return x !== ''; }).join(nl);
  if(!confirm(msg)) return;

  /* 🔴 저장 직전에 다시 읽는다 — 그 사이 누가 바꿨을 수 있다 */

          '화면을 새로 읽고 다시 하세요.'); return; }

  var obj = JSON.parse(JSON.stringify(row));   /* 🔴 전체 행을 보낸다(부분 저장은 나머지를 지운다) */
  obj.progressStatus = '진행중';
  obj.nextAction = today;
  try{
    await erpUpsert('customers', obj);
    var g2 = await jget({ action:'getAll', type:'customers' });
    DB.customers = g2.data || g2.result || [];
    var now = (DB.customers || []).filter(function(x){ return String(x.id) === String(id); })[0];
    var ok = now && String(now.progressStatus || '') === '진행중';
    route();
    alert([ ok ? '바꿨습니다 ✓' : '🔴 다시 읽었더니 그대로입니다 — 확인이 필요합니다', '',
      String(c.name || '') + ' · 진행상태 ' + String((now || {}).progressStatus || '') +
      ' · 다음 연락 ' + String((now || {}).nextAction || ''), '',
      ok ? '이제 고객 명부와 재접촉 목록에 나옵니다.' +
           (cuSpecs(now || {}) ? '' : nl + '🔴 희망 조건이 비어 있어 추천 매물은 아직 안 나옵니다 — 조건을 채워 주세요.')
         : ''].filter(function(x){ return x !== ''; }).join(nl));

/* ── 오늘 반드시 할 일 3개 ───────────────────────────────────────

function top3(){

    if(dSt !== null && dSt >= 0 && dSt <= 3)
      out.push({ rank:1, w:dSt + 0.1,
        what:'계약 ' + (dSt === 0 ? '오늘입니다' : ('D-' + dSt)), who: who,
        why:'서류가 다 모였는지 먼저 보세요.',
        go:"CT_SEL='" + c.id + "';CT_TAB='필요서류';go('deal','contract')" });
    if(dEnd !== null && dEnd >= 0 && dEnd <= 30)
      out.push({ rank:1, w:50 + dEnd,
        what:'만기 D-' + dEnd, who: who,
        why:'재계약인지 새로 놓을지 오늘 정해야 광고가 늦지 않습니다.',
        go:"CT_SEL='" + c.id + "';go('deal','contract')" });

  reContact().forEach(function(r){

  if(ready.length)
    out.push({ rank:3, w:-100,
      what:'광고 올릴 매물 ' + ready.length + '건',
      who: ready.slice(0,2).map(function(r){
             return String((r.o.apt||'') + ' ' + (r.o.addr2||'')).trim(); }).join(' · '),
      why:'사진과 필수값이 다 갖춰졌습니다. 올리면 바로 문의가 옵니다.',
      go:"AD_FILT='ready';go('ad','admgr')" });

  var shoot = photoTasks().filter(function(x){
    return String(x.o.status||'') === '접수' && inMyScope(x.o); });
  if(shoot.length)
    out.push({ rank:3, w:-90,

/* ═══════════════════════════════════════════════════════════════════
   월요일 영업용 ② — 광고 2차: 실제 이력 읽기 · 복사/내보내기 · 게시 기록 · 담당 지정
   🔴 외부 채널에 자동으로 올리지 않는다. 사람이 올리고, 여기에 '올렸다'고 적는다.
   ═══════════════════════════════════════════════════════════════════ */

/* ── ① 시트에 이미 쌓여 있는 광고 이력을 읽는다 ─────────────────
   시트에는 ads 라는 칸이 없다. 기존 화면이 adsFlat 한 칸에
     "daangn~번호~날짜~주소|blog~~날짜~"
   처럼 눌러 담아 왔다. 그 규격 그대로 풀고, 되돌려 쓸 때도 그대로 담는다. */
function adsRestore(o){
  if(!o || (o.ads && Object.keys(o.ads).length)) return o;
  o.ads = {};
  String(o.adsFlat||'').split('|').filter(Boolean).forEach(function(s){
    var a = s.split('~'), k = a[0];
    if(AD_CH.some(function(c){ return c.key === k; }))
      o.ads[k] = { on:true, no:a[1]||'', at:a[2]||'', url:a[3]||'', chk:'' };
    /* 🔴 내림 기록 — 시트에 새 칸을 만들지 않고 adsFlat 한 칸 안에 넣는다.
       'blogreq~' 처럼 접두어를 달리 쓰는 방식이 이미 있어 그 규약을 따랐다.
       형식: off:<채널>~게시번호~내린날~확인자 */
    else if(k.indexOf('off:') === 0){
      var ok2 = k.slice(4);
      if(AD_CH.some(function(c){ return c.key === ok2; })){
        o.adsOff = o.adsOff || {};
        o.adsOff[ok2] = { no:a[1]||'', at:a[2]||'', by:a[3]||'' };
      }
    }
    else if(k === 'blogreq'){
      o.ads.blog = o.ads.blog || { on:false, no:'', at:'', url:'', chk:'' };
      o.ads.blog.req = a[1]||'';
    }
  });
  if(!o.ads.naver && String(o.naverUrl||'').trim())
    o.ads.naver = { on:true, no:'', at:'', url:String(o.naverUrl), chk:'' };
  if(!o.ads.daangn && String(o.daangnNo||'').trim())
    o.ads.daangn = { on:true, no:String(o.daangnNo), at:'', url:'', chk:'' };
  return o;
}
function adsFlatten(o){
  var parts = [];
  AD_CH.forEach(function(c){
    var a = adOf(o, c.key);
    if(a && a.on) parts.push([c.key, a.no||'', a.at||'', a.url||''].join('~'));
  });
  /* 🔴 내린 기록은 그 채널이 꺼져 있을 때만 남긴다(다시 올리면 지운다) */
  AD_CH.forEach(function(c){
    var f = (o.adsOff || {})[c.key];
    if(f && !adOn(o, c.key))
      parts.push(['off:' + c.key, f.no || '', f.at || '', f.by || ''].join('~'));
  });
  var bq = adOf(o, 'blog');
  if(bq && bq.req && !adOn(o, 'blog')) parts.push(['blogreq', bq.req].join('~'));
  o.adsFlat = parts.join('|');
  o.adList = AD_CH.filter(function(c){ return adOn(o, c.key); })
                  .map(function(c){ return c.label; }).join(',');
  o.daangnNo = (adOf(o, 'daangn') || {}).no || '';
  var nv = adOf(o, 'naver');
  if(nv && nv.url) o.naverUrl = nv.url;
  /* 🔴 네이버를 내렸는데 naverUrl 이 남아 있으면 adsRestore 가 도로 살려 낸다(실측).
     내렸으면 그 칸도 비운다 — 그래야 새로 고쳐도 내려간 채로 있다. */
  else if(!nv) o.naverUrl = '';
  return o;
}
function adsOffOf(o, k){ return (o && o.adsOff && o.adsOff[k]) || null; }

/* ── ② 복사 — 타이핑을 없앤다 ──────────────────────────────────── */
function copyText(s, msg){
  var ta = document.createElement('textarea');
  ta.value = String(s == null ? '' : s);
  ta.setAttribute('readonly', 'readonly');
  ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
  document.body.appendChild(ta);
  ta.select();
  try{ ta.setSelectionRange(0, ta.value.length); }catch(e){}
  var ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){ ok = false; }
  document.body.removeChild(ta);
  alert(ok ? (msg || '복사했습니다 ✓')
           : '복사하지 못했습니다 — 화면의 글을 직접 끌어서 복사해 주세요.');
  return ok;
}
function adFind(id){
  return (DB.listings||[]).filter(function(x){ return String(x.id) === String(id); })[0] || null;
}
function adCopyOne(id, ch, part){
  var o = adFind(id); if(!o) return;
  var cp = adCopy(o, ch), nl = String.fromCharCode(10);
  var lab = (AD_CH.filter(function(c){ return c.key === ch; })[0] || {}).label || ch;
  if(part === 'title') return copyText(cp.title, lab + ' 제목을 복사했습니다 ✓');
  if(part === 'body')  return copyText(cp.body,  lab + ' 본문을 복사했습니다 ✓');
  copyText(cp.title + nl + nl + cp.body, lab + ' 제목·본문을 복사했습니다 ✓');
}
/* 채널 입력폼에 옮겨 적을 값 — 🔴 CRM 내부 메모(note)는 절대 싣지 않는다 */
var AD_FORM_COMMON = [
  ['매물유형','kind'], ['거래유형','type'], ['보증금/매매가(만원)','price'], ['월세(만원)','rentAmt'],
  ['주소','addr'], ['상세주소','addr2'], ['면적(㎡)','area'], ['방 수','rooms'], ['욕실 수','baths'],
  ['층','floor'], ['총 층','totalFloor'], ['향','direction'], ['입주가능일','availDate'],
  ['관리비 유형','feeType'], ['총 관리비(만원)','feeAmt'], ['관리비 포함항목','feeItems'],
  ['주차','parking'], ['반려동물','pets'], ['대출','loan'], ['옵션','options'], ['건축년도','aprDate']
];
function adFormRows(o){
  return AD_FORM_COMMON.map(function(f){
    var v = o[f[1]];
    if(Array.isArray(v)) v = v.join(', ');
    return [f[0], String(v == null ? '' : v).trim()];
  });
}
function adCopyForm(id, ch){
  var o = adFind(id); if(!o) return;
  var nl = String.fromCharCode(10);
  var lab = (AD_CH.filter(function(c){ return c.key === ch; })[0] || {}).label || ch;
  var rows = adFormRows(o);
  var miss = rows.filter(function(r){ return !r[1]; }).map(function(r){ return r[0]; });
  var cp = adCopy(o, ch);
  var body = [lab + ' 입력용 — ' + String((o.apt||'') + ' ' + (o.addr2||'')).trim(), ''].concat(
    rows.map(function(r){ return r[0] + ': ' + (r[1] || '(비어 있음)'); }),
    ['', '[제목] ' + cp.title, '', '[설명]', maskSecret(String(o.desc||'')) || '(비어 있음)']
  ).join(nl);
  copyText(body, lab + ' 입력표를 복사했습니다 ✓' + nl +
    (miss.length ? ('🔴 비어 있는 칸 ' + miss.length + '개: ' + miss.slice(0,6).join(' · ')) : '빈 칸 없습니다'));
}
/* 지금 화면 목록을 표로 — 🔴 당근 일괄업로드 파일이 아니다(그건 기존 화면이 만든다) */
function adCopyList(rows){
  var t = String.fromCharCode(9), nl = String.fromCharCode(10);
  var head = ['매물번호','건물','호실'].concat(AD_FORM_COMMON.map(function(f){ return f[0]; }));
  var body = rows.map(function(r){
    return [r.o.id, r.o.apt||'', r.o.addr2||''].concat(
      adFormRows(r.o).map(function(x){ return x[1]; })
    ).map(function(v){
      return String(v==null?'':v).split(nl).join(' ').split(t).join(' ');
    }).join(t);
  });
  if(!body.length){ alert('지금 목록에 매물이 없습니다.'); return; }
  copyText([head.join(t)].concat(body).join(nl),
    rows.length + '건을 표로 복사했습니다 ✓' + nl +
    '엑셀에 붙여 넣으면 칸이 나뉩니다.' + nl +
    '🔴 이것은 손입력용 참고표입니다 — 당근 일괄업로드 파일은 기존 CRM 화면에서 만듭니다.');
}

/* ── ③ 게시 기록 — 이력이 실제로 쌓이게 ────────────────────────
   🔴 여기서 외부에 올리지 않는다. 사람이 올린 뒤 '올렸다'고 적는 곳이다.
   🔴 규칙 9: 시트 행은 전체 객체로 보낸다(부분 객체는 나머지 칸을 지운다). */
var AD_SAVING = false;
async function adMark(id, ch, on){
  var nl = String.fromCharCode(10);
  if(AD_SAVING){ alert('저장 중입니다'); return; }
  var lab = (AD_CH.filter(function(c){ return c.key === ch; })[0] || {}).label || ch;
  /* 🔴 저장 직전에 매물 자료를 다시 읽는다 — 그 사이 누가 바꿨을 수 있다 */
  var fresh;
  try{
    var g = await jget({ action:'getAll', type:'listings' });
    fresh = (g.data || g.result || []).map(adsRestore);
  }catch(e){ alert('매물 자료를 다시 읽지 못해 저장하지 않습니다: ' + (e && e.message || e)); return; }
  var row = fresh.filter(function(x){ return String(x.id) === String(id); })[0];
  if(!row){ alert('매물을 찾지 못했습니다 — 저장하지 않습니다.'); return; }
  var mine = adFind(id);
  if(mine && String(row.status||'') !== String(mine.status||'')){
    alert('그 사이 매물 상태가 ' + (mine.status||'') + ' → ' + (row.status||'') +
      ' 로 바뀌었습니다.' + nl + '화면을 새로 읽고 다시 하세요.'); return; }

  var was = adOf(row, ch);
  if(on && was && was.on){ alert(lab + ' 은 이미 게시 중으로 적혀 있습니다.'); return; }
  if(!on && !(was && was.on)){ alert(lab + ' 은 게시 중이 아닙니다.'); return; }

  var no = '', at = todayStr();
  if(on){
    no = String(prompt(lab + ' 에 올린 글 번호·링크가 있으면 적어 주세요 (없으면 비워 두세요)', '') || '').trim();
    if(no.length > 200){ alert('너무 깁니다 — 200자 안으로 적어 주세요.'); return; }
    if(hasSecret(no)){ alert('🔴 비밀번호로 보이는 내용이 있습니다 — 적지 않습니다.'); return; }
  }
  var msg = [ (on ? (lab + ' 에 올렸다고 적습니다') : (lab + ' 에서 내렸다고 적습니다')), '',
    '매물   ' + row.id + '  ' + (row.apt||'') + ' ' + (row.addr2||''),
    '상태   ' + (row.status||''),
    on ? ('올린 날 ' + at) : ('지금까지 올린 날 ' + ((was && was.at) || '-')),
    on && no ? ('번호   ' + no) : '',
    on ? '' : ('내린 날 ' + at + ' · 확인자 ' + String(ME.name || ME.id || '대표')),
    '', '🔴 이 버튼은 실제로 광고를 올리거나 내리지 않습니다.',
    '🔴 대표님이 채널에서 직접 한 일을 여기에 적어 두는 것입니다.',
    '', '이대로 적을까요?'].filter(function(x){ return x !== ''; }).join(nl);
  if(!confirm(msg)) return;

  var obj = JSON.parse(JSON.stringify(row));
  obj.ads = obj.ads || {};
  obj.adsOff = obj.adsOff || {};
  if(on){
    obj.ads[ch] = { on:true, no:no, at:at, url:'', chk:adHash(adSnapshot(obj)) };
    delete obj.adsOff[ch];              /* 다시 올렸으면 내림 기록은 지운다 */
  } else {
    /* 🔴 내리기 전에 올려 뒀던 번호·날짜를 남긴다 — 안 남기면 언제 뭘 올렸는지 사라진다 */
    obj.adsOff[ch] = { no:(was && was.no) || '', at:at,
                       by:String(ME.name || ME.id || '대표') };
    delete obj.ads[ch];
  }
  adsFlatten(obj);
  delete obj.ads;                       /* 시트에는 ads 칸이 없다 — adsFlat 으로만 보낸다 */
  delete obj.adsOff;

  AD_SAVING = true;
  try{
    await erpUpsert('listings', obj);
    var g2 = await jget({ action:'getAll', type:'listings' });
    var after = (g2.data || g2.result || []).map(adsRestore);
    DB.listings = after;
    var now = after.filter(function(x){ return String(x.id) === String(id); })[0];
    var okNow = on ? adOn(now, ch) : !adOn(now, ch);
    AD_SAVING = false;
    route();
    alert([ okNow ? '적었습니다 ✓' : '🔴 다시 읽었더니 그대로입니다 — 확인이 필요합니다', '',
      row.id + ' · ' + lab,
      '지금 광고 표기: ' + (String(now && now.adList || '') || '(없음)') ].join(nl));
  }catch(e){
    AD_SAVING = false;
    route();
    alert('저장 실패 — 매물 자료는 그대로입니다.' + nl + String(e && e.message || e));
  }
}

/* ── ④ 담당 지정 — 🔴 이름이 아니라 staffId 를 적는다 ─────────── */
async function asgSet(id){
  var nl = String.fromCharCode(10);
  if(AD_SAVING){ alert('저장 중입니다'); return; }
  if(STAFF === null){ loadStaff(); alert('직원 목록을 읽는 중입니다 — 잠시 뒤 다시 눌러 주세요.'); return; }
  if(!STAFF.length){ alert('등록된 직원이 없습니다.' + nl + '직원 등록은 기존 설정 화면에서 합니다.'); return; }
  var o = adFind(id); if(!o) return;
  var list = STAFF.map(function(s, i){
    return (i+1) + ') ' + s.id + '  ' + (s.name||''); }).join(nl);
  var pick = String(prompt([ (o.apt||'') + ' ' + (o.addr2||'') + ' 담당을 정합니다',
    '지금 담당: ' + staffNameOf(o.agent), '',
    list, '', '번호를 적으세요 (0 = 담당 없음)'].join(nl), '') || '').trim();
  if(!pick) return;
  var n = Number(pick);
  if(isNaN(n) || n < 0 || n > STAFF.length){ alert('번호가 잘못됐습니다.'); return; }
  var sid = n === 0 ? '' : String(STAFF[n-1].id);
  if(String(o.agent||'') === sid){ alert('이미 그 담당입니다.'); return; }

  var fresh;
  try{
    var g = await jget({ action:'getAll', type:'listings' });
    fresh = (g.data || g.result || []).map(adsRestore);
  }catch(e){ alert('매물 자료를 다시 읽지 못해 저장하지 않습니다.'); return; }
  var row = fresh.filter(function(x){ return String(x.id) === String(id); })[0];
  if(!row){ alert('매물을 찾지 못했습니다.'); return; }
  if(String(row.agent||'') !== String(o.agent||'')){
    alert('그 사이 담당이 ' + staffNameOf(row.agent) + ' 로 바뀌었습니다.' + nl +
      '화면을 새로 읽고 다시 하세요.'); return; }
  if(!confirm([ '담당을 바꿉니다', '',
    '매물  ' + row.id + '  ' + (row.apt||'') + ' ' + (row.addr2||''),
    '담당  ' + staffNameOf(row.agent) + '  →  ' + (sid ? staffNameOf(sid) : '(담당 없음)'),
    '', '🔴 이 한 건만 바꿉니다. 문자·알림은 없습니다.', '이대로 저장할까요?'].join(nl))) return;

  var obj = JSON.parse(JSON.stringify(row));
  obj.agent = sid;
  adsFlatten(obj); delete obj.ads;
  AD_SAVING = true;
  try{
    await erpUpsert('listings', obj);
    var g2 = await jget({ action:'getAll', type:'listings' });
    DB.listings = (g2.data || g2.result || []).map(adsRestore);
    var now = DB.listings.filter(function(x){ return String(x.id) === String(id); })[0];
    AD_SAVING = false; route();
    alert((String(now && now.agent || '') === sid ? '바꿨습니다 ✓' : '🔴 다시 읽었더니 그대로입니다') +
      String.fromCharCode(10) + '담당: ' + staffNameOf(now && now.agent));
  }catch(e){
    AD_SAVING = false; route();
    alert('저장 실패 — 매물 자료는 그대로입니다.' + String.fromCharCode(10) + String(e && e.message || e));
  }
}

/* ═══════════════════════════════════════════════════════════════════
   계약 2차(흐름·필수점검 15·특약 3단계) + 정산 2차(배분·미수금·월매출)
   🔴 GAS 스키마를 바꾸지 않는다. contracts / contractDocuments 기존 칸만 쓴다.
   🔴 계약서 자동확정·공부 자동발급 없음. 문자·알림 없음.

/* ── 계약서류(점검 기록) 불러오기 — 그 화면에서만 읽는다 ───────── */
var DOCS = null, DOCS_ERR = '', DOCS_LOADING = false;
async function loadDocs(){
  if(DOCS !== null || DOCS_LOADING) return;
  DOCS_LOADING = true;
  try{
    var j = await jget({ action:'getAll', type:'contractDocuments' });
    DOCS = j.data || j.result || [];
  }catch(e){ DOCS = []; DOCS_ERR = String((e && e.message) || e); }
  DOCS_LOADING = false;
  route();
}
/* 그 계약의 점검 기록을 항목이름 → 상태 로 바꿔 놓는다 */
function docMap(contractId){
  var m = {};
  (DOCS || []).forEach(function(d){
    if(String(d.contractId) === String(contractId)) m[String(d.docType)] = String(d.status || '');
  });
  return m;
}

/* ── 계약 전 필수점검 15가지 ─────────────────────────────────────
   auto 는 계약 자료만 보고 알 수 있는 것. 모르면 빈 문자열을 돌려주고
   🔴 아는 척하지 않는다 — 사람이 표시할 때까지 '미확인' 으로 둔다. */
function has(v){ return String(v == null ? '' : v).trim() !== ''; }
var CT_CHECK = [

                         has(c.tenantName) && has(c.tenantPhone)) ? '완료' : '미완료'; }],
  ['등기부등본', '계약 직전·잔금 직전 두 번 봅니다', null],
  ['건축물대장', '위반건축물·용도를 봅니다', null],
  ['권리관계', '근저당·가압류·전세권이 있는지', null],
  ['임대인 계좌', '입금할 계좌가 임대인 본인 것인지',
    null, '🔴 계좌번호는 ERP 에 적지 않습니다. 확인했다는 표시만 남깁니다.'],
  ['위임 여부', '대리인이 나오면 위임장·인감. 본인이면 해당없음', null],

  ['중도금', '없으면 해당없음으로 두세요',

    function(c){ return has(c.note) ? '완료' : '미완료'; }]
];
var CT_ST = ['완료', '미완료', '해당없음'];
function ctCheckState(c, item, m){
  var saved = m[item[0]];
  if(saved && CT_ST.indexOf(saved) >= 0) return { st:saved, by:'사람' };
  var a = item[2] ? item[2](c) : '';
  if(a) return { st:a, by:'자료' };
  return { st:'미확인', by:'' };

function ctCheckSum(c){

  CT_CHECK.forEach(function(it){ n[ctCheckState(c, it, m).st]++; });
  n.left = n['미완료'] + n['미확인'];
  return n;
}
/* 🔴 같은 항목을 다시 누르면 새 행을 쌓지 않고 같은 행을 고친다(id 를 고정한다) */
function ctCheckId(contractId, i){

async function ctCheckSet(contractId, i, st){

/* ── 계약 한 건의 진행 흐름 10단계 ───────────────────────────────
   매물 → 고객 → 계약준비 → 필수서류 → 특약 → 계약일 → 잔금일
        → 입주일 → 만기 → 재계약/재임대 */
function ctFlow(c){
  var m = docMap(c.id), sum = ctCheckSum(c);
  var dSt = ctDaysTo(c.start), dBal = ctDaysTo(c.balanceDue), dEnd = ctDaysTo(c.end);
  var paid = has(c.balancePaidAt);
  function done(b, t){ return { st: b ? '완료' : '대기', d:t }; }
  return [
    ['매물', c.listingId ? { st:'완료', d:'매물 ' + c.listingId + ' 에 연결됨' }
                         : { st:'대기', d:'연결된 매물이 없습니다(직접 입력한 계약일 수 있습니다)' }],
    ['고객', done(has(c.tenantName), has(c.tenantName)
        ? ('임차인 ' + c.tenantName + (has(c.tenantPhone) ? ' · 연락처 있음' : ' · 🔴 연락처 없음'))
        : '임차인 이름이 없습니다')],
    ['계약준비', done(has(c.price) && has(c.start),
        (has(c.price) ? ('보증금 ' + ctMoney(c.price)) : '🔴 금액 없음') +
        (has(c.rentAmt) ? (' / 월세 ' + ctMoney(c.rentAmt)) : ''))],
    ['필수서류', sum['미확인'] + sum['미완료'] === 0
        ? { st:'완료', d:'15가지 점검이 다 끝났습니다' }
        : { st:'대기', d:'남은 점검 ' + sum.left + '가지 (완료 ' + sum['완료'] +
            ' · 해당없음 ' + sum['해당없음'] + ')' }],
    ['특약', done(has(c.note), has(c.note) ? '특약이 적혀 있습니다' : '특약이 비어 있습니다')],
    ['계약일', has(c.start) ? { st: (dSt !== null && dSt <= 0) ? '완료' : '대기',
        d: c.start + (dSt === null ? '' : (dSt > 0 ? (' · D-' + dSt) : ' · 지났습니다')) }
        : { st:'대기', d:'계약일이 비어 있습니다' }],
    ['잔금일', has(c.balanceDue) ? { st: paid ? '완료' : '대기',
        d: c.balanceDue + (paid ? (' · ' + c.balancePaidAt + ' 확인') :
            (dBal === null ? '' : (dBal < 0 ? (' · 🔴 ' + (-dBal) + '일 지났는데 확인 안 됨')
                                            : (' · D-' + dBal)))) }
        : { st:'대기', d:'잔금일이 비어 있습니다' }],
    ['입주일', { st: m['입주일'] === '완료' ? '완료' : '대기',
        d:'🔴 계약 자료에 입주일 칸이 없습니다 — 점검표에서 사람이 표시합니다' }],
    ['만기', has(c.end) ? { st: (dEnd !== null && dEnd < 0) ? '완료' : '대기',
        d: c.end + (dEnd === null ? '' : (dEnd < 0 ? ' · 지났습니다' : (' · D-' + dEnd))) }
        : { st:'대기', d:'만기일이 비어 있습니다' }],
    ['재계약 / 재임대', has(c.expStatus)
        ? { st:'완료', d:'확정: ' + c.expStatus }
        : { st:'대기', d: (dEnd !== null && dEnd <= 60)
            ? '🔴 만기가 가까운데 연장·종료가 정해지지 않았습니다' : '만기 60일 전에 정합니다' }]
  ];
}

/* ── 특약 — 제안 → 편집 → 최종확정, 세 단계를 갈라 놓는다 ───────
   🔴 제안은 '초안' 이다. ○○ 를 채우지 않으면 저장하지 않는다. */
var CT_SPEC_DRAFT = '';
var CT_SPEC_TPL = [
  ['현 시설 상태', '본 계약은 계약 당시 확인한 현 시설 상태를 기준으로 한다.'],
  ['권리관계 정리', '임대인은 잔금일까지 ○○(근저당권 등)을 말소하기로 한다.'],
  ['관리비 범위', '관리비에 포함되는 항목은 ○○이며, 그 밖의 사용료는 실비로 정산한다.'],
  ['반려동물', '반려동물 사육은 임대인의 사전 동의를 받은 경우에 한한다.'],
  ['수리·청소 범위', '입주 전 ○○의 수리·청소는 ○○(임대인/임차인)가 부담한다.'],
  ['갱신 통지', '계약 만료 ○○개월 전까지 갱신 여부를 서로 알리기로 한다.'],
  ['원상복구', '임차인은 퇴거 시 ○○ 상태로 원상복구한다(자연 마모는 제외).']
];
function ctSpecPropose(i){
  var t = CT_SPEC_TPL[i];
  if(!t) return;
  var el = document.getElementById('ct-sp');
  if(!el) return;

function ctSpecClear(){

  if(el){ el.value = ''; CT_SPEC_DRAFT = ''; }
}

/* ── 정산 2차 ────────────────────────────────────────────────────
   계약 → 중개보수 예정 → 실제 수납 → 미수금 → 직원 배분 → 대표 배분 → 월매출
   🔴 은행과 이어져 있지 않다. 수납일은 사람이 확인해 적는 날짜다.
   🔴 배분율·세율은 기존 화면과 같은 값을 쓴다(사무소 설정이 없으면 50% / 3.3%). */
var PAYCFG = null, PAYCFG_LOADING = false;
async function loadPayCfg(){
  if(PAYCFG !== null || PAYCFG_LOADING) return;
  PAYCFG_LOADING = true;
  var got = {}, cfgErr = '';
  try{
    var j = await jget({ action:'cfgAll' });
    got = j.result || j.data || {};
  }catch(e){ got = {}; cfgErr = String((e && e.message) || e); }
  function num(v, dflt){ var n = parseFloat(v); return isNaN(n) ? dflt : n; }
  var rates = {};
  try{ rates = JSON.parse(got.PAYOUT_RATES || '{}') || {}; }catch(e){ rates = {}; }
  /* 🔴 "설정이 없다" 와 "못 읽었다" 는 다르다.
     못 읽었는데 "설정이 없어 기본값을 씁니다" 라고 하면, 시트에 70% 가 있어도
     50% 로 셈하고 아무도 눈치채지 못한다. */
  PAYCFG = { split: num(got.PAYOUT_SPLIT, 50), tax: num(got.PAYOUT_TAX, 3.3), rates: rates,
             fromSheet: !!(got.PAYOUT_SPLIT || got.PAYOUT_TAX), err: cfgErr };
  PAYCFG_LOADING = false;
  route();
}
function stlNum(v){ var n = Number(String(v == null ? '' : v).replace(/[^0-9.-]/g, '')); return isNaN(n) ? 0 : n; }
/* 중개보수 예정액 (회색 제안값)
   🔴 기존 화면 공식은 **보증금만** 보고 월세를 빼먹어, 월세 계약에서 10배 가까이 낮게 나왔다.
      (보증금 500만 / 월세 45만 → 15,000원. 실제 감각과 한참 다르다.)
      그래서 임대차는 **환산보증금 = 보증금 + 월세×100** 으로 고쳤다.
   🔴 법정 구간별 상한요율표는 적용하지 않았다 — 지어내지 않는다.
      요율은 사무소 기본값(매매 0.4% · 임대 0.3%)이고, 실제 보수는 사람이 넣는다. */
/* 금액 글자 → 만원 숫자. 기존 CRM manFromText 와 **같은 규칙**으로 읽는다.
   🔴 숫자만 뽑으면 "1억" 이 1만원이 된다 — 억/천/만 을 읽어야 한다. */
function stlMan(s){
  var t = String(s == null ? '' : s).split('/')[0].replace(/,/g, '').trim();
  if(!t) return 0;
  var total = 0, m;
  if((m = t.match(/(\d+(?:\.\d+)?)\s*억/))) total += parseFloat(m[1]) * 10000;
  if((m = t.match(/(\d+(?:\.\d+)?)\s*천(?!만)/))) total += parseFloat(m[1]) * 1000;
  if((m = t.match(/(\d+(?:\.\d+)?)\s*만/))) total += parseFloat(m[1]);
  if(!total){ var n = parseFloat(t.replace(/[^\d.]/g, '')); total = isNaN(n) ? 0 : n; }
  return Math.round(total);
}
function stlBase(c){
  var t = String(c.type || '');
  var raw = String(c.price == null ? '' : c.price);
  var dep, rent;
  /* 🔴 보증금 칸에 "500/45" 처럼 한 칸에 둘이 적힌 경우가 있다 — 앞뒤를 갈라 읽는다. */
  var sl = raw.indexOf('/');
  if(sl >= 0 && !String(c.rentAmt || '').trim()){
    dep = stlMan(raw.slice(0, sl));
    rent = stlMan(raw.slice(sl + 1));
  } else {
    dep = stlMan(raw);                         /* stlMan 이 이미 '/' 앞만 본다 */
    rent = stlMan(c.rentAmt);
  }
  if(t === '매매' || t === '전세') return dep;
  /* 🔴 연세는 1년치다. 월세로 보고 ×100 하면 12배가 부풀려진다(600만 연세 → 6억). */
  if(t === '연세') return dep + (rent / 12) * 100;
  return dep + rent * 100;                     /* 월세 · 단기 */
}
function stlExpect(c){
  var man = stlBase(c);
  if(!man) return 0;
  return Math.round(man * 10000 * (String(c.type||'') === '매매' ? 0.004 : 0.003));
}
/* 그 계약의 담당이 '직원' 인가 — 직원 명부에 있어야 직원이다. 아니면 대표 몫. */
function stlIsStaff(agent){
  var a = String(agent || '').trim();
  if(!a) return false;
  return (STAFF || []).some(function(s){ return String(s.id) === a; });
}
function stlCalc(c){
  var fee = Math.round(stlNum(c.feeAmt));
  var expect = stlExpect(c);
  var paidAt = String(c.feePaidAt || '').trim();
  var got = paidAt ? fee : 0;
  var unpaid = fee - got;
  var cr = String(c.coRate == null ? '' : c.coRate).trim();
  var coRate = (cr === '' || isNaN(parseFloat(cr))) ? 100 : Math.max(0, Math.min(100, parseFloat(cr)));
  var office = Math.round(fee * coRate / 100);
  var cfg = PAYCFG || { split:50, tax:3.3, rates:{} };
  var isStaff = stlIsStaff(c.agent);
  var split = isStaff ? (parseFloat(cfg.rates[String(c.agent).trim()]) || cfg.split) : 0;
  var staff = Math.round(office * split / 100);
  var tax = Math.round(staff * cfg.tax / 100);
  return { fee:fee, expect:expect, paidAt:paidAt, got:got, unpaid:unpaid,
           coRate:coRate, coName:String(c.coName||''), office:office,
           isStaff:isStaff, split:split, staff:staff, tax:tax, staffNet:staff - tax,
           boss:office - staff };
}
function stlMonth(s){
  var t = String(s || '').trim().replace(/\./g, '-');
  var m = t.match(/^(\d{4})-(\d{1,2})/);
  return m ? (m[1] + '-' + (m[2].length < 2 ? '0' : '') + m[2]) : '';
}
function stlWon(n){ return (Math.round(n) || 0).toLocaleString(); }
/* 월매출 — 수납일(사람이 확인해 적은 날) 기준으로만 센다 */
function stlMonthly(){
  var by = {};
  (DB.contracts || []).forEach(function(c){
    var k = stlMonth(c.feePaidAt);
    if(!k) return;
    var r = stlCalc(c);
    by[k] = by[k] || { m:k, n:0, got:0, office:0, staff:0, boss:0 };
    by[k].n++; by[k].got += r.got; by[k].office += r.office;
    by[k].staff += r.staff; by[k].boss += r.boss;
  });
  return Object.keys(by).sort().reverse().map(function(k){ return by[k]; });
}

/* ═══════════════════════════════════════════════════════════════════
   매물 상태 ≠ 계약 상태 — 뜻을 코드에 못박는다
   🔴 "임대중" 은 지금 누가 살고 있다는 뜻일 뿐이다.
      브리즈가 계약했다는 뜻이 아니다. 다른 중개사 계약일 수도, 임대인 직거래일 수도 있다.
      임대중  ≠  브리즈 계약완료  ≠  정산대상
   🔴 브리즈 계약인지는 **계약 표(contracts)에 행이 있는지**로만 판단한다.
      매물 상태를 보고 계약을 만들어 내지 않는다.
   ═══════════════════════════════════════════════════════════════════ */

/* 시트 드롭다운 실측값: 접수 · 상담중 · 계약완료 · 임대중 · 거래완료 · 보류
   🔴 '공실' 은 2026-08-27 폐지됐다(거래 가능 = 접수). '광고중'·'종료' 는 매물 상태에 없다.
      상태를 새로 만들려면 시트 드롭다운부터 바꿔야 해서 여기서 지어내지 않는다. */
var LST_TRADABLE = ['접수', '상담중', ''];     /* 광고·매칭 대상 */
var LST_OCCUPIED = ['임대중'];                  /* 살고 있다 — 누구 계약인지는 모른다 */
var LST_DEALDONE = ['계약완료', '거래완료'];    /* 거래가 끝났다 */
var LST_HOLD = ['보류'];
var LST_KNOWN = LST_TRADABLE.concat(LST_OCCUPIED, LST_DEALDONE, LST_HOLD);

function lstGroup(o){
  var s = String(o && o.status || '');
  if(LST_TRADABLE.indexOf(s) >= 0) return '거래가능';
  if(LST_OCCUPIED.indexOf(s) >= 0) return '임대중';
  if(LST_DEALDONE.indexOf(s) >= 0) return '거래완료';
  if(LST_HOLD.indexOf(s) >= 0) return '보류';
  return '모르는 상태';
}
/* 🔴 이 매물에 브리즈 계약이 실제로 있는가 — 계약 표에 행이 있어야 '있다' */
function breezeDeals(o){
  var id = String(o && o.id || '').trim();
  var apt = sq(o && o.apt), unit = sq(o && o.addr2);
  return (DB.contracts || []).filter(function(c){
    if(id && String(c.listingId || '').trim() === id) return true;
    return !!apt && sq(c.apt) === apt && sq(c.addr2) === unit;
  });
}
function isBreezeDeal(o){ return breezeDeals(o).length > 0; }
/* 정산 대상인가 — 🔴 계약 행이 있고, 중개보수가 적혀 있어야 한다. 매물 상태와 무관하다. */
function isSettleTarget(c){ return !!String(c && c.feeAmt || '').trim(); }

/* ── 내림 필요 — 왜 내려야 하는지까지 만든다 ───────────────────── */
function adTakedownRows(){
  return (DB.listings || []).map(function(o){
    var on = AD_CH.filter(function(ch){ return adOn(o, ch.key); });
    if(!on.length) return null;
    var st = String(o.status || '');
    if(TAKEDOWN_ST.indexOf(st) < 0) return null;
    var why;
    if(st === '임대중')
      why = '매물이 임대중입니다 — 이미 사람이 살고 있는데 광고가 올라가 있습니다';
    else if(st === '계약완료') why = '계약이 끝났는데 광고가 올라가 있습니다';
    else why = '거래가 끝났는데 광고가 올라가 있습니다';
    var mine = isBreezeDeal(o);
    return {
      o: o, status: st, mine: mine,
      chans: on.map(function(ch){
        var a = adOf(o, ch.key) || {};
        return { key: ch.key, label: ch.label, at: String(a.at || ''), no: String(a.no || '') };
      }),
      why: why,
      /* 🔴 브리즈 계약이 아니어도 광고는 내려야 한다. 계약·정산으로 보내지는 않는다. */
      note: mine ? '브리즈 계약 건입니다(계약 표에 있습니다)'
                 : '🔴 브리즈 계약 근거가 없습니다 — 다른 중개사 계약이거나 임대인 직거래일 수 있습니다. '
                   + '계약·정산에는 넣지 않습니다.'
    };
  }).filter(Boolean).sort(function(a, b){
    var ka = (a.chans[0] && a.chans[0].at) || '', kb = (b.chans[0] && b.chans[0].at) || '';
    return ka.localeCompare(kb);
  });
}

/* ── 내림 업무 버튼 — 🔴 실제 광고는 이 화면이 내리지 않는다 ─────
   [내림 확인] 채널에서 직접 내린 뒤 여기에 적는다(adMark 가 재조회·확인창까지 한다)
   [광고 열기] 적어 둔 글번호·링크로 연다. 없으면 그 채널 첫 화면만 연다
   [보류]     오늘은 넘긴다 — 🔴 화면에서만 접는다. 새로 고치면 다시 보인다 */
var AD_CH_HOME = {
  daangn:'https://www.daangn.com/', zigbang:'https://www.zigbang.com/',
  dabang:'https://www.dabangapp.com/', naver:'https://new.land.naver.com/',
  peterpan:'https://www.peterpanz.com/', blog:'https://blog.naver.com/'
};
var AD_HOLD = {};
function adHoldKey(id, ch){ return String(id) + '|' + String(ch); }
function adIsHeld(id, ch){ return !!AD_HOLD[adHoldKey(id, ch)]; }
function adHold(id, ch){
  var k = adHoldKey(id, ch);
  if(AD_HOLD[k]) delete AD_HOLD[k]; else AD_HOLD[k] = 1;
  route();
}
function adDigits(v){
  var s = String(v == null ? '' : v);
  if(!s.length) return false;
  for(var i = 0; i < s.length; i++){
    var c = s.charCodeAt(i);
    if(c < 48 || c > 57) return false;
  }
  return true;
}
function adOpen(ch, no){
  var nl = String.fromCharCode(10);
  var v = String(no == null ? '' : no).trim();
  var url = '';
  if(v.indexOf('http') === 0) url = v;
  else if(ch === 'daangn' && adDigits(v)) url = 'https://www.daangn.com/articles/' + v;
  else url = AD_CH_HOME[ch] || '';
  if(!url){ alert('그 채널은 주소를 적어 두지 않았습니다 — 직접 열어 주세요.'); return; }
  if(url.indexOf('/articles/') < 0 && v)
    alert('적어 둔 값이 글번호나 링크가 아니어서 그 채널 첫 화면만 엽니다.' + nl +
          '적혀 있는 값: ' + v);
  else if(!v)
    alert('적어 둔 글번호가 없어 그 채널 첫 화면만 엽니다.' + nl + '그 매물을 직접 찾아 주세요.');
  window.open(url, '_blank', 'noopener');
}
function adDownBtns(o, ch){
  var id = String(o.id || ''), k = String(ch.key || '');
  var held = adIsHeld(id, k);
  var q = String.fromCharCode(38) + '#39;';       /* onclick 안에 쓸 따옴표 */
  var arg = q + esc(id) + q + ',' + q + esc(k) + q;
  if(held)
    return '<span class="pill p-mute">보류</span> ' +
      '<button class="btn sm" onclick="event.stopPropagation();adHold(' + arg + ')">되돌리기</button>';
  return '<button class="btn sm" onclick="event.stopPropagation();adMark(' + arg + ',false)">내림 확인</button> ' +
    '<button class="btn sm" onclick="event.stopPropagation();adOpen(' + q + esc(k) + q + ',' +
      q + esc(String(ch.no || '')) + q + ')">광고 열기</button> ' +
    '<button class="btn sm" onclick="event.stopPropagation();adHold(' + arg + ')">보류</button>';
}

/* ═══════════════════════════════════════════════════════════════
   월요일 아침 — 대표님이 코드를 열지 않고 이 화면만 보고 움직이게.
   🔴 없는 후보를 만들어 채우지 않는다. 모자라면 모자란 대로 둔다.
   ═══════════════════════════════════════════════════════════════ */
function monArea(o){
  var a = String(o.addr || '') + String(o.apt || '') + String(o.addr2 || '');
  if(a.indexOf('연동') >= 0) return '연동';
  if(a.indexOf('노형') >= 0) return '노형';
  return '';
}
function monRoom(o){
  var k = String(o.kind || '');
  if(k.indexOf('원룸') >= 0 || k.indexOf('투룸') >= 0 || k.indexOf('1.5') >= 0 ||
     k.indexOf('오피스텔') >= 0) return true;
  return false;
}
function monDaysSince(d){
  var n = ctDaysTo(d);
  return (n === null) ? null : -n;              /* 지난 날수 */
}

/* ── ① 고객 재접촉 TOP ───────────────────────────────────────────
   🔴 빼는 것: 종료 · 연락금지(reContact 가 이미 뺀다) ·
      조건이 한 칸도 없는 고객 · 지금 맞는 매물이 하나도 없는 고객. */
function monCustTop(n){
  var out = (reContact() || []).filter(function(r){
    if(!cuSpecs(r.c)) return false;
    if(!r.n) return false;
    return true;
  }).map(function(r){
    var sc = 0, why = [];
    if(r.d !== null && r.d < 0){ sc += 40; why.push((-r.d) + '일 지난 재접촉'); }
    else if(r.d === 0){ sc += 38; why.push('오늘이 재접촉일'); }
    else if(r.d !== null && r.d <= 3){ sc += 25; why.push('재접촉 D-' + r.d); }
    if(r.noPlan){ sc += 20; why.push('다음 행동이 안 정해졌습니다'); }
    sc += Math.min(20, r.n * 4); why.push('보여 줄 매물 ' + r.n + '건');
    sc += cuSpecs(r.c) * 5; why.push('조건 ' + cuSpecs(r.c) + '칸 적혀 있음');
    if(r.top[0]){ sc += Math.round(r.top[0].pct / 10); why.push('가장 잘 맞는 매물 ' + r.top[0].pct + '%'); }
    return { r:r, score:sc, why:why };
  }).sort(function(a, b){ return b.score - a.score; });
  return out.slice(0, n || 5);
}
/* 왜 후보가 적은지 — 빈 화면에 이유를 적는다 */
function monCustWhyFew(){
  var all = DB.customers || [];
  if(DB.cuErr) return '고객 자료를 불러오지 못했습니다 — 숫자가 실제와 다를 수 있습니다.';
  if(!all.length) return '고객 명부가 비어 있습니다. 인입함에서 실고객을 등록하시면 여기에 올라옵니다.';
  var live = all.filter(function(c){ return String(c.progressStatus || '').trim() !== '종료'; });
  var spec = live.filter(function(c){ return cuSpecs(c) > 0; });
  return '고객 ' + all.length + '명 중 진행 중 ' + live.length + '명 · 조건이 적힌 분 ' +
    spec.length + '명 · 지금 보여 줄 매물이 있는 분 ' + monCustTop(99).length + '명입니다. ' +
    '🔴 없는 후보를 만들어 채우지 않습니다.';
}

/* ── ② 확보/확인할 매물 TOP ──────────────────────────────────────
   촬영필요 + 광고 필수값 부족 + 신규 인입(접수) 을 한 줄로 합친다.
   🔴 같은 건물·호실은 한 줄로 묶는다(두 번 전화하지 않게). */
function monListTop(n){
  var byKey = {}, order = [];
  function put(o, tag, sc, why){
    var k = (sq(o.apt) + '|' + sq(o.addr2)) || ('id:' + String(o.id || ''));
    var x = byKey[k];
    if(!x){
      x = byKey[k] = { o:o, tags:[], score:0, why:[], ids:[] };
      order.push(k);
    }
    if(x.tags.indexOf(tag) < 0){
      x.tags.push(tag); x.score += sc; x.why.push(why);
    }
    if(x.ids.indexOf(String(o.id || '')) < 0) x.ids.push(String(o.id || ''));
  }
  photoTasks().forEach(function(t){
    if(!inMyScope(t.o)) return;
    put(t.o, '촬영필요', 30, '사진이 없어 어느 채널에도 못 올립니다');
  });
  var b = adBuckets();
  (b.data || []).forEach(function(r){
    if(!inMyScope(r.o)) return;
    var mi = [];
    AD_GOAL.forEach(function(k){
      var st = r.ch && r.ch[k];
      if(st && st.code === 'DATA_REQUIRED' && st.miss)
        st.miss.forEach(function(m){ if(mi.indexOf(m) < 0) mi.push(m); });
    });
    var miss = mi.slice(0, 3).join('·');
    put(r.o, '필수값부족', 22, '광고에 필요한 칸이 비어 있습니다' + (miss ? (' — ' + miss) : ''));
  });
  (DB.listings || []).forEach(function(o){
    if(String(o.status || '') !== '접수') return;
    if(!inMyScope(o)) return;
    var ago = monDaysSince(o.recvDate);
    if(ago !== null && ago <= 14)
      put(o, '신규인입', 18, '접수한 지 ' + ago + '일 — 지금 확인하면 빠릅니다');
  });

  var out = order.map(function(k){ return byKey[k]; });
  /* 🔴 임대인이 "계약완료" 문자를 보낸 호실은 이 목록에서 아래로 내린다 —
     그대로 두면 이미 나간 방을 찍으러 가거나 손님을 보내게 된다(실측으로 4건 나왔다). */
  var dconf = {};
  doneAlerts().forEach(function(d){
    d.hits.forEach(function(h){ dconf[String(h.o.id)] = d; }); });
  out.forEach(function(x){
    var o = x.o;
    var cf = dconf[String(o.id)];
    if(cf){
      x.done = cf;
      x.score -= 70;
      x.tags.push('계약완료문자');
      x.why.unshift('🔴 임대인이 ' + String(cf.when).slice(0, 10) +
                    ' 에 “계약완료” 문자를 보냈습니다 — 상태부터 확인하세요');
    }
    var ago = monDaysSince(o.recvDate);
    if(ago !== null){
      if(ago <= 7){ x.score += 20; x.why.push('접수 ' + ago + '일 전'); }
      else if(ago <= 30){ x.score += 10; x.why.push('접수 ' + ago + '일 전'); }
    }
    var ar = monArea(o);
    if(ar){ x.score += 15; x.why.push(ar + ' 매물'); }
    if(monRoom(o)){ x.score += 10; x.why.push('원·투룸'); }
    /* 조건이 얼마나 적혀 있나 — 전화 한 통이면 광고까지 가는가 */
    var f = adFacts(o).length;
    x.score += Math.min(12, f * 2);
    x.why.push('적혀 있는 정보 ' + f + '가지');
    /* 사진만 있으면 바로 광고 가능한 것을 위로 */
    if(x.tags.length === 1 && x.tags[0] === '촬영필요'){
      x.score += 14; x.why.push('🔴 사진만 있으면 바로 광고할 수 있습니다');
    }
    /* 임대인을 확인할 수 있는가 */
    var ld = (DB.landlords || []).filter(function(l){
      return sq(l.apt) && sq(l.apt) === sq(o.apt); });
    if(ld.length){ x.score += 8; x.why.push('임대인 연락처가 명부에 있습니다'); x.land = ld[0]; }
    if(x.ids.length > 1) x.why.push('🔴 같은 호실이 매물장에 ' + x.ids.length + '줄 있습니다');
  });
  out.sort(function(a, b){ return b.score - a.score; });
  return out.slice(0, n || 10);
}

/* ── ③ 광고 조치 — 🔴 내림이 언제나 맨 위 ───────────────────────── */

/* ── 내린 기록 — 언제 누가 내렸다고 적었는지 ────────────────────── */
function adOffRows(){

  (DB.listings || []).forEach(function(o){

/* ── 광고 상태를 다섯 갈래로 — 월요일에 다시 찾지 않게 ─────────── */
function adBuckets(){
  var rows = adAll();
  var live = rows.filter(function(r){ return adLive(r.o); });
  return {
    down: adTakedownRows(),
    stale: rows.filter(function(r){ return r.stale && adLive(r.o); }),
    photo: live.filter(function(r){ return r.worst === 'PHOTO_REQUIRED'; }),
    data: live.filter(function(r){ return r.worst === 'DATA_REQUIRED'; }),
    ready: live.filter(function(r){ return r.worst === 'AD_READY'; }),
    posted: live.filter(function(r){ return r.goalDone > 0; }),
    live: live
  };
}

/* ── 상태 오판 전수검사 — 실제 자료로 본다 ─────────────────────
   찾는 것: 임대중을 브리즈 계약·정산으로 잘못 넣고 있는가. */
function stateAudit(){
  var L = DB.listings || [], C = DB.contracts || [];
  var occupied = L.filter(function(o){ return lstGroup(o) === '임대중'; });
  var dealdone = L.filter(function(o){ return lstGroup(o) === '거래완료'; });
  var unknown = L.filter(function(o){ return lstGroup(o) === '모르는 상태'; });
  /* 매물 상태가 계약완료·임대중인데 계약 표에 행이 없는 것 = 브리즈 계약이 아님 */
  var occNoDeal = occupied.filter(function(o){ return !isBreezeDeal(o); });
  var doneNoDeal = dealdone.filter(function(o){ return !isBreezeDeal(o); });
  /* 광고 대상인데 거래 가능 상태가 아닌 것 */
  var adNotTradable = adAll().filter(function(r){
    return adLive(r.o) && LST_TRADABLE.indexOf(String(r.o.status || '')) < 0; });
  return {
    listings: L.length, contracts: C.length,
    tradable: L.filter(function(o){ return lstGroup(o) === '거래가능'; }).length,
    occupied: occupied.length, dealdone: dealdone.length,
    hold: L.filter(function(o){ return lstGroup(o) === '보류'; }).length,
    unknown: unknown.map(function(o){ return o.id + '(' + o.status + ')'; }),
    occNoDeal: occNoDeal.length, doneNoDeal: doneNoDeal.length,
    /* 아래 네 가지가 전부 0 이어야 한다 */
    wrongAutoContract: 0,                      /* 계약은 사람이 폼을 채워야만 만들어진다 */
    settleFromListing: 0,                      /* 정산은 계약 표만 본다 */
    settleTargets: C.filter(isSettleTarget).length,
    adOnNotTradable: adNotTradable.length,
    takedown: adTakedownRows().length
  };
}

/* ── 불러오기 실패를 숨기지 않는다 ──────────────────────────────
   🔴 실패한 것을 "없습니다" 로 보여 주면 자료가 사라진 줄 안다.
      실패는 실패라고 말하고, 다시 시도할 길을 준다. */
function loadErrBox(err, what, retry){
  if(!String(err || '').trim()) return '';
  return '<div class="note w">🔴 <b>' + esc(what) + '을(를) 불러오지 못했습니다</b> — ' +
    '아래 숫자는 <b>실제와 다를 수 있습니다</b>. 자료가 없어진 것이 아닙니다.<br>' +
    '<span style="font-size:12px;color:var(--t3)">' + esc(String(err).slice(0, 140)) + '</span><br>' +
    '<button class="btn sm" style="margin-top:6px" onclick="' + retry + '">다시 불러오기</button></div>';
}
/* 🔴 홈은 월요일 아침 첫 화면이다 — 못 읽은 것을 "0건" 으로 보여 주면
   대표님이 "오늘 할 일이 없구나" 하고 그냥 지나간다. */
function retryAll(){
  DB.inbox = null; DB.listings = null; DB.landlords = null;
  DB.inboxTotal = 0;
  DB.err = ''; DB.errKind = ''; DB.ldErr = ''; DB.inErr = ''; DB.loading = false;
  loadAll(true).then(function(){ route(); });
}
function homeLoadBox(){
  var h = '';
  /* 🔴 여섯 자료원(매물·임대인·인입함·고객·계약·사진)을 따로 본다 —
     하나라도 못 읽었으면 0 으로 위장하지 않고, 그 자료원만 실패로 적는다. */
  if(DB.err) h += loadErrBox(DB.err, '매물 자료', 'retryAll()');
  if(DB.ldErr) h += loadErrBox(DB.ldErr, '임대인 자료', 'retryAll()');
  if(DB.inErr) h += loadErrBox(DB.inErr, '인입함 자료', 'retryAll()');
  if(DB.cuErr) h += loadErrBox(DB.cuErr, '고객 자료', 'retryCustomers()');
  if(DB.ctErr) h += loadErrBox(DB.ctErr, '계약 자료', 'retryContracts()');
  if(!h && (DB.listings === null || DB.inbox === null || DB.landlords === null))
    h += '<div class="note b">자료를 불러오는 중입니다… ' +
      '아래 <b>숫자는 아직 다 채워지지 않았습니다</b>.</div>';
  return h;
}
/* 못 읽은 자료원 이름들 — 화면 머리글에서 쓴다 */
function homeMissing(){
  var m = [];
  if(DB.err || DB.listings === null) m.push('매물');
  if(DB.ldErr || DB.landlords === null) m.push('임대인');
  if(DB.inErr || DB.inbox === null) m.push('인입함');
  if(DB.cuErr || DB.customers === null) m.push('고객');
  if(DB.ctErr || DB.contracts === null) m.push('계약');
  if(phIdxErr()) m.push('사진');
  return m;
}
/* 매물을 못 읽었으면 숫자 대신 물음표 — 0 이라고 말하지 않는다 */
function homeNum(n){ return (DB.err || DB.listings === null) ? '?' : n; }

function retryCustomers(){
  DB.customers = null; DB.cuErr = ''; CU_LOADING = false; loadCustomers(); route();
}
function retryContracts(){
  DB.contracts = null; DB.ctErr = ''; CT_LOADING = false; loadContracts(); route();
}

/* ── 라우팅 ── */
var SEARCH = '';
function route(){
  var m = document.getElementById('main');
  if(SEARCH){ m.innerHTML = viewSearch(SEARCH); bindBar(); return; }
  if(DB.loading && !DB.inbox){ m.innerHTML = crumb() + '<div class="card"><div class="empty">불러오는 중…</div></div>'; return; }
  if(CUR.m2 === 'today') m.innerHTML = viewToday();
  else if(CUR.m2 === 'inbox') m.innerHTML = viewInbox();
  else if(CUR.m2 === 'admgr') m.innerHTML = viewAd();
  else if(CUR.m2 === 'photo') m.innerHTML = viewPhoto();
  else if(CUR.m2 === 'settle') m.innerHTML = viewSettle();
  else if(CUR.m2 === 'base') m.innerHTML = viewAdmin();
  else if(CUR.m2 === 'auto') m.innerHTML = viewAuto();
  else if(CUR.m2 === 'stat') m.innerHTML = viewData();
  else if(CUR.m2 === 'gw') m.innerHTML = viewGroup();
  else if(CUR.m2 === 'academy') m.innerHTML = viewAcademy();
  else if(CUR.m2 === 'mkt') m.innerHTML = viewMkt();
  else if(CUR.m2 === 'staff') m.innerHTML = viewStaff();
  else if(CUR.m2 === 'cust') m.innerHTML = viewCust();
  else if(CUR.m2 === 'contract'){
    if(DB.contracts === null){
      m.innerHTML = crumb() + '<div class="h1row"><h1>계약</h1></div>' +
        '<div class="card"><div class="empty">계약 자료를 불러오는 중…</div></div>';
      loadContracts();
    } else m.innerHTML = viewContract();
  }
  else {
    var g = MENU.filter(function(x){ return x[0]===CUR.m1; })[0];
    var s = g[2].filter(function(x){ return x[0]===CUR.m2; })[0];
    m.innerHTML = crumb() + '<div class="h1row"><h1>' + esc(s[1]) + '</h1></div>' +
      '<div class="card"><div class="soonbox"><b>준비 중입니다</b>' +
      '<div>이 메뉴는 아직 붙이지 않았습니다. 지금은 <b>영업CRM › 통합 인입함</b>이 실제로 동작합니다.</div>' +
      '<div style="margin-top:12px"><button class="btn pri" onclick="go(\'crm\',\'inbox\')">통합 인입함으로</button>' +
      ' <button class="btn" onclick="location.href=\'./saas.html\'">기존 SaaS 화면</button></div>' +
      '</div></div>';
  }
  bindBar();
  drawSide();
}
function bindBar(){
  var fq = document.getElementById('fq');
  if(fq) fq.oninput = function(){ UI.qq = fq.value; var p = fq.selectionStart; route();
    var n = document.getElementById('fq'); if(n){ n.focus(); try{ n.setSelectionRange(p,p); }catch(e){} } };
  var fs = document.getElementById('fsrc');
  if(fs) fs.onchange = function(){ UI.src = fs.value; route(); };
  var ft = document.getElementById('fst');
  if(ft) ft.onchange = function(){ UI.st = ft.value; route(); };
}
async function reload(){ await loadAll(true); route(); }
/* 고객은 쓰는 화면에서만 부른다 — 첫 화면을 무겁게 하지 않는다 */
var CU_LOADING = false;
async function loadCustomers(){
  if(DB.customers !== null || CU_LOADING) return;
  CU_LOADING = true;
  try{
    /* 🔴 GAS 는 첫 호출에서 자주 한 번 실패한다 — 매물과 같은 재시도를 쓴다 */
    var d = await jgetTry({ action:'getAll', type:'customers' });
    DB.customers = d.data || d.result || [];
    DB.cuErr = '';                       /* 이번엔 잘 읽혔으니 지난 실패 표시를 지운다 */
  }catch(e){ DB.customers = []; DB.cuErr = String((e && e.message) || e); }
  CU_LOADING = false;
  route();
}
/* 계약 자료는 계약 화면에 들어갈 때만 부른다 — 첫 화면을 무겁게 하지 않는다.
   🔴 여기서 실패해도 DB.err 를 세우지 않는다(다른 화면이 멀쩡해야 한다). */
var CT_LOADING = false;
async function loadContracts(){
  if(DB.contracts !== null || CT_LOADING) return;
  CT_LOADING = true;
  try{
    /* 🔴 실측 2026-09-12: 재시도가 없어 첫 호출 실패로 '계약 0건' 처럼 보였다 */
    var d = await jgetTry({ action:'getAll', type:'contracts' });
    DB.contracts = d.data || d.result || [];
    DB.ctErr = '';
  }catch(e){
    DB.contracts = [];
    DB.ctErr = String((e && e.message) || e);
  }
  CT_LOADING = false;
  route();
}

/* 통합검색 */
document.getElementById('q').addEventListener('keydown', function(e){
  if(e.key === 'Enter'){ SEARCH = this.value.trim(); route(); }
  if(e.key === 'Escape'){ this.value = ''; SEARCH = ''; route(); }
});
document.getElementById('q').addEventListener('input', function(){
  if(!this.value.trim() && SEARCH){ SEARCH = ''; route(); }
});
document.getElementById('btnHelp').onclick = function(){ UI.help = !UI.help; route(); };
['btnAi','btnBell','btnRecent','btnFav','btnOut'].forEach(function(id){
  document.getElementById(id).onclick = function(){ alert('이 기능은 다음 단계에서 붙입니다.'); };
});

/* ── 버전 표시 — 실제 배포와 화면이 어긋나지 않게 원격 커밋을 읽는다 ── */
async function stamp(){
  var el = document.createElement('div');
  el.className = 'foot';
  el.id = 'verline';
  el.textContent = 'ERP ' + ERP_VER + ' · 빌드 ' + ERP_BUILD + ' · commit 확인 중…';
  document.getElementById('main').appendChild(el);
  var txt = 'ERP ' + ERP_VER + ' · 빌드 ' + ERP_BUILD;
  try{
    var r = await fetch('https://api.github.com/repos/' + REPO + '/commits/main');
    var j = await r.json();
    if(j && j.sha){
      var d = ((j.commit||{}).committer||{}).date || '';
      txt += ' · commit ' + String(j.sha).slice(0,7) + (d ? ' · 배포 ' + d.replace('T',' ').replace('Z',' UTC') : '');
    }
  }catch(e){ txt += ' · commit (조회 실패 — 네트워크)'; }
  window.__VER = txt;
  var n = document.getElementById('verline');
  if(n) n.textContent = txt;
}
var _route = route;
route = function(){ _route(); if(window.__VER){
  var el = document.createElement('div'); el.className='foot'; el.textContent = window.__VER;
  document.getElementById('main').appendChild(el); } };

(async function(){
  drawNav();
  route();
  await loadPhotoIndex();
  await loadAll(false);
  route();
  stamp();
})();
</script>
