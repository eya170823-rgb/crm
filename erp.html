/* ── 마케팅: 원소스 멀티유즈 ───────────────────────────────────── */
var MK_SEL = null, MK_CH = '블로그';
var MK_CHANNELS = [
  { key:'블로그',  label:'네이버 블로그', auto:false, note:'발행기는 따로 있습니다(연결 확인 전)' },
  { key:'인스타',  label:'인스타그램',   auto:false, note:'자동 게시 없음 — 문구만 만듭니다' },
  { key:'릴스',    label:'릴스·쇼츠',    auto:false, note:'대본만 만듭니다' },
  { key:'문자',    label:'문자 안내문',  auto:false, note:'🔴 발송하지 않습니다' }
];
function mkFacts(o){
  /* 🔴 매물에 실제로 있는 값만 쓴다 */
  var f = [];
  if(o.kind) f.push(['유형', o.kind]);
  if(o.type) f.push(['거래', o.type]);
  var money = adMoney(o); if(money) f.push(['가격', money + '만']);
  if(o.feeAmt) f.push(['관리비', o.feeAmt + '만']);
  if(o.area) f.push(['면적', o.area]);
  if(o.rooms) f.push(['방', o.rooms]);
  if(o.baths) f.push(['욕실', o.baths]);
  if(o.floor) f.push(['층', o.floor + (o.totalFloor ? ('/' + o.totalFloor) : '')]);
  if(o.direction) f.push(['향', o.direction]);
  if(o.parking) f.push(['주차', o.parking]);
  if(o.pets) f.push(['반려동물', o.pets]);
  if(o.options) f.push(['옵션', String(o.options)]);
  if(o.availDate) f.push(['입주', o.availDate]);
  return f;
}
function mkContent(o, ch){
  var nl = String.fromCharCode(10);
  var head = [o.apt, o.addr2].filter(Boolean).join(' ');
  var facts = mkFacts(o);
  var line = facts.map(function(x){ return x[0] + ' ' + x[1]; }).join(' · ');
  var addr = String(o.addr||'').trim();
  var out = {};
  if(ch === '블로그'){
    out.title = head + ' ' + (o.type||'') + ' ' + (adMoney(o)||'') + ' 매물 안내';
    out.body = [
      head + (addr ? (' (' + addr + ')') : ''), '',
      '■ 매물 정보',
      facts.map(function(x){ return '· ' + x[0] + ' : ' + x[1]; }).join(nl), '',
      '■ 안내',
      '· 확인된 내용만 적었습니다. 더 필요한 정보는 문의 주시면 확인해 드립니다.',
      '', '브리즈부동산중개'
    ].join(nl);
  } else if(ch === '인스타'){
    out.title = head + ' ' + (adMoney(o)||'');
    out.body = [
      '[' + head + ']', (o.type||'') + ' ' + (adMoney(o)||'') + '만',
      line, '', '· 자세한 조건은 프로필 링크·문의로',
      '#제주원룸 #' + String(o.apt||'').replace(/\s/g,'') + ' #브리즈부동산중개'
    ].filter(Boolean).join(nl);
    out.cards = facts.slice(0, 5).map(function(x, i){
      return (i+1) + '. ' + x[0] + ' — ' + x[1]; }).join(nl);
  } else if(ch === '릴스'){
    out.title = head + ' ' + (adMoney(o)||'') + ' 둘러보기';
    out.body = [
      '[0~2초] ' + head + ' ' + (o.type||'') + ' ' + (adMoney(o)||'') + '만',
      '[2~6초] ' + (facts[0] ? (facts[0][0] + ' ' + facts[0][1]) : '내부 모습'),
      '[6~12초] ' + facts.slice(1, 4).map(function(x){ return x[0] + ' ' + x[1]; }).join(', '),
      '[12~15초] 문의는 브리즈부동산중개',
      '', '🔴 촬영 전이라면 먼저 사진·영상이 필요합니다.'
    ].join(nl);
    out.thumb = head + nl + (adMoney(o)||'') + '만';
  } else {
    out.title = head + ' 안내';
    out.body = [
      '[브리즈부동산중개]', head + ' ' + (o.type||'') + ' ' + (adMoney(o)||'') + '만',
      line, '자세한 내용 문의 주세요.'
    ].filter(Boolean).join(nl);
  }
  out.missing = [];
  ['area','rooms','baths','floor','direction','availDate'].forEach(function(k){
    if(!String(o[k]||'').trim()) out.missing.push(
      ({area:'면적',rooms:'방 수',baths:'욕실 수',floor:'층',direction:'향',availDate:'입주일'})[k]);
  });
  return out;
}

var GATHER = null, GATHER_ERR = '', GATHER_LOADING = false;
async function loadGather(){
  if(GATHER !== null || GATHER_LOADING) return;
  GATHER_LOADING = true;
  try{
    var j = await jget({ action:'gatherStatus' });
    GATHER = j.result || j.data || {};
  }catch(e){ GATHER = {}; GATHER_ERR = String((e && e.message) || e); }
  GATHER_LOADING = false;
  route();
}

/* ── 그룹웨어: 오늘 한 일(실데이터) · 할 일 · 결재 ────────────── */
function gwToday(){
  var t = todayStr();
  var inb = DB.inbox || [];
  var L = DB.listings || [];
  var rows = [];
  var todayIn = inb.filter(function(r){ return String(r.when||'').indexOf(t) === 0; });
  if(todayIn.length){
    var by = {};
    todayIn.forEach(function(r){ var s = srcOf(r.kind, r.text); by[s] = (by[s]||0) + 1; });
    rows.push({ when: t, what: '인입 ' + todayIn.length + '건 들어옴',
                detail: Object.keys(by).map(function(k){ return k + ' ' + by[k]; }).join(' · '),
                go: "go('crm','inbox')" });
  }
  L.forEach(function(o){
    if(String(o.recvDate||'').indexOf(t) === 0)
      rows.push({ when: t, what: '매물 접수 ' + o.id,
                  detail: (o.apt||'') + ' ' + (o.addr2||'') + ' · ' + (o.type||'') + ' ' + (adMoney(o)||''),
                  go: "AD_SEL='" + o.id + "';go('ad','admgr')" });
    if(String(o.updatedAt||'').indexOf(t) === 0 && String(o.recvDate||'').indexOf(t) !== 0)
      rows.push({ when: String(o.updatedAt).slice(11,16), what: '매물 수정 ' + o.id,
                  detail: (o.apt||'') + ' ' + (o.addr2||''), go: '' });
  });
  (DB.contracts||[]).forEach(function(c){
    if(String(c.start||'').indexOf(t) === 0)
      rows.push({ when: t, what: '계약 ' + c.id, detail: (c.apt||'') + ' ' + (c.addr2||''),
                  go: "CT_SEL='" + c.id + "';go('deal','contract')" });
  });
  rows.sort(function(a,b){ return String(b.when).localeCompare(String(a.when)); });
  return rows;
}
function gwTodo(){
  var out = [];
  var un = (DB.inbox||[]).filter(function(r){ return !r.reg; }).length;
  if(un) out.push({ n:un, what:'인입 미처리 확인', go:"go('crm','inbox')", cls:'p-warn' });
  var sh = photoTasks().length;
  if(sh) out.push({ n:sh, what:'촬영 필요 매물', go:"go('ops','photo')", cls:'p-bad' });
  var ar = adAll().filter(function(r){ return adLive(r.o); });
  var blocked = ar.filter(function(r){ return r.worst === 'DATA_REQUIRED'; }).length;
  if(blocked) out.push({ n:blocked, what:'광고 필수값 채우기', go:"AD_FILT='';go('ad','admgr')", cls:'p-warn' });
  var ready = ar.filter(function(r){ return r.worst === 'AD_READY'; }).length;
  if(ready) out.push({ n:ready, what:'광고 올릴 수 있는 매물', go:"AD_FILT='ready';go('ad','admgr')", cls:'p-ok' });
  var wait = (APPR||[]).filter(function(a){ return String(a.status||'') === '대기'; }).length;
  if(wait) out.push({ n:wait, what:'결재 대기', go:"go('group','gw')", cls:'p-warn' });
  var ct = DB.contracts || [];
  var bal = ct.filter(function(c){
    var d = ctDaysTo(c.balanceDue);
    return !String(c.balancePaidAt||'').trim() && d !== null && d <= 7; }).length;
  if(bal) out.push({ n:bal, what:'잔금 임박', go:"go('deal','settle')", cls:'p-bad' });
  var dq = 0;
  try{ dq = dqCheck().items.reduce(function(s,x){ return s + x.n; }, 0); }catch(e){}
  if(dq) out.push({ n:dq, what:'손볼 자료', go:"go('data','stat')", cls:'p-warn' });
  return out;
}

/* ── 고객 조건 매칭 — 🔴 기존 매칭의 네 가지 문제를 고쳤다 ───────
   ① 조건을 안 적었으면 만점을 주지 않는다 → 그 항목을 분모에서 뺀다
   ② 예산을 실제로 본다 (기존에는 가격 비교가 아예 없었다)
   ③ 주거를 찾는 고객에게 상가·사무실·토지를 섞지 않는다
   ④ 지역을 적었는데 주소가 안 맞으면 후보로 올리지 않는다
   그리고 조건이 하나도 없는 고객에게는 아무것도 추천하지 않는다
   (예전에는 조건이 비어 있을수록 점수가 높아져 엉뚱한 매물이 1등이었다). */
var CU_BIZ_KIND = ['상가','사무실','건물','공장','창고','토지'];
function cuIsBiz(kind){
  var s = String(kind||'');
  return CU_BIZ_KIND.some(function(k){ return s.indexOf(k) >= 0; });
}
function cuNum(v){
  var s = String(v==null?'':v).replace(/[^0-9.]/g, '');
  return s ? Number(s) : 0;
}
function cuRentish(t){
  var s = String(t||'');
  return s.indexOf('월세') >= 0 || s.indexOf('연세') >= 0 || s.indexOf('단기') >= 0;
}
/* 임대는 보증금 + 월세×12 로 견준다. 같은 잣대를 매물·예산 양쪽에 똑같이 쓴다. */
function cuCost(o){
  var p = cuNum(o.price), r = cuNum(o.rentAmt);
  return String(o.type||'') === '매매' ? p : (p + r * 12);
}
function cuRegions(c){
  return String(c.region||'').split(/[,\/\s]+/).map(function(s){ return s.trim(); })
    .filter(function(s){ return s.length >= 2; });
}
/* 고객이 실제로 적어 둔 조건이 몇 개인지 — 0이면 추천하지 않는다 */
function cuSpecs(c){
  var n = 0;
  if(String(c.type||'').trim()) n++;
  if(String(c.propType||'').trim()) n++;
  if(cuRegions(c).length) n++;
  if(cuNum(c.budget)) n++;
  return n;
}
/* 매물 주소에서 동·읍·면·리를 뽑는다 (2026-09-14 — 지역을 동 단위로 맞추려고) */
function cuDongOf(l){
  var a = String((l && l.addr) || '');
  var out = '';
  a.replace(/[(),]/g, ' ').split(/\s+/).forEach(function(t){
    if(/^[가-힣]{1,6}(동|읍|면|리)$/.test(t)) out = t;
  });
  return out;
}
/* 적은 지역이 동·읍·면·리 단위인가 (2026-09-14) */
function cuRegionDong(rd){
  return /(동|읍|면|리)$/.test(String(rd || ''));
}
/* '서귀포시' → '서귀포' 처럼 넓은 단위 꼬리를 뗀다 (2026-09-14) */
function cuRegionWide(rd){
  return String(rd || '').replace(/(특별자치도|특별시|광역시|시|군|구|도)$/, '');
}
function cuMatch(c){
  var wantType = String(c.type||'').trim();
  var wantKind = String(c.propType||'').trim();
  var regions  = cuRegions(c);
  var budget   = cuNum(c.budget);
  if(!cuSpecs(c)) return [];            /* 🔴 조건이 없으면 빈 손으로 돌려준다 */

  return (DB.listings || []).map(function(l){
    /* ── 하드 필터: 여기서 걸리면 후보가 아니다 ── */
    if(!adLive(l)) return null;                                 /* 계약완료·임대중·보류 */
    if(String(l.status||'') !== '접수') return null;            /* 거래 가능한 것만 */
    if(wantType){
      var same = (String(l.type||'') === wantType);
      var both = cuRentish(wantType) && cuRentish(l.type);
      if(!same && !both) return null;                           /* 매매↔임대 교차 금지 */
    }
    /* ③ 주거를 찾는 고객에게 상가·토지를 섞지 않는다 */
    if(!cuIsBiz(wantKind) && cuIsBiz(l.kind)) return null;
    /* 종류를 적었으면 그 종류만 — '원룸'은 '오픈형 원룸'에 들어가므로 통과한다 */
    if(wantKind && String(l.kind||'').indexOf(wantKind) < 0) return null;
    /* ④ 지역 — 🔴 2026-09-14: **동 단위로 정확히** 맞춰야 한다.
       종전에는 주소 글자에 들어 있기만 하면 통과라, '연동' 을 찾는 고객에게
       '연동로' 같은 다른 동 매물이 섞일 수 있었다. */
    if(regions.length){
      var lDong = cuDongOf(l);
      var lAddr = String(l.addr||'') + ' ' + String(l.apt||'') + ' ' + String(l.addr2||'');
      var hit = regions.some(function(r){
        var rd = String(r).replace(/\s+/g, '');
        if(!rd) return false;
        /* 🔴 2026-09-14 고침 — 적은 지역이 **동 단위인지 넓은 단위인지**를 먼저 가른다.
           1.20.0 은 전부 동으로만 맞춰서 '서귀포시'·'제주시' 를 적은 고객이
           추천 0건이 됐다(검산 day2 C4-fix2 실측). */
        if(cuRegionDong(rd)){
          if(lDong) return (lDong === rd || lDong === rd + '동' || lDong + '동' === rd);
          return lAddr.indexOf(rd) >= 0;   /* 동을 못 읽은 매물만 글자로 봐 준다 */
        }
        /* 시·군·구·도 단위 — 주소에 그 이름이 들어 있으면 맞다 */
        var wide = cuRegionWide(rd);
        return lAddr.indexOf(rd) >= 0 || (wide.length >= 2 && lAddr.indexOf(wide) >= 0);
      });
      if(!hit) return null;
    }

    /* ── 점수 (2026-09-14 개편) ────────────────────────────────
       🔴 거래유형·종류·지역은 **필터로만** 쓴다. 점수에 넣지 않는다.
          여기까지 온 매물은 그 셋을 이미 만족한다 — 점수에 넣으면 전부 만점이라
          변별력이 0이 된다(알려진 결함이었다).
       🔴 점수는 **얼마나 가까운가**로만 매긴다: 예산 40 · 면적 25 · 층 15 · 입주일 20.
       🔴 고객이 안 적은 것은 분모에도 넣지 않는다(안 적었다고 감점하지 않는다). */
    var got = 0, max = 0, why = [];
    var cost = cuCost(l);
    if(budget){
      max += 40;
      if(!cost){ got += 8; why.push('🔴 가격이 비어 있어 예산을 못 봅니다'); }
      else if(cost <= budget * 0.9){ got += 40; why.push('예산보다 쌈'); }
      else if(cost <= budget){ got += 36; why.push('예산 안'); }
      else if(cost <= budget * 1.1){ got += 22; why.push('예산보다 조금 비쌈(10% 안)'); }
      else if(cost <= budget * 1.2){ got += 10; why.push('예산보다 비쌈(20% 안)'); }
      else return null;                    /* 20% 넘게 비싸면 제안하지 않는다 */
    }
    var wantArea = cuNum(c.areaSize);
    if(wantArea){
      max += 25;
      var ar = parseFloat(String(l.area || '').replace(/[^0-9.]/g, '')) || 0;
      if(!ar){ got += 5; why.push('🔴 면적이 비어 있습니다'); }
      else {
        var gap = Math.abs(ar - wantArea) / wantArea;
        if(gap <= 0.05){ got += 25; why.push('면적 딱 맞음'); }
        else if(gap <= 0.15){ got += 18; why.push('면적 비슷함'); }
        else if(gap <= 0.3){ got += 8; why.push('면적 차이 있음'); }
        else why.push('면적이 많이 다름');
      }
    }
    var wantFloor = cuNum(c.conFloor);
    if(wantFloor){
      max += 15;
      var fl = parseInt(String(l.floor || '').replace(/[^0-9]/g, ''), 10) || 0;
      if(!fl){ got += 3; why.push('🔴 층이 비어 있습니다'); }
      else {
        var fg = Math.abs(fl - wantFloor);
        if(fg === 0){ got += 15; why.push('원하는 층'); }
        else if(fg <= 2){ got += 10; why.push('층이 가까움'); }
        else if(fg <= 5){ got += 5; why.push('층 차이 있음'); }
        else why.push('층이 많이 다름');
      }
    }
    var wantIn = String(c.conMoveIn || '').slice(0, 10);
    if(/^\d{4}-\d{2}-\d{2}$/.test(wantIn)){
      max += 20;
      var av = String(l.availDate || '').slice(0, 10);
      if(!/^\d{4}-\d{2}-\d{2}$/.test(av)){ got += 4; why.push('🔴 입주가능일이 비어 있습니다'); }
      else {
        var dd = Math.round((new Date(av + 'T00:00:00') - new Date(wantIn + 'T00:00:00')) / 86400000);
        if(dd <= 0){ got += 20; why.push('바로 입주 가능'); }
        else if(dd <= 14){ got += 15; why.push('2주 안 입주'); }
        else if(dd <= 30){ got += 9; why.push('한 달 안 입주'); }
        else why.push('입주가 늦음(' + dd + '일)');
      }
    }
    /* 🔴 점수를 매길 근거가 하나도 없으면 점수를 만들지 않는다 — "예산 없음" 으로 둔다 */
    if(max === 0){
      return { l:l, pct: null, noScore: true,
               why: ['예산 없음 — 점수를 매길 조건이 없어 최신순으로 보여 드립니다'] };
    }
    return { l:l, pct: Math.round(got * 100 / max), why: why };
  }).filter(Boolean).sort(function(a, b){
    /* 🔴 점수가 없는 것끼리는 **최신순** */
    if(a.pct === null && b.pct === null)
      return String(b.l.recvDate || '').localeCompare(String(a.l.recvDate || ''));

    return cuCost(a.l) - cuCost(b.l);       /* 같은 점수면 싼 것 먼저 */
  });
}

    return { ok:false, why:(who.via === 'NAME' ? '임대인(이름으로 확인)' : '임대인 번호'), who:who };
  if(who.code === 'LISTING')

  if(biz) return { ok:true, why:'업체 영업전화로 보입니다(“' + biz + '”) — 검토 필요',

/* ── §3 문의 공통 이벤트 — 🔴 글에 적힌 것만 읽는다(지어내지 않는다) ── */

/* 🔴 지역 이름은 **우리 자료에 실제로 있는 동·리 이름**만 인정한다.

var INQ_REG = null;

  var m = {};

  }

  (DB.landlords || []).forEach(function(l){ eat(l.addr); });

function inqParse(t){
  var s = String(t || '');
  var o = { desiredRegion:'', propertyType:'', dealType:'', depositBudget:'', rentBudget:'',

  /* 지역 — 🔴 우리 자료에 있는 동 이름만 (어미 오탐 방지) */
  var regs = inqRegionSet(), keep = [];
  for(var ri = 0; ri < regs.length; ri++){
    if(s.indexOf(regs[ri]) >= 0 && keep.indexOf(regs[ri]) < 0) keep.push(regs[ri]);
    if(keep.length >= 3) break;
  }
  if(keep.length){ o.desiredRegion = keep.join(' '); o.read.push('지역'); }
  /* 거래유형 */
  if(/매매|매수|사고\s*싶/.test(s)){ o.dealType = '매매'; o.read.push('거래유형'); }
  else if(/전세/.test(s)){ o.dealType = '전세'; o.read.push('거래유형'); }
  else if(/연세/.test(s)){ o.dealType = '연세'; o.read.push('거래유형'); }
  else if(/월세/.test(s)){ o.dealType = '월세'; o.read.push('거래유형'); }
  /* 종류·구조 */
  if(/오픈형\s*원룸/.test(s)) o.propertyType = '오픈형 원룸';
  else if(/분리형\s*원룸/.test(s)) o.propertyType = '분리형 원룸';
  else if(/1\.5\s*룸/.test(s)) o.propertyType = '1.5룸';
  else if(/투룸|two\s*room|2\s*룸/i.test(s)) o.propertyType = '투룸';
  else if(/쓰리룸|3\s*룸|세\s*방/.test(s)) o.propertyType = '쓰리룸';
  else if(/원룸/.test(s)) o.propertyType = '원룸';
  else if(/아파트/.test(s)) o.propertyType = '아파트';
  else if(/오피스텔/.test(s)) o.propertyType = '오피스텔';
  else if(/상가|사무실|점포/.test(s)) o.propertyType = '상가';
  if(o.propertyType) o.read.push('종류');
  /* 방 수 — "방 2개" · "투룸" 에서만 */
  var rm = s.match(/방\s*(\d)\s*(?:개|칸)?/);
  if(rm){ o.roomCount = rm[1]; o.read.push('방 수'); }
  else if(o.propertyType === '투룸'){ o.roomCount = '2'; o.read.push('방 수(투룸)'); }
  else if(o.propertyType === '쓰리룸'){ o.roomCount = '3'; o.read.push('방 수(쓰리룸)'); }
  else if(o.propertyType === '원룸' || o.propertyType === '오픈형 원룸'){
    o.roomCount = '1'; o.read.push('방 수(원룸)'); }
  /* 예산 — "300/50" · "보증금 300" · "월세 50" · "50에 300" */
  var sl = s.match(/(?:^|[^0-9])(\d{2,5})\s*\/\s*(\d{2,5})(?:[^0-9]|$)/);
  if(sl){ o.depositBudget = sl[1]; o.rentBudget = sl[2]; o.read.push('예산(보증금/월세)'); }
  if(!o.depositBudget){
    var d1 = s.match(/보증금\s*(\d{2,5})/);
    if(d1){ o.depositBudget = d1[1]; o.read.push('예산 보증금'); }
  }
  if(!o.rentBudget){
    var r1 = s.match(/(?:월세|월|임대료)\s*(\d{2,5})/);
    if(r1){ o.rentBudget = r1[1]; o.read.push('예산 월세'); }
  }
  if(!o.depositBudget && !o.rentBudget){
    var man = s.match(/(\d{2,5})\s*만\s*(?:원)?\s*(?:정도|이하|까지|안|내)/);
    if(man){ o.rentBudget = man[1]; o.read.push('예산(대략)'); }
  }
  /* 입주일 */
  var mv = s.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/);
  if(/즉시|바로|당장|이번\s*주/.test(s)){ o.moveInDate = '즉시'; o.read.push('입주일'); }
  else if(mv){ o.moveInDate = mv[1] + '월 ' + mv[2] + '일'; o.read.push('입주일'); }
  else if(/다음\s*달|내달/.test(s)){ o.moveInDate = '다음 달'; o.read.push('입주일'); }
  /* 꼭 있어야 하는 것 / 피하고 싶은 것 */
  if(/주차/.test(s)){

  if(/반려|강아지|고양이|애견|펫/.test(s)){
    if(/반려\s*(?:안|불|금지)/.test(s)) o.avoid.push('반려 불가');
    else { o.pet = '있음'; o.mustHave.push('반려동물 가능'); }
    o.read.push('반려동물');
  }
  if(/엘리베이터|엘베/.test(s)){ o.mustHave.push('엘리베이터'); o.read.push('엘리베이터'); }
  if(/풀옵션|옵션/.test(s)){ o.options.push('풀옵션'); o.read.push('옵션'); }
  if(/1층|일층/.test(s)) o.mustHave.push('1층');
  if(/고층/.test(s)) o.mustHave.push('고층');
  if(/반지하|지하/.test(s)) o.avoid.push('반지하');
  /* 특정 매물 이야기 — 건물 이름·호실이 매물장에 있으면 집는다 */
  var uu = unitSpans(s);
  if(uu.length === 1) o.mentionedUnit = uu[0].u;
  (DB.listings || []).forEach(function(l){
    if(o.mentionedBuilding) return;
    var nm = String(l.apt || '').trim();
    if(nm.length >= 3 && s.indexOf(nm) >= 0) o.mentionedBuilding = nm;

  /* 방문·전화 의사 */
  if(/오늘|지금|당장/.test(s) && /방문|보러|볼\s*수|보고/.test(s)) o.visitWish = '오늘';
  else if(/내일/.test(s) && /방문|보러|볼\s*수|보고/.test(s)) o.visitWish = '내일';
  else if(/방문|보러|볼\s*수|보고\s*싶|구경/.test(s)) o.visitWish = '희망';
  if(/전화\s*(?:주|부탁|해\s*주)|통화\s*(?:가능|부탁)|연락\s*(?:주|부탁)/.test(s)) o.callWish = '전화 요청';
  return o;
}
/* 인입 한 줄 → 문의 이벤트 */

/* 인입함에서 문의만 — 🔴 인입함을 한 번만 훑는다 */
var INQ_ALL = null;
function inqAll(limit){

      var ev = inquiryEvent(r);

      var k = String(ev.receivedAt).slice(0, 16) + '|' + sq(ev.rawText).slice(0, 40);

/* ── §4 기존 고객 우선 연결 — 🔴 고객을 새로 만들지 않는다 ────────── */

/* ── §5 즉시 매칭 — 🔴 조건 미지정은 가산점이 아니라 중립(분모에서 뺀다) ──

function inqNeed(ev, c){

  if(n.dep || n.rent) n.from.push('이번 문의: 예산');
  if(ev.moveInDate) n.from.push('이번 문의: 입주일');

    if(!n.region && String(c.region || '').trim()){ n.region = c.region; n.from.push('고객 저장값: 지역'); }
    if(!n.kind && String(c.propType || '').trim()){ n.kind = c.propType; n.from.push('고객 저장값: 종류'); }
    if(!n.type && String(c.type || '').trim()){ n.type = c.type; n.from.push('고객 저장값: 거래유형'); }
    if(!n.dep && !n.rent && cuNum(c.budget)){ n.dep = cuNum(c.budget); n.from.push('고객 저장값: 예산'); }

  if(n.move) n.specs++;

  if(n.must.length) n.specs++;
  return n;
}
function inqYes(v){ var s = String(v || ''); return /가능|있|예|ㅇ|완비|무료/.test(s) && !/불가|없|안\s*됨/.test(s); }
function inqNo(v){ var s = String(v || ''); return /불가|없|안\s*됨|금지/.test(s); }
/* 입주일 비교 — 매물 availDate 와 손님 희망을 견준다(모르면 중립에 가깝게) */
function inqMoveFit(l, want){

function inqMatch(need){
  if(!need || !need.specs) return [];
  var W = { region:25, kind:20, type:15, money:25, rooms:10, move:10, must:15 };

    /* ── 하드 필터 ── */
    if(!adLive(l)) return null;
    if(String(l.status || '') !== '접수') return null;
    if(need.type){
      var same = (String(l.type || '') === need.type);
      var both = cuRentish(need.type) && cuRentish(l.type);
      if(!same && !both) return null;                       /* 매매↔임대 교차 금지 */
    }
    if(!cuIsBiz(need.kind) && cuIsBiz(l.kind)) return null;  /* 주거 손님에게 상가 금지 */
    if(need.kind){
      var lk = String(l.kind || '');
      var kOk = lk.indexOf(need.kind) >= 0;
      if(!kOk && need.kind === '원룸') kOk = /원룸|오피스텔/.test(lk);
      if(!kOk && need.kind === '투룸') kOk = /투룸|빌라|주택|1\.5/.test(lk);

    if(need.region){
      var regs = String(need.region).split(/[,\/\s]+/).filter(function(x){ return x.length >= 2; });
      var addr = String(l.addr || '') + ' ' + String(l.apt || '') + ' ' + String(l.addr2 || '');
      if(regs.length && !regs.some(function(r){ return addr.indexOf(r) >= 0; })) return null;
    }
    /* 🔴 예산 초과는 상위로 올리지 않는다 — 20% 넘으면 제외 */
    var dep = cuNum(l.price), rent = cuNum(l.rentAmt);
    if(need.dep && dep && dep > need.dep * 1.2) return null;
    if(need.rent && rent && rent > need.rent * 1.2) return null;
    /* 필수조건이 매물에 "불가" 로 적혀 있으면 제외 */
    var must = need.must || [];
    for(var i = 0; i < must.length; i++){
      if(must[i] === '주차' && inqNo(l.parking)) return null;
      if(must[i] === '반려동물 가능' && inqNo(l.pets)) return null;

    }
    /* ── 점수: 손님이 말한 조건만 분모에 넣는다 ── */
    var got = 0, max = 0, why = [], ask = [];
    if(need.region){ max += W.region; got += W.region; why.push('지역 ' + need.region + ' 맞음'); }
    if(need.kind){ max += W.kind; got += W.kind; why.push('종류 ' + need.kind); }
    if(need.type){
      max += W.type;
      got += (String(l.type || '') === need.type) ? W.type : Math.round(W.type * 0.6);
      why.push('거래 ' + (l.type || '?'));
    }
    if(need.dep || need.rent){
      max += W.money;
      var okD = !need.dep || !dep || dep <= need.dep;
      var okR = !need.rent || !rent || rent <= need.rent;
      if(!dep && !rent){ got += W.money * 0.25; ask.push('가격이 매물에 비어 있습니다'); }
      else if(okD && okR){ got += W.money; why.push('예산 안 (' + dep + '/' + rent + ')'); }
      else { got += W.money * 0.5; why.push('예산보다 조금 비쌈 (' + dep + '/' + rent + ')'); }
    }
    if(need.rooms){
      max += W.rooms;
      var lr = cuNum(l.rooms);
      if(!lr){ got += W.rooms * 0.3; ask.push('방 수가 매물에 비어 있습니다'); }
      else if(lr >= cuNum(need.rooms)){ got += W.rooms; why.push('방 ' + lr + '개'); }
      else { got += W.rooms * 0.3; why.push('방 ' + lr + '개(희망 ' + need.rooms + ')'); }
    }
    if(need.move){
      max += W.move;
      var mf = inqMoveFit(l, need.move);
      got += W.move * mf.pts;
      if(mf.why) (mf.pts >= 0.8 ? why : ask).push(mf.why);
    }
    if(must.length){
      max += W.must;
      var hit = 0;
      must.forEach(function(m){
        if(m === '주차' && inqYes(l.parking)){ hit++; why.push('주차 ' + l.parking); return; }
        if(m === '반려동물 가능' && inqYes(l.pets)){ hit++; why.push('반려 ' + l.pets); return; }
        if(m === '엘리베이터' && inqYes(l.elevator)){ hit++; why.push('엘리베이터 있음'); return; }
        ask.push(m + ' 여부가 매물에 비어 있습니다');
      });
      got += W.must * (must.length ? (hit / must.length) : 0);
    }
    return { l:l, pct:Math.round(got * 100 / max), why:why, ask:ask,
             cost:cuCost(l) };
  }).filter(Boolean).sort(function(a, b){
    if(b.pct !== a.pct) return b.pct - a.pct;
    return a.cost - b.cost;                                  /* 같은 점수면 싼 것 먼저 */
  });
}
function inqTop3(ev, c){
  var need = inqNeed(ev, c || null);
  var all = inqMatch(need);
  /* 🔴 손님이 짚은 그 매물은 맨 앞에 둔다(거래가능일 때만). 점수와 무관하게 그것을 물었다. */
  var ml = ev.mentionedListing;
  if(ml && ml.live){
    all = all.filter(function(x){ return String(x.l.id) !== ml.id; });
    var lo = (DB.listings || []).filter(function(x){ return String(x.id) === ml.id; })[0];
    if(lo) all.unshift({ l:lo, pct:100, why:['손님이 이 방을 직접 물었습니다'], ask:[],
                         cost:cuCost(lo) });
  }
  return { need:need, top:all.slice(0, 3), n:all.length,
           why:all.length ? '' : (need.specs
             ? '조건에 맞는 거래가능 매물이 없습니다'
             : '조건이 한 칸도 없어 추천하지 않습니다 — 무엇을 원하시는지 먼저 물어야 합니다') };
}

/* ── §7 문의 우선순위 — 🔴 실제로 적힌 것만 근거로 쓴다 ────────── */
function inqHeat(ev, lk, mt){
  var why = [], code = 'LOW';
  var p = ev._p || {};
  if(ev.review){ return { code:'REVIEW', why:['업체 영업전화로 보입니다 — ' + ev.why] }; }
  if(lk && lk.code === 'BLOCKED') return { code:'REVIEW', why:['연락금지 고객'] };
  if(p.visitWish === '오늘' || p.visitWish === '내일'){ code = 'HOT'; why.push(p.visitWish + ' 방문을 원합니다'); }
  if(p.callWish){ if(code !== 'HOT') code = 'HOT'; why.push('전화를 달라고 했습니다'); }
  if(ev.mentionedListingId){ if(code !== 'HOT') code = 'HOT'; why.push('특정 매물을 짚어 물었습니다'); }
  if(String(p.moveInDate || '') === '즉시'){ if(code !== 'HOT') code = 'HOT'; why.push('즉시 입주를 원합니다'); }
  if(code !== 'HOT'){
    var sp = (mt && mt.need) ? mt.need.specs : 0;
    if(sp >= 2 && mt && mt.top && mt.top.length){ code = 'WARM';
      why.push('조건이 ' + sp + '가지 있고 보여 줄 매물이 ' + mt.top.length + '건 있습니다'); }
    else if(lk && lk.code === 'REOPEN_REVIEW'){ code = 'FOLLOW_UP'; why.push('종료 고객의 새 연락'); }
    else if(sp >= 1){ code = 'FOLLOW_UP'; why.push('조건이 ' + sp + '가지뿐입니다'); }
    else { code = 'LOW'; why.push('조건이 없습니다 — 무엇을 원하는지 물어야 합니다'); }
  }
  if(lk && lk.code === 'REOPEN_REVIEW' && code === 'HOT') why.push('종료 고객이라 재오픈 검토가 함께 필요합니다');
  return { code:code, why:why };
}

/* ── §6 응답 준비 — 🔴 초안만 만든다. 보내지 않는다 ───────────── */
function inqAskList(ev, mt){
  var q = [], p = ev._p || {}, n = (mt && mt.need) || {};
  if(!n.region) q.push('어느 동네를 보고 계신가요?');
  if(!n.kind) q.push('원룸·투룸 중 어느 쪽을 찾으시나요?');
  if(!n.dep && !n.rent) q.push('보증금·월세는 어느 정도로 보고 계신가요?');
  if(!n.move) q.push('언제 입주를 원하시나요?');
  if(!p.parking && !(n.must || []).length) q.push('주차·반려동물 같이 꼭 필요한 것이 있나요?');
  (mt && mt.top || []).forEach(function(x){
    (x.ask || []).forEach(function(a){
      var s = x.l.apt + ' ' + x.l.addr2 + ' — ' + a;
      if(q.indexOf(s) < 0) q.push(s);
    });
  });
  return q;
}
function inqDraft(ev, lk, mt, heat){
  var LF = String.fromCharCode(10);
  var name = String(ev.customer || '').trim();
  var head = (name ? (name + '님, ') : '') + '안녕하세요, 브리즈부동산중개입니다.';
  var body = [head];
  /* 🔴 짚어 물은 방이 이미 나갔으면 그것부터 사실대로 말한다 */
  var ml2 = ev.mentionedListing;
  if(ml2 && !ml2.live)
    body.push(ml2.apt + ' ' + ml2.unit + ' 는 현재 ' + (ml2.status || '거래 마감') +
              ' 상태입니다. 비슷한 조건으로 대신 보실 방을 정리했습니다.');
  if(mt && mt.top && mt.top.length){
    body.push('문의 주신 조건으로 지금 보실 수 있는 방을 정리했습니다.');
    mt.top.forEach(function(x, i){
      var l = x.l;
      var line = (i + 1) + ') ' + String(l.apt || '') + ' ' + String(l.addr2 || '') + ' · ' +
        String(l.type || '') + ' ' + cuNum(l.price) + (cuNum(l.rentAmt) ? ('/' + cuNum(l.rentAmt)) : '') +
        (cuNum(l.area) ? (' · ' + cuNum(l.area) + '㎡') : '') +
        (String(l.floor || '') ? (' · ' + l.floor) : '');
      body.push(line);
    });
  } else {
    body.push('조건을 조금만 더 알려 주시면 맞는 방을 골라 보여 드리겠습니다.');
  }
  var ask = inqAskList(ev, mt);
  if(ask.length) body.push('확인 부탁드립니다: ' + ask.slice(0, 2).join(' / '));
  body.push('편하신 시간 알려 주시면 방 보시게 준비해 두겠습니다.');
  return body.join(LF);
}
function inqPrep(ev){
  var lk = inqLink(ev);
  var mt = inqTop3(ev, lk.c);
  var heat = inqHeat(ev, lk, mt);
  var p = ev._p || {};
  var wants = [];
  if(p.desiredRegion) wants.push('지역 ' + p.desiredRegion);
  if(p.propertyType) wants.push('종류 ' + p.propertyType);
  if(p.dealType) wants.push('거래 ' + p.dealType);
  if(p.depositBudget || p.rentBudget)
    wants.push('예산 ' + (p.depositBudget || '?') + '/' + (p.rentBudget || '?'));
  if(p.moveInDate) wants.push('입주 ' + p.moveInDate);
  if(p.roomCount) wants.push('방 ' + p.roomCount);
  if((p.mustHave || []).length) wants.push('꼭 필요 ' + p.mustHave.join('·'));
  if((p.avoid || []).length) wants.push('피하고 싶은 것 ' + p.avoid.join('·'));
  if(ev.mentionedListing) wants.push('짚은 매물 ' + ev.mentionedListing.apt + ' ' +
    ev.mentionedListing.unit + '(' + (ev.mentionedListing.status || '?') + ')');
  if(p.visitWish) wants.push('방문 ' + p.visitWish);
  if(p.callWish) wants.push(p.callWish);
  /* 전화냐 문자냐 — 손님이 준 신호로 정한다 */
  var howCode = 'SMS', howWhy = '문자로 먼저 보내고 답을 기다립니다';
  if(p.callWish){ howCode = 'CALL'; howWhy = '손님이 전화를 달라고 했습니다'; }
  else if(ev.source === '부재중전화'){ howCode = 'CALL'; howWhy = '부재중 전화라 회신이 필요합니다'; }
  else if(ev.source === '통화녹음'){ howCode = 'CALL'; howWhy = '전화로 이야기하던 건이라 전화가 자연스럽습니다'; }
  else if(heat.code === 'HOT'){ howCode = 'CALL'; howWhy = '급한 문의라 전화가 빠릅니다'; }
  return { ev:ev, link:lk, match:mt, heat:heat,
           wants:wants, ask:inqAskList(ev, mt), draft:inqDraft(ev, lk, mt, heat),
           how:{ code:howCode, why:howWhy },
           visit:(p.visitWish ? inqVisitPlan(ev, mt) : null),
           note:'🔴 초안입니다 — 이 화면은 문자를 보내지 않습니다. 대표님이 복사해 보내십니다.' };
}

/* ── §8 방문예약 준비 — 한 묶음으로 ───────────────────────────── */
function inqVisitPlan(ev, mt){
  var p = ev._p || {};
  mt = mt || inqTop3(ev, (inqLink(ev) || {}).c);
  var stops = (mt.top || []).map(function(x){
    var l = x.l;
    /* 🔴 이미 가진 출입정보가 있으면 다시 묻지 않는다 */
    var door = '';
    var hay = String(l.note || '') + ' ' + String(l.desc || '');
    var dm = hay.match(/(?:비번|비밀번호|출입|현관)[^0-9]{0,6}(\d{3,6})/);
    if(dm) door = '이미 있음(화면에 적지 않습니다)';
    return { id:String(l.id), apt:String(l.apt || ''), unit:String(l.addr2 || ''),
             addr:String(l.addr || ''), floor:String(l.floor || ''),
             price:cuNum(l.price), rent:cuNum(l.rentAmt), fee:cuNum(l.feeAmt),
             avail:String(l.availDate || ''),
             door:door || '🔴 출입방법 확인 필요(임대인)',
             photo:(function(){
               try{ var ph = adPhotoOf(l);
                    return (ph && ph.unit && ph.unit.done > 0)
                      ? ('그 호실 사진 ' + ph.unit.done + '장 있음')
                      : '그 호실 사진 없음(보여 줄 때 참고)'; }catch(e){ return ''; }
             })(),
             ld:(function(){
               var lds = (DB.landlords || []).filter(function(x2){
                 return sq(x2.apt) && sq(x2.apt) === sq(l.apt); });
               return lds.length ? ('임대인 ' + lds.length + '명 명부에 있음') : '임대인 미확인';
             })() };
  });
  /* 이동 순서 — 같은 건물끼리 묶고, 주소가 같은 동네끼리 이어 본다 */
  stops.sort(function(a, b){
    var ka = a.apt + ' ' + a.addr, kb = b.apt + ' ' + b.addr;
    return ka.localeCompare(kb);
  });
  return { when:(p.visitWish || ''), meet:(stops.length ? (stops[0].apt + ' 앞') : ''),
           stops:stops, order:stops.map(function(s){ return s.apt + ' ' + s.unit; }),
           note:'🔴 예약을 잡지 않습니다 — 대표님이 시간을 정하면 이 묶음을 그대로 씁니다' };
}

/* ── §9 클로징 지원 — 미팅 뒤 최소 입력으로 ────────────────────── */
function inqClose(form){
  var f = form || {};
  var out = { input:f, negotiate:[], askLandlord:[], alts:[], nextAt:'', prep:[],
              note:'🔴 계약을 만들지 않습니다 — 제안만 합니다' };
  var l = (DB.listings || []).filter(function(x){ return String(x.id) === String(f.listingId || ''); })[0];
  var price = l ? cuNum(l.price) : 0, rent = l ? cuNum(l.rentAmt) : 0;
  if(String(f.priceResist || '').trim()){
    if(rent) out.negotiate.push('월세 ' + rent + '만 → ' + Math.max(0, rent - 3) + '~' + Math.max(0, rent - 5) + '만 조정 여지 확인');
    if(price) out.negotiate.push('보증금 ' + price + '만 올리고 월세 낮추는 안 (임대인 선호 확인)');
    out.askLandlord.push('가격 조정이 가능한지');
  }
  if(String(f.blocker || '').trim()){
    out.askLandlord.push('“' + String(f.blocker).slice(0, 30) + '” 을 고쳐 줄 수 있는지');
    out.negotiate.push('수리·정비 조건을 계약서에 적는 안');
  }
  if(String(f.moveIn || '').trim()){
    out.askLandlord.push('입주일 ' + f.moveIn + ' 가능 여부');
  }
  if(String(f.decider || '').trim())
    out.prep.push('결정하는 분(' + String(f.decider).slice(0, 20) + ')이 함께 보실 시간 잡기');
  /* 대안 매물 — 같은 조건에서 다음 후보 */
  if(f.eventRow != null){
    var evs = inqAll(0).filter(function(e){ return String((e._row || {}).row) === String(f.eventRow); });
    if(evs.length){
      var mt = inqTop3(evs[0], (inqLink(evs[0]) || {}).c);
      out.alts = (mt.top || []).filter(function(x){ return String(x.l.id) !== String(f.listingId || ''); })
        .slice(0, 2).map(function(x){ return x.l.apt + ' ' + x.l.addr2 + ' (' + x.pct + '%)'; });
    }
  }
  /* 재접촉 시점 — 걸림돌이 있으면 짧게, 없으면 이틀 뒤 */
  var d = new Date();
  d.setDate(d.getDate() + (String(f.blocker || '').trim() ? 1 : 2));
  out.nextAt = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  out.prep.push('계약 준비: 등기부·건축물대장 확인 · 확인설명서 초안 · 계약금 입금계좌 확인');
  return out;
}

/* ── §10 오늘 응대·방문·계약 후보 ─────────────────────────────── */
function inqToday(){
  var today = todayStr();
  var out = { answer:[], visit:[], close:[], synthetic:0, real:0 };
  inqAll(0).forEach(function(ev){
    var pr = inqPrep(ev);
    var days = ctDaysTo(String(ev.receivedAt).slice(0, 10));
    var fresh = (days === null) ? false : (days >= -3);       /* 사흘 안에 온 것 */
    var row = { ev:ev, prep:pr, when:ev.receivedAt, heat:pr.heat.code };
    if(pr.heat.code === 'HOT' || (fresh && pr.heat.code === 'WARM')) out.answer.push(row);
    if((ev._p || {}).visitWish) out.visit.push(row);
    if(pr.link.code === 'EXISTING_ACTIVE' && pr.match.top.length) out.close.push(row);
    out.real++;
  });
  out.answer.sort(function(a, b){ return String(b.when).localeCompare(String(a.when)); });
  return out;
}

/* ═══════════════════════════════════════════════════════════════════
   4단계 — 실제 영업 운영 연결 (2026-09-13)
   ② 번호 없는 통화녹음을 이름으로 잇는다   ③ 신규고객 승인등록(승인 전 생성 0)
   ⑤ 촬영을 건물 동선으로 묶는다            ⑧ 오늘 실행판
   🔴 문자·게시·계약을 자동으로 하지 않는다. 고객은 대표 승인 뒤에만 만든다.
   ═══════════════════════════════════════════════════════════════════ */

/* ── ② 번호 없는 통화녹음 ───────────────────────────────────────
   녹음 파일 이름이 '통화 녹음 <상대>_날짜_시각' 이라, 주소록에 **이름**으로 저장된 사람은
   번호가 비어 들어온다(실측: 번호 없는 통화 52건 전부 이름은 있었다).
   그래서 이름으로 잇는다 — 🔴 딱 하나일 때만. 여럿이면 잇지 않고 REVIEW.
   잘못된 사람에게 잇는 것보다 못 잇는 것이 낫다. */
function inqUnitStrip(s){ return String(s || '').replace(/\d{2,4}\s*호/g, ''); }
function inqByName(nm){
  var base = sq(nm), cut = sq(inqUnitStrip(nm));
  if(!base) return { code:'NONAME', hits:[] };
  var hits = [];
  function eat(tag, rows, f){
    (rows || []).forEach(function(o){
      var v = sq(o[f]);
      if(!v || v.length < 3) return;
      var how = '';
      if(v === base) how = '주소록 이름이 명부와 같습니다';
      else if(v === cut) how = '호실만 떼면 명부 이름과 같습니다';
      else if(v.length >= 5 && base.indexOf(v) >= 0) how = '주소록 이름 안에 명부 이름이 들어 있습니다';
      if(how) hits.push({ tag:tag, o:o, how:how });
    });
  }
  eat('CUSTOMER', DB.customers, 'name');
  eat('LANDLORD', DB.landlords, 'name');
  eat('LISTING', DB.listings, 'cname');
  var seen = {}, uniq = [];
  hits.forEach(function(h){
    var k = h.tag + ':' + String(h.o.id);
    if(!seen[k]){ seen[k] = 1; uniq.push(h); } });
  if(uniq.length === 1)
    return { code:uniq[0].tag, hit:uniq[0].o, how:uniq[0].how, hits:uniq };
  if(uniq.length > 1)
    return { code:'AMBIG', hits:uniq,
             how:'이름이 맞는 사람이 ' + uniq.length + '명입니다 — 잇지 않았습니다' };
  /* 이름이 아니라 주소록 라벨('임대-노형동738-12진군길25퀸하우스')일 때 — 건물이 한 곳이면 건물까지만 */
  var bl = {};
  function eatB(rows){
    (rows || []).forEach(function(o){
      var a = sq(o.apt);
      if(a && a.length >= 3 && base.indexOf(a) >= 0) bl[String(o.apt).trim()] = 1; }); }
  eatB(DB.listings);
  eatB(DB.landlords);
  var names = Object.keys(bl);
  if(names.length === 1)
    return { code:'BUILDING', bldg:names[0], hits:[],
             how:'주소록 이름에 건물 이름(' + names[0] + ')이 있습니다 — 사람은 아직 모릅니다' };
  if(names.length > 1)
    return { code:'AMBIG', hits:[],
             how:'주소록 이름에 건물 이름이 ' + names.length + '개 있습니다 — 잇지 않았습니다' };
  return { code:'UNKNOWN', hits:[], how:'명부에서 찾지 못했습니다' };
}

/* 고객 번호는 기존 CRM 과 같은 꼴로 만든다(index.html uid() = 시각_무작위5자).
   🔴 형식이 다르면 두 화면이 같은 사람을 다르게 본다. */
function cuNewId(list){
  var id;
  do { id = String(Date.now()) + '_' + Math.random().toString(36).slice(2, 7); }
  while((list || []).some(function(c){ return String(c.id) === id; }));
  return id;
}

/* ── ③ 신규고객 승인등록 — 🔴 대표가 누르기 전에는 아무것도 만들지 않는다 ── */
function inqNewCustomerDraft(ev){
  var pr = inqPrep(ev);
  var p = ev._p || {};
  var nl = String.fromCharCode(10);
  var note = ['[문의 ' + String(ev.receivedAt).slice(0, 16) + ' ' + ev.source + ']',
              maskSecret(String(ev.rawText || '')).slice(0, 300)];
  if(pr.wants.length) note.push('읽어낸 조건: ' + pr.wants.join(' · '));
  if((pr.match.top || []).length)
    note.push('그때 추천: ' + pr.match.top.map(function(t){
      return String(t.l.apt || '') + ' ' + String(t.l.addr2 || '') + '(' + t.pct + '%)'; }).join(' / '));
  if(pr.ask.length) note.push('확인할 것: ' + pr.ask.slice(0, 3).join(' / '));
  return {
    id:'', name:(String(ev.customer || '').trim() || ('문의 ' + String(ev.receivedAt).slice(5, 16))),
    phone:String(ev.phone || ''), role:'임차인', type:String(p.dealType || ''),
    recvDate:String(ev.receivedAt).slice(0, 10), deadline:'',
    budget:(p.depositBudget || p.rentBudget)
      ? ((p.depositBudget || '') + (p.rentBudget ? ('/' + p.rentBudget) : '')) : '',
    region:String(p.desiredRegion || ''), propType:String(p.propertyType || ''),
    areaSize:'', step:'0', progressStatus:'진행중',
    conApt:(ev.mentionedListing ? String(ev.mentionedListing.apt || '') : ''),
    conMoveIn:String(p.moveInDate || ''), conFloor:'', conUnit:'', conPrice:'', conRenewal:'',
    note:note.join(nl).slice(0, 1500), nextAction:todayStr(), agent:'',
    _prep:pr
  };
}

/* ── ⑤ 촬영을 건물 동선으로 묶는다 (호실별 일정이 아니라 건물 한 번) ── */
function shootPlan(){
  var by = {};
  listingAdAll().forEach(function(x){
    if(!adLive(x.o)) return;
    if(x.ev.todo.code !== 'NEED_PHOTO') return;
    var key = String(x.o.apt || '(이름 없음)');
    var b = by[key] || (by[key] = { apt:key, addr:String(x.o.addr || ''), units:[],
                                    common:0, doors:0, lds:[], need:{} });
    var ph = x.ev.ad.photo || {};
    b.common = Math.max(b.common, ph.BUILDING_COMMON || 0);
    var hay = String(x.o.note || '') + ' ' + String(x.o.desc || '');
    var hasDoor = /비번|비밀번호|출입|현관/.test(hay);
    if(hasDoor) b.doors++;
    var miss = (x.ev.ad.needs && x.ev.ad.needs.missingRequired || [])
      .map(function(m){ return m.label; });
    miss.forEach(function(m){ b.need[m] = (b.need[m] || 0) + 1; });
    b.units.push({ id:String(x.o.id), unit:String(x.o.addr2 || ''),
                   floor:String(x.o.floor || ''), type:String(x.o.type || ''),
                   price:cuNum(x.o.price), rent:cuNum(x.o.rentAmt),
                   other:ph.OTHER_UNIT_REFERENCE || 0, door:hasDoor, miss:miss });
  });
  var out = Object.keys(by).map(function(k){ return by[k]; });
  out.forEach(function(b){
    b.units.sort(function(p, q){
      return (parseInt(p.unit, 10) || 0) - (parseInt(q.unit, 10) || 0); });
    /* 그 건물 임대인 — 이미 아는 사람만 */
    b.lds = (DB.landlords || []).filter(function(l){
      return sq(l.apt) && sq(l.apt) === sq(b.apt); })
      .map(function(l){ return { id:String(l.id), name:String(l.name || ''),
                                 mask:phMask(l.phone) }; });
    b.shots = ['현관·거실', '방(호실마다)', '주방', '욕실', '창밖 전망', '건물 외관(한 번만)'];
  });
  /* 호실이 많은 건물부터 — 한 번 가서 많이 찍는 순서 */
  out.sort(function(a, b){ return b.units.length - a.units.length; });
  return { buildings:out, units:out.reduce(function(a, b){ return a + b.units.length; }, 0) };
}
function shootCopy(){
  var nl = String.fromCharCode(10);
  var p = shootPlan();
  var L = ['촬영 동선 — 건물 ' + p.buildings.length + '곳 · 호실 ' + p.units + '개', ''];
  p.buildings.forEach(function(b, i){
    L.push((i + 1) + ') ' + b.apt + '  (' + b.units.length + '호실)');
    L.push('   주소 ' + b.addr);
    L.push('   호실 ' + b.units.map(function(u){ return u.unit; }).join(', '));
    L.push('   찍을 것 ' + b.shots.join(' · '));
    L.push('   건물 공용부 사진 ' + (b.common ? (b.common + '장 있음(또 안 찍어도 됨)') : '없음'));
    L.push('   출입방법 아는 호실 ' + b.doors + '/' + b.units.length);
    L.push('   임대인 ' + (b.lds.length ? b.lds.map(function(x){
      return (x.name || '이름없음') + ' ' + x.mask; }).join(' / ') : '명부에 없음'));
    var nk = Object.keys(b.need);
    if(nk.length) L.push('   같이 확인할 값 ' + nk.map(function(k){
      return k + '(' + b.need[k] + '건)'; }).join(' · '));
    L.push('');
  });
  L.push('🔴 이 목록은 사진을 올리거나 광고를 올리지 않습니다 — 찍어 오시면 폴더에 넣습니다.');
  copyText(L.join(nl), '촬영 동선을 복사했습니다');
}

/* ── ⑧ 오늘 실행판 — 대표가 오늘 움직일 사람·매물만 ────────────── */
function todayBoard(){
  var iq = inqToday();
  var la = listingAdAll().filter(function(x){ return adLive(x.o); });
  var sp = shootPlan();
  var done = doneAlerts();
  var doneIds = {};
  done.forEach(function(a){ a.hits.forEach(function(h){ doneIds[String(h.o.id)] = 1; }); });
  return {
    answer:iq.answer,                                     /* 즉시 응답 */
    visit:iq.visit,                                       /* 오늘 방문 */
    close:iq.close,                                       /* 계약 가능 */
    vacancy:{ n:Object.keys(doneIds).length,              /* 공실 확보(계약완료 확인) */
              why:'계약완료 문자가 온 매물 — 상태를 바꾸면 그 방이 정리됩니다' },
    ad:{ ready:la.filter(function(x){ return x.ev.ad.code === 'AD_READY_PREVIEW'; }).length,
         data:la.filter(function(x){ return x.ev.ad.code === 'DATA_REQUIRED'; }).length,
         photo:la.filter(function(x){ return x.ev.ad.code === 'PHOTO_REQUIRED'; }).length,
         review:la.filter(function(x){ return x.ev.ad.code === 'REVIEW_REQUIRED'; }).length,
         shootB:sp.buildings.length, shootU:sp.units }
  };
}

/* ── 대표님 단추 — 🔴 복사만 한다. 보내지 않는다 ─────────────────── */
function inqFindByRow(row){
  var all = inqAll(0);
  for(var i = 0; i < all.length; i++)
    if(String((all[i]._row || {}).row) === String(row)) return all[i];
  return null;
}

/* ── 재접촉 대상 ─────────────────────────────────────────────────
   종료 고객 제외 · 연락금지 제외 · 담당 밖 제외. */
function cuBlocked(c){
  var t = String(c.note||'') + ' ' + String(c.progressStatus||'');
  return t.indexOf('연락금지') >= 0 || t.indexOf('수신거부') >= 0;
}
function reContact(){
  return (DB.customers || []).filter(function(c){
    if(String(c.progressStatus||'').trim() === '종료') return false;
    if(cuBlocked(c)) return false;
    if(!inMyScope(c)) return false;
    return true;
  }).map(function(c){
    var d = ctDaysTo(c.nextAction);
    var ms = cuMatch(c);
    return { c:c, d:d,
             due: (d !== null && d <= 0),
             noPlan: !String(c.nextAction||'').trim(),
             top: ms.slice(0, 3), n: ms.length };
  }).sort(function(a, b){
    var ka = (a.d === null ? 9000 : a.d), kb = (b.d === null ? 9000 : b.d);
    if(ka !== kb) return ka - kb;
    return b.n - a.n;
  });
}

/* ═══ 월요일 실행 도구 ═══════════════════════════════════════════
   🔴 여기 있는 어느 것도 전화를 걸거나 문자를 보내지 않는다.
      목록을 만들고, 문자 글을 만들어 복사해 드릴 뿐이다. ═══════════ */

/* ── ① 🔴 '계약완료 문자' 와 매물장이 어긋나는 것 ────────────────
   서버가 임대완료 문자를 알아보고 인입함에 ⚠️ 로 넣어 둔다.
   그 호실이 우리 매물장에 아직 '접수' 로 있으면 헛걸음하게 된다. */
var DONE_MARK = '임대완료 문자';
/* 🔴 한 문자에 호실이 여럿 나오면 **호실마다 그 뒤 문구를 따로** 본다.
   "301호는 계약됐구요! 402호는 남아있어요~" 에서 402호까지 계약완료로 보면
   아직 살아 있는 방을 죽인다(2026-09-12 실측으로 잡은 오판). */
var DONE_SAY = ['계약완료', '계약 완료', '계약됐', '계약 됐', '계약되었', '계약 되었',
                '나갔', '마감', '임대완료', '임대 완료', '계약이 진행', '계약진행중'];
var STILL_SAY = ['남아', '남았', '있어요', '있습니다', '가능', '공실', '비어', '퇴실 예정',
                 '퇴실예정', '입주'];
/* 🔴 한 문장을 호실마다 쪼개는 일은 **여기 한 곳에서만** 한다.
   doneUnits(계약완료 목록) 와 statusHintOf(호실별 최신상태) 가 같은 결과를 쓴다 —
   두 군데서 따로 판정하면 언젠가 서로 어긋난다. */
function unitSpans(t){
  var s2 = String(t || ''), pos = [], i = 0;
  while(i < s2.length){
    var j = s2.indexOf('호', i);
    if(j < 0) break;
    var k = j - 1, num = '';
    while(k >= 0){
      var c = s2.charCodeAt(k);
      if(c >= 48 && c <= 57){ num = s2.charAt(k) + num; k--; }
      else break;
    }
    if(num.length >= 3 && num.length <= 4) pos.push({ u:num + '호', at:k + 1, end:j + 1 });
    i = j + 1;
  }
  for(var m = 0; m < pos.length; m++){
    pos[m].seg = s2.slice(pos[m].end, (m + 1 < pos.length) ? pos[m + 1].at : s2.length);
  }
  return pos;
}
function sayHas(seg, list){
  for(var n = 0; n < list.length; n++) if(String(seg || '').indexOf(list[n]) >= 0) return true;
  return false;
}
/* 그 호실 한 칸만 보고 'DONE'(계약완료) · 'STILL'(아직 있음) · '' 를 돌려준다 */
function unitSay(t, unit){
  var s2 = String(t || ''), pos = unitSpans(s2), u = sq(unit);
  for(var m = 0; m < pos.length; m++){
    if(sq(pos[m].u) !== u) continue;
    var isDone = sayHas(pos[m].seg, DONE_SAY), isStill = sayHas(pos[m].seg, STILL_SAY);
    /* 그 호실 뒤에 아무 말이 없으면(앞에 몰아서 쓴 문장) 문장 전체를 본다 */
    if(!isDone && !isStill) isDone = sayHas(s2, DONE_SAY);
    if(isStill) return 'STILL';
    return isDone ? 'DONE' : '';
  }
  return '';
}
function doneUnits(t){
  var s2 = String(t || ''), pos = unitSpans(s2), out = [];
  for(var m = 0; m < pos.length; m++){
    if(unitSay(s2, pos[m].u) === 'DONE' && out.indexOf(pos[m].u) < 0) out.push(pos[m].u);
  }
  return out;
}
/* 같은 호실에 여러 문자가 있을 때 **가장 최근 직접근거** 만 쓴다.
   rows 는 {when, text} 꼴. 🔴 문장 전체 상태를 한 번에 적용하지 않는다. */
function statusHintOf(rows, unit){
  var best = null;
  (rows || []).forEach(function(r){
    var say = unitSay(r.text, unit);
    if(!say) return;
    var wn = String(r.when || '');
    if(!best || wn > best.when) best = { when:wn, say:say, text:String(r.text || '') };
  });
  if(!best) return { code:'UNKNOWN', when:'', text:'', why:'그 호실을 직접 말한 문자가 없습니다' };
  if(best.say === 'DONE')
    return { code:'CONTRACT_DONE', when:best.when, text:best.text,
             why:'가장 최근 직접근거가 계약완료이고 그 뒤에 "있다"는 말이 없습니다' };
  var soon = sayHas(best.text, ['퇴실 예정', '퇴실예정']);
  return { code: soon ? 'MOVEOUT_SOON' : 'AVAILABLE', when:best.when, text:best.text,
           why:'가장 최근 직접근거가 ' + (soon ? '퇴실 예정' : '아직 있다') + ' 입니다' };
}

         건물 이름이 없었다 — 이름에만 있었다(실측). 이름에 **그 매물의** 건물명이나
         지번이 들어 있을 때만 쓴다(다른 건물로 번지지 않는다). */
      var nm = sq(r.name);

      if(same || inbody || sameJ || inName || jbName)

/* ═══ 재오픈 검토 ═══════════════════════════════════════════════
   종료된 고객에게 **그 뒤로** 새 연락이 오면, 종료를 풀지 않고 '검토 후보'로만 올린다.
   🔴 자동으로 종료를 해제하지 않는다 · 🔴 고객을 새로 만들지 않는다 · 🔴 문자를 보내지 않는다.
   실제 상태 변경은 [다시 상담 시작] 을 눌렀을 때만 일어난다. */
function phDigits(v){
  var t = String(v == null ? '' : v), out = '';
  for(var i = 0; i < t.length; i++){
    var c = t.charCodeAt(i);
    if(c >= 48 && c <= 57) out += t.charAt(i);
  }
  if(out.length >= 11 && out.slice(0, 2) === '82') out = '0' + out.slice(2);
  return out;
}
/* 🔴 전화 칸에 번호가 여러 개 들어 있는 일이 흔하다
   (실측 2026-09-12: 임대인 4,075명 중 433명 = 10.6%).
     예) 한 칸에 "010-****-**36, 010-****-**66, 010-****-**71, 010-****-**89" 처럼 넷이 적혀 있다
   숫자를 다 이어붙여 비교하면 **한 번호도 못 맞춘다.** 실제로 에코 드 파리 218호
   계약완료 문자가 임대인과 못 이어져 '어긋남' 목록에서 빠졌다.
   그래서 칸에서 번호를 하나하나 뽑아 쓴다. */
var PH_RE = /0\d{1,2}[-.\s]?\d{3,4}[-.\s]?\d{4}/g;
function phAll(v){
  var t = String(v == null ? '' : v), out = [], m;
  PH_RE.lastIndex = 0;
  while((m = PH_RE.exec(t)) !== null){
    var d = phDigits(m[0]);
    if(d.length >= 9 && d.length <= 11 && out.indexOf(d) < 0) out.push(d);
  }
  if(!out.length){
    var d2 = phDigits(t);
    if(d2.length >= 9 && d2.length <= 11) out.push(d2);
  }
  return out;
}
function phFirst(v){ var a = phAll(v); return a.length ? a[0] : ''; }
/* 맞추는 기준은 뒤 8자리 — 시트가 010 의 앞 0 을 떨구기 때문이다(1026010110).
   GAS inboxPhoneKey_ 가 쓰는 규칙과 같게 맞췄다. */
function phKey(v){
  var d = phDigits(v);
  return d.length >= 8 ? d.slice(-8) : '';
}
function phHas(cell, target){
  var t = phKey(target);
  if(!t) return false;
  var a = phAll(cell);
  for(var i = 0; i < a.length; i++) if(phKey(a[i]) === t) return true;
  return false;
}
function phMask(v){
  var d = phFirst(v) || phDigits(v);
  return d.length >= 4 ? ('***' + d.slice(-4)) : '***';
}
/* 고객이 무언가를 원한다는 신호 */
var RO_WANT = ['방문', '보러', '보고싶', '방 보', '이사', '퇴실', '위약금', '해지', '계약',
               '입주', '월세', '전세', '보증금', '구하', '알아보', '문의', '연장', '재계약',
               '전화', '통화', '가능할까', '될까요', '있을까요'];
/* 광고·안내 문자는 고객 의도가 아니다 */
var RO_AD = ['[Web발신]', '광고', '무료체험', '수신거부', '이벤트', '할인행사', '가입',
             '인증번호', '승인번호', '결제', '고객센터', '안내드립니다', '스팸'];
function reopenIntent(kind, t){
  var k = String(kind || '');
  if(k === '통화녹음') return '전화가 왔습니다';
  if(k === '부재중전화') return '부재중 전화가 있었습니다';
  var v = String(t || '');
  if(!v.trim()) return '';
  for(var i = 0; i < RO_AD.length; i++)
    if(v.indexOf(RO_AD[i]) >= 0) return '';                 /* 광고성 — 재오픈 아님 */
  for(var j = 0; j < RO_WANT.length; j++)
    if(v.indexOf(RO_WANT[j]) >= 0)
      return '“' + RO_WANT[j] + '” 이야기가 나왔습니다';
  return '';
}
function reopenReview(){
  var cs = (DB.customers || []).filter(function(c){
    return String(c.progressStatus || '').trim() === '종료'; });
  if(!cs.length) return [];
  var inb = DB.inbox || [];
  return cs.map(function(c){
    var ph = phDigits(c.phone);
    if(!ph) return null;
    /* 🔴 '종료 이후' 의 기준 — 시트에 종료한 날이 없어 접수일(recvDate)을 쓴다.
       같은 날 것은 상담 중에 오간 것이므로 넣지 않는다. */
    var base = String(c.recvDate || '').slice(0, 10);
    var hits = [], seen = {};
    inb.forEach(function(r){
      if(!phHas(c.phone, r.phone)) return;   /* 🔴 고객 칸에도 번호가 여러 개일 수 있다 */
      var when = String(r.when || '');
      if(base && when.slice(0, 10) <= base) return;
      var t = String(r.text || '');
      /* '문자수신' 과 '문자수신(백업)' 이 같은 것을 두 줄로 넣는다 — 하나로 본다 */
      var key = when.slice(0, 16) + '|' + sq(t).slice(0, 40);
      if(seen[key]) return;
      seen[key] = 1;
      var kind = srcOf(r.kind, t);
      var why = reopenIntent(kind, t);
      if(!why) return;
      hits.push({ when:when, kind:kind, text:t, why:why, bld:String(r.bld || '') });
    });
    if(!hits.length) return null;
    hits.sort(function(a, b){ return String(b.when).localeCompare(String(a.when)); });
    var bld = '';
    for(var i = 0; i < hits.length; i++){ if(hits[i].bld){ bld = hits[i].bld; break; } }
    return { c:c, hits:hits, last:hits[0], bld:bld, blocked:cuBlocked(c),
             days:(function(){ var d = ctDaysTo(String(hits[0].when).slice(0, 10));
                               return d === null ? null : -d; })() };
  }).filter(Boolean).sort(function(a, b){
    return String(b.last.when).localeCompare(String(a.last.when)); });
}
/* [다시 상담 시작] — 🔴 여기서만 실제로 바뀐다. 고객 1건만 저장한다. */

    '', '🔴 고객 1건만 저장합니다. 문자는 나가지 않습니다.',
    '🔴 다른 칸(조건·예산·메모)은 건드리지 않습니다.',
    '', '이대로 바꿀까요?'].filter(function(x){ return x !== ''; }).join(nl);
  if(!confirm(msg)) return;

  /* 🔴 저장 직전에 다시 읽는다 — 그 사이 누가 바꿨을 수 있다 */
  var fresh;

    alert('그 사이 진행상태가 “' + (row.progressStatus || '') + '” 로 바뀌었습니다.' + nl +
          '화면을 새로 읽고 다시 하세요.'); return; }

  var obj = JSON.parse(JSON.stringify(row));   /* 🔴 전체 행을 보낸다(부분 저장은 나머지를 지운다) */
  obj.progressStatus = '진행중';
  obj.nextAction = today;
  try{
    await erpUpsert('customers', obj);
    var g2 = await jget({ action:'getAll', type:'customers' });
    DB.customers = g2.data || g2.result || [];
    var now = (DB.customers || []).filter(function(x){ return String(x.id) === String(id); })[0];
    var ok = now && String(now.progressStatus || '') === '진행중';
    route();
    alert([ ok ? '바꿨습니다 ✓' : '🔴 다시 읽었더니 그대로입니다 — 확인이 필요합니다', '',
      String(c.name || '') + ' · 진행상태 ' + String((now || {}).progressStatus || '') +
      ' · 다음 연락 ' + String((now || {}).nextAction || ''), '',
      ok ? '이제 고객 명부와 재접촉 목록에 나옵니다.' +
           (cuSpecs(now || {}) ? '' : nl + '🔴 희망 조건이 비어 있어 추천 매물은 아직 안 나옵니다 — 조건을 채워 주세요.')
         : ''].filter(function(x){ return x !== ''; }).join(nl));

/* ── 오늘 반드시 할 일 3개 ───────────────────────────────────────
   1순위 시간이 정해진 일(잔금·계약·만기) → 2순위 계약될 고객 → 3순위 매물·광고.
   🔴 없는 일을 만들지 않는다. 자료가 없으면 그 자리는 비운다. */
function top3(){
  var out = [];
  var ct = DB.contracts || [];

  ct.forEach(function(c){
    var who = String((c.apt||'') + ' ' + (c.addr2||'')).trim() || String(c.id||'');
    var dBal = ctDaysTo(c.balanceDue), dSt = ctDaysTo(c.start), dEnd = ctDaysTo(c.end);
    if(!String(c.balancePaidAt||'').trim() && dBal !== null && dBal <= 3)
      out.push({ rank:1, w:dBal,
        what:'잔금 ' + (dBal < 0 ? (-dBal + '일 지났습니다') : (dBal === 0 ? '오늘입니다' : ('D-' + dBal))),
        who: who + (c.tenantName ? (' · ' + c.tenantName) : ''),
        why:'돈이 오가는 날입니다. 입금을 확인하고 표시해 두세요.',
        go:"CT_SEL='" + c.id + "';CT_TAB='수납';go('deal','contract')" });
    if(dSt !== null && dSt >= 0 && dSt <= 3)
      out.push({ rank:1, w:dSt + 0.1,
        what:'계약 ' + (dSt === 0 ? '오늘입니다' : ('D-' + dSt)), who: who,
        why:'서류가 다 모였는지 먼저 보세요.',
        go:"CT_SEL='" + c.id + "';CT_TAB='필요서류';go('deal','contract')" });
    if(dEnd !== null && dEnd >= 0 && dEnd <= 30)
      out.push({ rank:1, w:50 + dEnd,
        what:'만기 D-' + dEnd, who: who,
        why:'재계약인지 새로 놓을지 오늘 정해야 광고가 늦지 않습니다.',
        go:"CT_SEL='" + c.id + "';go('deal','contract')" });
  });

  reContact().forEach(function(r){
    if(r.d === null || r.d > 0) return;
    out.push({ rank:2, w:r.d,
      what:'재접촉 ' + (r.d < 0 ? (-r.d + '일 지났습니다') : '오늘입니다'),
      who: String(r.c.name||'') + (r.c.region ? (' · ' + r.c.region) : '') +
           (r.c.type ? (' ' + r.c.type) : ''),
      why: r.n ? ('지금 보여 줄 수 있는 매물이 ' + r.n + '건 있습니다.')
               : '약속한 날이 지났습니다. 조건을 다시 물어보세요.',
      go:"CU_SEL='" + String(r.c.id||'') + "';go('crm','cust')" });
  });

  var ready = adAll().filter(function(r){
    return adLive(r.o) && r.worst === 'AD_READY' && inMyScope(r.o); });
  if(ready.length)
    out.push({ rank:3, w:-100,
      what:'광고 올릴 매물 ' + ready.length + '건',
      who: ready.slice(0,2).map(function(r){
             return String((r.o.apt||'') + ' ' + (r.o.addr2||'')).trim(); }).join(' · '),
      why:'사진과 필수값이 다 갖춰졌습니다. 올리면 바로 문의가 옵니다.',
      go:"AD_FILT='ready';go('ad','admgr')" });

  var shoot = photoTasks().filter(function(x){
    return String(x.o.status||'') === '접수' && inMyScope(x.o); });
  if(shoot.length)
    out.push({ rank:3, w:-90,
      what:'촬영할 매물 ' + shoot.length + '건',
      who: shoot.slice(0,2).map(function(x){
             return String((x.o.apt||'') + ' ' + (x.o.addr2||'')).trim(); }).join(' · '),
      why:'사진이 없으면 어느 채널에도 못 올립니다.',
      go:"go('ops','photo')" });

  var un = (DB.inbox || []).filter(function(r){ return !r.reg; }).length;
  if(un)
    out.push({ rank:3, w:-80,
      what:'새로 들어온 것 ' + un + '건 보기', who:'통화·문자에 매물과 고객이 섞여 있습니다',
      why:'오늘 안 보면 그대로 묻힙니다.', go:"go('crm','inbox')" });

  out.sort(function(a, b){ return (a.rank - b.rank) || (a.w - b.w); });
  return out.slice(0, 3);
}

      '인입함 <b>' + (DB.inbox || []).length + '건</b>에서 손님 문의만 골라 봤습니다(광고·임대인·업체 영업전화 제외).</div>';
  }
  if(ro.length){
    h1 += '<div class="note w" style="font-size:12.5px;margin:0 0 10px">' +
      '🔴 <b>재오픈 검토 ' + ro.length + '건</b> — 종료된 고객에게 <b>그 뒤로 새 연락</b>이 왔습니다. ' +
      '종료 상태는 그대로 두었습니다.</div>';
    h1 += '<ol style="margin:0 0 12px;padding-left:19px">';
    ro.forEach(function(x){
      var c = x.c, L = x.last;
      h1 += monLine(

          (x.hits.length > 1 ? (' <span style="color:var(--t3)">외 ' + (x.hits.length - 1) + '건</span>') : ''),

  if(!ro.length && (DB.customers || []).some(function(c){

  if(DB.customers === null) h1 += monEmpty('고객 자료를 불러오는 중입니다…');
  else if(DB.cuErr) h1 += monEmpty('🔴 고객 자료를 불러오지 못했습니다 — <b>후보가 없는 것이 아닙니다</b>.');
  else if(!cu.length) h1 += monEmpty((ro.length ? '그 밖에 정상 재접촉 후보는 없습니다 — ' : '') +

  else {
    h1 += (ro.length ? '<div style="font-size:12px;color:var(--t3);margin:0 0 6px">그 밖의 재접촉 후보</div>' : '') +
      '<ol style="margin:0;padding-left:19px">';
    cu.forEach(function(x){

             c.budget ? ('예산 ' + c.budget) : ''].filter(Boolean).join(' · ')) +

    '📬 <b>과거 문자(MMS)에서 나온 매물 후보</b>는 이 화면에 넣지 않았습니다 — ' +

    '이 화면이 고객·매물을 스스로 만들지는 않습니다.</div>';

   월요일 영업용 ② — 광고 2차: 실제 이력 읽기 · 복사/내보내기 · 게시 기록 · 담당 지정
   🔴 외부 채널에 자동으로 올리지 않는다. 사람이 올리고, 여기에 '올렸다'고 적는다.

/* ── ① 시트에 이미 쌓여 있는 광고 이력을 읽는다 ─────────────────
   시트에는 ads 라는 칸이 없다. 기존 화면이 adsFlat 한 칸에
     "daangn~번호~날짜~주소|blog~~날짜~"
   처럼 눌러 담아 왔다. 그 규격 그대로 풀고, 되돌려 쓸 때도 그대로 담는다. */
function adsRestore(o){
  if(!o || (o.ads && Object.keys(o.ads).length)) return o;
  o.ads = {};
  String(o.adsFlat||'').split('|').filter(Boolean).forEach(function(s){
    var a = s.split('~'), k = a[0];
    if(AD_CH.some(function(c){ return c.key === k; }))
      o.ads[k] = { on:true, no:a[1]||'', at:a[2]||'', url:a[3]||'', chk:'' };
    /* 🔴 내림 기록 — 시트에 새 칸을 만들지 않고 adsFlat 한 칸 안에 넣는다.
       'blogreq~' 처럼 접두어를 달리 쓰는 방식이 이미 있어 그 규약을 따랐다.
       형식: off:<채널>~게시번호~내린날~확인자 */
    else if(k.indexOf('off:') === 0){
      var ok2 = k.slice(4);
      if(AD_CH.some(function(c){ return c.key === ok2; })){
        o.adsOff = o.adsOff || {};
        o.adsOff[ok2] = { no:a[1]||'', at:a[2]||'', by:a[3]||'' };
      }
    }
    else if(k === 'blogreq'){
      o.ads.blog = o.ads.blog || { on:false, no:'', at:'', url:'', chk:'' };
      o.ads.blog.req = a[1]||'';
    }
  });
  if(!o.ads.naver && String(o.naverUrl||'').trim())
    o.ads.naver = { on:true, no:'', at:'', url:String(o.naverUrl), chk:'' };
  if(!o.ads.daangn && String(o.daangnNo||'').trim())
    o.ads.daangn = { on:true, no:String(o.daangnNo), at:'', url:'', chk:'' };
  return o;
}
function adsFlatten(o){
  var parts = [];
  AD_CH.forEach(function(c){
    var a = adOf(o, c.key);
    if(a && a.on) parts.push([c.key, a.no||'', a.at||'', a.url||''].join('~'));
  });
  /* 🔴 내린 기록은 그 채널이 꺼져 있을 때만 남긴다(다시 올리면 지운다) */
  AD_CH.forEach(function(c){
    var f = (o.adsOff || {})[c.key];
    if(f && !adOn(o, c.key))
      parts.push(['off:' + c.key, f.no || '', f.at || '', f.by || ''].join('~'));
  });
  var bq = adOf(o, 'blog');
  if(bq && bq.req && !adOn(o, 'blog')) parts.push(['blogreq', bq.req].join('~'));
  o.adsFlat = parts.join('|');
  o.adList = AD_CH.filter(function(c){ return adOn(o, c.key); })
                  .map(function(c){ return c.label; }).join(',');
  o.daangnNo = (adOf(o, 'daangn') || {}).no || '';
  var nv = adOf(o, 'naver');
  if(nv && nv.url) o.naverUrl = nv.url;
  /* 🔴 네이버를 내렸는데 naverUrl 이 남아 있으면 adsRestore 가 도로 살려 낸다(실측).
     내렸으면 그 칸도 비운다 — 그래야 새로 고쳐도 내려간 채로 있다. */
  else if(!nv) o.naverUrl = '';
  return o;
}
function adsOffOf(o, k){ return (o && o.adsOff && o.adsOff[k]) || null; }

/* ── ② 복사 — 타이핑을 없앤다 ──────────────────────────────────── */
function copyText(s, msg){
  var ta = document.createElement('textarea');
  ta.value = String(s == null ? '' : s);
  ta.setAttribute('readonly', 'readonly');
  ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
  document.body.appendChild(ta);
  ta.select();
  try{ ta.setSelectionRange(0, ta.value.length); }catch(e){}
  var ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){ ok = false; }
  document.body.removeChild(ta);
  alert(ok ? (msg || '복사했습니다 ✓')
           : '복사하지 못했습니다 — 화면의 글을 직접 끌어서 복사해 주세요.');
  return ok;
}

function adCopyOne(id, ch, part){

  if(part === 'body')  return copyText(cp.body,  lab + ' 본문을 복사했습니다 ✓');
  copyText(cp.title + nl + nl + cp.body, lab + ' 제목·본문을 복사했습니다 ✓');
}

/* ── ③ 게시 기록 — 이력이 실제로 쌓이게 ────────────────────────
   🔴 여기서 외부에 올리지 않는다. 사람이 올린 뒤 '올렸다'고 적는 곳이다.
   🔴 규칙 9: 시트 행은 전체 객체로 보낸다(부분 객체는 나머지 칸을 지운다). */
var AD_SAVING = false;
var AD_BUSY = false;
/* 🔴 2026-09-14 — 누르고 나서 저장 직전 재조회(실측 3.3~18.4초) 동안 아무 표시가 없어
   버튼이 죽은 것처럼 보였다. 그 사이 또 누르면 확인창이 두 번 뜬다.
   누르는 즉시 표시하고, 끝날 때까지 다시 못 누르게 한다. */
function adBusy(on){
  AD_BUSY = !!on;
  var bs = document.querySelectorAll('button');
  for(var i = 0; i < bs.length; i++){
    var t = String(bs[i].textContent || '');
    if(t === '내림 확인' || t === '올림 확인' || t === '확인하는 중…'){
      bs[i].disabled = !!on;
      if(on){ if(!bs[i].getAttribute('data-lab')) bs[i].setAttribute('data-lab', t);
              bs[i].textContent = '확인하는 중…'; }
      else { var lab = bs[i].getAttribute('data-lab');
             if(lab){ bs[i].textContent = lab; bs[i].removeAttribute('data-lab'); } }
    }
  }
}
/* ══ 🔴 2026-09-14 (지시 1-5) 게시 근거 ═══════════════════════════════════
   "게시중" 으로 적으려면 **게시 링크(URL) 또는 캡처 첨부**가 있어야 한다.
   근거 없이 적으면 화면에는 광고 중인데 실제로는 안 올라간 상태가 된다(알려진 결함).
   🔴 서버(GAS upsertRow)가 같은 규칙으로 또 막는다 — 화면 숨김이 아니다. ══ */
function adProofOk(u){
  var t = String(u == null ? '' : u).trim();
  if(!t) return false;
  if(/^https?:\/\/\S{6,}/i.test(t)) return true;
  if(/^첨부:LA[0-9A-Za-z]{4,}$/.test(t)) return true;
  return false;
}
/* 캡처 사진 한 장을 고르게 한다 (고르지 않으면 null) */
function adShotPick(){
  return new Promise(function(res){
    var el = document.createElement('input');
    el.type = 'file';
    el.accept = 'image/*';
    el.style.display = 'none';
    document.body.appendChild(el);
    var done = false;
    el.onchange = function(){
      done = true;
      var f = el.files && el.files[0];
      try{ document.body.removeChild(el); }catch(e){}
      if(!f){ res(null); return; }
      var fr = new FileReader();
      fr.onload = function(){ res({ name:f.name, mime:f.type || 'image/jpeg', b64:String(fr.result||'') }); };
      fr.onerror = function(){ res(null); };
      fr.readAsDataURL(f);
    };
    /* 창을 닫아 버리면 onchange 가 안 온다 — 자리만 치운다 */
    setTimeout(function(){ if(!done){ try{ document.body.removeChild(el); }catch(e){} } }, 300000);
    el.click();
  });
}
/* 게시 근거를 받아 낸다 — 링크 먼저, 없으면 캡처 첨부. 둘 다 없으면 '' 를 돌려준다. */
async function adProofAsk(listingId, lab){
  var nl = String.fromCharCode(10);
  var u = String(prompt([lab + ' 에 올린 글 **링크(URL)** 를 적어 주세요.', '',
    '🔴 링크나 캡처가 없으면 "게시중" 으로 적지 않습니다.',
    '   (화면에는 광고 중인데 실제로는 안 올라간 상태를 막기 위한 것입니다)', '',
    '링크가 없으면 그냥 확인을 누르세요 — 캡처 첨부로 넘어갑니다.'].join(nl), '') || '').trim();
  if(u && !adProofOk(u)){
    alert('링크 형식이 아닙니다 — http:// 또는 https:// 로 시작해야 합니다.');
    return '';
  }
  if(u) return u;
  if(!confirm(['링크가 없군요.', '', '채널에 올라간 화면 **캡처 사진**을 첨부하시겠습니까?', '',
    '첨부하지 않으면 "게시중" 으로 적지 않습니다.'].join(nl))) return '';
  var f = await adShotPick();
  if(!f){ alert('캡처를 고르지 않았습니다 — 적지 않습니다.'); return ''; }
  try{
    var r = await erpPost({ action:'attachUpload', listingId:String(listingId),
      b64:f.b64, name:f.name, mime:f.mime, note:'게시 캡처 (' + lab + ')' });
    var row = (r && (r.result || r.data)) || {};
    var aid = String(row.id || '');
    if(!/^LA[0-9A-Za-z]{4,}$/.test(aid)){
      alert('캡처는 올라갔는데 첨부번호를 못 받았습니다 — 적지 않습니다.');
      return '';
    }
    return '첨부:' + aid;
  }catch(e){
    alert('캡처를 올리지 못했습니다 — 적지 않습니다.' + nl + String(e && e.message || e));
    return '';
  }
}

async function adMark(id, ch, on){
  var nl = String.fromCharCode(10);
  if(AD_SAVING){ alert('저장 중입니다'); return; }
  if(AD_BUSY) return;                 /* 두 번 눌러도 확인창이 두 번 뜨지 않는다 */
  adBusy(true);
  var lab = (AD_CH.filter(function(c){ return c.key === ch; })[0] || {}).label || ch;
  /* 🔴 저장 직전에 매물 자료를 다시 읽는다 — 그 사이 누가 바꿨을 수 있다 */
  var fresh;
  try{
    var g = await jget({ action:'getAll', type:'listings' });
    fresh = (g.data || g.result || []).map(adsRestore);
  }catch(e){ adBusy(false); alert('매물 자료를 다시 읽지 못해 저장하지 않습니다: ' + (e && e.message || e)); return; }
  var row = fresh.filter(function(x){ return String(x.id) === String(id); })[0];
  if(!row){ adBusy(false); alert('매물을 찾지 못했습니다 — 저장하지 않습니다.'); return; }
  var mine = adFind(id);
  if(mine && String(row.status||'') !== String(mine.status||'')){
    alert('그 사이 매물 상태가 ' + (mine.status||'') + ' → ' + (row.status||'') +
      ' 로 바뀌었습니다.' + nl + '화면을 새로 읽고 다시 하세요.'); adBusy(false); return; }

  var was = adOf(row, ch);
  if(on && was && was.on){ adBusy(false); alert(lab + ' 은 이미 게시 중으로 적혀 있습니다.'); return; }
  if(!on && !(was && was.on)){ adBusy(false); alert(lab + ' 은 게시 중이 아닙니다.'); return; }

  var no = '', at = todayStr();
  adBusy(false);                      /* 확인창을 띄우기 직전에 표시를 거둔다 */
  AD_BUSY = true;                     /* 다만 중복 진입은 계속 막는다 */
  var proof = '';
  if(on){
    /* 🔴 2026-09-14 지시 1-5 — 게시 링크 또는 캡처가 **반드시** 있어야 한다 */
    proof = await adProofAsk(id, lab);
    if(!adProofOk(proof)){
      adBusy(false);
      alert(['🔴 "게시중" 으로 적지 않았습니다.', '',
        '게시 링크(URL) 나 캡처 사진이 있어야 적을 수 있습니다.',
        '채널에 올린 글을 열어 주소를 복사해 오시거나, 화면 캡처를 첨부해 주세요.'].join(nl));
      return;
    }
    no = String(prompt(lab + ' 광고번호·글번호가 따로 있으면 적어 주세요 (없으면 비워 두세요)', '') || '').trim();
    if(no.length > 200){ adBusy(false); alert('너무 깁니다 — 200자 안으로 적어 주세요.'); return; }
    if(hasSecret(no)){ adBusy(false); alert('🔴 비밀번호로 보이는 내용이 있습니다 — 적지 않습니다.'); return; }
  }
  var msg = [ (on ? (lab + ' 에 올렸다고 적습니다') : (lab + ' 에서 내렸다고 적습니다')), '',
    '매물   ' + row.id + '  ' + (row.apt||'') + ' ' + (row.addr2||''),
    '상태   ' + (row.status||''),
    on ? ('올린 날 ' + at) : ('지금까지 올린 날 ' + ((was && was.at) || '-')),
    on && no ? ('번호   ' + no) : '',
    on ? ('근거   ' + (proof.indexOf('첨부:') === 0 ? '캡처 첨부 ' + proof.slice(3) : proof)) : '',
    on ? '' : ('내린 날 ' + at + ' · 확인자 ' + String(ME.name || ME.id || '대표')),
    '', '🔴 이 버튼은 실제로 광고를 올리거나 내리지 않습니다.',
    '🔴 대표님이 채널에서 직접 한 일을 여기에 적어 두는 것입니다.',
    '', '이대로 적을까요?'].filter(function(x){ return x !== ''; }).join(nl);
  if(!confirm(msg)){ adBusy(false); return; }

  var obj = JSON.parse(JSON.stringify(row));
  obj.ads = obj.ads || {};
  obj.adsOff = obj.adsOff || {};
  if(on){
    obj.ads[ch] = { on:true, no:no, at:at, url:proof, chk:adHash(adSnapshot(obj)) };
    delete obj.adsOff[ch];              /* 다시 올렸으면 내림 기록은 지운다 */
  } else {
    /* 🔴 내리기 전에 올려 뒀던 번호·날짜를 남긴다 — 안 남기면 언제 뭘 올렸는지 사라진다 */
    obj.adsOff[ch] = { no:(was && was.no) || '', at:at,
                       by:String(ME.name || ME.id || '대표') };
    delete obj.ads[ch];
  }
  adsFlatten(obj);
  delete obj.ads;                       /* 시트에는 ads 칸이 없다 — adsFlat 으로만 보낸다 */
  delete obj.adsOff;

  AD_SAVING = true;
  adBusy(false);                      /* 여기서부터는 AD_SAVING 이 막는다 */
  try{
    await erpUpsert('listings', obj);
    var g2 = await jget({ action:'getAll', type:'listings' });

    var okNow = on ? adOn(now, ch) : !adOn(now, ch);
    AD_SAVING = false;
    route();
    alert([ okNow ? '적었습니다 ✓' : '🔴 다시 읽었더니 그대로입니다 — 확인이 필요합니다', '',
      row.id + ' · ' + lab,
      '지금 광고 표기: ' + (String(now && now.adList || '') || '(없음)') ].join(nl));
  }catch(e){
    AD_SAVING = false;
    route();
    alert('저장 실패 — 매물 자료는 그대로입니다.' + nl + String(e && e.message || e));
  }
}

function has(v){ return String(v == null ? '' : v).trim() !== ''; }
var CT_CHECK = [

var CT_ST = ['완료', '미완료', '해당없음'];
function ctCheckState(c, item, m){

/* 🔴 같은 항목을 다시 누르면 새 행을 쌓지 않고 같은 행을 고친다(id 를 고정한다) */

/* ── 계약 한 건의 진행 흐름 10단계 ───────────────────────────────
   매물 → 고객 → 계약준비 → 필수서류 → 특약 → 계약일 → 잔금일
        → 입주일 → 만기 → 재계약/재임대 */
function ctFlow(c){
  var m = docMap(c.id), sum = ctCheckSum(c);
  var dSt = ctDaysTo(c.start), dBal = ctDaysTo(c.balanceDue), dEnd = ctDaysTo(c.end);
  var paid = has(c.balancePaidAt);
  function done(b, t){ return { st: b ? '완료' : '대기', d:t }; }
  return [
    ['매물', c.listingId ? { st:'완료', d:'매물 ' + c.listingId + ' 에 연결됨' }
                         : { st:'대기', d:'연결된 매물이 없습니다(직접 입력한 계약일 수 있습니다)' }],
    ['고객', done(has(c.tenantName), has(c.tenantName)
        ? ('임차인 ' + c.tenantName + (has(c.tenantPhone) ? ' · 연락처 있음' : ' · 🔴 연락처 없음'))
        : '임차인 이름이 없습니다')],
    ['계약준비', done(has(c.price) && has(c.start),
        (has(c.price) ? ('보증금 ' + ctMoney(c.price)) : '🔴 금액 없음') +
        (has(c.rentAmt) ? (' / 월세 ' + ctMoney(c.rentAmt)) : ''))],
    ['필수서류', sum['미확인'] + sum['미완료'] === 0
        ? { st:'완료', d:'15가지 점검이 다 끝났습니다' }
        : { st:'대기', d:'남은 점검 ' + sum.left + '가지 (완료 ' + sum['완료'] +
            ' · 해당없음 ' + sum['해당없음'] + ')' }],
    ['특약', done(has(c.note), has(c.note) ? '특약이 적혀 있습니다' : '특약이 비어 있습니다')],
    ['계약일', has(c.start) ? { st: (dSt !== null && dSt <= 0) ? '완료' : '대기',
        d: c.start + (dSt === null ? '' : (dSt > 0 ? (' · D-' + dSt) : ' · 지났습니다')) }
        : { st:'대기', d:'계약일이 비어 있습니다' }],
    ['잔금일', has(c.balanceDue) ? { st: paid ? '완료' : '대기',
        d: c.balanceDue + (paid ? (' · ' + c.balancePaidAt + ' 확인') :
            (dBal === null ? '' : (dBal < 0 ? (' · 🔴 ' + (-dBal) + '일 지났는데 확인 안 됨')
                                            : (' · D-' + dBal)))) }
        : { st:'대기', d:'잔금일이 비어 있습니다' }],
    ['입주일', { st: m['입주일'] === '완료' ? '완료' : '대기',
        d:'🔴 계약 자료에 입주일 칸이 없습니다 — 점검표에서 사람이 표시합니다' }],
    ['만기', has(c.end) ? { st: (dEnd !== null && dEnd < 0) ? '완료' : '대기',
        d: c.end + (dEnd === null ? '' : (dEnd < 0 ? ' · 지났습니다' : (' · D-' + dEnd))) }
        : { st:'대기', d:'만기일이 비어 있습니다' }],
    ['재계약 / 재임대', has(c.expStatus)
        ? { st:'완료', d:'확정: ' + c.expStatus }
        : { st:'대기', d: (dEnd !== null && dEnd <= 60)
            ? '🔴 만기가 가까운데 연장·종료가 정해지지 않았습니다' : '만기 60일 전에 정합니다' }]
  ];
}

/* ── 특약 — 제안 → 편집 → 최종확정, 세 단계를 갈라 놓는다 ───────
