     임대중·계약완료라 매물장에서 빠진 방이다. 예전에는 이런 문자가 REVIEW 로 빠졌다. */
  if(mu && !mu.listings.length){
    out.code = 'NEW'; out.confidence = 85; out.how = '호실마스터';
    out.unitId = mu.unitId; out.hits = bm.listings || [];
    out.why = '그 호실은 대장에 있습니다(' + mu.unitId + ') — 지금 매물 행이 없을 뿐입니다' +
              '(빈 호실이거나 임대중).';
    return out;
  }
  /* 6 — 건물만 같음 → 그 호실 매물은 없다(새 후보) */
  if((bm.listings || []).length || bm.bldg){
    out.confidence = 40; out.how = (bm.how || []).join('+') || '건물';
    out.hits = bm.listings || [];
    out.code = 'NEW';
    out.why = '건물은 우리 자료에 있고(' + out.how + ') 그 호실 매물은 없습니다 — 새 후보';
    return out;
  }
  /* 7 — 호실만 있고 건물 근거가 없다 → REVIEW.
     🔴 숫자만 같은 호실을 다른 건물에 붙이지 않는다(이 규칙이 오연결을 막는 마지막 줄). */
  out.confidence = 0; out.how = ''; out.hits = [];
  out.code = 'REVIEW_REQUIRED';
  out.why = '호실(' + ev.unit + ')만 있고 건물 근거가 없습니다 — 숫자만 같은 호실을 다른 건물에 붙이지 않습니다';
  return out;
}

/* ── 같은 발신자의 인접 메시지에서 건물 이름 찾기 (2026-09-13 §4-5·§5) ──
   조건을 좁게 잡는다. 넷을 다 만족할 때만 근거로 쓴다.
     ① 같은 발신자(뒤 8자리)   ② 시간창 안(기본 30일)
     ③ 우리 매물장/임대인 명부에 있는 건물 이름이 **한 곳만** 나온다
     ④ 그 이름이 건물 이름으로 쓸 수 있는 값이다(bldgKeyOk)
   🔴 후보가 2개 이상이면 빈 값을 돌려준다 — REVIEW 로 남는다. */
var NB_DAYS = 30;
function nbDays(a, b){
  var x = String(a || '').slice(0, 10), y = String(b || '').slice(0, 10);
  if(x.length < 10 || y.length < 10) return 9999;
  var dx = new Date(+x.slice(0, 4), +x.slice(5, 7) - 1, +x.slice(8, 10));
  var dy = new Date(+y.slice(0, 4), +y.slice(5, 7) - 1, +y.slice(8, 10));
  return Math.abs(dx - dy) / 86400000;
}
/* 🔴 건물 이름 꾸러미를 **한 번만** 만든다 (2026-09-13 성능).
   처음엔 글마다 4,120개 이름을 훑어서 2-3 검산이 300초를 넘겼다(실측).
   이름 길이별로 갈라 두고, 글에서 같은 길이 조각만 잘라 맞춘다 —
   훑는 횟수가 (이름 수 × 글 수) 에서 (글 길이 × 길이 종류) 로 줄어든다. */
var NB_POOL = null;
function nbPool(){
  var nL = (DB.listings || []).length, nD = (DB.landlords || []).length;
  if(NB_POOL && NB_POOL.nL === nL && NB_POOL.nD === nD) return NB_POOL;
  var byLen = {}, lens = {};
  function add(v){
    if(!bldgKeyOk(v)) return;
    var k = sq(v);
    if(!byLen[k.length]) byLen[k.length] = {};
    byLen[k.length][k] = String(v);
    lens[k.length] = 1;
  }
  (DB.listings || []).forEach(function(o){ add(o.apt); });
  (DB.landlords || []).forEach(function(l){ add(l.apt); });
  NB_POOL = { nL:nL, nD:nD, byLen:byLen,
              lens:Object.keys(lens).map(Number).sort(function(a, b){ return b - a; }) };
  return NB_POOL;
}
function nbNamesIn(text){
  var hay = sq(text), P = nbPool(), out = {};
  for(var i = 0; i < P.lens.length; i++){
    var L = P.lens[i], tbl = P.byLen[L];
    for(var j = 0; j + L <= hay.length; j++){
      var frag = hay.substr(j, L);
      if(tbl[frag]) out[frag] = tbl[frag];
    }
  }
  return out;
}
var NB_CACHE = null;
function matchNeighborBldg(row){
  var out = { bldg:'', why:'', cands:[] };
  var ph = phKey(row && row.phone);
  if(!ph) return out;
  /* 🔴 같은 번호를 여러 번 묻는다 — 한 번 셈하고 기억한다(날짜창이 있으므로 날짜도 열쇠에 넣는다) */
  var ck = (DB.inbox || []).length + '|' + ((DB.listings || []).length);
  if(!NB_CACHE || NB_CACHE.key !== ck) NB_CACHE = { key:ck, m:{} };
  var mk = ph + '|' + String((row && row.when) || '').slice(0, 10);
  if(NB_CACHE.m[mk]) return NB_CACHE.m[mk];
  var idx = inboxIdx();
  var mine = (idx.byPhone || {})[ph] || [];
  if(!mine.length){ NB_CACHE.m[mk] = out; return out; }
  /* 그 번호가 보낸 글 전체에서 우리 건물 이름을 찾는다 */
  var names = {};
  mine.forEach(function(r){
    if(nbDays(r.when, row.when) > NB_DAYS) return;
    var got = nbNamesIn(r.text);
    Object.keys(got).forEach(function(k){ names[k] = got[k]; });
  });
  out.cands = Object.keys(names).map(function(k){ return names[k]; });
  if(out.cands.length === 1){
    out.bldg = out.cands[0];
    out.why = '같은 번호가 ' + NB_DAYS + '일 안에 보낸 글에 건물 이름이 "' +
              out.bldg + '" 한 곳만 나옵니다';
  } else if(out.cands.length > 1){
    out.why = '같은 번호 글에 건물 이름이 여럿입니다(' + out.cands.join(', ') + ') — 쓰지 않습니다';
  }
  NB_CACHE.m[mk] = out;
  return out;
}

/* ── §5 호실이 안 적힌 글에서 호실 근거 찾기 (2026-09-13) ─────────────
   115건 REVIEW 중 91건이 "호실 없음" 이었다. 같은 발신자의 **가까운 시각** 글에
   호실이 **하나만** 나오면 그것을 후보 호실로 본다.
   🔴 자동 연결 허용 조건 넷을 다 만족할 때만:
      같은 발신자 · 같은 건물 근거 · 짧은 시간창(기본 2일) · 한 개 호실로만 확정
   🔴 후보가 2개 이상이면 REVIEW 유지. 오연결 0 이 최우선. */
var NB_UNIT_DAYS = 2;
var NBU_CACHE = null;
function unitFromNeighbors(row){
  var out = { unit:'', why:'', cands:[] };
  var ph = phKey(row && row.phone);
  if(!ph) return out;
  var ck2 = (DB.inbox || []).length + '|' + ((DB.listings || []).length);
  if(!NBU_CACHE || NBU_CACHE.key !== ck2) NBU_CACHE = { key:ck2, m:{} };
  var mk2 = ph + '|' + String((row && row.when) || '').slice(0, 10) + '|' + sq(row && row.text).slice(0, 40);
  if(NBU_CACHE.m[mk2]) return NBU_CACHE.m[mk2];
  var nb = matchNeighborBldg(row);
  if(!nb.bldg) return out;                       /* 건물 근거가 없으면 쓰지 않는다 */
  var mine = (inboxIdx().byPhone || {})[ph] || [];
  var us = {};
  mine.forEach(function(r){
    if(nbDays(r.when, row.when) > NB_UNIT_DAYS) return;
    if(sq(r.text) === sq(row.text)) return;      /* 자기 자신은 빼고 */
    unitSpans(r.text).forEach(function(u){ us[sq(u.u)] = u.u; });
  });
  out.cands = Object.keys(us).map(function(k){ return us[k]; });
  if(out.cands.length === 1){
    out.unit = out.cands[0];
    out.bldg = nb.bldg;
    out.why = '같은 번호가 ' + NB_UNIT_DAYS + '일 안에 보낸 글에 호실이 "' + out.unit +
              '" 하나만 나옵니다 (건물 ' + nb.bldg + ')';
  } else if(out.cands.length > 1){
    out.why = '가까운 글에 호실이 여럿입니다(' + out.cands.join(', ') + ') — 쓰지 않습니다';
  }
  NBU_CACHE.m[mk2] = out;
  return out;
}

/* ── 이미 아는 값은 다시 묻지 않는다 ─────────────────────────────
   접수 문자에서 읽은 값 → 없으면 붙은 매물의 값 → 그래도 없으면 물어본다. */
function intakeNeeds(ev){
  var hit = (ev._match && ev._match.hits && ev._match.hits.length === 1)
            ? ev._match.hits[0] : null;
  var FROM = { dealType:'type', deposit:'price', rent:'rentAmt', building:'apt',
               unit:'addr2', area:'area', roomCount:'rooms', bathCount:'baths',
               floor:'floor', totalFloor:'totalFloor', maintenance:'feeAmt',
               moveInDate:'availDate', yearlyRent:'rentAmt' };
  var known = [], needReq = [], needOpt = [];
  function val(k){
    var v = String(ev[k] == null ? '' : ev[k]).trim();
    if(v) return { v:v, from:'이번 접수' };
    if(hit && FROM[k]){
      var w2 = String(hit[FROM[k]] == null ? '' : hit[FROM[k]]).trim();
      if(w2) return { v:w2, from:'기존 매물 ' + hit.id };
    }
    return null;
  }
  INTAKE_REQ.concat(INTAKE_OPT).forEach(function(f){
    var req = INTAKE_REQ.some(function(x){ return x[0] === f[0]; });
    var g = val(f[0]);
    if(g) known.push({ k:f[0], label:f[1], v:g.v, from:g.from });
    else if(req) needReq.push({ k:f[0], label:f[1] });
    else needOpt.push({ k:f[0], label:f[1] });
  });
  return { known:known, missingRequired:needReq, missingOptional:needOpt,
           askAgain:0, hit:hit };
}

/* ── 중복매물 판정 ──────────────────────────────────────────────── */
function intakeDup(ev){
  var mp = ev._match || {};
  if(mp.code === 'NEW') return { code:'NEW', why:'같은 건물에 그 호실 매물이 없습니다', hit:null };
  if(mp.code === 'NEW_BUILDING') return { code:'NEW_BUILDING', why:mp.why, hit:null };
  if(mp.code !== 'MATCH') return { code:'REVIEW_REQUIRED', why:mp.why || '사람이 봐야 합니다', hit:null };
  var o = (DB.listings || []).filter(function(x){
    return String(x.id) === String(mp.listingId); })[0];
  if(!o) return { code:'REVIEW_REQUIRED', why:'붙인 매물을 다시 찾지 못했습니다', hit:null };
  /* 상태가 달라졌나 — 문자가 말한 최신상태와 매물장 상태 */
  var st = String(o.status || '');
  var tradable = LST_TRADABLE.indexOf(st) >= 0;
  if(ev.statusHint === 'CONTRACT_DONE' && tradable)
    return { code:'STATUS_CHANGE', why:'문자는 계약완료인데 매물장은 ' + st + ' 입니다',
             hit:o, from:st, to:'계약완료' };
  if(ev.statusHint === 'AVAILABLE' && !tradable)
    return { code:'STATUS_CHANGE', why:'문자는 아직 있다는데 매물장은 ' + st + ' 입니다',
             hit:o, from:st, to:'접수' };
  /* 값이 달라졌나 */
  var ch = [];
  [['deposit', 'price', '보증금'], ['rent', 'rentAmt', '월세']].forEach(function(c){
    var now = String(ev[c[0]] || '').trim(), was = String(o[c[1]] == null ? '' : o[c[1]]).trim();
    if(now && was && now !== was) ch.push({ label:c[2], from:was, to:now });
  });
  if(ch.length) return { code:'PRICE_CHANGE', why:'기존 매물과 금액이 다릅니다', hit:o, changes:ch };
  return { code:'SAME', why:'기존 매물 ' + o.id + ' 과 같습니다 — 새로 만들지 않습니다', hit:o };
}

/* ── 사진 세 갈래 ───────────────────────────────────────────────
   EXACT_UNIT            그 호실 사진 — 광고에 쓸 수 있다
   BUILDING_COMMON       건물 공용부 — 공용부로만 쓴다
   OTHER_UNIT_REFERENCE  다른 호실 — 🔴 이 호실 내부사진으로 절대 쓰지 않는다 */
/* 🔴 광고에 쓸 만한 사진인가 — 크기로 가른다(인덱스에 담은 KB).
   64×64 썸네일이 1~2KB 로 들어와 있다(실측). 그런 것을 광고에 올리면 허위매물로 보인다. */
var PH_MIN_KB = 20;        /* 이보다 작으면 광고에 쓸 사진이 아니다 */
var PH_GOOD_KB = 60;       /* 이 정도면 넉넉하다(참고용 — 막지는 않는다) */
/* 🔴 크기(KB)만으로 화질을 믿지 않는다 — 그림이 작으면 KB 가 넉넉해도 못 쓴다.
   실측: 워터마크가 64×64 썸네일을 그대로 찍어 1KB 보정완료를 만든 폴더가 있었다.
   해상도는 인덱스에 담긴 폴더만 알 수 있다(doneMinW/doneMinH) — 없으면 막지 않는다. */
var PH_MIN_W = 600;
var PH_MIN_H = 400;
function intakePhoto(ev){
  var ph = judgePhoto(ev._match && ev._match.code === 'MATCH'
             ? { code:'SAME', hit:(ev._match.hits || [])[0] }
             : { code:'NEW', hit:null },
           ev._bm, { unit:ev.unit }, ev._row);
  /* 🔴 judgePhoto 가 돌려주는 칸 이름 그대로 쓴다 — unit.{name,raw,done} · others[].{raw,done}
     광고에 쓸 수 있는 것은 **보정완료(done)** 뿐이다. 원본(raw)만 있으면 아직 못 쓴다. */
  var uDone = (ph.unit && ph.unit.done) ? ph.unit.done : 0;
  var uRaw = (ph.unit && ph.unit.raw) ? ph.unit.raw : 0;
  /* 🔴 2026-09-14 — 참고사진(같은 건물 같은 평면의 **다른 호실** 사진)을 구분한다.
     파일 이름이 '참고_' 로 시작하는 것이며, photo_ref_scan.py 가 색인에 세어 둔다.
     광고에 쓸 수는 있지만 **반드시 그렇다고 밝혀야 한다** — 안 밝히면 허위매물이다. */
  var uRef = (ph.unit && ph.unit.refDone) ? ph.unit.refDone : 0;
  var uRefOnly = !!(ph.unit && ph.unit.refOnly) && uDone > 0;
  var others = (ph.others || []).reduce(function(a, x){
    return a + (x.raw || 0) + (x.done || 0); }, 0);
  var out = {
    code: ph.code, why: ph.why || '', note: ph.note || '', folder: ph.bldFolder || '',
    EXACT_UNIT: uDone, EXACT_UNIT_RAW: uRaw, BUILDING_COMMON: ph.common || 0,
    REF_PLAN: uRef, refOnly: uRefOnly,
    refNote: uRefOnly ? '동일 평면 참고사진입니다(그 호실 사진이 아직 없습니다)' : '',
    OTHER_UNIT_REFERENCE: others,
    useForAd: uDone > 0 ? 'EXACT_UNIT' : '',
    commonUse: (ph.common || 0) > 0 ? 'BUILDING_COMMON — 공용부·외관으로만' : '',
    blocked: others > 0
      ? ('🔴 같은 건물 다른 호실 사진 ' + others + '장 — 이 호실 광고에 쓰지 않습니다') : '',
    askShoot: (uDone === 0 && uRaw === 0 && !phIdxErr())
  };
  if(phIdxErr()){ out.code = 'REVIEW_REQUIRED'; out.why = phIdxErr(); out.askShoot = false; }

  /* ── 품질 ───────────────────────────────────────────────────────
     🔴 EXACT_UNIT 이라고 바로 광고 가능으로 보지 않는다. 크기가 너무 작으면 막는다.
        그리고 "촬영 필요" 와 "보정 필요" 를 가른다 — 원본이 있으면 촬영이 아니다. */
  var u = (ph.unit || {});
  out.doneMaxKB = (u.doneMaxKB === undefined) ? null : u.doneMaxKB;
  out.doneMinKB = (u.doneMinKB === undefined) ? null : u.doneMinKB;
  out.rawMaxKB = (u.rawMaxKB === undefined) ? null : u.rawMaxKB;
  out.rawMinKB = (u.rawMinKB === undefined) ? null : u.rawMinKB;
  out.doneMinW = (u.doneMinW === undefined) ? null : u.doneMinW;
  out.doneMinH = (u.doneMinH === undefined) ? null : u.doneMinH;
  out.rawMinW = (u.rawMinW === undefined) ? null : u.rawMinW;
  out.rawMinH = (u.rawMinH === undefined) ? null : u.rawMinH;
  out.quality = 'UNKNOWN';
  out.qualityWhy = '';
  if(out.doneMaxKB !== null){
    out.quality = (out.doneMaxKB < PH_MIN_KB) ? 'LOW'
                : ((out.doneMaxKB >= PH_GOOD_KB) ? 'GOOD' : 'OK');
    if(out.quality === 'LOW')
      out.qualityWhy = '보정완료 사진이 ' + out.doneMaxKB + 'KB 뿐입니다';
  }
  /* 🔴 그림 크기(해상도)로 한 번 더 본다 — KB 가 넉넉해도 작은 그림은 광고에 못 쓴다 */
  if(out.doneMinW !== null && out.doneMinW > 0 &&
     (out.doneMinW < PH_MIN_W || (out.doneMinH !== null && out.doneMinH > 0 && out.doneMinH < PH_MIN_H))){
    out.quality = 'LOW';
    out.qualityWhy = '보정완료 사진이 ' + out.doneMinW + '×' + out.doneMinH +
      ' 뿐입니다(광고 최소 ' + PH_MIN_W + '×' + PH_MIN_H + ')';
  }
  /* 🔴 0KB·가로 0 = 깨진 파일. 광고에 쓰지 않는다. */
  if(out.doneMinKB === 0 || out.doneMinW === 0){
    out.quality = 'BROKEN';
    out.qualityWhy = '보정완료에 열리지 않는 파일이 섞여 있습니다';
  }
  if(out.rawMinKB === 0) out.broken = '원본에 0KB 빈 파일이 섞여 있습니다';
  /* ── 🔴 출처 (2026-09-13 §10·§11) ───────────────────────────────
     호실이 맞고 품질이 좋아도 **출처가 우리 것이 아니면 광고에 쓰지 않는다.**
     실측: 워터마크까지 끝난 유일한 사진이 타사 밴드 글에서 받은 것이었다. */
  var sj = photoSrcJudge(ph.unit);
  out.srcCode = sj.code; out.srcWhy = sj.why; out.src = sj.src;
  out.srcUsable = sj.usable;
  if(out.EXACT_UNIT > 0 && !sj.usable){
    out.useForAd = '';
    out.askShoot = true;                       /* 쓸 사진이 없으니 촬영 후보다 */
    out.fixBy = 'SHOOT';
    if(sj.code === 'PROHIBITED_SOURCE'){
      out.code = 'SOURCE_PROHIBITED';
      out.why = '그 호실 보정완료 ' + out.EXACT_UNIT + '장이 있지만 ' + sj.why;
    } else {
      out.code = 'SOURCE_REVIEW';
      out.why = '그 호실 보정완료 ' + out.EXACT_UNIT + '장이 있지만 ' + sj.why;
    }
  }
  /* 원본이 광고에 쓸 만한가 — 크기와 해상도 둘 다 본다(다시 보정하면 되는지 가른다) */
  var rawUsable = (out.rawMaxKB !== null && out.rawMaxKB >= PH_MIN_KB) &&
                  !(out.rawMinW !== null && out.rawMinW > 0 && out.rawMinW < PH_MIN_W);
  if(out.EXACT_UNIT > 0 && (out.quality === 'LOW' || out.quality === 'BROKEN')){
    out.code = 'REVIEW_REQUIRED';
    out.useForAd = '';
    out.why = '그 호실 ' + out.qualityWhy + ' — 광고에 쓸 사진이 아닙니다' +
      (rawUsable
        ? (' (원본은 ' + out.rawMaxKB + 'KB' +
           (out.rawMinW ? ('·' + out.rawMinW + '×' + out.rawMinH) : '') +
           ' 있습니다 — 촬영이 아니라 다시 보정하면 됩니다)')
        : ' (원본도 작습니다 — 다시 찍어야 합니다)');
    out.askShoot = !rawUsable;
    out.fixBy = rawUsable ? 'REDO_WATERMARK' : 'SHOOT';
  } else if(out.EXACT_UNIT === 0 && rawUsable){
    /* 🔴 그 호실 원본이 있는데 보정이 안 된 것 — 촬영 요청 대상이 아니다 */
    out.code = 'REVIEW_REQUIRED';
    out.why = '그 호실 원본 ' + out.EXACT_UNIT_RAW + '장(최대 ' + out.rawMaxKB +
      'KB' + (out.rawMinW ? ('·' + out.rawMinW + '×' + out.rawMinH) : '') +
      ')이 있는데 보정완료가 0장입니다 — 촬영이 아니라 보정이 필요합니다';
    out.askShoot = false;
    out.fixBy = 'WATERMARK';
  } else if(out.EXACT_UNIT === 0 && out.EXACT_UNIT_RAW > 0 && !rawUsable){
    /* 🔴 그 호실 원본이 있기는 하나 썸네일이다 — 보정해도 못 쓴다. 이건 촬영이다. */
    out.code = 'REVIEW_REQUIRED';
    out.why = '그 호실 원본 ' + out.EXACT_UNIT_RAW + '장이 있지만 ' +
      (out.rawMinW ? (out.rawMinW + '×' + out.rawMinH) : (out.rawMaxKB + 'KB')) +
      ' 밖에 안 됩니다 — 보정해도 광고에 못 씁니다(다시 찍어야 합니다)';
    out.askShoot = true;
    out.fixBy = 'SHOOT';
  }
  return out;
}

/* ── 광고준비 판정 ─────────────────────────────────────────────
   DATA_REQUIRED / PHOTO_REQUIRED / REVIEW_REQUIRED / AD_READY_PREVIEW
   🔴 대표 승인 전에는 AD_READY 가 되지 않는다 — PREVIEW 까지만. */
function intakeAd(ev){
  if(ev._adr) return ev._adr;            /* 🔴 한 번만 셈한다 */
  /* 🔴 대표님께 묻기 전에 가진 자료로 먼저 채운 결과를 쓴다(2-2단계) */
  var nd = intakeNeeds2(ev), dup = intakeDup(ev), ph = intakePhoto(ev);
  var r = { code:'REVIEW_REQUIRED', why:'', needs:nd, dup:dup, photo:ph, blockers:[] };
  if(ev.statusHint === 'CONTRACT_DONE'){
    r.code = 'REVIEW_REQUIRED';
    r.blockers.push('계약완료 문자가 있습니다 — 광고 대상이 아닙니다');
    r.why = r.blockers[0]; ev._adr = r; return r;
  }
  if(dup.code === 'REVIEW_REQUIRED' || dup.code === 'NEW_BUILDING'){
    r.code = 'REVIEW_REQUIRED'; r.blockers.push(dup.why); r.why = dup.why; ev._adr = r; return r;
  }
  if(ev.matchConfidence < 80 && dup.code !== 'NEW'){
    r.code = 'REVIEW_REQUIRED';
    r.blockers.push('매물 연결이 확실하지 않습니다(' + ev.matchConfidence + ')');
    r.why = r.blockers[0]; ev._adr = r; return r;
  }
  if(nd.missingRequired.length){
    r.code = 'DATA_REQUIRED';
    r.why = '광고 필수값이 비어 있습니다 — ' +
            nd.missingRequired.map(function(x){ return x.label; }).join('·');
    r.blockers.push(r.why); ev._adr = r; return r;
  }
  /* 🔴 사진 출처 (2026-09-13 §10) — 호실·품질을 넘겨도 출처가 막히면 광고 불가 */
  if(ph.code === 'SOURCE_PROHIBITED'){
    r.code = 'SOURCE_REVIEW'; r.why = ph.why; r.blockers.push(ph.why);
    r.photoFix = '대표님이 가진 원본이나 새 촬영본이 필요합니다';
    ev._adr = r; return r;
  }
  if(ph.code === 'SOURCE_REVIEW'){
    r.code = 'SOURCE_REVIEW'; r.why = ph.why; r.blockers.push(ph.why);
    r.photoFix = '이 사진을 임대인이 주신 것인지 확인하면 광고에 쓸 수 있습니다';
    ev._adr = r; return r;
  }
  if(ph.code === 'REVIEW_REQUIRED'){
    /* 사진 자료를 못 읽었거나, 그 호실 원본은 있는데 보정완료가 0장인 경우 */
    r.code = 'REVIEW_REQUIRED'; r.why = ph.why; r.blockers.push(ph.why); ev._adr = r; return r;
  }
  if(!ph.EXACT_UNIT){
    r.code = 'PHOTO_REQUIRED';
    r.why = (ph.code === 'BUILDING_ONLY'
             ? '건물 공용부 사진만 있습니다 — 이 호실 내부사진이 없습니다'
             : '이 호실 사진이 없습니다') +
            (ph.OTHER_UNIT_REFERENCE ? (' ' + ph.blocked) : '');
    r.blockers.push(r.why); ev._adr = r; return r;
  }
  /* 🔴 두 겹 — 위에서 걸렀더라도 출처가 '쓸 수 있음' 이 아니면 AD_READY 로 보내지 않는다 */
  if(ph.srcUsable !== true){
    r.code = 'SOURCE_REVIEW';
    r.why = '사진 출처가 확인되지 않았습니다' + (ph.srcWhy ? (' — ' + ph.srcWhy) : '');
    r.blockers.push(r.why); ev._adr = r; return r;
  }
  r.code = (ev.approvalStatus === 'APPROVED') ? 'AD_READY' : 'AD_READY_PREVIEW';
  r.why = (r.code === 'AD_READY') ? '광고 가능합니다'
        : '필수값·사진이 갖춰졌습니다 — 🔴 대표 승인을 누르면 광고 가능';
  ev._adr = r; return r;
}

/* ── 채널별 광고문구 준비 — 🔴 사실만 쓴다. 게시하지 않는다 ────────
   없는 옵션·장점을 지어내지 않고, 허위 희소성("마지막 1실")을 쓰지 않는다. */
/* 🔴 광고에 나갈 **건물 이름**인가 — 이름이 아니면 문구를 아예 만들지 않는다.
   실측(2026-09-12): 매물장 단지명이 '202'(호실번호)로 들어가 광고문에 "단지 : 202" 로 찍혔다.
   막는 것: ① 숫자뿐 ② 호실과 같음 ③ 너무 짧음 ④ 종류어뿐 ⑤ 주소(동·도로명) 조각 */
function bldgNameCheck(name, unit, addr){
  var t = sq(name), u = sq(unit), n = String(name || '');
  if(!t) return { code:'REVIEW_BUILDING_NAME', why:'건물명이 비어 있습니다' };
  if(/^[0-9-]+$/.test(t))
    return { code:'REVIEW_BUILDING_NAME', why:'건물명이 숫자뿐입니다 — "' + n + '"' };
  if(u && (t === u || (t + '호') === u))
    return { code:'REVIEW_BUILDING_NAME', why:'건물명이 호실과 같습니다 — "' + n + '"' };
  if(t.length < 3)
    return { code:'REVIEW_BUILDING_NAME', why:'건물명이 너무 짧습니다 — "' + n + '"' };
  if(bldgIsKind(t))
    return { code:'REVIEW_BUILDING_NAME', why:'건물 종류어일 뿐 이름이 아닙니다 — "' + n + '"' };
  if(/(동|리|읍|면)$/.test(t) && String(addr || '').indexOf(n) >= 0)
    return { code:'REVIEW_BUILDING_NAME', why:'주소(동 이름)를 건물명으로 잡았습니다 — "' + n + '"' };
  if(/^[가-힣]{1,6}(로|길)[0-9-]*$/.test(t))
    return { code:'REVIEW_BUILDING_NAME', why:'도로명을 건물명으로 잡았습니다 — "' + n + '"' };
  return { code:'VALID_BUILDING_NAME', why:'' };
}
/* 사진 폴더 지번으로 진짜 이름을 찾아 본다(있으면 대표님께 보여 준다) */
function bldgNameSuggest(addr){
  var jb = (String(addr || '').match(/(\d{1,5}-\d{1,4})/) || [])[1] || '';
  var out = '';
  try {
    if(jb && PIDX && PIDX.index){
      Object.keys(PIDX.index).forEach(function(k){
        var v = PIDX.index[k];
        if(!out && sq(v.jibun) === sq(jb) &&
           bldgNameCheck(v.name, '', '').code === 'VALID_BUILDING_NAME') out = v.name;
      });
    }
  } catch(e){}
  return out;
}
function adCopyPrep(ev){
  var ad = intakeAd(ev);
  if(ad.code !== 'AD_READY_PREVIEW' && ad.code !== 'AD_READY')
    return { ok:false, why:'광고준비가 안 됐습니다 — ' + ad.why, drafts:[] };
  /* 🔴 이름을 먼저 가른다 — 잘못된 이름으로 광고문을 만들지 않는다 */
  var hit0 = (ev._match && (ev._match.hits || [])[0]) || null;
  var nm = (hit0 && hit0.apt) || ev.building;
  var nc = bldgNameCheck(nm, (hit0 && hit0.addr2) || ev.unit, (hit0 && hit0.addr) || ev.address);
  if(nc.code !== 'VALID_BUILDING_NAME'){
    var sug = bldgNameSuggest((hit0 && hit0.addr) || ev.address);
    return { ok:false, nameCheck:nc, suggest:sug, drafts:[],
             why:'건물명을 확인해야 합니다 — ' + nc.why +
                 (sug ? (' (사진 폴더 지번으로는 "' + sug + '" 입니다)') : '') };
  }
  var k = {}, nd = ad.needs;
  nd.known.forEach(function(x){ k[x.k] = x.v; });
  var NBSP = ' ', LF = String.fromCharCode(10);   /* 🔴 ERP 에 LF 전역은 없다 */
  /* 단위를 붙인다 — 이미 붙어 있으면 그대로 둔다(값은 지어내지 않는다) */
  function unit1(v, u){
    var t = String(v == null ? '' : v).trim();
    if(!t) return '';
    return (t.indexOf(u) >= 0) ? t : (t + u);
  }
  function money(){
    var d = k.deposit ? ('보증금 ' + unit1(k.deposit, '만')) : '';
    var rr = k.rent ? ('월세 ' + unit1(k.rent, '만')) : '';
    return [d, rr].filter(Boolean).join(' / ');
  }
  var facts = [];
  if(k.area) facts.push('전용 ' + unit1(k.area, '㎡'));
  if(k.roomCount) facts.push('방 ' + unit1(k.roomCount, '개'));
  if(k.bathCount) facts.push('욕실 ' + unit1(k.bathCount, '개'));
  if(k.floor){
    var fl = unit1(k.floor, '층');
    facts.push(k.totalFloor ? (fl + ' (총 ' + unit1(k.totalFloor, '층') + ')') : fl);
  }
  if(k.maintenance) facts.push('관리비 ' +
    (/^[0-9]+$/.test(String(k.maintenance).trim()) ? unit1(k.maintenance, '만') : k.maintenance));
  if(k.moveInDate) facts.push('입주 ' + k.moveInDate);
  var head = (k.building || '') + ' ' + (k.unit || '');
  /* 제목에 "월세 보증금…/월세…" 처럼 겹쳐 적히지 않게 — 금액 문구가 이미 말하면 뺀다 */
  var dealWord = (k.dealType && money().indexOf(k.dealType) < 0) ? k.dealType : '';
  var DR = [
    { ch:'daangn', name:'당근',
      title: (head + ' ' + dealWord + ' ' + money()).split('  ').join(' ').trim(),
      body: head + NBSP + (k.dealType || '') + ' ' + money() + LF + facts.join(' · ') +
            LF + '※ 사진은 해당 호실 실사입니다.' },
    { ch:'zigbang', name:'직방',
      title: ((k.building || '') + ' ' + dealWord + ' ' + money()).split('  ').join(' ').trim(),
      body: facts.join(' / ') + LF + '문의 주시면 방 보는 시간 맞춰 드립니다.' },
    { ch:'dabang', name:'다방',
      title: (dealWord + ' ' + money() + ' ' + (k.building || '')).split('  ').join(' ').trim(),
      body: facts.join(', ') },
    { ch:'naver', name:'네이버',
      title: (k.building || '') + ' ' + (k.unit || '') + ' ' + (k.dealType || ''),
      body: '보증금/월세 ' + money() + LF + facts.join(LF) },
    { ch:'blog', name:'블로그',
      title: (k.building || '') + ' ' + (k.unit || '') + ' 실제 조건 정리',
      body: head + ' ' + (k.dealType || '') + ' ' + money() + LF + facts.join(LF) +
            LF + '사진은 해당 호실에서 직접 찍은 것만 올립니다.' }
  ];
  /* 🔴 지어낸 말이 섞였는지 스스로 본다 */
  var BAN = ['마지막', '단 한', '급매', '최저가', '무조건', '역세권 확정', '곧 마감'];
  var bad = [];
  DR.forEach(function(d){
    BAN.forEach(function(b){
      if((d.title + d.body).indexOf(b) >= 0) bad.push(d.ch + ':' + b);
    });
  });
  return { ok:true, why:'', drafts:DR, banned:bad, facts:facts,
           note:'🔴 복사해서 쓰는 초안입니다. 이 함수는 게시하지 않습니다.' };
}

/* ═══ 자동보완 — 대표님께 묻기 전에 가진 자료로 먼저 채운다 ═══════════
   🔴 고정 건물정보만 같은 건물에서 물려받는다. 면적·방·욕실은 다른 호실에서 복사하지 않는다.
   🔴 값마다 어디서 왔는지(source)·언제 것인지(sourceDate)·얼마나 믿을 만한지(confidence)를 적는다. */
var BLDG_INHERIT = [['totalFloor', 'totalFloor', '총 층'], ['bldgUse', 'bldgUse', '건물용도'],
                    ['parkTotal', 'parkTotal', '총 주차'], ['strct', 'strct', '구조'],
                    ['ugFloor', 'ugFloor', '지하층'], ['aprDate', 'aprDate', '사용승인일']];
/* 🔴 호실별 — 같은 호실 기록이나 글에 적힌 것만. 다른 호실에서 가져오지 않는다. */
var UNIT_ONLY = [['area', 'area', '면적'], ['roomCount', 'rooms', '방 수'],
                 ['bathCount', 'baths', '욕실 수'], ['floor', 'floor', '층'],
                 ['maintenance', 'feeAmt', '관리비'], ['moveInDate', 'availDate', '입주 가능일'],
                 ['dealType', 'type', '거래유형'], ['deposit', 'price', '보증금'],
                 ['rent', 'rentAmt', '월세'], ['kind', 'kind', '매물유형']];

/* 글에서 호실별 값을 읽는다 — 없으면 비운다(지어내지 않는다) */
function textFacts(t){
  var s2 = String(t || ''), o = {};
  var m;
  m = s2.match(/(?:전용|전용면적|면적)\s*([0-9]{1,3}(?:\.[0-9]{1,2})?)\s*(?:㎡|m2|제곱)/);
  if(!m) m = s2.match(/([0-9]{1,3}(?:\.[0-9]{1,2})?)\s*(?:㎡|m2)/);
  if(m) o.area = m[1];
  m = s2.match(/방\s*([0-9])\s*(?:개|칸)/);
  if(m) o.roomCount = m[1];
  else if(/투룸|2룸/.test(s2)) o.roomCount = '2';
  else if(/원룸|1룸|오픈형|분리형/.test(s2)) o.roomCount = '1';
  m = s2.match(/(?:욕실|화장실)\s*([0-9])\s*(?:개|칸)/);
  if(m) o.bathCount = m[1];
  m = s2.match(/([0-9]{1,2})\s*층/);
  if(m) o.floor = m[1];
  m = s2.match(/관리비\s*(?:포함)?\s*([0-9]{1,3})\s*만?/);
  if(m) o.maintenance = m[1];
  else if(/관리비\s*포함/.test(s2)) o.maintenance = '포함';
  return o;
}
/* 🔴 호실 번호에서 층을 읽는다 — 202호=2층 · 1607호=16층.
   이건 그 호실 자신의 근거다(다른 호실 값을 베끼는 것이 아니다).
   🔴 다만 규칙이 다른 건물도 있으므로 확신은 MEDIUM 으로 둔다. */
function floorFromUnit(u, totalFloor){
  var d = String(u || '').replace(/[^0-9]/g, '');
  if(d.length < 3 || d.length > 4) return '';
  var f = (d.length === 3) ? d.slice(0, 1) : d.slice(0, 2);
  var n = parseInt(f, 10);
  if(!n) return '';
  var tf = parseInt(String(totalFloor || '').replace(/[^0-9]/g, ''), 10);
  if(tf && n > tf) return '';          /* 총층보다 크면 규칙이 다른 건물 — 쓰지 않는다 */
  return String(n);
}

function intakeAutoFill(ev){
  if(ev._af) return ev._af;              /* 🔴 한 번만 셈한다 */
  var mp = ev._match || {};
  var hit = (mp.hits || []).length === 1 ? mp.hits[0] : null;
  var L = DB.listings || [];
  var got = {}, prov = {};
  function put(k, v, src, date, conf){
    v = String(v == null ? '' : v).trim();
    if(!v || got[k]) return;
    got[k] = v;
    prov[k] = { value:v, source:src, sourceDate:String(date || ''), confidence:conf };
  }
  /* A — 이번 접수에서 읽은 값 */
  UNIT_ONLY.forEach(function(f){
    put(f[0], ev[f[0]], '이번 접수(' + ev.source + ')', String(ev.receivedAt).slice(0, 10), 'HIGH');
  });
  /* A' — 붙은 매물 자신 */
  if(hit){
    UNIT_ONLY.forEach(function(f){
      put(f[0], hit[f[1]], '매물 ' + hit.id, hit.updatedAt || hit.recvDate, 'HIGH');
    });
    BLDG_INHERIT.forEach(function(f){
      put(f[0], hit[f[1]], '매물 ' + hit.id, hit.updatedAt || hit.recvDate, 'HIGH');
    });
  }
  /* B — 같은 건물 + **같은 호실** 의 다른 기록 (과거 매물 행) */
  var bk = sq(ev.building), uk = sq(ev.unit);
  if(bk && uk){
    L.forEach(function(o){
      if(hit && String(o.id) === String(hit.id)) return;
      if(sq(o.apt) !== bk || sq(o.addr2) !== uk) return;
      UNIT_ONLY.forEach(function(f){
        put(f[0], o[f[1]], '같은 호실 과거기록 ' + o.id, o.updatedAt || o.recvDate, 'HIGH');
      });
    });
  }
  /* C — 같은 건물의 **고정 정보만** 물려받는다 (면적·방·욕실은 절대 안 가져온다) */
  if(bk){
    var sib = L.filter(function(o){ return sq(o.apt) === bk; });
    BLDG_INHERIT.forEach(function(f){
      var vals = {};
      sib.forEach(function(o){
        var v = String(o[f[1]] == null ? '' : o[f[1]]).trim();
        if(v) vals[v] = (vals[v] || 0) + 1;
      });
      var ks = Object.keys(vals);
      if(ks.length === 1)
        put(f[0], ks[0], '같은 건물 ' + sib.length + '건이 모두 같음', '', 'HIGH');
      else if(ks.length > 1){
        /* 값이 갈리면 가장 많은 것을 쓰되 확신을 낮춘다 */
        ks.sort(function(a, b){ return vals[b] - vals[a]; });
        if(vals[ks[0]] > vals[ks[1]])
          put(f[0], ks[0], '같은 건물 ' + vals[ks[0]] + '/' + sib.length + '건', '', 'MEDIUM');
      }
    });
  }
  /* D — 임대인 명부의 건물 정보 */
  var ld = (ev._bm && (ev._bm.landlords || [])[0]) || null;
  if(ld){
    BLDG_INHERIT.forEach(function(f){
      put(f[0], ld[f[1]], '임대인 명부', ld.updatedAt || '', 'MEDIUM');
    });
  }
  /* E·F — 이 호실을 말한 통화·문자 본문에서 (같은 호실 글만 본다) */
  intakeSameUnitRows(ev).forEach(function(r){
    var f2 = textFacts(r.text);
    Object.keys(f2).forEach(function(k){
      put(k, f2[k], '문자·통화 본문', String(r.when || '').slice(0, 10), 'MEDIUM');
    });
  });
  /* 매물유형에서 방·욕실 — 🔴 유형이 정하는 것만. 투룸 이상·아파트는 채우지 않는다. */
  var kd = String(got.kind || (hit && hit.kind) || '').trim();
  if(kd){
    var one = ['오픈형 원룸', '분리형 원룸', '원룸', '1.5룸'];
    if(one.indexOf(kd) >= 0){
      put('roomCount', '1', '매물유형(' + kd + ')', '', 'MEDIUM');
      put('bathCount', '1', '매물유형(' + kd + ')', '', 'MEDIUM');
    } else if(kd === '오피스텔'){
      put('bathCount', '1', '매물유형(' + kd + ')', '', 'MEDIUM');
    }
    /* 🔴 '빌라(투룸 이상)'·'아파트'·'주택' 은 방 수가 정해지지 않는다 — 비워 둔다 */
  }
  /* 호실 번호에서 층 */
  if(!got.floor){
    var fl = floorFromUnit(ev.unit, got.totalFloor);
    if(fl) put('floor', fl, '호실 번호(' + ev.unit + ')', '', 'MEDIUM');
  }
  ev._af = { values:got, provenance:prov };
  return ev._af;
}

/* 자동보완을 넣은 '부족한 것' — 대표님께 물을 것만 남긴다 */
function intakeNeeds2(ev){
  if(ev._nd2) return ev._nd2;            /* 🔴 한 번만 셈한다 */
  var af = intakeAutoFill(ev);
  var known = [], needReq = [], needOpt = [];
  INTAKE_REQ.concat(INTAKE_OPT).forEach(function(f){
    var req = INTAKE_REQ.some(function(x){ return x[0] === f[0]; });
    var v = af.values[f[0]];
    if(f[0] === 'building') v = v || ev.building;
    if(f[0] === 'unit') v = v || ev.unit;
    if(v) known.push({ k:f[0], label:f[1], v:v,
                       from:(af.provenance[f[0]] || {}).source || '이번 접수',
                       date:(af.provenance[f[0]] || {}).sourceDate || '',
                       conf:(af.provenance[f[0]] || {}).confidence || 'HIGH' });
    else if(req) needReq.push({ k:f[0], label:f[1] });
    else needOpt.push({ k:f[0], label:f[1] });
  });
  ev._nd2 = { known:known, missingRequired:needReq, missingOptional:needOpt,
              hit:(ev._match && (ev._match.hits || []).length === 1) ? ev._match.hits[0] : null,
              prov:af.provenance };
  return ev._nd2;
}

/* ── 대표님이 정말 해야 할 일만 남긴다 ────────────────────────────── */
function intakeTodo(ev){
  var ad = ev.ad || intakeAd(ev);
  if(ad.dup.code === 'STATUS_CHANGE' || ev.statusHint === 'CONTRACT_DONE')
    return { code:'NEED_REVIEW', why:ad.dup.why || '계약완료 문자가 있습니다' };
  if(ad.code === 'REVIEW_REQUIRED') return { code:'NEED_REVIEW', why:ad.why };
  if(ad.code === 'PHOTO_REQUIRED'){
    var ph = ad.photo;
    /* 🔴 원본이 있으면 촬영이 아니라 보정이다 */
    if(ph.EXACT_UNIT_RAW > 0 || ph.fixBy === 'WATERMARK' || ph.fixBy === 'REDO_WATERMARK')
      return { code:'NEED_REVIEW',
               why:'그 호실 원본 사진이 있습니다(최대 ' + (ph.rawMaxKB == null ? '?' : ph.rawMaxKB) +
                   'KB) — 촬영이 아니라 보정이 필요합니다' };
    return { code:'NEED_PHOTO', why:ph.why || '이 호실 사진이 없습니다' };
  }
  if(ad.code === 'DATA_REQUIRED'){
    var ms = ad.needs.missingRequired.map(function(x){ return x.label; });
    var askLd = ms.filter(function(x){
      return ['면적', '방 수', '욕실 수', '관리비', '입주 가능일'].indexOf(x) >= 0; });
    if(askLd.length)
      return { code:'NEED_CALL', why:'임대인에게 물어야 하는 값 — ' + askLd.join('·'),
               fields:ms };
    return { code:'NEED_FIELD', why:'채워야 하는 값 — ' + ms.join('·'), fields:ms };
  }
  return { code:'READY', why:ad.why };
}

/* ═══ 광고 안전검사 — 🔴 게시하지 않는다. 올려도 되는지만 말한다 ═════════
   🔴 계정 제한·캡차·IP·브라우저 지문 우회 기능은 만들지 않는다.
   🔴 이 함수는 네트워크를 부르지 않는다(쓰기·게시 0). */
var AD_TRY_MAX = 2;          /* 무한 재시도 금지 — 한 채널에 두 번까지만 */
var AD_STOP_WORDS = ['제한', '차단', '일시중지', '정지', '신고', '캡차', 'captcha',
                     '로그인 필요', '권한', '429', '503', 'rate limit', 'too many'];

/* 사진 지문 — 같은 사진을 여러 번 올리는 것과 다른 호실 사진을 막는다.
   🔴 파일 내용을 읽지 않는다(이름·장수·호실 폴더로 본다) — 네트워크를 부르지 않기 위해서다.
      진짜 픽셀 비교는 보정 프로그램이 하는 일이고, 여기서는 "같은 폴더의 같은 사진을
      여러 매물에 돌려 쓰는지" 를 막는 것이 목적이다. */
function adPhotoFinger(o){
  var ph = adPhotoOf(o);
  var f = { folder:ph.bldFolder || '', unit:(ph.unit && ph.unit.name) || '',
            done:(ph.unit && ph.unit.done) || 0, raw:(ph.unit && ph.unit.raw) || 0,
            others:(ph.others || []).length, common:ph.common || 0 };
  f.key = sq(f.folder) + '|' + sq(f.unit);
  return f;
}
/* 같은 사진 묶음을 여러 매물이 나눠 쓰고 있나 */
function adPhotoShared(){
  var by = {};
  (DB.listings || []).forEach(function(o){
    if(!adLive(o)) return;
    var f = adPhotoFinger(o);
    if(!f.unit || !f.done) return;
    (by[f.key] = by[f.key] || []).push(String(o.id));
  });
  var out = [];
  Object.keys(by).forEach(function(k){
    if(by[k].length > 1) out.push({ key:k, ids:by[k] });
  });
  return out;
}

function adSafety(ev){
  var r = { code:'OK', blockers:[], warns:[], actions:[], checked:[] };
  var mp = ev._match || {};
  var o = (mp.hits || []).length === 1 ? mp.hits[0] : null;
  var ad = ev.ad || intakeAd(ev);

  /* D — 계약완료·거래완료·임대중은 올리지 않는다 */
  r.checked.push('계약완료·거래완료 차단');
  if(ev.statusHint === 'CONTRACT_DONE'){
    r.blockers.push('계약완료 문자가 있습니다 — 올리지 않습니다');
  }
  if(o && STATUS_OFF.indexOf(String(o.status || '')) >= 0){
    r.blockers.push('매물 상태가 ' + o.status + ' 입니다 — 올리지 않습니다');
    if(TAKEDOWN_ST.indexOf(String(o.status || '')) >= 0){
      var on = AD_CH.filter(function(c){ return adOn(o, c.key); });
      if(on.length) r.actions.push({ code:'TAKEDOWN_REQUIRED',
        why:'게시 중인데 ' + o.status + ' 입니다 — 먼저 내려야 합니다',
        channels:on.map(function(c){ return c.label; }) });
    }
  }

  /* A — 같은 매물 중복광고 */
  r.checked.push('같은 매물 중복광고');
  if(o){
    var same = (DB.listings || []).filter(function(x){
      if(String(x.id) === String(o.id)) return false;
      return sq(x.apt) === sq(o.apt) && sq(x.addr2) === sq(o.addr2);
    });
    var sameLive = same.filter(adLive);
    if(sameLive.length){
      r.blockers.push('같은 건물·같은 호실 매물이 ' + sameLive.length +
        '건 더 살아 있습니다(' + sameLive.map(function(x){ return x.id; }).join(', ') +
        ') — 새로 올리면 중복광고가 됩니다');
      r.actions.push({ code:'REVIEW_REQUIRED', why:'같은 호실 매물을 하나로 합쳐야 합니다' });
    }
    /* E — 이미 게시돼 있으면 새로 만들지 않고 고친다 */
    var posted = AD_CH.filter(function(c){ return adOn(o, c.key); });
    if(posted.length){
      var stale = posted.filter(function(c){ return adStale(o, c.key); });
      var expired = posted.filter(function(c){ return adExpired(o, c.key); });
      if(stale.length || expired.length){
        r.actions.push({ code:'UPDATE_REQUIRED',
          why:'이미 올려 둔 글이 있고 그 뒤 내용이 바뀌었습니다 — 새 글이 아니라 고쳐야 합니다',
          channels:stale.concat(expired).map(function(c){ return c.label; }) });
      } else {
        r.actions.push({ code:'ALREADY_POSTED',
          why:'이미 올라가 있고 내용도 같습니다 — 다시 올리지 않습니다',
          channels:posted.map(function(c){ return c.label; }) });
      }
      r.blockers.push('이미 게시 중인 채널이 ' + posted.length +
        '곳 있습니다 — 새 글 대신 고치기/내리기로 갑니다');
    }
  }

  /* B·C — 사진 */
  r.checked.push('사진 중복·유사도 · 다른 호실 차단');
  var ph = ad.photo || {};
  if(ph.OTHER_UNIT_REFERENCE > 0 && !ph.EXACT_UNIT){
    r.blockers.push('🔴 이 호실 사진이 없고 다른 호실 사진만 ' +
      ph.OTHER_UNIT_REFERENCE + '장 있습니다 — 다른 호실 사진은 쓰지 않습니다');
  }
  if(ph.EXACT_UNIT && o){
    var shared = adPhotoShared().filter(function(x){
      return x.ids.indexOf(String(o.id)) >= 0; });
    if(shared.length){
      r.warns.push('같은 사진 묶음을 매물 ' + shared[0].ids.length +
        '건이 나눠 쓰고 있습니다(' + shared[0].ids.join(', ') + ') — 같은 사진 반복입니다');
    }
  }
  if(ph.EXACT_UNIT_RAW > 0 && !ph.EXACT_UNIT){
    r.warns.push('그 호실 원본 ' + ph.EXACT_UNIT_RAW +
      '장이 있는데 보정완료가 0장입니다 — 촬영이 아니라 보정이 필요합니다');
  }

  /* F — 무한 재시도 금지 */
  r.checked.push('무한 재시도 금지');
  r.retryLimit = AD_TRY_MAX;

  /* G — 제한·오류 감지 (게시 이력 메모에 그런 말이 있으면 멈춘다) */
  r.checked.push('플랫폼 제한·오류 감지');
  if(o){
    var hay = String(o.note || '') + ' ' + String(o.adList || '') + ' ' + String(o.desc || '');
    var hitStop = AD_STOP_WORDS.filter(function(k){
      return hay.toLowerCase().indexOf(String(k).toLowerCase()) >= 0; });
    if(hitStop.length){
      r.blockers.push('🔴 제한·오류로 보이는 기록이 있습니다(' + hitStop.join(',') +
        ') — 멈추고 사람이 봅니다');
      r.actions.push({ code:'STOP', why:'플랫폼 제한·오류 기록' });
    }
  }

  /* H — 광고에 나갈 이름이 이름이 아닌 경우 (🔴 허위·오표기 방지)
     실측: 매물장에 단지명이 '202'(호실번호)로 들어간 건이 있었고, 광고문에도
     "단지 : 202" 로 찍혔다. 사진 폴더 지번으로는 건물 이름을 알 수 있다. */
  r.checked.push('건물명(단지명) 검사');
  var nm2 = (o && o.apt) || ev.building;
  var nc2 = bldgNameCheck(nm2, (o && o.addr2) || ev.unit, (o && o.addr) || ev.address);
  r.bldgName = nc2.code;
  if(nc2.code !== 'VALID_BUILDING_NAME'){
    var real = bldgNameSuggest((o && o.addr) || ev.address);
    r.blockers.push(nc2.why + ' — 이대로 광고에 나가면 잘못된 이름입니다' +
      (real ? (' (사진 폴더 지번으로는 "' + real + '" 입니다 — 대표님 확인 필요)') : ''));
    r.actions.push({ code:'REVIEW_REQUIRED',
                     why:'건물명을 확인해야 합니다' + (real ? (' → ' + real) : '') });
  }

  /* 결론 */
  if(r.blockers.length) r.code = 'BLOCKED';
  else if(r.actions.filter(function(a){ return a.code === 'UPDATE_REQUIRED'; }).length)
    r.code = 'UPDATE_REQUIRED';
  else if(r.warns.length) r.code = 'REVIEW_REQUIRED';
  r.why = r.blockers[0] || (r.actions[0] && r.actions[0].why) || r.warns[0] || '올려도 됩니다';
  return r;
}

/* 승인 뒤 줄 세우기 — 🔴 게시하지 않는다. 무엇을 올릴지 적어 두기만 한다. */
function adPostQueue(evs){
  var out = [];
  (evs || []).forEach(function(ev){
    var ad = ev.ad || intakeAd(ev);
    if(ad.code !== 'AD_READY_PREVIEW' && ad.code !== 'AD_READY') return;
    var sf = adSafety(ev);
    if(sf.code === 'BLOCKED') return;
    var cp = adCopyPrep(ev);
    if(!cp.ok) return;
    out.push({ eventId:ev.eventId, listingId:ev.listingId,
               building:ev.building, unit:ev.unit,
               state:(ev.approvalStatus === 'APPROVED') ? 'QUEUED' : 'WAIT_APPROVAL',
               safety:sf.code, action:(sf.actions[0] || {}).code || 'NEW',
               channels:cp.drafts.map(function(d){ return d.ch; }),
               note:'🔴 실제 게시는 하지 않습니다 — 대표님이 채널에서 직접 올린 뒤 [게시 확인] 을 누릅니다' });
  });
  return out;
}

/* ── 매물 한 건을 접수후보와 같은 꼴로 — 광고준비를 매물장 전체에 물어본다 ──
   🔴 인입 문자가 없어도 광고준비를 계산한다. 문자가 있으면 최신상태도 함께 본다. */

  var row = { row:'L:' + o.id, when:String(o.updatedAt || o.recvDate || todayStr()),

              bld:String(o.apt || ''), text:String(o.addr || ''), reg:'' };
  var ev = {
    eventId:'LISTING:' + o.id, source:'LISTING',
    receivedAt:String(o.updatedAt || o.recvDate || ''), sender:'',
    rawText:'(매물장) ' + String(o.apt || '') + ' ' + String(o.addr2 || ''),
    building:String(o.apt || ''), address:String(o.addr || ''), jibun:jb,
    unit:String(o.addr2 || ''), unitCands:null,
    dealType:'', deposit:'', rent:'', yearlyRent:'', maintenance:'',
    area:'', roomCount:'', bathCount:'', floor:'', totalFloor:'',
    moveInDate:'', kind:'', statusHint:'UNKNOWN', photoRefs:[],
    landlordId:'', listingId:String(o.id),
    parseConfidence:0, matchConfidence:100, matchHow:'매물장 직접',
    reviewReason:'', approvalStatus:'PENDING',
    _ai:{ unit:String(o.addr2 || '') },
    _bm:{ bldg:o.apt, addr:o.addr, jibun:jb, listings:[o], landlords:[], how:['매물장'] },
    _row:row,
    _match:{ code:'MATCH', listingId:String(o.id), confidence:100,
             how:'매물장 직접', why:'', hits:[o] }
  };
  /* 🔴 임대인을 **먼저** 붙인다. 문자에 건물 전체 이름이 없고 줄임말만 있으면
     ("제니" = 에코제니) 그 줄은 임대인 번호로만 이어진다.
     종전에는 문자를 먼저 모아 캐시해서 그런 줄 11건을 잃었다(전/후 대조로 잡음). */
  /* 🔴 한 건물에 임대인이 여럿이면 **전부** 본다.
     실측 사고(2026-09-12): 에코힐튼은 임대인이 2명인데 첫 사람만 봐서, 둘째 사람이 보낸
     "히튼1607호 계약완료" 문자를 못 이었다 → 이미 계약된 호실에 촬영을 요청할 뻔했다. */
  var lds = (DB.landlords || []).filter(function(l){
    return sq(l.apt) && sq(l.apt) === sq(o.apt); });
  if(!lds.length) lds = (DB.landlords || []).filter(function(l){
    var la = sq(l.apt), ap = sq(o.apt);
    return la && ap && la.length >= 3 && (la.indexOf(ap) >= 0 || ap.indexOf(la) >= 0); });
  if(lds.length){ ev._bm.landlords = lds; ev.landlordId = String(lds[0].id || ''); }
  /* 그 호실을 말한 문자가 있으면 최신상태를 읽는다 */
  var rows = intakeSameUnitRows(ev);
  if(ev.unit) ev.statusHint = statusHintOf(rows, ev.unit).code;
  /* 🔴 월요일 계획과 **같은 근거**를 쓴다 — 두 화면이 다른 숫자를 말하면 안 된다.
     doneAlerts 는 건물 이름 줄임말·오타("히튼")도 임대인 번호로 이어 준다. */
  if(ev.statusHint !== 'CONTRACT_DONE' && doneConflict(o)) ev.statusHint = 'CONTRACT_DONE';
  if(ev.statusHint === 'UNKNOWN' && LST_TRADABLE.indexOf(String(o.status || '')) >= 0)
    ev.statusHint = 'AVAILABLE';
  return ev;
}

/* ── 인입함 전체를 접수후보로 — 화면이 아니라 값만 돌려준다 ───────── */
function intakeAll(limit){
  var out = [];
  (DB.inbox || []).forEach(function(r){
    var t = String(r.text || '');
    if(!t) return;
    if(isTestRow(t)) return;                     /* 🔴 시험 줄은 후보로 세우지 않는다 */
    /* 🔴 2026-09-13 §5 — 호실이 글에 없어도 **인접 메시지로 호실이 하나로 확정되면** 본다.
       종전에는 여기서 잘라서, 호실 없는 임대인 문자 91건이 후보에 아예 없었다(실측). */
    if(!/\d{3,4}\s*호/.test(t) && !unitFromNeighbors(r).unit) return;
    intakeEventsFrom(r).forEach(function(ev){
      ev.ad = intakeAd(ev);
      out.push(ev);
    });
  });
  out.sort(function(a, b){ return String(b.receivedAt).localeCompare(String(a.receivedAt)); });
  return limit ? out.slice(0, limit) : out;
}

/* ── 인입함 중복 줄 묶기 (2026-09-12 실측으로 들어온 수정) ──────────────
   휴대폰 백업 파일 7개가 전부 '전체 백업' 이어서, 회수가 돌 때마다 같은 문자를
   다시 넣었다. 받아온 500줄 중 296줄이 덧줄이고, 한 번호는 122줄이 고유 27줄이었다.
   '더존빌301호는 계약됐구요' 문자는 5개 파일에 있어 인입함에 5줄로 있다.
   🔴 시트는 그대로 두고 **화면에서만** 한 줄로 묶는다. 안 묶으면 같은 방을
      다섯 번 확인하게 되고, 미처리 건수가 2.5배로 보인다.
   묶은 줄수는 r.dup 에 남겨 화면에 그대로 적는다(숨기지 않는다). */
/* 🔴 묶는 열쇠 — 보낸이 + 정확한 시각(초까지) + 접수경로 + 본문 전체.
   분 단위·앞 40자만 쓰면 **서로 다른 문자가 합쳐진다**(같은 사람이 같은 분에
   두 통 보내는 일은 흔하다). 인입함의 when 은 초까지 있다(실측 19자).
   ⚠ 서버가 본문을 400자에서 자르므로, 400자가 넘는 문자는 앞 400자까지만 비교된다.
     같은 사람이 같은 **초**에 앞 400자가 똑같은 긴 문자를 두 통 보낸 경우만
     합쳐질 수 있다 — 실측 0건이고, 그런 일이 생기면 화면에 묶음 수로 드러난다. */
function inKeyOf(r){
  var o = r || {};
  return String(o.when || '') + '|' + phDigits(o.phone) + '|' +
         String(o.kind || '') + '|' + sq(o.text);
}
function inDedup(rows){
  var by = {}, order = [];
  (rows || []).forEach(function(r){
    var k = inKeyOf(r);
    if(!by[k]){ r.dup = 1; by[k] = r; order.push(k); return; }
    var n = (by[k].dup || 1) + 1;
    /* 처리 표시가 있는 줄을 남긴다 — 이미 처리한 일을 다시 시키지 않는다 */
    if(!sq(by[k].reg) && sq(r.reg)) by[k] = r;
    by[k].dup = n;
  });
  var rows = order.map(function(k){ return by[k]; });
  return inPathMerge(rows);
}
/* 🔴 같은 문자 한 통이 실시간(MacroDroid) 과 백업 파일 두 경로로 들어와 두 줄이 된다.
   실측 2026-09-12: 전체 1,052줄 중 27줄이 그런 경우였다(2~4초 차이).
   조건을 좁게 잡는다 — 같은 번호 · 본문이 **전체가** 같다 · 10초 이내 ·
   접수경로가 다르다. 네 가지를 다 만족할 때만 묶는다.
   같은 경로로 두 번 온 것은 묶지 않는다(그건 정말 두 통일 수 있다). */
function inSecs(v){
  var t = String(v || '');
  if(t.length < 19) return null;
  var y = +t.slice(0, 4), mo = +t.slice(5, 7), d = +t.slice(8, 10);
  var hh = +t.slice(11, 13), mi = +t.slice(14, 16), ss = +t.slice(17, 19);
  if(!y || !mo || !d) return null;
  return Date.UTC(y, mo - 1, d, hh, mi, ss) / 1000;
}
function inIsBackup(k){ return String(k || '').indexOf('백업') >= 0; }
function inPathMerge(rows){
  var byBody = {};
  rows.forEach(function(r, i){
    var k = phDigits(r.phone) + '|' + sq(r.text);
    (byBody[k] = byBody[k] || []).push(i);
  });
  var drop = {};
  Object.keys(byBody).forEach(function(k){
    var idx = byBody[k];
    if(idx.length < 2) return;
    for(var a = 0; a < idx.length; a++){
      for(var b = a + 1; b < idx.length; b++){
        var x = rows[idx[a]], y = rows[idx[b]];
        if(drop[idx[a]] || drop[idx[b]]) continue;
        if(inIsBackup(x.kind) === inIsBackup(y.kind)) continue;   /* 경로가 같으면 안 묶는다 */
        var tx = inSecs(x.when), ty = inSecs(y.when);
        if(tx === null || ty === null) continue;
        if(Math.abs(tx - ty) > 10) continue;                      /* 10초 넘으면 안 묶는다 */
        /* 처리 표시가 있는 줄을 남긴다. 둘 다 없으면 실시간 줄을 남긴다(원본 경로). */
        var keepA = sq(x.reg) ? true : (sq(y.reg) ? false : !inIsBackup(x.kind));
        var keep = keepA ? x : y, gone = keepA ? y : x;
        keep.dup = (keep.dup || 1) + (gone.dup || 1);
        keep.dupPath = (keep.dupPath || 0) + 1;
        drop[keepA ? idx[b] : idx[a]] = 1;
      }
    }
  });
  var out = [];
  rows.forEach(function(r, i){ if(!drop[i]) out.push(r); });
  return out;
}
/* ── 통합 인입함 ── */
function inboxRows(){
  var rows = (DB.inbox || []).slice();
  if(UI.src) rows = rows.filter(function(r){ return srcOf(r.kind, r.text) === UI.src; });
  if(UI.st === 'un') rows = rows.filter(function(r){ return !r.reg; });
  if(UI.st === 'done') rows = rows.filter(function(r){ return !!r.reg; });
  if(UI.qq){
    var q = UI.qq.toLowerCase();
    rows = rows.filter(function(r){
      return [r.when, r.name, r.phone, r.bld, r.text].join(' ').toLowerCase().indexOf(q) >= 0;
    });
  }
  return rows;
}
/* ══ 1단계 2026-09-14 — 고객접수 (인입함 → 고객) ══════════════════
   🔴 자동 접수 금지. 대표님이 눌러야만 만들어진다.
   🔴 인입함 원문은 그대로 둔다 — 처리상태만 적는다.
   🔴 새 저장소를 만들지 않는다: 사람마스터 + 고객관리(기존 탭). ══ */
var INB_TAB = '매물문의';

var INB_AD_WORDS = ['광고', '무료거부', '수신거부', '080', '이벤트', '할인', '쿠폰', '당첨',
                    '카드승인', '결제', '출금', '입금', '인증번호', '본인확인', '택배', '배송'];

/* 🔴 시험용 번호인가 — 010-0000-00xx · 10000000xx · 100-000-00xx (철칙 16).
   이것을 진짜 문의로 보면 가짜 고객이 생긴다. */
function inbTestPhone(v){
  var d = String(v == null ? '' : v).replace(/[^0-9]/g, '');
  if(!d) return false;
  return d.indexOf('010000000') === 0 || d.indexOf('1000000') === 0 ||
         d.indexOf('100000000') === 0;
}
/* 인입 한 줄이 어느 탭인가 — 🔴 원문을 고치지 않는다. 보기만 나눈다. */
function inbTabOf(r){
  var t = String((r && r.text) || '');
  var flat = sq(t);
  if(inbTestPhone(r && r.phone)) return '기타';      /* 시험 번호는 문의가 아니다 */
  for(var i = 0; i < INB_AD_WORDS.length; i++){
    if(flat.indexOf(sq(INB_AD_WORDS[i])) >= 0) return '광고·스팸';
  }
  /* 우리 임대인 명부에 있는 번호면 임대인 */
  var ph = (r && r.phone) || '';
  if(ph){
    var isLd = (DB.landlords || []).some(function(L){
      return phHas(L.phone, ph) || phHas(L.phone2, ph); });
    if(isLd) return '임대인';
  }
  /* 공실·계약 알림 말투면 임대인 쪽으로 */
  if(flat.indexOf('공실') >= 0 || flat.indexOf('계약완료') >= 0 || flat.indexOf('임대완료') >= 0 ||
     flat.indexOf('방나갔') >= 0 || flat.indexOf('나갔습니다') >= 0) return '임대인';
  /* 찾는 말투면 매물문의 */
  if(flat.indexOf('문의') >= 0 || flat.indexOf('보러') >= 0 || flat.indexOf('구해') >= 0 ||
     flat.indexOf('있나요') >= 0 || flat.indexOf('원룸') >= 0 || flat.indexOf('투룸') >= 0 ||
     flat.indexOf('월세') >= 0 || flat.indexOf('전세') >= 0 || flat.indexOf('입주') >= 0) return '매물문의';
  if(srcOf(r.kind, r.text) === '부재중전화') return '기타';
  return '기타';
}
/* 최근 N일 안인가 */
function inbRecent(r, days){
  var t = String((r && r.when) || '').slice(0, 10).replace(/[.\/]/g, '-');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(t)) return true;      /* 날짜를 모르면 빼지 않는다 */
  var d = new Date(t + 'T00:00:00');
  if(isNaN(d.getTime())) return true;
  return (Date.now() - d.getTime()) <= (days || INB_DAYS) * 86400000;
}
/* 탭별 줄 — 미처리 먼저 */
function inbRows(tab){
  var rows = (DB.inbox || []).filter(function(r){ return inbRecent(r, INB_DAYS); });
  if(tab) rows = rows.filter(function(r){ return inbTabOf(r) === tab; });
  if(UI.qq){
    var q = UI.qq.toLowerCase();
    rows = rows.filter(function(r){
      return [r.when, r.name, r.phone, r.bld, r.text].join(' ').toLowerCase().indexOf(q) >= 0; });
  }
  rows.sort(function(a, b){
    var ar = a.reg ? 1 : 0, br = b.reg ? 1 : 0;
    if(ar !== br) return ar - br;                        /* 미처리 먼저 */
    return String(b.when || '').localeCompare(String(a.when || ''));
  });
  /* 🆕 4-2 조건 패널 — 조건이 꺼져 있으면 그대로 지나간다 */
  return qpApply('crm/inbox', rows, {
    date: function(r){ return r.when; },
    group: function(r){ return inbTabOf(r); },
    text: function(r){ return [r.when, r.name, r.phone, r.bld, r.text].join(' '); }
  });
}
function inbCount(tab){ return inbRows(tab).length; }
function inbUndone(tab){ return inbRows(tab).filter(function(r){ return !r.reg; }).length; }

/* 한 줄 열기 */

function inbFind(row){
  return (DB.inbox || []).filter(function(r){ return String(r.row) === String(row); })[0] || null;

  if(!confirm(msg)) return;

              '만들지 않았습니다 — 그 고객에 이어 적으십시오.');

function inbNextDay(){
  var d = new Date(Date.now() + 86400000);
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}
function perNewId(list){
  var mx = 0;
  (list || []).forEach(function(p){
    var m = String(p.id || '').match(/^P-(\d+)$/);
    if(m) mx = Math.max(mx, parseInt(m[1], 10));
  });
  return 'P-' + ('000' + (mx + 1)).slice(-4);
}

/* ══ 2단계 2026-09-14 — 공실접수 (인입함 임대인 → 호실) ══════════
   🔴 자동 생성 금지. 대표님이 눌러야만 만들어진다.
   🔴 "방 나갔습니다 / 계약완료" 를 **계약완료로 자동처리하지 않는다.**
   🔴 발신번호는 '접수연락처' 로만 잇는다 — 소유자로 단정하지 않는다. ══ */

/* 글에서 가격을 읽는다 — 🔴 없으면 없는 대로 둔다(지어내지 않는다) */
function vacMoney(t){
  var s0 = String(t || '');
  var out = { deposit: '', rent: '' };
  var m = s0.match(/(\d{2,5})\s*[\/의]\s*(\d{2,4})/);      /* 300/45 · 300의 45 */
  if(m){ out.deposit = m[1]; out.rent = m[2]; return out; }
  var d = s0.match(/보증금\s*(\d{2,5})/);
  var r = s0.match(/월세\s*(\d{2,4})/);

  if(r) out.rent = r[1];

}
function vacHo(t){

/* 인입 한 줄 → 건물·호실·가격 후보와 판정 */
function vacRead(r){
  var out = { bm:null, ho:'', unitId:'', unit:null, listing:null,
              code:'REVIEW', why:'', money:vacMoney(r && r.text), lock:false };
  out.bm = matchBuildingMaster(r, {});
  out.ho = vacHo(r && r.text);
  if(!out.bm){ out.code = 'NEW_BUILDING'; out.why = '우리 자료에 이 건물이 없습니다'; return out; }
  if(!out.ho){ out.code = 'REVIEW'; out.why = '호실을 읽지 못했습니다'; return out; }
  if(VAC_LOCK.indexOf(out.ho) >= 0){
    out.lock = true; out.code = 'LOCKED';
    out.why = '🔴 ' + out.ho + '호는 저장하지 않기로 한 호실입니다';
    return out;
  }
  if(VAC_REVIEW.indexOf(out.ho) >= 0){
    out.code = 'REVIEW'; out.why = '🔴 ' + out.ho + '호는 사람이 봐야 하는 호실입니다';
    return out;
  }
  var mu = matchUnitMaster(out.bm.id, out.ho + '호');
  if(mu){
    out.unitId = mu.unitId; out.unit = mu.unit;
    out.listing = (mu.listings || [])[0] || null;
    if(out.listing){
      var chg = [];
      if(out.money.deposit && String(out.listing.price || '') !== out.money.deposit)
        chg.push('보증금 ' + (out.listing.price || '(없음)') + ' → ' + out.money.deposit);
      if(out.money.rent && String(out.listing.rentAmt || '') !== out.money.rent)
        chg.push('월세 ' + (out.listing.rentAmt || '(없음)') + ' → ' + out.money.rent);
      out.changes = chg;
      out.code = chg.length ? 'CHANGE' : 'SAME';
      out.why = chg.length ? ('기존 매물 ' + out.listing.id + ' 과 값이 다릅니다: ' + chg.join(' · '))
                           : ('기존 매물 ' + out.listing.id + ' 과 같습니다');
    } else {
      out.code = 'NEW';
      out.why = '그 호실은 대장에 있고(' + out.unitId + ') 지금 매물 행이 없습니다';
    }
    return out;
  }
  if(VAC_NO_NEW.indexOf(out.ho) >= 0){
    out.code = 'REVIEW';
    out.why = '🔴 ' + out.ho + '호는 새로 만들지 않기로 한 호실입니다';
    return out;
  }
  out.code = 'NEW';
  out.why = '건물은 있고(' + out.bm.name + ') 그 호실은 대장에 없습니다 — 새 호실 후보';
  return out;
}

function colRecent(r){

function colJudge(r){

  if(String(r.writer || '') === '중개'){
    out.code = '타사매물';

  var fake = { text: [r.apt, r.addr, r.kind].filter(Boolean).join(' '),
               name:'', bld:'', phone:String(r.phone || '') };
  out.bm = matchBuildingMaster(fake, {});
  if(!out.bm){
    out.code = '신규후보';
    out.why = '우리 건물마스터에 없는 건물입니다';

      out.unitId = mu.unitId;
      out.listing = (mu.listings || [])[0] || null;

  if(out.listing){
    var chg = [];

    var rn = String(r.rent || '').replace(/[^0-9]/g, '');

      chg.push('보증금 ' + (out.listing.price || '(없음)') + ' → ' + dep);
    if(rn && String(out.listing.rentAmt || '') !== rn)

    return out;
  }
  out.code = '신규후보';
  out.why = '건물은 있고(' + out.bm.name + ') 그 호실 매물은 없습니다' +

function colState(id){
  var a = ((typeof APV_ROWS !== 'undefined' && APV_ROWS) || []).filter(function(x){
    return String(x.kind) === '공실확인' && String(x.targetType) === 'collect' &&
           String(x.targetId) === String(id); })[0];
  if(!a) return { code:'', label:'확인 전', at:'' };
  var st = String(a.status || '요청');
  if(st === '승인') return { code:'허락', label:'허락', at:String(a.decidedAt || ''), a:a };
  if(st === '반려') return { code:'거절', label:'거절', at:String(a.decidedAt || ''), a:a };
  return { code:'문자발송', label:'문자 보냄', at:String(a.requestedAt || ''), a:a };
}
function colRows(tab){

  if(tab) rows = rows.filter(function(r){ return colJudge(r).code === tab; });
  if(UI.qq){

  }
  rows.sort(function(a, b){ return String(b.seenAt || '').localeCompare(String(a.seenAt || '')); });
  /* 🆕 4-2 조건 패널 */
  return qpApply('data/collect', rows, {
    date: function(r){ return r.seenAt; },
    group: function(r){ return colJudge(r).code; },
    text: function(r){ return [r.apt, r.addr, r.dong, r.nick, r.phone].join(' '); }
  });
}
function colCount(tab){ return colRows(tab).length; }
function colFind(id){
  return (COL_ROWS || []).filter(function(r){ return String(r.id) === String(id); })[0] || null;
}
function colOpen(id){
  COL_OPEN = (String(COL_OPEN) === String(id)) ? '' : String(id);
  COL_SMS = null; route();
}
function colMoney(r){
  var d = String(r.deposit || '').replace(/[^0-9]/g, '');
  var rn = String(r.rent || '').replace(/[^0-9]/g, '');
  if(String(r.trade || '') === '매매') return (r.price ? (Math.round(r.price / 1) + '만') : '');
  return (d || '?') + '/' + (rn || '?');
}

/* [허락받음] / [거절] / [무시] — 🔴 상태만 바꾼다. 매물장은 아직 그대로 */
async function colMark(id, what){
  var nl = String.fromCharCode(10);
  if(COL_BUSY){ alert('처리 중입니다'); return; }
  var r = colFind(id);
  if(!r) return;
  var st = colState(id);
  var msg = { '허락':'임대인에게 **허락을 받았다**고 표시합니다.' + nl +
                     '그때부터 [매물로 접수] 를 쓸 수 있습니다.',
              '거절':'거절로 표시합니다 — 다시 올라오지 않습니다.',
              '무시':'스팸·중복으로 표시합니다.' }[what] || '';
  if(!confirm([msg, '', String(r.dong || '') + ' ' + String(r.apt || ''), '',
    '🔴 매물장은 아직 바뀌지 않습니다.'].join(nl))) return;
  COL_BUSY = true;
  try{
    if(!st.a){
      /* 문자를 안 보냈어도 상태를 남길 수 있게 결재 건을 먼저 만든다 */
      var add = await erpPost({ action:'approvalAdd', kind:'공실확인', targetType:'collect',
        targetId:String(id), dept:'운영',
        title:'공실확인 — ' + String(r.dong || '') + ' ' + String(r.apt || '') + ' (' + r.src + ')',
        note:'문자 없이 ' + what + ' 로 표시' });

      st = colState(id);
    }
    if(st.a){
      await erpPost({ action:'approvalDecide', id:String(st.a.id),
        status:(what === '허락' ? '승인' : '반려'),
        reason:(what === '허락' ? '임대인 허락 확인' : (what + ' 로 표시')) });
      await adApvLoad(true);
    }
    COL_BUSY = false; route();
    alert(what + ' 로 표시했습니다 ✓' +

/* 🔴 [매물로 접수] — **허락받은 것만**. 허락 전에는 버튼이 아예 없다. */
async function colToListing(id){
  var nl = String.fromCharCode(10);
  if(COL_BUSY){ alert('처리 중입니다'); return; }
  var r = colFind(id);
  if(!r){ alert('그 줄을 찾지 못했습니다.'); return; }
  var st = colState(id);
  if(st.code !== '허락'){
    alert('🔴 허락받은 것만 매물장에 넣을 수 있습니다.' + nl +
          '지금 상태: ' + st.label); return; }
  if(String(r.writer || '') === '중개'){
    alert('🔴 중개업소 글입니다 — 등록하지 않습니다.'); return; }
  var j = colJudge(r);
  if(!j.bm){ alert('건물을 못 찾았습니다 — 건물부터 확인해야 합니다.'); return; }
  var ho = vacHo(String(r.apt || '') + ' ' + String(r.addr || ''));
  if(!ho){ alert('호실을 읽지 못했습니다 — 수집 글에 호실이 없습니다.'); return; }
  if(VAC_LOCK.indexOf(ho) >= 0){ alert('🔴 ' + ho + '호는 저장하지 않기로 한 호실입니다.'); return; }
  if(!j.unitId && VAC_NO_NEW.indexOf(ho) >= 0){
    alert('🔴 ' + ho + '호는 새로 만들지 않기로 한 호실입니다.'); return; }

  var uid = j.unitId || (j.bm.id + '-' + uHoKey(ho + '호'));
  var dep = String(r.deposit || '').replace(/[^0-9]/g, '');
  var rn = String(r.rent || '').replace(/[^0-9]/g, '');
  if(!confirm(['허락받은 매물을 매물장에 넣습니다 — 이대로 할까요?', '',
    '건물   ' + j.bm.name, '호실   ' + ho + '호  (' + uid + ')',
    '값     ' + (dep || '(비움)') + '/' + (rn || '(비움)'),
    '출처   수집매물 ' + r.src + ' ' + r.id + ' · 허락 ' + (st.at || todayStr()),
    '', '🔴 접수 상태로만 넣습니다. 문자는 나가지 않습니다.'].join(nl))) return;

  COL_BUSY = true;
  try{
    var g = await jget({ action:'getAll', type:'listings' });
    var fresh = (g.data || g.result || []).map(adsRestore);
    if(!j.unitId){
      await erpUpsert('units', {
        id: uid, buildingId: j.bm.id, ho: ho + '호', hoKey: uHoKey(ho + '호'),
        floor: String(r.floor || ''), area: String(r.area || ''),
        rooms: '', baths: '', direction: '', structure: '',
        note: '수집매물 ' + r.src + ' ' + r.id + ' 에서 접수(허락 받음)',
        updatedAt: new Date().toISOString()
      });
    }
    var obj = {
      id: vacNewId(fresh), apt: String(j.bm.name || ''), addr: String(j.bm.addr || ''),
      addr2: ho + '호', status: '접수', type: String(r.trade || '월세'),
      price: dep, rentAmt: rn, area: String(r.area || ''), floor: String(r.floor || ''),
      kind: String(r.kind || ''), unitId: uid, recvDate: todayStr(),
      note: ['[수집매물 ' + r.src + ' ' + r.id + ']',
             '허락 ' + (st.at || todayStr()) + ' — 임대인 확인 뒤 접수',
             String(r.url || ''),
             '작성 ' + String(r.writer || '') + ' ' + String(r.nick || '')].filter(Boolean).join(nl).slice(0, 1000),
      updatedAt: new Date().toISOString()
    };
    await erpUpsert('listings', obj);
    /* 연락처 → 사람마스터에 있으면 '접수연락처' 로만 */
    var pr = personByPhone(r.phone);
    if(pr && !pr.many){
      var lid = 'L-' + String(pr.id).replace('P-', '') + '-' + uHoKey(ho + '호') + '-접수';
      var has = (DB.roleLinks || []).some(function(x){ return String(x.id) === lid; });
      if(!has){
        await erpUpsert('roleLinks', {
          id: lid, personId: String(pr.id), scope: 'unit', targetId: uid,
          role: '접수연락처', since: todayStr(), until: '',
          evidence: '수집매물 ' + r.src + ' ' + r.id, note: '수집 글의 연락처 — 소유자로 확인된 것이 아닙니다',
          updatedAt: new Date().toISOString()
        });
      }
    }
    var g2 = await jget({ action:'getAll', type:'listings' });
    DB.listings = (g2.data || g2.result || []).map(adsRestore);
    DB.units = null; DB.roleLinks = null;
    await loadMasters(['units', 'roleLinks']);
    var now = (DB.listings || []).filter(function(x){ return String(x.id) === String(obj.id); })[0];
    COL_BUSY = false; COL_OPEN = ''; route();
    alert([now ? '매물장에 넣었습니다 ✓' : '🔴 다시 읽었더니 안 보입니다 — 확인이 필요합니다', '',
      obj.id + ' · ' + obj.apt + ' ' + obj.addr2, '호실 ' + uid].join(nl));
  }catch(e){
    COL_BUSY = false; route();
    alert('넣지 못했습니다 — 자료는 그대로입니다.' + nl + String(e && e.message || e));
  }
}
/* 3-6 답장 — 그 번호로 온 인입이 있으면 알린다. 🔴 자동으로 허락 처리하지 않는다 */
function colReply(r){
  if(!r || !String(r.phone || '').trim()) return null;
  var st = colState(r.id);
  if(!st.at) return null;
  var since = String(st.at).slice(0, 10);
  var hit = (DB.inbox || []).filter(function(x){
    if(!phHas(x.phone, r.phone)) return false;
    return String(x.when || '').slice(0, 10) >= since;
  });
  return hit.length ? { n:hit.length, last:hit[0] } : null;
}

function viewInbox(){
  if(DB.err) return crumb() + '<div class="h1row"><h1>통합 인입함</h1></div>' + keyBox();
  /* 🔴 2026-09-14 — 인입함을 아직 못 읽었으면 **0건이라고 말하지 않는다**.
     (화면 잠금을 매물 기준으로 바꾸면서 이 화면이 먼저 열릴 수 있게 됐다) */
  if(DB.inbox === null){
    return crumb() + '<div class="h1row"><h1>통합 인입함</h1></div>' +
      (DB.loading ? loadpCard()
        : loadErrBox('인입함을 아직 읽지 못했습니다 — 0건이 아닙니다.', '인입함 자료', 'retryAll()'));
  }
  /* 🆕 2026-09-14 — 새 경로(건물마스터·호실마스터·사람마스터)가 쓰일 화면이다.
     🔴 첫 적재가 **끝난 뒤에만** 읽는다 — 같이 읽으면 첫 화면이 다시 느려진다.
     아직 없으면 새 경로가 스스로 비켜서고 기존 경로로 돈다(화면은 그대로 뜬다). */
  if(DB.ready && DB.buildings === null) loadMasters(['buildings', 'units', 'persons']);
  var all = DB.inbox || [];
  var rows = inboxRows();
  var un = all.filter(function(r){ return !r.reg; }).length;
  /* 🆕 1단계 — 최근 30일 · 탭 4개 · 미처리 먼저 */
  var tabRows = inbRows(INB_TAB);
  var bySrc = {};
  all.forEach(function(r){ var s = srcOf(r.kind, r.text); bySrc[s] = (bySrc[s]||0) + 1; });

  var h = crumb() +
  '<div class="h1row"><h1>통합 인입함</h1><span class="cnt">총 <b>' + all.length + '</b>건' +
    ' / 미처리 <b class="hot">' + un + '</b>건' +
    (UI.src||UI.st||UI.qq ? ' · 지금 화면 <b>' + rows.length + '</b>건' : '') + '</span></div>' +
  '<div class="bar">' +
    '<input type="search" id="fq" placeholder="이름 · 번호 · 건물 · 내용 검색" value="' + esc(UI.qq) + '">' +
    '<select id="fsrc"><option value="">전체 출처</option>' +
      SRC_ALL.map(function(s){
        var n = bySrc[s] || 0;
        return '<option value="' + s + '"' + (UI.src===s?' selected':'') + (n?'':' disabled') + '>' +
          s + ' (' + n + ')</option>';
      }).join('') + '</select>' +
    '<select id="fst"><option value="">전체 상태</option>' +
      '<option value="un"' + (UI.st==='un'?' selected':'') + '>미처리</option>' +
      '<option value="done"' + (UI.st==='done'?' selected':'') + '>처리됨</option></select>' +
    '<button class="btn" onclick="reload()">다시 불러오기</button>' +
    /* 🔴 대표 메모 — 새 화면을 만들지 않고 여기 한 줄만 더한다(2026-09-12 지시 3).
       적으면 인입함에 한 줄이 들어가고 바로 접수후보로 흐른다. 매물장은 바뀌지 않는다. */
    '<input type="text" id="memoIn" placeholder="메모 접수 — 예: 노형동 OO빌 502호 300/55 다음주 입주" ' +
      'style="flex:1;min-width:240px" onkeydown="if(event.key===&#39;Enter&#39;)memoAdd()">' +
    '<button class="btn pri" onclick="memoAdd()">메모 접수</button>' +
    '<button class="btn" onclick="UI.help=!UI.help;route()">Help</button>' +
    '<span style="flex:1"></span>' +
    '<button class="btn" disabled title="다음 단계">인쇄</button>' +
    '<button class="btn" disabled title="다음 단계">표시항목</button>' +
    '<button class="btn" disabled title="다음 단계">엑셀</button>' +
  '</div>' +
  '<div class="kpis">' +
    kpi('전체', all.length, '', '') +
    kpi('미처리', un, un?'w':'', "UI.st='un';route()") +
    kpi('통화녹음', bySrc['통화녹음']||0, '', "go('crm','inbox','통화녹음')") +
    kpi('SMS', bySrc['SMS']||0, '', "go('crm','inbox','SMS')") +
    kpi('사진접수', bySrc['사진접수']||0, '', "go('crm','inbox','사진접수')") +
    kpi('부재중전화', bySrc['부재중전화']||0, '', "go('crm','inbox','부재중전화')") +
  '</div>';
  h += '<div class="note i">인입함 <b>' + (DB.inboxTotal || 0) + '줄</b> 중 <b>' +
    (DB.inboxRaw || 0) + '줄</b>을 읽었습니다(' + (DB.inboxPages || 0) + '쪽). ' +
    ((DB.inboxRaw || 0) >= (DB.inboxTotal || 0)
      ? '전체를 읽었으니 계약완료 판정·중복검사에 써도 됩니다.'
      : '🔴 <b>덜 읽었습니다</b> — 읽은 범위 밖 문자는 "없는 것" 으로 보이니 판정에 쓰지 마세요.') +
    (DB.inboxCut ? ' 🔴 12쪽에서 끊었습니다.' : '') + '</div>';
  /* ══ 🆕 1단계 화면 — 최근 30일, 탭 4개 ══ */
  h += '<div class="card" style="margin:0 0 14px"><div class="sbody" style="padding:12px 14px">' +
    '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px">' +
    '<b style="font-size:14px">최근 ' + INB_DAYS + '일</b>' +
    INB_TABS.map(function(t){
      var n = inbUndone(t), tot = inbCount(t);
      return '<button class="btn sm' + (INB_TAB === t ? ' pri' : '') + '" ' +
        'onclick="INB_TAB=&#39;' + esc(t) + '&#39;;INB_OPEN=&#39;&#39;;INB_FORM=null;route()">' +
        esc(t) + ' <b>' + n + '</b>/' + tot + '</button>';
    }).join(' ') +
    '<span style="flex:1"></span>' +
    '<span style="font-size:12px;color:var(--t3)">미처리가 먼저 나옵니다 · 처리된 줄은 흐리게</span>' +
    '</div>';
  if(!tabRows.length){
    h += '<div class="empty" style="padding:18px">최근 ' + INB_DAYS + '일 안에 ' +
         esc(INB_TAB) + ' 가 없습니다. <b>0건이 아니라 이 기간에 없는 것</b>입니다.</div>';
  } else {
    h += '<div class="tblwrap"><table><colgroup><col style="width:112px"><col style="width:124px">' +
      '<col><col style="width:120px"><col style="width:70px"></colgroup>' +
      '<thead><tr><th>날짜</th><th>발신번호</th><th>내용</th><th>처리상태</th><th></th></tr></thead><tbody>';
    tabRows.slice(0, 200).forEach(function(r){
      var doneRow = !!r.reg;
      var open = String(INB_OPEN) === String(r.row);
      h += '<tr' + (doneRow ? ' style="opacity:.55"' : '') + '>' +
        '<td class="mono">' + esc(String(r.when || '').slice(0, 16)) + '</td>' +
        '<td class="mono">' + esc(phMask(r.phone) || '-') + '</td>' +
        '<td><span class="ell">' + esc(maskSecret(String(r.text || '')).slice(0, 60)) + '</span></td>' +
        '<td>' + (doneRow ? ('<span class="pill p-good">' + esc(String(r.reg).slice(0, 14)) + '</span>')
                          : '<span class="pill p-warn">미처리</span>') + '</td>' +
        '<td><button class="btn sm" onclick="inbOpen(&#39;' + esc(String(r.row)) + '&#39;)">' +
          (open ? '닫기' : '열기') + '</button></td></tr>';
      if(open) h += '<tr><td colspan="5" style="padding:0 0 10px">' + inbPanel(r) + '</td></tr>';
    });
    h += '</tbody></table></div>';
    if(tabRows.length > 200) h += '<div style="font-size:12px;color:var(--t3);margin-top:6px">' +
      '🔴 ' + tabRows.length + '건 중 200건만 보여 줍니다.</div>';
  }
  h += '</div></div>';

  var pathN = 0;
  (DB.inbox || []).forEach(function(r){ pathN += (r.dupPath || 0); });
  if(pathN) h += '<div class="note i">그 중 <b>' + pathN + '줄</b>은 같은 문자 한 통이 ' +
    '<b>실시간과 백업 두 경로</b>로 들어온 것입니다(같은 번호 · 본문 전체가 같고 10초 이내 · ' +
    '경로가 다를 때만 묶습니다).</div>';
  if(DB.inboxDup) h += '<div class="note i">🔴 같은 문자가 여러 줄 들어와 있어 <b>' +
    DB.inboxDup + '줄</b>을 한 줄로 묶어 보여 줍니다(받아온 ' + (DB.inboxRaw || 0) +
    '줄 → ' + all.length + '줄). 휴대폰 백업 파일이 여러 개라 회수가 같은 문자를 ' +
    '다시 넣은 것입니다. <b>시트는 그대로</b>이고 지운 것은 없습니다.</div>';

  if(UI.help) h += '<div class="note i"><b>이 화면 사용법</b><br>' +
    '· 한 줄을 누르면 오른쪽에 상세가 열립니다(페이지 이동 없음).<br>' +
    '· 오른쪽에서 <b>AI 추출 → 건물 대조 → 판정 → 사진 → 광고</b> 순서로 확인합니다.<br>' +
    '· 🔴 이 화면은 아직 <b>아무것도 저장하지 않습니다</b>. [매물 접수]는 후보만 만들어 보여 줍니다.<br>' +
    '· 🔴 통화에 섞인 <b>출입 비밀번호</b>는 목록·요약에서 자동으로 가립니다(원문 보기에서 권한 확인 후 열람).</div>';

  h += '<div class="split' + (UI.sel !== null ? ' open' : '') + '">' +
  '<div class="card"><div class="tblwrap"><table>' +
  '<colgroup><col style="width:34px"><col style="width:124px"><col style="width:84px"><col style="width:150px">' +
  '<col style="width:118px"><col style="width:120px"><col style="width:62px"><col><col style="width:96px"><col style="width:150px"></colgroup>' +
  '<thead><tr><th><input type="checkbox" class="chk" disabled></th><th>수신일시</th><th>출처</th><th>이름/발신자</th>' +
  '<th>전화번호</th><th>건물명</th><th>호실</th><th>요약</th><th>처리상태</th><th>빠른 분류</th></tr></thead><tbody>';

  if(!rows.length){
    h += '<tr><td colspan="10" class="empty">조건에 맞는 인입이 없습니다</td></tr>';
  } else {
    rows.forEach(function(r, i){
      var ai = aiExtract(r.text);
      var txt = maskSecret(String(r.text||'')).replace(/\s+/g,' ').trim();
      h += '<tr' + (UI.sel === r.row ? ' class="sel"' : '') + ' onclick="pick(' + r.row + ')">' +
        '<td><input type="checkbox" class="chk" disabled onclick="event.stopPropagation()"></td>' +
        '<td class="mono">' + esc(String(r.when||'').slice(0,16)) + '</td>' +
        '<td>' + esc(srcOf(r.kind, r.text)) + '</td>' +
        '<td><span class="ell">' + esc(r.name || '-') + '</span></td>' +
        '<td class="mono"><span class="ell">' + esc(phoneShow(r.phone) || '-') + '</span></td>' +
        '<td><span class="ell">' + esc(r.bld || (bldgTokens([r.name,r.bld].join(' ')).name ? '' : '') || '-') + '</span></td>' +
        '<td>' + esc(ai.unit || (ai.unitCands ? '여러개' : '-')) + '</td>' +
        '<td><span class="ell">' + esc(txt.slice(0,120)) + '</span></td>' +
        '<td>' + (r.reg ? '<span class="pill p-mute">처리됨</span>' : '<span class="pill p-warn">미처리</span>') +
          ((r.dup || 1) > 1 ? ' <span class="pill p-mute" title="같은 문자가 인입함에 ' + r.dup +
            '줄 있습니다(시트는 그대로)">같은 문자 ' + r.dup + '줄</span>' : '') + '</td>' +
        '<td onclick="event.stopPropagation()"><div class="rowacts">' +
          '<button class="btn sm" onclick="pick(' + r.row + ')">매물</button>' +
          '<button class="btn sm" disabled title="다음 단계">고객</button>' +
          '<button class="btn sm" disabled title="다음 단계">임대인</button>' +
          '<button class="btn sm" disabled title="다음 단계">임장</button>' +
        '</div></td></tr>';
    });
  }
  h += '</tbody></table></div>' +
    '<div class="actbar">' +
      '<button class="btn pri" disabled title="다음 단계">+ 신규</button>' +
      '<button class="btn" disabled title="다음 단계">상태변경</button>' +
      '<button class="btn" disabled title="다음 단계">문자/발송</button>' +
      '<button class="btn" disabled title="다음 단계">엑셀</button>' +
      '<span style="flex:1"></span>' +
      '<span style="font-size:12.5px;color:var(--t3);align-self:center">🔴 이 화면은 저장하지 않습니다</span>' +
    '</div></div>';

  h += UI.sel !== null ? detailPanel() : '';
  h += '</div>';
  return h;
}

function pick(rowId){
  UI.sel = (UI.sel === rowId) ? null : rowId;
  route();
}
function findRow(){
  return (DB.inbox||[]).filter(function(r){ return r.row === UI.sel; })[0] || null;
}
function detailPanel(){
  var r = findRow();
  if(!r) return '';
  var ai = aiExtract(r.text);
  var bm = matchBuilding(r, ai);
  var j = judge(ai, bm);
  var ph = judgePhoto(j, bm, ai, r);
  var ad = judgeAd(ai, ph);
  var secret = hasSecret(r.text);

  var badge = { SAME:['p-mute','⚪ 동일'], CHANGE:['p-warn','🟠 조건변경'], NEW:['p-brand','🔵 신규 매물후보'],
                NEW_BUILDING:['p-brand','🔵 신규 건물'], REVIEW_REQUIRED:['p-bad','🔴 확인필요'] }[j.code];
  var phb = { PHOTO_READY:['p-ok','PHOTO_READY'], PHOTO_REQUIRED:['p-bad','PHOTO_REQUIRED'],
              REVIEW_REQUIRED:['p-warn','REVIEW_REQUIRED'], BUILDING_ONLY:['p-warn','BUILDING_ONLY'],
              NO_PHOTO:['p-bad','NO_PHOTO'] }[ph.code] || ['p-warn', ph.code];
  var adb = { AD_READY:['p-ok','AD_READY'], DATA_REQUIRED:['p-warn','DATA_REQUIRED'],
              PHOTO_REQUIRED:['p-bad','PHOTO_REQUIRED'], REVIEW_REQUIRED:['p-warn','REVIEW_REQUIRED'] }[ad.code] || ['p-warn', ad.code];

  var h = '<div class="side"><h3><span>인입 상세 · 행' + r.row + '</span>' +
    '<button class="btn sm" onclick="UI.sel=null;route()">닫기</button></h3><div class="sbody">';

  h += '<dl class="kv">' +
    '<dt>수신일시</dt><dd class="mono">' + esc(r.when) + '</dd>' +
    '<dt>출처</dt><dd>' + esc(srcOf(r.kind, r.text)) + '</dd>' +
    '<dt>발신자</dt><dd>' + esc(r.name || '-') + '</dd>' +
    '<dt>전화번호</dt><dd class="mono">' + esc(phoneShow(r.phone) || '-') + '</dd>' +
    '<dt>처리상태</dt><dd>' + (r.reg ? '처리됨' : '미처리') + '</dd>' +
    '</dl>';

  if(secret) h += '<div class="note b">🔴 이 글에 <b>출입 비밀번호</b>로 보이는 내용이 있습니다 — 목록·요약·광고에는 나가지 않습니다.</div>';

  /* ① AI 추출 */
  h += '<div class="sec"><h4>① AI 정보추출</h4><dl class="kv">' +
    '<dt>건물명</dt><dd>' + esc(bm.bldg || '-') + '</dd>' +
    '<dt>주소</dt><dd>' + esc(bm.addr || (bm.jibun ? ('(지번 ' + bm.jibun + ')') : '-')) + '</dd>' +
    '<dt>호실</dt><dd>' + esc(ai.unit || (ai.unitCands ? ai.unitCands.join(', ') + ' (여러 개)' : '-')) + '</dd>' +
    '<dt>거래유형</dt><dd>' + esc(ai.trade || '-') + '</dd>' +
    '<dt>매물유형</dt><dd>' + esc(ai.kind || '-') + '</dd>' +
    '<dt>보증금</dt><dd>' + (ai.deposit ? esc(ai.deposit) + '만' : '-') + '</dd>' +
    '<dt>월세</dt><dd>' + (ai.rent ? esc(ai.rent) + '만' : '-') + '</dd>' +
    '<dt>관리비</dt><dd>' + (ai.feeIncluded ? '월세에 포함(금액 미확인)' : '-') + '</dd>' +
    '<dt>퇴실청소비</dt><dd>' + (ai.clean ? esc(ai.clean) + '만' : '-') + '</dd>' +
    '</dl>';
  if(ai.missing.length) h += '<div class="note w">🔴 확신하지 못한 값은 <b>비워 두었습니다</b>(임의로 채우지 않습니다): ' +
    esc(ai.missing.join(' · ')) + '</div>';
  h += '</div>';

  /* ② 건물·호실·매물 대조 */
  h += '<div class="sec"><h4>② 건물 → 호실 → 매물 대조</h4><ul class="steps">' +
    '<li><i>' + (bm.landlords.length ? '✅' : '—') + '</i><span>임대인 명부</span><b>' +
      (bm.landlords.length ? esc(bm.landlords[0].apt || '') + ' · ' + esc(bm.landlords[0].addr || '') : '없음') + '</b></li>' +
    '<li><i>' + (bm.listings.length ? '✅' : '—') + '</i><span>같은 건물 매물</span><b>' + bm.listings.length + '건</b></li>' +
    '<li><i>' + (ai.unit ? '✅' : '🔴') + '</i><span>호실</span><b>' + esc(ai.unit || '읽지 못함') + '</b></li>' +
    '<li><i>' + (j.hit ? '✅' : '—') + '</i><span>그 호실 현재 매물</span><b>' + (j.hit ? esc(j.hit.id) : '없음') + '</b></li>' +
    '</ul>' +
    '<div style="margin-top:8px">판정 <span class="pill ' + badge[0] + '">' + badge[1] + '</span> ' +
      '<span style="font-size:12.5px;color:var(--t2)">' + esc(j.why) + '</span></div>';
  if(bm.how.length) h += '<div style="margin-top:6px;font-size:12.5px;color:var(--t3)">대조 근거: ' + esc(bm.how.join(' + ')) + '</div>';
  if(j.changes.length) h += '<div class="note w" style="margin-top:8px">' + j.changes.map(function(c){
      return c.label + ' <b>' + esc(c.from) + '만</b> → <b>' + esc(c.to) + '만</b>'; }).join('<br>') + '</div>';
  h += '</div>';

  /* ②-2 연결된 매물이 있으면 그 매물의 이력 탭 */
  if(j.hit){
    h += '<div class="sec"><h4>매물 ' + esc(j.hit.id) + ' — 이력</h4>' + histTabs(j.hit, null, null) + '</div>';
  }

  /* ③ 사진 */
  h += '<div class="sec"><h4>③ 사진 (드라이브 실측)</h4>' +
    '<div>사진상태 <span class="pill ' + phb[0] + '">' + phb[1] + '</span></div>' +
    '<div style="margin-top:6px;font-size:12.5px;color:var(--t2)">' + esc(ph.why) + '</div>';
  if(ph.bldFolder) h += '<div style="margin-top:6px;font-size:12px;color:var(--t3)">폴더: ' + esc(ph.bldFolder) + '</div>';
  if(ph.unit) h += '<div class="note g" style="margin-top:8px">EXACT_UNIT · ' + esc(ph.unit.name) +
      ' — 원본 ' + ph.unit.raw + '장 · 보정완료 ' + ph.unit.done + '장</div>';
  if(ph.others.length) h += '<div class="note w" style="margin-top:8px">같은 건물 다른 호실 사진: ' +
      ph.others.map(function(o){ return esc(o.name) + ' ' + (o.raw + o.done) + '장'; }).join(' · ') +
      '<br>🔴 <b>이 사진들을 ' + esc(ai.unit || '이 호실') + ' 광고사진으로 쓰지 않습니다.</b></div>';
  if(ph.note) h += '<div class="note b" style="margin-top:8px">' + esc(ph.note) + '</div>';

    '<div style="margin-top:6px;font-size:12.5px;color:var(--t2)">' + esc(ad.why) + '</div>' +

        ' 사진이 없는 상태로는 게시되지 않습니다.</div>' : '') +
    '<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">' +
      '<button class="btn" disabled title="사진·필수정보가 갖춰져야 열립니다">광고 준비</button>' +
      '<button class="btn" disabled title="🔴 외부 게시는 아직 검증 전입니다">실제 게시 (검증 전)</button>' +
    '</div></div>';

  /* ④-2 사진·광고 이력 탭(같은 매물) — 판정값을 넘겨 준다 */
