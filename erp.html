    h += '<div class="sec"><h4>' + esc(HIST_TAB) + ' (매물 ' + esc(j.hit.id) + ')</h4>'
       + histTabs(j.hit, ph, ad) + '</div>';
  }

  /* ⑤ 다음 업무 */
  h += '<div class="sec"><h4>⑤ 여기서 할 일</h4><div style="display:flex;gap:6px;flex-wrap:wrap">' +
    '<button class="btn" onclick="preview(' + r.row + ')">후보 미리보기</button>' +
    (j.code === 'NEW'
      ? '<button class="btn pri" onclick="erpSaveListing(' + r.row + ')">🔴 매물 접수(실제 등록)</button>'
      : '<button class="btn" disabled title="신규(NEW) 후보만 접수합니다">매물 접수</button>') +
    '<button class="btn" disabled title="다음 단계">촬영 업무 만들기</button>' +
    '<button class="btn" disabled title="다음 단계">확인필요로 보내기</button>' +
    '</div><div style="margin-top:8px;font-size:12.5px;color:var(--t3)">' +
    (j.code === 'NEW'
      ? '[매물 접수]를 누르면 <b>확인창</b>이 뜨고, 눌러야 매물장에 <b>이 한 건만</b> 새로 등록됩니다. 기존 매물은 손대지 않습니다.'
      : '지금은 신규(NEW) 후보만 접수합니다.') + '</div>';
  if(LASTSAVE) h += '<div class="note g">✅ ' + esc(LASTSAVE.when) + ' 등록 완료 · <b>' +
    esc(LASTSAVE.id) + '</b> · 매물 ' + LASTSAVE.before + ' → ' + LASTSAVE.after + '건 · 같은 호실 ' +
    LASTSAVE.dup + '건</div>';

  /* 원문 */
  h += '<div class="sec"><h4>원문' + (secret ? ' (비밀번호 가림)' : '') + '</h4>' +
    '<pre class="raw">' + esc(maskSecret(r.text)) + '</pre></div>';

  h += '</div></div>';
  return h;
}

/* ═══════════════════════════════════════════════════════════════════
   매물 접수 — 🔴 실제로 저장한다(신규 1건). 기존 매물은 건드리지 않는다.
   · 저장 직전에 시트를 다시 읽어 같은 건물·호실이 이미 있는지 확인한다
   · 사람이 확인창에서 눌러야만 보낸다
   · 단건 upsert 1회만 — 전체 저장(saveAll) 을 쓰지 않는다
   · 🔴 비밀번호 같은 민감정보는 어떤 칸에도 넣지 않는다
   ═══════════════════════════════════════════════════════════════════ */
var KIND_CODE = { '오픈형 원룸':'R', '분리형 원룸':'R', '빌라(투룸 이상)':'B', '아파트':'A',
                  '오피스텔':'R', '주택':'D', '상가':'S', '사무실':'F', '건물':'G',
                  '공장/창고':'C', '토지':'T', '기타':'X' };
var DEAD_ST = ['거래완료', '계약완료'];
var SAVING = false;
var LASTSAVE = null;

function pad2(n){ return (n < 10 ? '0' : '') + n; }
function todayStr(){
  var d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
}
function newListingId(kind, list){
  var p = KIND_CODE[kind] || 'X';
  var d = new Date();
  var ymd = String(d.getFullYear()).slice(2) + pad2(d.getMonth()+1) + pad2(d.getDate());
  var seq = 1, id;
  do { id = p + ymd + '-' + pad2(seq); seq++; }
  while(list.some(function(l){ return String(l.id) === id; }));
  return id;
}
function dupCheck(list, apt, addr2){
  var same = list.filter(function(o){
    return sq(o.apt) === sq(apt) && sq(o.addr2) === sq(addr2); });
  return { all: same, alive: same.filter(function(o){ return DEAD_ST.indexOf(String(o.status||'')) < 0; }) };
}
/* HEADERS 에 있는 칸만 채운다 — 새 DB 칸을 만들지 않는다 */
function buildListing(r, ai, bm, id){
  var nl = String.fromCharCode(10);
  var lines = ['[ERP 접수 ' + todayStr() + '] 출처 통화녹음 · 인입함 행' + r.row +
               ' (' + String(r.when||'').slice(0,16) + ')'];
  if(ai.feeIncluded) lines.push('관리비: 월세에 포함(통화) — 금액 미확인');
  if(ai.clean) lines.push('퇴실 청소비 ' + ai.clean + '만원(통화)');
  lines.push('사진: 이 호실 사진 없음 → 촬영 필요. 같은 건물 다른 호실 사진은 쓰지 않음');
  /* 🔴 §7 (2026-09-13) — 원본에서 **확정된 것만** 넣는다. 없는 값은 빈칸으로 둔다.
     · 다른 호실 값을 끌어오지 않는다 · 사진은 승계하지 않는다
     · 임대인은 보낸 번호로 찾은 1명만(여러 명이면 비운다 — 틀린 사람을 넣지 않는다) */
  var ld = null;
  var lds = (bm.landlords || []);
  if(lds.length === 1) ld = lds[0];
  else if(r && r.phone){
    var byPh = (DB.landlords || []).filter(function(L){ return phHas(L.phone, r.phone); });
    if(byPh.length === 1) ld = byPh[0];
  }
  var srcWord = srcOf(r.kind, r.text);
  if(ai.fee) lines.push('관리비 ' + ai.fee + '만원(원본에 적힘)');
  if(ai.moveIn) lines.push('입주 가능 ' + ai.moveIn + '(원본에 적힘)');
  if((r.origins || []).length) lines.push('원본 경로: ' + r.origins.join(' · '));
  return {
    id: id,
    apt: bm.bldg || '',
    addr: bm.addr || '',
    addr2: ai.unit || '',
    type: ai.trade || '월세',
    kind: ai.kind || '',
    price: ai.deposit || '',
    rentAmt: ai.rent || '',
    status: '접수',
    recvDate: todayStr(),
    note: lines.join(nl),
    /* 확정된 것만 — 관리비는 '포함' 이면 금액을 넣지 않는다(허위값 금지) */
    feeType: (ai.feeIncluded ? '월세에 포함' : (ai.fee ? '기타 부과' : '')),
    feeAmt: (ai.feeIncluded ? '' : (ai.fee || '')),
    availDate: ai.moveIn || '',
    cname: ld ? String(ld.name || '') : '',
    cphone: ld ? String(ld.phone || '') : '',
    area: '', floor: '', totalFloor: '', rooms: '', baths: '',
    direction: '', agent: ''
  };
}
/* 🔴 2026-09-13 §14·§18 — DRY-RUN.
   dry 를 주면 **저장 직전까지 똑같이 해 보고** 만들어질 row 를 돌려준다.
   POST 하지 않고, 확인창도 띄우지 않는다.
   🔴 실제 저장과 **같은 함수**(buildListing)로 payload 를 만든다 —
      미리보기와 실제가 달라지는 일을 구조로 막는다. */
async function erpSaveListing(rowId, dry){
  var nl = String.fromCharCode(10);
  function stop(why, more){
    if(dry) return { ok:false, why:why, detail:more || '' };
    alert(why + (more ? (nl + more) : ''));
    return undefined;
  }
  if(SAVING && !dry){ alert('저장 중입니다'); return; }
  var r = (DB.inbox||[]).filter(function(x){ return String(x.row) === String(rowId); })[0];
  if(!r) return stop('그 인입 줄을 찾지 못했습니다');
  var ai = aiExtract(r.text);
  var bm = matchBuilding(r, ai);
  var j = judge(ai, bm);
  if(j.code !== 'NEW')
    return stop('지금은 신규(NEW) 후보만 접수합니다.', '판정: ' + j.code + ' — ' + j.why);
  if(!ai.unit || !bm.bldg || !bm.addr)
    return stop('건물·주소·호실이 모두 확인돼야 접수합니다.',
                '건물=' + (bm.bldg || '-') + ' 주소=' + (bm.addr || '-') + ' 호실=' + (ai.unit || '-'));
  var fresh;
  try{
    var g = await jget({ action:'getAll', type:'listings' });
    fresh = g.data || g.result || [];
  }catch(e){ return stop('매물장을 다시 읽지 못해 저장하지 않습니다: ' + (e && e.message || e)); }
  var before = fresh.length;
  var dup = dupCheck(fresh, bm.bldg, ai.unit);
  if(dup.alive.length){
    if(dry) return { ok:false, why:'같은 건물·호실 매물이 이미 있습니다',
                     detail:dup.alive.map(function(o){ return o.id + ' ' + o.status; }).join(', ') };
    alert('이미 같은 건물·호실 매물이 있습니다 — 새로 만들지 않습니다.' + nl +
          dup.alive.map(function(o){ return o.id + ' · ' + o.status; }).join(nl));
    DB.listings = fresh; route(); return;
  }
  if(dup.all.length){
    if(!confirm('같은 건물·호실이 과거 자료로 ' + dup.all.length + '건 있습니다(' +
        dup.all.map(function(o){ return o.id + ' ' + o.status; }).join(', ') + ').' + nl +
        '지금은 살아 있는 매물이 아니라 새 회차로 만듭니다. 계속할까요?')) return;
  }
  var id = newListingId(ai.kind, fresh);
  var obj = buildListing(r, ai, bm, id);
  if(dry){
    /* 🔴 여기서 멈춘다 — POST 하지 않는다. 만들어질 row 그대로를 돌려준다. */
    var ph0 = intakePhoto(intakeEvent(r, ai.unit));
    return { ok:true, id:id, payload:obj, before:before, after:before + 1,
             dupPast:dup.all.length,
             empties:Object.keys(obj).filter(function(k){ return String(obj[k] || '') === ''; }),
             filled:Object.keys(obj).filter(function(k){ return String(obj[k] || '') !== ''; }),
             photoInherited:('photoUrl' in obj) || ('photoCnt' in obj),
             photoState:ph0.code + '/E' + ph0.EXACT_UNIT + (ph0.srcCode ? ('/' + ph0.srcCode) : ''),
             srcRow:{ origin:(r.origins || ['인입함']).join('·'), row:String(r.row),
                      when:String(r.when || ''), kind:String(r.kind || '') } };
  }
  var msg = ['매물장에 새로 등록합니다', '',
    '매물번호  ' + id,
    '건물      ' + obj.apt,
    '주소      ' + obj.addr,
    '호실      ' + obj.addr2,
    '거래      ' + obj.type + ' / ' + (obj.kind || '(미확인)'),
    '보증금    ' + obj.price + '만',
    '월세      ' + obj.rentAmt + '만' + (ai.feeIncluded ? ' (관리비 포함)' : ''),
    '상태      ' + obj.status,
    '', '지금 매물 ' + before + '건 → ' + (before + 1) + '건',
    '🔴 사진이 없어 광고는 나가지 않습니다.',
    '🔴 비밀번호 등 민감정보는 저장하지 않습니다.', '', '이대로 등록할까요?'].join(nl);
  if(!confirm(msg)) return;

  SAVING = true;
  try{
    var u = gsUrl(), t = gsTok();
    var res = await fetch(u, { method:'POST', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({ action:'upsert', type:'listings', data: obj, token: t }) });
    var jj = await res.json();
    if(!jj || !jj.ok) throw new Error((jj && jj.error) || '저장 실패');
    var g2 = await jget({ action:'getAll', type:'listings' });
    var after = g2.data || g2.result || [];
    var made = after.filter(function(o){ return String(o.id) === id; });
    var dup2 = dupCheck(after, bm.bldg, ai.unit);
    DB.listings = after;
    LASTSAVE = { id:id, before:before, after:after.length, made:made.length,
                 dup:dup2.all.length, when:new Date().toTimeString().slice(0,8) };
    /* 🔴 §13 (2026-09-13) — 승인 뒤 바로 다시 셈한다.
       대표가 새로 고치지 않아도 광고준비·사진·중복 판정이 새 값으로 나온다. */
    try{ vacRecalc(); }catch(e9){}
    SAVING = false;
    route();
    alert(['등록했습니다 ✓', '',
      '매물번호  ' + id,
      '매물 건수 ' + before + ' → ' + after.length,
      '같은 호실 ' + dup2.all.length + '건(방금 만든 것 포함)',
      made.length === 1 ? '다시 읽어 1건 확인했습니다.'
                        : '🔴 다시 읽었더니 ' + made.length + '건입니다 — 확인이 필요합니다.'].join(nl));
  }catch(e){
    SAVING = false;
    route();
    alert('저장 실패 — 매물장은 그대로입니다.' + nl + String(e && e.message || e));
  }
}

        '">' + esc(ph.code) + '</span></div>' +
        '<div style="margin-top:6px;font-size:12.5px;color:var(--t2)">' + esc(ph.why) + '</div>' +
        (ph.others && ph.others.length ? '<div class="note w" style="margin-top:8px">같은 건물 다른 호실: ' +
           ph.others.map(function(x){ return esc(x.name) + ' ' + (x.raw + x.done) + '장'; }).join(' · ') +
           '<br>🔴 이 호실 사진으로 쓰지 않습니다.</div>' : '')) : '';
    h += '<div class="empty" style="padding:14px">촬영·보정 이력은 아직 쌓이지 않습니다</div>';
  } else if(HIST_TAB === '광고이력'){
    h += ad ? ('<div>광고상태 <span class="pill ' + (ad.blocked ? 'p-bad' : 'p-ok') + '">' + esc(ad.code) +
        '</span></div><div style="margin-top:6px;font-size:12.5px;color:var(--t2)">' + esc(ad.why) + '</div>') : '';
    h += '<div class="empty" style="padding:14px">게시·수정·내림 이력이 아직 없습니다</div>';
  } else if(HIST_TAB === '가격이력'){
    h += '<div class="empty" style="padding:14px">가격 변경 이력이 아직 없습니다' +
         '<br><span style="font-size:12px">(값이 바뀌면 여기에 쌓입니다 — 지금 만들어 내지 않습니다)</span></div>';
  } else {
    h += '<div class="empty" style="padding:14px">공실·계약 이력이 아직 없습니다</div>';
  }
  return h;
}

/* ── 통합검색 ── */
function viewSearch(q){
  var ql = q.toLowerCase(), qd = nDigit(q);
  var L = (DB.listings||[]).filter(function(o){
    return [o.id,o.apt,o.addr,o.addr2,o.cname].join(' ').toLowerCase().indexOf(ql) >= 0; }).slice(0,20);
  var LD = (DB.landlords||[]).filter(function(o){
    return [o.name,o.apt,o.addr].join(' ').toLowerCase().indexOf(ql) >= 0 ||
           (qd && nDigit(o.phone).indexOf(qd) >= 0); }).slice(0,20);
  var IN = (DB.inbox||[]).filter(function(o){
    return [o.name,o.bld,o.text].join(' ').toLowerCase().indexOf(ql) >= 0 ||
           (qd && nDigit(o.phone).indexOf(qd) >= 0); }).slice(0,20);
  var bl = {};
  (DB.listings||[]).forEach(function(o){ if(o.apt && sq(o.apt).toLowerCase().indexOf(sq(ql)) >= 0) bl[o.apt] = (bl[o.apt]||0)+1; });
  (DB.landlords||[]).forEach(function(o){ if(o.apt && sq(o.apt).toLowerCase().indexOf(sq(ql)) >= 0) bl[o.apt] = bl[o.apt]||0; });

  var h = '<div class="crumb">통합검색</div><div class="h1row"><h1>“' + esc(q) + '” 검색 결과</h1></div>';
  h += '<div class="note i">검색되는 것: <b>건물 · 매물 · 임대인 · 인입함 · 고객 · 계약 · 직원</b>. ' +
       '🔴 전화번호는 권한에 따라 가려집니다. 직원 접속 토큰은 검색 결과에 나오지 않습니다.</div>';
  h += '<div class="srchg"><h4>건물 ' + Object.keys(bl).length + '</h4>' +
    (Object.keys(bl).length ? Object.keys(bl).map(function(k){
      return '<div class="srow">' + esc(k) + ' <span style="color:var(--t3)">· 매물 ' + (bl[k]||0) + '건</span></div>'; }).join('')
      : '<div class="srow" style="color:var(--t3)">없음</div>') + '</div>';
  h += '<div class="srchg"><h4>매물 ' + L.length + '</h4>' +
    (L.length ? L.map(function(o){
      return '<div class="srow"><b>' + esc(o.id) + '</b> · ' + esc(o.apt||'') + ' ' + esc(o.addr2||'') +
        ' <span style="color:var(--t3)">' + esc(o.type||'') + ' ' + esc(o.price||'') + '/' + esc(o.rentAmt||'') + '</span></div>'; }).join('')
      : '<div class="srow" style="color:var(--t3)">없음</div>') + '</div>';
  h += '<div class="srchg"><h4>임대인 ' + LD.length + '</h4>' +
    (LD.length ? LD.map(function(o){
      return '<div class="srow">' + esc(o.name||'(이름없음)') + ' · ' + esc(o.apt||'') +
        ' <span class="mono" style="color:var(--t3)">' + esc(phoneShow(o.phone)) + '</span></div>'; }).join('')
      : '<div class="srow" style="color:var(--t3)">없음</div>') + '</div>';
  h += '<div class="srchg"><h4>인입함 ' + IN.length + '</h4>' +
    (IN.length ? IN.map(function(o){
      return '<div class="srow" onclick="go(\'crm\',\'inbox\');pick(' + o.row + ')">' +
        '<span class="mono" style="color:var(--t3)">' + esc(String(o.when||'').slice(0,16)) + '</span> · ' +
        esc(maskSecret(String(o.text||'')).slice(0,70)) + '</div>'; }).join('')
      : '<div class="srow" style="color:var(--t3)">없음</div>') + '</div>';
  /* 고객 */
  var CU = (DB.customers||[]).filter(function(o){
    return [o.name,o.phone,o.region,o.propType].join(' ').toLowerCase().indexOf(ql) >= 0 ||
           (qd && nDigit(o.phone).indexOf(qd) >= 0); }).slice(0,20);
  h += '<div class="srchg"><h4>고객 ' + (DB.customers === null ? '(불러오는 중)' : CU.length) + '</h4>' +
    (DB.customers === null ? '<div class="srow" style="color:var(--t3)">고객 자료를 불러오는 중…</div>'
     : (CU.length ? CU.map(function(o){
        return '<div class="srow">' + esc(o.name||'(이름없음)') + ' · ' + esc(o.type||'') +
          ' <span class="mono" style="color:var(--t3)">' + esc(phoneShow(o.phone)) + '</span>' +
          ' <span style="color:var(--t3)">' + esc(o.progressStatus||'') + '</span></div>'; }).join('')
        : '<div class="srow" style="color:var(--t3)">없음</div>')) + '</div>';
  if(DB.customers === null) loadCustomers();
  /* 계약 */
  var CT = (DB.contracts||[]).filter(function(o){
    return [o.id,o.apt,o.addr2,o.tenantName,o.landlordName].join(' ').toLowerCase().indexOf(ql) >= 0; }).slice(0,20);
  h += '<div class="srchg"><h4>계약 ' + (DB.contracts === null ? '(불러오는 중)' : CT.length) + '</h4>' +
    (DB.contracts === null ? '<div class="srow" style="color:var(--t3)">계약 자료를 불러오는 중…</div>'
     : (CT.length ? CT.map(function(o){
        return '<div class="srow" onclick="CT_SEL=&#39;' + esc(o.id) + '&#39;;go(&#39;deal&#39;,&#39;contract&#39;)">' +
          '<b>' + esc(o.id) + '</b> · ' + esc((o.apt||'') + ' ' + (o.addr2||'')) +
          ' <span style="color:var(--t3)">' + esc(o.start||'') + '~' + esc(o.end||'') + '</span></div>'; }).join('')
        : '<div class="srow" style="color:var(--t3)">없음</div>')) + '</div>';
  if(DB.contracts === null) loadContracts();
  /* 직원 */
  var ST = (STAFF||[]).filter(function(o){
    return [o.id,o.name].join(' ').toLowerCase().indexOf(ql) >= 0; }).slice(0,20);
  h += '<div class="srchg"><h4>직원 ' + (STAFF === null ? '(불러오는 중)' : ST.length) + '</h4>' +
    (STAFF === null ? '<div class="srow" style="color:var(--t3)">직원 자료를 불러오는 중…</div>'
     : (ST.length ? ST.map(function(o){
        return '<div class="srow">' + esc(o.name||'-') + ' <span class="mono" style="color:var(--t3)">' +
          esc(o.id) + '</span> <span style="color:var(--t3)">🔴 토큰 비표시</span></div>'; }).join('')
        : '<div class="srow" style="color:var(--t3)">없음</div>')) + '</div>';
  if(STAFF === null) loadStaff();
  return h;
}

/* ═══════════════════════════════════════════════════════════════════
   광고자동화 1차 — 🔴 실제 외부 게시는 하지 않는다.
   기존 CRM 규약을 그대로 쓴다(새로 만들지 않는다):
     · PLATFORMS 7채널 · STATUS_OFF_MARKET · ads 필드({on,no,url,at,chk,memo})
     · adSnapshot/adHash → 값이 바뀌면 '수정필요'
     · 당근 필수칸은 DAANGN_HEADERS 실측 규격에서 가져온다
   근거 없는 채널 규칙은 만들지 않고 '확인 전'이라고 적는다.
   ═══════════════════════════════════════════════════════════════════ */
var AD_CH = [
  { key:'daangn',   label:'당근',   dedup:'unit',    validDays:0,  bulk:true  },
  { key:'zigbang',  label:'직방',   dedup:'listing', validDays:30, bulk:false },
  { key:'dabang',   label:'다방',   dedup:'listing', validDays:30, bulk:false },
  { key:'naver',    label:'네이버', dedup:'listing', validDays:90, bulk:false },
  { key:'isj',      label:'이실장', dedup:'listing', validDays:0,  bulk:false },
  { key:'peterpan', label:'피터팬', dedup:'none',    validDays:0,  bulk:false },
  { key:'blog',     label:'블로그', dedup:'none',    validDays:0,  bulk:false }
];
var AD_GOAL = ['daangn','zigbang','dabang','naver'];   /* 진행률 분모가 되는 목표 채널 */
var STATUS_OFF = ['계약완료','임대중','거래완료','보류'];
var TAKEDOWN_ST = ['계약완료','임대중','거래완료'];

function adOf(o, k){ return (o && o.ads && o.ads[k]) || null; }
function adOn(o, k){ var a = adOf(o,k); return !!(a && a.on); }
function adLive(o){ return STATUS_OFF.indexOf(String(o.status||'')) < 0; }
function adSnapshot(o){
  var opt = Array.isArray(o.options) ? o.options.join(',') : String(o.options||'');
  return [o.type,o.price,o.rentAmt,o.area,o.rooms,o.baths,o.floor,o.totalFloor,
          o.feeAmt,o.availDate,opt,o.desc].join('¦');
}
function adHash(s){
  var h = 0; s = String(s==null?'':s);
  for(var i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) | 0;
  return String(h);
}
function adStale(o, k){
  var a = adOf(o,k);
  return !!(a && a.on && a.chk && a.chk !== adHash(adSnapshot(o)));
}
function adExpired(o, k){
  var ch = AD_CH.filter(function(c){ return c.key===k; })[0] || {};
  var a = adOf(o,k);
  if(!a || !a.on || !a.at || !ch.validDays) return false;
  var t = Date.parse(String(a.at).replace(/\./g,'-'));
  if(isNaN(t)) return false;
  return (Date.now() - t) > ch.validDays * 86400000;
}

/* ── 필수항목 — 있는 근거만 쓴다 ───────────────────────────────── */
var NEED_COMMON = [['kind','매물유형'],['type','거래유형'],['price','보증금/매매가'],
                   ['addr','주소'],['addr2','상세주소']];
var NEED_RENT   = [['rentAmt','월세']];
/* 🔴 당근 규격(DAANGN_HEADERS 실측) — 과거 누락 사고가 있던 칸 */
var NEED_DAANGN = [['area','면적'],['rooms','방 수'],['baths','욕실 수'],
                   ['floor','층'],['totalFloor','총 층']];
function adMissing(o, k){
  var need = NEED_COMMON.slice();
  if(['월세','연세','단기','단기임대'].indexOf(String(o.type||'')) >= 0) need = need.concat(NEED_RENT);
  if(k === 'daangn') need = need.concat(NEED_DAANGN);
  var miss = [];
  need.forEach(function(f){
    if(!String(o[f[0]] == null ? '' : o[f[0]]).trim()) miss.push(f[1]);
  });
  return miss;
}
/* 그 매물의 사진 상태(드라이브 실측 인덱스) */
function adPhotoOf(o){
  var bm = { bldg:o.apt, addr:o.addr, jibun:(String(o.addr||'').match(/(\d{1,5}-\d{1,4})/)||[])[1]||'' };
  return judgePhoto({ code:'SAME', hit:o }, bm, { unit:o.addr2 }, { name:o.apt, bld:o.apt, text:o.addr });
}
/* ── 채널 하나의 광고 상태 ─────────────────────────────────────── */
function adState(o, k, ph){
  var a = adOf(o,k);
  if(TAKEDOWN_ST.indexOf(String(o.status||'')) >= 0 && a && a.on)
    return { code:'TAKEDOWN_REQUIRED', why:'매물이 ' + o.status + ' 인데 광고가 올라가 있습니다', miss:[] };
  if(!adLive(o)) return { code:'REVIEW_REQUIRED', why:'광고 대상이 아닌 상태(' + (o.status||'') + ')', miss:[] };
  var miss = adMissing(o, k);
  if(a && a.on){
    if(adStale(o,k)) return { code:'POSTED', sub:'수정필요', why:'광고 올린 뒤 매물 값이 바뀌었습니다', miss:miss };
    if(adExpired(o,k)) return { code:'POSTED', sub:'갱신필요', why:'게시한 지 오래됐습니다', miss:miss };
    return { code:'POSTED', why:'게시 중' + (a.at ? (' · ' + a.at) : ''), miss:miss };
  }
  if(miss.length) return { code:'DATA_REQUIRED', why:'필수항목 부족', miss:miss };
  if(!ph || ph.code !== 'PHOTO_READY')
    return { code:'PHOTO_REQUIRED', why:(ph && ph.why) || '광고에 쓸 이 호실 사진이 없습니다', miss:[] };
  return { code:'AD_READY', why:'필수항목·사진이 갖춰졌습니다', miss:[] };
}
/* 매물 한 건의 채널 전체 */
function adRow(o){
  var ph = adPhotoOf(o);
  var byCh = {};
  AD_CH.forEach(function(c){ byCh[c.key] = adState(o, c.key, ph); });
  var goalDone = AD_GOAL.filter(function(k){ return byCh[k].code === 'POSTED'; }).length;
  var worst = 'AD_READY';
  var rank = { TAKEDOWN_REQUIRED:0, REVIEW_REQUIRED:1, DATA_REQUIRED:2, PHOTO_REQUIRED:3, AD_READY:4, POSTED:5 };
  AD_GOAL.forEach(function(k){ if(rank[byCh[k].code] < rank[worst]) worst = byCh[k].code; });
  return { o:o, ph:ph, ch:byCh, goalDone:goalDone, goalTotal:AD_GOAL.length, worst:worst,
           stale: AD_GOAL.some(function(k){ return byCh[k].sub === '수정필요'; }),
           takedown: AD_GOAL.some(function(k){ return byCh[k].code === 'TAKEDOWN_REQUIRED'; }) };
}
function adAll(){
  return (DB.listings || []).map(adRow);
}

/* 🏷 2026-09-14 — 참고사진 표기.
   그 호실 사진이 없어 같은 평면 다른 호실 사진을 쓰는 경우,
   🔴 광고문에 이 한 줄이 **반드시** 들어간다. 빼면 허위매물이 된다. */
var AD_REF_LINE = '※ 사진은 동일 평면 다른 호실의 참고사진입니다. 실제 호실은 방문 시 확인하실 수 있습니다.';
function adRefOnly(o){
  if(!o) return false;
  var ph = phCountFor(o);
  return !!(ph && ph.refOnly);
}
/* 매물 한 건의 사진 셈 — 색인에서 그 호실 칸을 찾는다.
   🔴 기존 photoFindBuilding(지번 우선)을 그대로 쓴다 — 규칙을 새로 만들지 않는다. */
function phCountFor(o){
  try{
    if(!PIDX || !PIDX.index || !o) return null;
    var tk = bldgTokens(String(o.addr || ''));
    var f = photoFindBuilding({ jibun:tk.jibun, bldg:String(o.apt || '') }, null);
    if(!f || !f.hit) return null;
    var key = sq(o.addr2 || ''), units = f.hit.units || {}, u = null;
    Object.keys(units).forEach(function(k){ if(sq(k) === key) u = units[k]; });
    if(!u) return null;
    return { done:u.done || 0, raw:u.raw || 0, ref:u.ref || 0,
             refDone:u.refDone || 0, refOnly:!!u.refOnly,
             /* 🔴 출처·크기도 함께 넘긴다 — 사진이 있어도 출처를 모르면 광고에 못 쓴다
                (photoSrcJudge 가 그렇게 막는다. 판정이 그걸 모르면 화면이 거짓말을 한다) */
             src:u.src, doneSrc:u.doneSrc, bandPost:u.bandPost, srcWhy:u.srcWhy,
             doneMaxKB:u.doneMaxKB, doneMinKB:u.doneMinKB,
             doneMinW:u.doneMinW, doneMinH:u.doneMinH };
  }catch(e){ return null; }
}
/* ── 광고문구 — 🔴 없는 정보를 만들지 않는다 ───────────────────── */
function adMoney(o){
  var t = String(o.type||'');
  if(t === '매매') return o.price ? (o.price + '만원') : '';
  if(!o.price && !o.rentAmt) return '';
  return (o.price||'?') + '/' + (o.rentAmt||'?');
}
function adFacts(o){
  var f = [];
  if(o.kind) f.push(o.kind);
  if(o.area) f.push('면적 ' + o.area);
  if(o.rooms) f.push('방 ' + o.rooms);
  if(o.baths) f.push('욕실 ' + o.baths);
  if(o.floor) f.push(o.floor + (o.totalFloor ? ('/' + o.totalFloor) : ''));
  if(o.direction) f.push(o.direction);
  if(o.feeAmt) f.push('관리비 ' + o.feeAmt + '만');
  if(o.parking) f.push('주차 ' + o.parking);
  if(o.availDate) f.push('입주 ' + o.availDate);
  return f;
}
function adCopy(o, k){
  var nl = String.fromCharCode(10);
  /* 🔴 참고사진이면 광고문에 반드시 이 줄이 붙는다 — adCopyOut() 이 끝에서 붙인다 */
  var refLine = adRefOnly(o) ? (nl + nl + AD_REF_LINE) : '';
  var money = adMoney(o);
  var head = [o.apt, o.addr2].filter(Boolean).join(' ');
  var facts = adFacts(o);
  var t = String(o.type||'');
  var title, body;
  if(k === 'daangn'){
    title = [head, t, money].filter(Boolean).join(' ');
    body = [head + (o.addr ? (' (' + o.addr + ')') : ''), t + ' ' + money,
            facts.join(' · '), '', '브리즈부동산중개'].filter(Boolean).join(nl);
  } else if(k === 'zigbang' || k === 'dabang'){
    title = [head, o.kind, t, money].filter(Boolean).join(' ');
    body = [head, t + ' ' + money, facts.join(' · '), '',
            '자세한 조건은 문의 주시면 안내드립니다.', '브리즈부동산중개'].filter(Boolean).join(nl);
  } else if(k === 'naver'){
    title = [o.apt, o.kind, t, money].filter(Boolean).join(' ');
    body = [facts.join(' · '), o.addr].filter(Boolean).join(nl);
  } else if(k === 'blog'){
    title = [o.apt, o.addr2, t, money].filter(Boolean).join(' ') + ' 매물 안내';
    body = [head + ' ' + t + ' ' + money, '', facts.map(function(x){ return '· ' + x; }).join(nl),
            '', '문의: 브리즈부동산중개'].filter(Boolean).join(nl);
  } else {
    title = [head, t, money].filter(Boolean).join(' ');
    body = [head, t + ' ' + money, facts.join(' · ')].filter(Boolean).join(nl);
  }
  /* 🔴 참고사진이면 본문 끝에 **반드시** 밝힌다 — 빠지면 허위매물이 된다 */
  body = body + refLine;
  /* 🔴 민감정보·과장표현은 넣지 않는다 */
  return { title: maskSecret(title), body: maskSecret(body),
           missing: adMissing(o, k), refPhoto: !!refLine };
}

/* ── 촬영필요 업무 ─────────────────────────────────────────────── */
function photoTasks(){
  return (DB.listings || []).filter(adLive).map(function(o){
    var ph = adPhotoOf(o);
    return { o:o, ph:ph };
  }).filter(function(x){
    return x.ph.code === 'PHOTO_REQUIRED' || x.ph.code === 'BUILDING_ONLY';
  }).sort(function(a, b){
    /* 접수 상태 · 최근 접수 먼저 */
    var pa = (a.o.status === '접수' ? 0 : 1), pb = (b.o.status === '접수' ? 0 : 1);
    if(pa !== pb) return pa - pb;
    return String(b.o.recvDate||'').localeCompare(String(a.o.recvDate||''));
  });
}

/* ── 광고관리 화면 ─────────────────────────────────────────────── */
var AD_SEL = null, AD_FILT = '', AD_SHOW = [];
function adPill(st){
  var m = { AD_READY:['p-ok','AD_READY'], POSTED:['p-brand','게시중'],
            PHOTO_REQUIRED:['p-bad','사진필요'], DATA_REQUIRED:['p-warn','정보부족'],
            REVIEW_REQUIRED:['p-warn','확인필요'], TAKEDOWN_REQUIRED:['p-bad','내림필요'],
            POSTING:['p-warn','게시중…'], FAILED:['p-bad','실패'] }[st.code] || ['p-mute', st.code];
  var lab = st.sub ? (m[1] + '·' + st.sub) : m[1];
  return '<span class="pill ' + (st.sub ? 'p-warn' : m[0]) + '">' + esc(lab) + '</span>';
}
function adMini(st){
  if(st.code === 'POSTED') return st.sub ? '<span class="pill p-warn">' + esc(st.sub) + '</span>'
                                         : '<span class="pill p-brand">게시</span>';
  if(st.code === 'AD_READY') return '<span class="pill p-ok">준비</span>';
  if(st.code === 'TAKEDOWN_REQUIRED') return '<span class="pill p-bad">내림</span>';
  if(st.code === 'PHOTO_REQUIRED') return '<span class="pill p-bad">사진</span>';
  if(st.code === 'DATA_REQUIRED') return '<span class="pill p-warn">정보</span>';
  return '<span class="pill p-mute">-</span>';
}
/* ══ B-1 2026-09-14 — 매물 한 건이 광고에 올라갈 수 있는가, 못 올리면 무엇이 비었나.
   🔴 갈래별로 흩어져 있던 것을 **한 줄**로 모은다.
      "이 매물은 사진만 있으면 올릴 수 있음" 처럼 대표님이 바로 손댈 수 있게. ══ */
var AD_MUST = [
  { k:'photo',   label:'사진' },
  { k:'price',   label:'가격' },
  { k:'area',    label:'면적' },
  { k:'floor',   label:'층' },
  { k:'avail',   label:'입주가능일' },
  { k:'fee',     label:'관리비' }
];
function adWhyOne(o){
  var out = { id:String(o.id || ''), apt:String(o.apt || ''), ho:String(o.addr2 || ''),
              status:String(o.status || ''), miss:[], warn:[], ok:false, one:'', ref:false };
  /* ① 상태 — 거래 가능이 아니면 광고 대상이 아니다 */
  if(STATUS_OFF.indexOf(out.status) >= 0){
    out.one = '광고 대상이 아닙니다 (' + out.status + ')';
    return out;
  }
  /* ② 사진 — 보정완료(워터마크)가 있어야 쓸 수 있다 */
  var ph = phCountFor(o);
  if(!ph || !ph.done){
    out.miss.push('사진');
    if(ph && ph.raw) out.warn.push('원본 ' + ph.raw + '장은 있는데 워터마크(보정완료)가 0장입니다');
  } else {
    /* 🔴 사진이 있어도 **출처**가 막히면 광고에 못 쓴다 — 기존 photoSrcJudge 를 그대로 쓴다.
       이걸 안 보면 화면이 "올릴 수 있다" 고 해 놓고 실제로는 막힌다(2026-09-14 회귀가 잡음). */
    var sj = photoSrcJudge(ph);
    if(!sj.usable){
      out.miss.push('사진 출처 확인');
      out.warn.push(sj.why);
    } else if(ph.refOnly){
      out.ref = true;
      out.warn.push('동일 평면 참고사진 ' + ph.refDone + '장 — 광고문에 그렇게 밝힙니다');
    }
    /* 🔴 너무 작은 사진도 막는다(64×64 썸네일이 섞여 있던 전력) */
    if(ph.doneMinW !== undefined && ph.doneMinW !== null && ph.doneMinW > 0 &&
       ph.doneMinW < PH_MIN_W){
      out.miss.push('사진 크기');
      out.warn.push('보정완료가 ' + ph.doneMinW + '×' + ph.doneMinH +
                    ' 뿐입니다(광고 최소 ' + PH_MIN_W + '×' + PH_MIN_H + ')');
    }
  }
  /* ③ 필수값 — 없는 것만 적는다(지어내지 않는다) */
  function empty(v){ return !String(v == null ? '' : v).trim(); }
  if(empty(o.price) && empty(o.rentAmt)) out.miss.push('가격');
  if(empty(o.area)) out.miss.push('면적');
  if(empty(o.floor)) out.miss.push('층');
  if(empty(o.availDate)) out.miss.push('입주가능일');
  if(empty(o.feeAmt) && empty(o.fee)) out.miss.push('관리비');
  /* ④ 건물명이 이름 꼴인가 */
  if(!bldNameOk(o.apt)) out.miss.push('건물명(쓸 수 있는 이름)');
  /* ⑤ 같은 호실이 두 건 살아 있나 */
  var same = (DB.listings || []).filter(function(x){
    return String(x.id) !== String(o.id) && sq(x.apt) === sq(o.apt) &&
           sq(x.addr2) === sq(o.addr2) && STATUS_OFF.indexOf(String(x.status || '')) < 0; });
  if(same.length) out.warn.push('같은 호실 매물이 ' + same.length + '건 더 있습니다(' +
    same.map(function(x){ return x.id; }).join(', ') + ')');
  /* ⑥ 이미 게시 중인 채널 */
  var posted = AD_CH.filter(function(c){ return adOn(o, c.key); });
  if(posted.length) out.warn.push('이미 ' + posted.map(function(c){ return c.label; }).join('·') +
    ' 에 올라가 있습니다 — 새 글이 아니라 고치기입니다');

  out.ok = out.miss.length === 0;
  if(out.ok){
    out.one = '🟢 올릴 수 있습니다' + (out.ref ? ' (참고사진 표기 포함)' : '');
  } else if(out.miss.length === 1){
    out.one = '🔴 ' + out.miss[0] + '만 있으면 올릴 수 있습니다';
  } else {
    out.one = '🔴 못 올립니다 — ' + out.miss.join(' · ') + ' 가 비었습니다';
  }
  return out;
}
function adWhyList(){
  return (DB.listings || [])
    .filter(function(o){ return STATUS_OFF.indexOf(String(o.status || '')) < 0; })
    .map(adWhyOne)
    .sort(function(a, b){
      if(a.ok !== b.ok) return a.ok ? -1 : 1;          /* 올릴 수 있는 것부터 */
      return a.miss.length - b.miss.length;            /* 그 다음은 덜 빠진 것부터 */
    });
}
/* ══ B-2 2026-09-14 — [광고 승인].
   🔴 생성 → 대표 승인 → 게시 를 합치지 않는다. 이 버튼은 **승인만** 한다.
   🔴 새 승인 저장소를 만들지 않는다 — 기존 결재함(approvals)에 넣는다(철칙).
   🔴 외부로 나가는 코드는 여전히 없다. 승인해도 아무것도 게시되지 않는다. ══ */
var AD_APV_SAVING = false;
/* 일반 POST — erpUpsert 와 같은 길로 보낸다(새 통로를 만들지 않는다) */
async function erpPost(body){
  var u = gsUrl(), t = gsTok();
  if(!u || !t) throw new Error('구글시트 주소·토큰이 없습니다');
  var b = JSON.parse(JSON.stringify(body || {}));
  b.token = t;
  var res = await fetch(u, { method:'POST', headers:{'Content-Type':'text/plain'},
    body: JSON.stringify(b) });
  var j = await res.json();
  if(!j || !j.ok) throw new Error((j && j.error) || '저장 실패');
  return j;
}
function adApprovedSet(){
  var m = {};
  ((typeof APV_ROWS !== 'undefined' && APV_ROWS) || []).forEach(function(a){
    if(String(a.kind) === '광고게시' && String(a.targetType) === 'listing')
      m[String(a.targetId)] = String(a.status || '요청');
  });
  return m;
}
var APV_ROWS = null, APV_LOADING = false, APV_ERR = '';
async function adApvLoad(force){
  if(APV_ROWS && !force) return APV_ROWS;
  if(APV_LOADING && !force) return APV_ROWS;
  APV_LOADING = true; APV_ERR = '';
  try{
    var j = await jgetTry({ action:'approvalList' });
    APV_ROWS = (j.result && j.result.rows) || j.result || j.data || [];
    if(!Array.isArray(APV_ROWS)) APV_ROWS = [];
  }catch(e){ APV_ROWS = null; APV_ERR = String((e && e.message) || e); }
  APV_LOADING = false;
  /* 🔴 2026-09-14 고침 — 다 읽고도 다시 그리지 않아 "불러오는 중" 에 머물렀다.
     읽든 못 읽든 화면을 새로 그린다(못 읽으면 실패라고 말한다). */
  try{ route(); }catch(e2){}
  return APV_ROWS;
}
async function adApprove(id){
  var nl = String.fromCharCode(10);
  if(AD_APV_SAVING){ alert('저장 중입니다'); return; }
  var o = (DB.listings || []).filter(function(x){ return String(x.id) === String(id); })[0];
  if(!o){ alert('매물을 찾지 못했습니다.'); return; }
  var wy = adWhyOne(o);
  if(!wy.ok){
    alert('아직 올릴 수 없는 매물입니다.' + nl + wy.one + nl + nl +
          '먼저 빠진 것을 채워 주세요 — 승인해도 광고가 나가지 않습니다.');
    return;
  }
  var msg = ['광고 게시를 승인합니다 — 결재함에 올립니다', '',
    '매물   ' + o.id + '  ' + (o.apt || '') + ' ' + (o.addr2 || ''),
    '상태   ' + (o.status || ''),
    wy.ref ? '사진   🔴 동일 평면 참고사진 — 광고문에 그렇게 밝힙니다' : '사진   그 호실 사진',
    '', '🔴 이 버튼은 **승인만** 합니다. 광고는 나가지 않습니다.',
    '🔴 실제 게시는 대표님이 채널에서 직접 하시고, 그 뒤 [올림 확인] 으로 적습니다.',
    '', '이대로 결재함에 올릴까요?'].join(nl);
  if(!confirm(msg)) return;
  AD_APV_SAVING = true;
  try{
    var r = await erpPost({ action:'approvalAdd', kind:'광고게시', targetType:'listing',
      targetId:String(o.id), dept:'광고',
      title:'광고 게시 승인 — ' + (o.apt || '') + ' ' + (o.addr2 || '') + ' (' + o.id + ')',
      note:(wy.ref ? '동일 평면 참고사진 사용 — 광고문에 표기됨. ' : '') + wy.one });
    await adApvLoad(true);
    AD_APV_SAVING = false;
    route();
    var st = (r && r.result && r.result.action) || '';
    alert(st === 'exists' ? '이미 결재 대기 중입니다 — 새로 올리지 않았습니다.'
                          : '결재함에 올렸습니다 ✓' + nl + nl + '대표님이 결재함에서 승인하시면 광고 후보가 됩니다.');
  }catch(e){
    AD_APV_SAVING = false; route();
    alert('올리지 못했습니다 — 매물 자료는 그대로입니다.' + nl + String(e && e.message || e));
  }
}

/* ═══════════════════════════════════════════════════════════════════
   계약·정산 1차 골격 — 🔴 보기 전용. 저장·계약서 작성·공부 발급 없음.

     id·apt·addr2·type·price·rentAmt·listingId

     feeAmt · coName · coRate · escrow · feePaidAt · agent · expStatus
   🔴 PaidAt 은 사람이 확인해 적는 날짜다(은행 연동 아님). 빈 칸은 빈 칸으로 둔다.
   ═══════════════════════════════════════════════════════════════════ */
var CT_SEL = null, CT_TAB = '기본', CT_FILT = '';

/* 필수서류 — 기존 '발급요청(docReqs)'·'계약서류(contractDocuments)' 와 같은 뜻의 목록.
   🔴 여기서 발급을 걸지 않는다. 무엇이 필요한지 보여 주기만 한다. */
var CT_DOCS = [
  ['등기부등본', '계약 직전·잔금 직전 두 번 확인'],
  ['건축물대장', '위반건축물·용도 확인'],
  ['신분증 사본', '임대인·임차인'],
  ['임대인 통장사본', '입금 계좌 확인'],
  ['위임장·인감', '대리계약일 때만'],
  ['확인설명서', '중개대상물 확인·설명서'],
  ['공제증서', '중개사고 배상'],
  ['계약서', '본계약서']
];
function ctDaysTo(d){
  var s = String(d || '').trim();
  if(!s) return null;
  var t = Date.parse(s.replace(/\./g, '-'));
  if(isNaN(t)) return null;
  return Math.round((t - Date.now()) / 86400000);
}
function ctMoney(v){
  var s = String(v == null ? '' : v).trim();
  return s ? (s + '만') : '';
}
/* 계약 상태 — 날짜와 수납으로만 판단한다. 없는 값을 추측하지 않는다. */
function ctState(c){
  var st = String(c.expStatus || '').trim();
  var dEnd = ctDaysTo(c.end), dBal = ctDaysTo(c.balanceDue);
  var paidBal = String(c.balancePaidAt || '').trim();
  if(st === '종료') return { code:'종료', cls:'p-mute' };
  if(!paidBal && dBal !== null && dBal < 0) return { code:'잔금 지남', cls:'p-bad' };
  if(!paidBal && dBal !== null && dBal <= 7) return { code:'잔금 임박', cls:'p-warn' };
  if(!paidBal && String(c.balanceAmt || '').trim()) return { code:'잔금 대기', cls:'p-warn' };
  if(dEnd !== null && dEnd < 0) return { code:'만기 지남', cls:'p-bad' };
  if(dEnd !== null && dEnd <= 60) return { code:'만기 임박', cls:'p-warn' };
  if(st === '연장') return { code:'연장 확정', cls:'p-ok' };
  return { code:'진행중', cls:'p-ok' };
}
function ctRows(){
  var list = (DB.contracts || []).slice();
  if(CT_FILT === 'bal') list = list.filter(function(c){
    var d = ctDaysTo(c.balanceDue);
    return !String(c.balancePaidAt||'').trim() && d !== null && d <= 7; });
  else if(CT_FILT === 'exp') list = list.filter(function(c){
    var d = ctDaysTo(c.end); return d !== null && d <= 60; });
  else if(CT_FILT === 'fee') list = list.filter(function(c){
    return String(c.feeAmt||'').trim() && !String(c.feePaidAt||'').trim(); });
  return list;
}
function viewContract(){
  /* 점검 기록은 이 화면에서만 쓴다 — 패널을 열어야만 읽으면 탭이 '불러오는 중'에서 멈춘다 */

/* ═══════════════════════════════════════════════════════════════════
   계약등록 · 서류/특약 · 잔금·만기 · 회계정산 · 직원관리
   🔴 저장은 전부 단건 upsert(gsUpsertOne 과 같은 경로). saveAll 을 쓰지 않는다.
   🔴 계약 등록은 사람이 확인창을 눌러야 나간다. 문자·알림은 보내지 않는다.
   🔴 기존 contracts / contractDocuments 스키마만 쓴다(새 칸 0).
   ═══════════════════════════════════════════════════════════════════ */
var CT_SAVING = false, CT_LAST = null, CT_FORM = null, CT_DOCSTATE = {}, CT_SPEC = '';

function ctNewId(list){
  var d = new Date();
  var ymd = String(d.getFullYear()).slice(2) + pad2(d.getMonth()+1) + pad2(d.getDate());
  var seq = 1, id;
  do { id = 'C' + ymd + '-' + pad2(seq); seq++; }
  while((list||[]).some(function(c){ return String(c.id) === id; }));
  return id;
}
/* 단건 저장 — 어떤 표에도 같은 길을 쓴다 */
async function erpUpsert(type, obj){
  var u = gsUrl(), t = gsTok();
  if(!u || !t) throw new Error('구글시트 주소·토큰이 없습니다');
  var res = await fetch(u, { method:'POST', headers:{'Content-Type':'text/plain'},
    body: JSON.stringify({ action:'upsert', type:type, data:obj, token:t }) });
  var j = await res.json();
  if(!j || !j.ok) throw new Error((j && j.error) || '저장 실패');
  return j;
}

/* ── 계약 등록 ─────────────────────────────────────────────────── */
function ctOpenNew(listingId){
  var o = (DB.listings||[]).filter(function(x){ return String(x.id) === String(listingId); })[0] || null;
  CT_FORM = {
    listingId: o ? o.id : '', apt: o ? (o.apt||'') : '', addr2: o ? (o.addr2||'') : '',
    type: o ? (o.type||'월세') : '월세', price: o ? (o.price||'') : '', rentAmt: o ? (o.rentAmt||'') : '',
    landlordName:'', landlordPhone:'', tenantName:'', tenantPhone:'',
    start:'', end:'', depositAmt:'', depositDue:'', interimAmt:'', interimDue:'',
    balanceAmt:'', balanceDue:'', feeAmt:'', agent:'', note:''
  };
  /* 임대인 명부에서 그 건물 임대인을 후보로 채워 준다(사람이 고친다) */
  if(o){
    var ld = (DB.landlords||[]).filter(function(L){
      return sq(L.apt) && sq(L.apt) === sq(o.apt); })[0];
    if(ld){ CT_FORM.landlordName = ld.name || ''; CT_FORM.landlordPhone = ld.phone || ''; }
  }
  CT_TAB = '등록';
  route();
}
function ctField(k, v){ if(CT_FORM) CT_FORM[k] = v; }
function ctFormMissing(){
  var f = CT_FORM || {}, miss = [];
  [['apt','건물'],['addr2','호실'],['type','거래유형'],['price','보증금/매매가'],
   ['landlordName','임대인 이름'],['tenantName','임차인 이름'],
   ['start','계약일'],['end','만기일']].forEach(function(x){
    if(!String(f[x[0]]||'').trim()) miss.push(x[1]);
  });
  if(['월세','연세','단기'].indexOf(String(f.type||'')) >= 0 && !String(f.rentAmt||'').trim())
    miss.push('월세');
  return miss;
}
async function ctSave(){
  if(CT_SAVING){ alert('저장 중입니다'); return; }
  var nl = String.fromCharCode(10);
  var miss = ctFormMissing();
  if(miss.length){ alert('아직 못 채운 것이 있습니다:' + nl + miss.join(' · ')); return; }
  /* 🔴 저장 직전에 계약 자료를 다시 읽어 중복을 본다 */
  var fresh;
  try{
    var g = await jget({ action:'getAll', type:'contracts' });
    fresh = g.data || g.result || [];

  };

    '', '지금 계약 ' + fresh.length + '건 → ' + (fresh.length + 1) + '건',
    '🔴 문자·알림은 보내지 않습니다.', '', '이대로 등록할까요?'].filter(function(x){ return x !== ''; }).join(nl);

  CT_SAVING = true;

  }catch(e){
    CT_SAVING = false;
    route();
    alert('저장 실패 — 계약 자료는 그대로입니다.' + nl + String(e && e.message || e));

/* ── 서류 체크 저장 (contractDocuments 스키마 그대로) ──────────── */
async function ctDocSave(contractId, docType, on){
  var nl = String.fromCharCode(10);
  var c = (DB.contracts||[]).filter(function(x){ return String(x.id) === String(contractId); })[0];
  if(!c){ alert('계약을 찾지 못했습니다'); return; }
  if(!confirm(docType + ' 를 ' + (on ? '받음' : '안 받음') + ' 으로 표시합니다.' + nl + '이대로 저장할까요?')) return;
  var obj = {
    id: 'CD' + String(Date.now()).slice(-10),
    contractId: String(contractId),
    docType: String(docType),
    version: '1',
    body: '',
    source: 'ERP 체크',
    createdAt: todayStr(),
    createdBy: ME.name || '대표',
    status: on ? '받음' : '안 받음',
    note: ''
  };
  try{
    await erpUpsert('contractDocuments', obj);
    CT_DOCSTATE[contractId] = CT_DOCSTATE[contractId] || {};
    CT_DOCSTATE[contractId][docType] = on ? '받음' : '안 받음';
    route();
    alert(docType + ' — ' + obj.status + ' 으로 저장했습니다 ✓');
  }catch(e){
    alert('저장 실패 — 그대로입니다.' + nl + String(e && e.message || e));
  }
}
/* ── 특약 저장 (contracts.note — 기존 칸) ──────────────────────── */
async function ctSpecSave(contractId){
  var nl = String.fromCharCode(10);
  var el = document.getElementById('ct-sp');
  if(!el){ return; }
  var text = String(el.value || '').trim();
  if(!text){ alert('적을 내용이 없습니다'); return; }
  /* 🔴 확실히 틀린 입력은 시트를 읽기 '전에' 막는다 — 굳이 왕복할 필요가 없다 */
  if(hasSecret(text)){
    alert('🔴 비밀번호로 보이는 내용이 있습니다. 특약에는 넣지 않습니다.'); return;
  }
  /* 🔴 제안 초안의 ○○ 를 안 채우면 저장하지 않는다 — 그대로 계약서에 들어가면 사고다 */
  if(text.indexOf('○○') >= 0){
    alert(['🔴 아직 채우지 않은 칸(○○)이 있습니다.', '',
      '제안은 초안입니다. ○○ 를 실제 내용으로 바꾼 뒤 저장해 주세요.'].join(nl)); return;
  }
  /* 🔴 저장 직전에 다시 읽는다 */
  var fresh;
  try{
    var g = await jget({ action:'getAll', type:'contracts' });
    fresh = g.data || g.result || [];
  }catch(e){ alert('계약 자료를 다시 읽지 못해 저장하지 않습니다'); return; }
  var c = fresh.filter(function(x){ return String(x.id) === String(contractId); })[0];
  if(!c){ alert('계약을 찾지 못했습니다'); return; }
  var was = String(c.note || '');
  var next = was ? (was + nl + text) : text;
  if(!confirm(['특약을 덧붙입니다', '', '계약 ' + c.id, '', text, '',
    '🔴 기존 내용은 지우지 않고 아래에 붙입니다.', '이대로 저장할까요?'].join(nl))) return;
  var obj = JSON.parse(JSON.stringify(c));
  obj.note = next;
  try{
    await erpUpsert('contracts', obj);
    var g2 = await jget({ action:'getAll', type:'contracts' });
    DB.contracts = g2.data || g2.result || [];
    CT_SPEC_DRAFT = '';
    route();
    alert('특약을 최종확정으로 저장했습니다 ✓');
  }catch(e){ alert('저장 실패 — 계약 자료는 그대로입니다.' + nl + String(e && e.message || e)); }
}

/* ── 잔금·만기 ─────────────────────────────────────────────────── */
function ctSchedule(){
  var out = [];
  (DB.contracts||[]).forEach(function(c){
    [['계약금', c.depositAmt, c.depositDue, c.depositPaidAt],
     ['중도금', c.interimAmt, c.interimDue, c.interimPaidAt],
     ['잔금',  c.balanceAmt, c.balanceDue, c.balancePaidAt]].forEach(function(p){
      if(!String(p[2]||'').trim()) return;
      out.push({ c:c, kind:p[0], amt:p[1], due:p[2], paid:p[3], d:ctDaysTo(p[2]) });
    });
    if(String(c.end||'').trim())
      out.push({ c:c, kind:'만기', amt:'', due:c.end, paid:'', d:ctDaysTo(c.end) });
  });
  out.sort(function(a,b){ return (a.d===null?9999:a.d) - (b.d===null?9999:b.d); });
  return out;
}

/* ── 자동화 상태 — 실제 자료의 최신 시각으로만 말한다 ─────────── */
function autoMaxWhen(rows, pick){
  var best = '';
  (rows || []).forEach(function(r){
    var v = String(pick(r) || '').trim();
    if(v && v > best) best = v;
  });
  return best;
}
function autoToday(rows, pick){
  var t = todayStr(), n = 0;
  (rows || []).forEach(function(r){ if(String(pick(r) || '').indexOf(t) === 0) n++; });
  return n;
}
function autoList(){
  var inb = DB.inbox || [];
  var W = function(r){ return r.when; };
  var sms = inb.filter(function(r){ return ['SMS','MMS'].indexOf(srcOf(r.kind, r.text)) >= 0; });
  var call = inb.filter(function(r){ return ['통화녹음','부재중전화'].indexOf(srcOf(r.kind, r.text)) >= 0; });
  var photo = inb.filter(function(r){ return srcOf(r.kind, r.text) === '사진접수'; });
  var L = DB.listings || [];
  var adAt = autoMaxWhen(L, function(o){
    var b = '';
    AD_CH.forEach(function(c){ var a = adOf(o, c.key); if(a && a.at && a.at > b) b = a.at; });
    return b;
  });
  var adOnN = L.filter(function(o){ return AD_CH.some(function(c){ return adOn(o, c.key); }); }).length;
  var un = inb.filter(function(r){ return !r.reg; }).length;
  return [
    { key:'sms', name:'문자수집', run:'폰 → 구글서버 → 인입함',
      last: autoMaxWhen(sms, W), today: autoToday(sms, W), n: sms.length,
      next:'문자가 오면 바로(폴백 10분)', state: sms.length ? 'ok' : 'none',
      note:'MacroDroid → GAS 문자수신함 → 인입함' },
    { key:'call', name:'통화 AI', run:'통화녹음 → 글자변환 → 인입함',
      last: autoMaxWhen(call, W), today: autoToday(call, W), n: call.length,
      next:'녹음이 올라오면', state: call.length ? 'ok' : 'none',
      note:'PC 가 켜져 있을 때만 (AI 요약 포함)' },
    { key:'vac', name:'공실수집(사진판독)', run:'드라이브 문자사진 → OCR → 공실현황',
      last: autoMaxWhen(photo, W), today: autoToday(photo, W), n: photo.length,

    { key:'cust', name:'고객분류', run:'인입함 → 고객·임대인·매물로 나누기',
      last:'', today: 0, n: un, next:'사람이 확인함', state:'manual',
      note:'미처리 ' + un + '건 — 아직 사람이 고른다(자동 분류 아님)' },
    { key:'ad', name:'광고', run:'매물 → 채널 게시',
      last: adAt, today: 0, n: adOnN, next:'사람이 올림', state: adOnN ? 'ok' : 'none',
      note:'🔴 자동 게시는 검증 전 — 지금은 사람이 각 사이트에서' },
    (function(){
      var g = GATHER;
      if(g === null){ loadGather();
        return { key:'web', name:'웹수집(당근·오일장)', run:'수집매물 표에 쌓임',
                 last:'', today:null, n:null, next:'예약(트리거)', state:'unknown',
                 note:'불러오는 중…' }; }
      if(GATHER_ERR || !g.phase)
        return { key:'web', name:'웹수집(당근·오일장)', run:'수집매물 표에 쌓임',
                 last:'', today:null, n:null, next:'예약(트리거)', state:'unknown',
                 note:'🔴 확인 전 — ' + (GATHER_ERR || '상태를 읽지 못했습니다') };
      var c = g.counts || {};

               last: fin || String(g.startedAt||''),

               state: g.phase === 'done' ? 'ok' : (g.phase === 'idle' ? 'none' : 'ok'),
               note: '구역 ' + (g.tile||0) + '/' + (g.tiles||0) + ' · 당근 ' + (c.dg||0) +
                     ' · 오일장 ' + (c.oj||0) + ' · 새 건 ' + (c.sn||0) + ' · 중복 ' + (c.dup||0) };
    })(),

/* ── 데이터 품질 — 실제 자료로만 센다 ──────────────────────────── */
function dqCheck(){
  var L = DB.listings || [], LD = DB.landlords || [], C = DB.customers || [];
  var live = L.filter(adLive);
  var out = { items: [] };
  function add(name, list, why, go2){
    out.items.push({ name:name, n:list.length, rows:list.slice(0, 60), why:why, go:go2 || '' });
  }
  /* 필수값 누락 — 광고에 꼭 필요한 칸 */
  add('매물 필수값 누락', live.filter(function(o){
    return NEED_COMMON.some(function(f){ return !String(o[f[0]]||'').trim(); }); }),
    '건물·주소·호실·거래유형·보증금 중 빈 칸', 'ad');
  /* 중복 가능성 — 같은 건물+호실이 둘 이상 */
  var key = {}, dup = [];
  live.forEach(function(o){
    var k = sq(o.apt) + '|' + sq(o.addr2);
    if(!sq(o.apt) || !sq(o.addr2)) return;
    key[k] = (key[k] || []).concat([o]);
  });
  Object.keys(key).forEach(function(k){ if(key[k].length > 1) dup = dup.concat(key[k]); });
  add('같은 호실이 둘 이상', dup, '건물+호실이 겹치는 살아 있는 매물', '');
  /* 사진 없음 */
  add('사진 없음', live.filter(function(o){

/* ══ 2-1 (2026-09-14) 결재함 한 화면 ══════════════════════════════════════
   신규건물 / 가격변경 / 신규호실 / 광고승인 / 광고내림 / 수집접수 / 지번확인 / 촬영필요
   🔴 새 저장소를 만들지 않는다 — 기존 결재함(approvals)을 그대로 쓴다(철칙).
   🔴 반려는 사유가 있어야 한다 — 서버(approvalDecide)가 막는다.
   🔴 승인해도 광고·문자는 나가지 않는다.
   🔴 승인 뒤 마스터 반영:
      · 지번확인·가격변경 → 그 매물 한 칸만 고친다(확인창 + 저장 뒤 다시 읽어 확인)
      · 신규건물·신규호실 → 마스터 **입력 화면을 연다**(추측으로 새 행을 만들지 않는다)
      · 광고승인 → 광고승인.json 은 PC 의 동기화가 옮긴다(브라우저는 파일을 못 쓴다) ══ */
var APV_GROUPS = [

/* 시트의 '요청' 을 화면에서는 '대기' 라고 부른다 (사람 말) */
function apvStatOf(a){
  var t = String((a && a.status) || '요청').trim();
  return t === '요청' ? '대기' : t;
}
function apvGroupOf(a){
  var k = String((a && a.kind) || '').trim();
  for(var i = 0; i < APV_GROUPS.length; i++)
    if(APV_GROUPS[i].kinds.indexOf(k) >= 0) return APV_GROUPS[i].key;
  return '';                                   /* 8갈래에 없는 것 = 기타 */
}
function apvRows(tab, st){
  var all = (APV_ROWS || []).slice();
  var out2 = all.filter(function(a){
    if(st && st !== '전체' && apvStatOf(a) !== st) return false;
    if(!tab || tab === '전체') return true;
    if(tab === '기타') return !apvGroupOf(a);
    return apvGroupOf(a) === tab;
  }).sort(function(x, y){
    return String(y.requestedAt || '').localeCompare(String(x.requestedAt || ''));
  });
  /* 🆕 4-2 조건 패널 — 결재함에도 같은 조건 틀을 쓴다 */
  return qpApply('group/apv', out2, {
    date: function(a){ return a.requestedAt; },
    status: function(a){ return apvStatOf(a); },
    group: function(a){ return apvGroupOf(a) || '기타'; },
    text: function(a){ return [a.kind, a.title, a.requester, a.note].join(' '); }
  });
}
function apvCount(tab, st){ return apvRows(tab, st).length; }
function apvPill(st){
  var cls = st === '대기' ? 'p-warn' : (st === '승인' ? 'p-good' : 'p-mute');
  return '<span class="pill ' + cls + '">' + esc(st) + '</span>';
}
/* note 끝에 [[key=value]] 로 적어 둔 것 — 승인 때 무엇을 고칠지 알려 준다 */
function apvPatch(note){
  var out = {}, re = /\[\[([a-zA-Z]+)=([^\]]{1,120})\]\]/g, m;
  var t = String(note || '');
  while((m = re.exec(t))) out[m[1]] = String(m[2]).trim();
  return out;
}
function apvListingOf(a){

/* ══ 3-2 (2026-09-14) 광고 세트 — 4종 미리보기 · 글만 수정 ═══════════════
   글은 결재함 note 안에 '### 채널' 로 나뉘어 들어 있다(PC 의 ad_set.py 가 올린다).
   🔴 새 저장소를 만들지 않는다. 🔴 여기서 아무것도 게시되지 않는다. ══ */
var AD_SET_CH = ['당근', '네이버', '블로그', '인스타'];
var AD_SET_TAB = {}, AD_SET_EDIT = null, AD_SET_SAVING = false;

function adSetParse(note){
  var out = {}, t = String(note || '');
  AD_SET_CH.forEach(function(ch){ out[ch] = { title:'', body:'' }; });
  var parts = t.split('### ');
  for(var i = 1; i < parts.length; i++){
    var blk = parts[i];
    var nlAt = blk.indexOf(String.fromCharCode(10));
    if(nlAt < 0) continue;
    var ch = blk.slice(0, nlAt).trim();
    if(AD_SET_CH.indexOf(ch) < 0) continue;
    var rest = blk.slice(nlAt + 1).replace(/\s+$/, '');
    var nl2 = rest.indexOf(String.fromCharCode(10));
    out[ch] = nl2 < 0 ? { title: rest, body: '' }
                      : { title: rest.slice(0, nl2), body: rest.slice(nl2 + 1) };
  }
  return out;
}
function adSetBuild(sets){
  return ['[[set=1]]'].concat(AD_SET_CH.map(function(ch){
    var x = sets[ch] || { title:'', body:'' };
    return '### ' + ch + String.fromCharCode(10) + (x.title || '') +
           String.fromCharCode(10) + (x.body || '');
  })).join(String.fromCharCode(10));
}
function adSetIs(a){ return String((a && a.kind) || '') === '광고세트'; }
function adSetTab(id, ch){ AD_SET_TAB[String(id)] = ch; AD_SET_EDIT = null; route(); }
function adSetEditStart(id, ch){
  var a = (APV_ROWS || []).filter(function(x){ return String(x.id) === String(id); })[0];
  if(!a) return;
  var sets = adSetParse(a.note);
  AD_SET_EDIT = { id:String(id), ch:ch,
                  title:(sets[ch] || {}).title || '', body:(sets[ch] || {}).body || '' };
  route();
}
function adSetEditSet(k, v){ if(AD_SET_EDIT) AD_SET_EDIT[k] = v; }
function adSetEditCancel(){ AD_SET_EDIT = null; route(); }
async function adSetEditSave(){
  var nl = String.fromCharCode(10);
  if(!AD_SET_EDIT || AD_SET_SAVING) return;
  var e = AD_SET_EDIT;
  if(hasSecret(e.title) || hasSecret(e.body)){
    alert('🔴 비밀번호로 보이는 내용이 있습니다 — 저장하지 않습니다.'); return; }
  if(!confirm([e.ch + ' 글을 고칩니다 — 이대로 저장할까요?', '',
    '🔴 글만 고칩니다. 승인 상태는 그대로 둡니다.',
    '🔴 광고는 나가지 않습니다.'].join(nl))) return;
  AD_SET_SAVING = true; route();
  try{
    /* 🔴 저장 직전에 다시 읽는다 — 전체 행을 보내야 다른 칸이 지워지지 않는다(철칙 9) */
    var g = await jget({ action:'getAll', type:'approvals' });
    var rows = g.data || g.result || [];
    var cur = rows.filter(function(x){ return String(x.id) === String(e.id); })[0];
    if(!cur){ AD_SET_SAVING = false; route(); alert('결재 건을 찾지 못했습니다 — 고치지 않았습니다.'); return; }
    var sets = adSetParse(cur.note);
    sets[e.ch] = { title:String(e.title || ''), body:String(e.body || '') };
    var obj = JSON.parse(JSON.stringify(cur));
    obj.note = adSetBuild(sets).slice(0, 3800);
    obj.updatedAt = new Date().toISOString();
    await erpUpsert('approvals', obj);
    await adApvLoad(true);
    var back = (APV_ROWS || []).filter(function(x){ return String(x.id) === String(e.id); })[0];
    var okNow = back && String(adSetParse(back.note)[e.ch].body || '') === String(e.body || '');
    AD_SET_SAVING = false; AD_SET_EDIT = null; route();
    alert(okNow ? ('고쳤습니다 ✓' + nl + e.ch)
                : ('🔴 다시 읽었더니 그대로입니다 — 확인이 필요합니다'));
  }catch(err){
    AD_SET_SAVING = false; route();
    alert('고치지 못했습니다 — 글은 그대로입니다.' + nl + String(err && err.message || err));
  }
}

    h += '<div style="font-weight:700;font-size:13px;margin-bottom:3px">' +
      esc(cur.title || '(제목 없음)') + '</div>' +
      '<div style="font-size:12.5px;line-height:1.65;white-space:pre-wrap;' +
      'background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 11px;' +
      'max-height:280px;overflow:auto">' + esc(cur.body || '(내용 없음)') + '</div>' +
      '<div style="margin-top:6px">' +
      '<button class="btn sm" onclick="event.stopPropagation();adSetEditStart(&#39;' +
      esc(id) + '&#39;,&#39;' + ch + '&#39;)">글만 수정</button>' +
      '<span style="font-size:11.5px;color:var(--t3);margin-left:8px">' +

  }
  return h;

/* ── 승인 뒤 마스터 반영 ─────────────────────────────────────────── */
async function apvApply(a){
  var nl = String.fromCharCode(10);
  var grp = apvGroupOf(a);
  var pat = apvPatch(a.note);
  var o = apvListingOf(a);

  if(grp === '지번확인' || grp === '가격변경'){
    if(!o){ alert('승인했습니다 ✓' + nl + '🔴 연결된 매물을 찾지 못해 자료는 고치지 않았습니다.'); return; }
    var want = {};

      var addr = pat.addr || String(prompt(['승인하셨습니다. 이제 매물장 주소를 고칩니다.', '',

    } else {

    try{

      await erpUpsert('listings', obj);

      DB.listings = (g2.data || g2.result || []).map(adsRestore);
      var back = (DB.listings || []).filter(function(x){ return String(x.id) === String(o.id); })[0];
      var okAll = back && ks.every(function(k){ return String(back[k] || '') === String(want[k]); });
      alert((okAll ? '고쳤습니다 ✓' : '🔴 다시 읽었더니 그대로입니다 — 확인이 필요합니다') + nl + nl +
            o.id + ' · ' + ks.join(', '));
    }catch(e){ alert('고치지 못했습니다 — 자료는 그대로입니다.' + nl + String(e && e.message || e)); }
    return;
  }

  if(grp === '신규건물' || grp === '신규호실'){
    alert(['승인했습니다 ✓', '',
      '🔴 마스터에 새 줄을 **추측으로 만들지 않습니다.**',

    go('data', 'bldg');

      '승인된 글은 사무실 PC 의 00_광고세트 폴더에 그대로 있습니다.',
      '대표님이 채널에서 직접 올리시면 됩니다.'].join(nl));

  if(grp === '광고갱신'){

  if(grp === '광고승인'){

      '이 승인은 사무실 PC 의 **광고승인 동기화**가 광고승인.json 으로 옮깁니다.',

async function apvDecide(id, to){
  var nl = String.fromCharCode(10);
  if(APV_BUSY){ alert('처리 중입니다'); return; }
  var a = (APV_ROWS || []).filter(function(x){ return String(x.id) === String(id); })[0];
  if(!a){ alert('결재 건을 찾지 못했습니다.'); return; }
  if(apvStatOf(a) !== '대기'){ alert('이미 ' + apvStatOf(a) + ' 된 건입니다.'); return; }
  var reason = '';
  if(to === '반려'){
    /* 🔴 반려는 사유가 있어야 한다 — 서버도 막지만 여기서 먼저 받는다 */
    reason = String(prompt(['반려 사유를 적어 주세요 (반드시 필요합니다)', '',
      a.kind + ' · ' + a.title].join(nl), '') || '').trim();
    if(!reason){ alert('사유가 없어 반려하지 않았습니다.'); return; }
    if(hasSecret(reason)){ alert('🔴 비밀번호로 보이는 내용이 있습니다 — 적지 않습니다.'); return; }
  }
  if(!confirm([(to === '승인' ? '이 결재를 승인합니다' : '이 결재를 반려합니다'), '',
    '종류   ' + (a.kind || ''),
    '제목   ' + (a.title || ''),
    reason ? ('사유   ' + reason) : '',
    '', '🔴 승인해도 광고·문자는 나가지 않습니다.'].filter(function(x){ return x !== ''; }).join(nl))) return;

  APV_BUSY = true; route();
  try{
    await erpPost({ action:'approvalDecide', id:String(id), status:String(to), reason:reason });
    await adApvLoad(true);
    var now = (APV_ROWS || []).filter(function(x){ return String(x.id) === String(id); })[0];
    APV_BUSY = false; route();
    if(!now || apvStatOf(now) !== to){
      alert('🔴 다시 읽었더니 그대로입니다 — 확인이 필요합니다.');
      return;
    }
    if(to === '승인') await apvApply(now);
    else alert('반려했습니다 ✓' + nl + '사유: ' + reason);
    route();
  }catch(e){
    APV_BUSY = false; route();
    alert('처리하지 못했습니다 — 결재함은 그대로입니다.' + nl + String(e && e.message || e));
  }
}

/* ── 4-2 조회 화면 조건 패널 ──────────────────────────────────────── */
var QP = {}, QP_SAVED = {};
var QP_PERIODS = [['today','금일'],['yday','전일'],['week','금주'],['lweek','전주'],
                  ['month','금월'],['lmonth','전월'],['d30','최근30일'],['custom','직접입력']];
function qpDay(d){
  var z = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
  return z.toISOString().slice(0, 10);
}
function qpRange(key){
  var now = new Date(), t = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  function back(n){ return new Date(t.getTime() - n * 86400000); }
  if(key === 'today')  return { from: qpDay(t), to: qpDay(t) };
  if(key === 'yday')   return { from: qpDay(back(1)), to: qpDay(back(1)) };
  if(key === 'week'){
    var wd = (t.getDay() + 6) % 7;                     /* 월요일 시작 */
    return { from: qpDay(back(wd)), to: qpDay(t) };
  }
  if(key === 'lweek'){
    var wd2 = (t.getDay() + 6) % 7;
    return { from: qpDay(back(wd2 + 7)), to: qpDay(back(wd2 + 1)) };
  }
  if(key === 'month')  return { from: qpDay(new Date(now.getFullYear(), now.getMonth(), 1)), to: qpDay(t) };
  if(key === 'lmonth') return { from: qpDay(new Date(now.getFullYear(), now.getMonth() - 1, 1)),
                                to: qpDay(new Date(now.getFullYear(), now.getMonth(), 0)) };
  if(key === 'd30')    return { from: qpDay(back(29)), to: qpDay(t) };
  return { from:'', to:'' };
}
function qpGet(sc){
  if(!QP[sc]) QP[sc] = { period:'', from:'', to:'', q:'', status:'', group:'',
                         on:false, open:true, tab:'기본' };
  return QP[sc];
}
function qpSet(sc, k, v){
  var g = qpGet(sc);
  g[k] = v;
  if(k === 'period'){ var r = qpRange(v); if(v !== 'custom'){ g.from = r.from; g.to = r.to; } }
  route();
}
function qpSearch(sc){ var g = qpGet(sc); g.on = true; g.open = false; route(); }
function qpToggle(sc){ var g = qpGet(sc); g.open = !g.open; route(); }
function qpReset(sc){
  QP[sc] = { period:'', from:'', to:'', q:'', status:'', group:'', on:false, open:true, tab:'기본' };
  route();
}
/* 조건 저장 탭 — 브라우저에만 둔다(시트를 건드리지 않는다) */
function qpSavedLoad(sc){
  if(QP_SAVED[sc]) return QP_SAVED[sc];
  var v = [];
  try{ v = JSON.parse(localStorage.getItem('qp_' + sc) || '[]') || []; }catch(e){ v = []; }
  QP_SAVED[sc] = v; return v;
}
function qpSavedPut(sc){
  var g = qpGet(sc);
  var nm = String(prompt('이 조건을 무슨 이름으로 저장할까요?', '') || '').trim();
  if(!nm) return;
  var v = qpSavedLoad(sc).filter(function(x){ return x.name !== nm; });
  v.push({ name:nm, q:g.q, period:g.period, from:g.from, to:g.to, status:g.status, group:g.group });
  QP_SAVED[sc] = v.slice(0, 8);
  try{ localStorage.setItem('qp_' + sc, JSON.stringify(QP_SAVED[sc])); }catch(e){}
  g.tab = nm; route();
}
function qpSavedUse(sc, nm){
  var g = qpGet(sc);
  if(nm === '기본'){ qpReset(sc); return; }
  var x = qpSavedLoad(sc).filter(function(y){ return y.name === nm; })[0];
  if(!x) return;
  g.q = x.q || ''; g.period = x.period || ''; g.from = x.from || ''; g.to = x.to || '';
  g.status = x.status || ''; g.group = x.group || ''; g.tab = nm; g.on = true; g.open = false;
  route();
}
function qpSavedDel(sc, nm){
  if(!confirm('저장한 조건 "' + nm + '" 을 지울까요?')) return;
  QP_SAVED[sc] = qpSavedLoad(sc).filter(function(x){ return x.name !== nm; });
  try{ localStorage.setItem('qp_' + sc, JSON.stringify(QP_SAVED[sc])); }catch(e){}
  var g = qpGet(sc); if(g.tab === nm) g.tab = '기본';
  route();
}
/* 조건에 맞는 줄만 남긴다 — cfg: {date:fn, status:fn, text:fn, group:fn} */
function qpApply(sc, rows, cfg){
  var g = qpGet(sc);
  if(!g.on) return rows;
  cfg = cfg || {};
  return (rows || []).filter(function(r){
    if((g.from || g.to) && cfg.date){
      var d = String(cfg.date(r) || '').slice(0, 10);
      if(!d) return false;
      if(g.from && d < g.from) return false;
      if(g.to && d > g.to) return false;
    }
    if(g.status && cfg.status && String(cfg.status(r) || '') !== g.status) return false;
    if(g.group && cfg.group && String(cfg.group(r) || '') !== g.group) return false;
    if(g.q && cfg.text){
      if(String(cfg.text(r) || '').toLowerCase().indexOf(g.q.toLowerCase()) < 0) return false;
    }
    return true;
  });
}
function qpSummary(sc){
  var g = qpGet(sc), bits = [];
  if(g.from || g.to) bits.push((g.from || '처음') + ' ~ ' + (g.to || '오늘'));
  if(g.status) bits.push('상태 ' + g.status);
  if(g.group) bits.push(g.group);
  if(g.q) bits.push('"' + g.q + '"');
  return bits.length ? bits.join(' · ') : '조건 없음(전체)';
}

async function abTrash(sc, type){
  var nl = String.fromCharCode(10);
  if(ABAR_BUSY){ alert('처리 중입니다'); return; }
  var ids = selIds(sc);
  if(!ids.length){ alert('고른 줄이 없습니다.'); return; }
  if(!type){ alert('이 화면에서는 삭제를 쓸 수 없습니다.'); return; }
  if(!confirm(['고른 ' + ids.length + '건을 휴지통으로 옮깁니다 — 이대로 할까요?', '',
    ids.slice(0, 8).join(', ') + (ids.length > 8 ? ' 외 ' + (ids.length - 8) + '건' : ''),
    '', '🔴 바로 지우지 않습니다. 삭제로그에 내용이 남고 30일 안에 되살릴 수 있습니다.',
    '🔴 되살리기는 대표님만 할 수 있습니다.'].join(nl))) return;
  ABAR_BUSY = true; route();
  var okN = 0, bad = [];
  for(var i = 0; i < ids.length; i++){
    try{
      var r = await erpPost({ action:'trash', type:type, data:{ id:ids[i] } });
      var res = (r && (r.result || r.data)) || {};
      if(res.error) bad.push(ids[i] + ': ' + res.error); else okN++;
    }catch(e){ bad.push(ids[i] + ': ' + String(e && e.message || e)); }
  }
  ABAR_BUSY = false; selClear(sc);
  alert([okN + '건을 휴지통으로 옮겼습니다 ✓',
    bad.length ? ('🔴 못 옮긴 것 ' + bad.length + '건' + nl + bad.slice(0, 4).join(nl)) : '',
    '', '30일 안에는 되살릴 수 있습니다.'].filter(function(x){ return x !== ''; }).join(nl));
  try{ await loadAll(true); }catch(e){}
  route();
}
/* 화면에 보이는 표를 CSV 로 — 시트를 건드리지 않는다 */
function abExcel(sc){
  var t = document.querySelector('#main table');
  if(!t){ alert('이 화면에는 내려받을 표가 없습니다.'); return; }
  var rows = Array.prototype.map.call(t.querySelectorAll('tr'), function(tr){
    return Array.prototype.map.call(tr.querySelectorAll('th,td'), function(td){
      var v = String(td.textContent || '').replace(/\s+/g, ' ').trim();
      return '"' + v.split('"').join('""') + '"';
    }).join(',');
  }).join(String.fromCharCode(13) + String.fromCharCode(10));
  var blob = new Blob([String.fromCharCode(0xFEFF) + rows], { type:'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = sc.split('/').join('_') + '_' + todayStr() + '.csv';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ try{ document.body.removeChild(a); URL.revokeObjectURL(a.href); }catch(e){} }, 400);
}

function qpInject(html, sc){
  var cfg = qpScreens()[sc];
  if(!cfg) return html;
  var panel = '', bar = '';
  try{ panel = qpHtml(sc, cfg); }catch(e){ panel = ''; }
  try{ bar = abarHtml(sc, cfg); }catch(e){ bar = ''; }
  if(!panel && !bar) return html;
  var i = html.indexOf('class="h1row"');
  if(i >= 0){
    var j = html.indexOf('</div>', i);
    if(j >= 0) return html.slice(0, j + 6) + panel + html.slice(j + 6) + bar;
  }
  return panel + html + bar;
}

var FM_STATE = {}, FM_SAVED = null;

}

function fmSavedLoad(){

/* 표를 정렬·소계·그래프로 바꿔 그린다 — 표가 없으면 아무것도 하지 않는다 */
function fmPaint(sc){
  var g = fmGet(sc);
  var host = document.getElementById('main');
  if(!host) return;
  var t = host.querySelector('table');
  if(!t) return;
  var head = Array.prototype.map.call(t.querySelectorAll('thead th'), function(x){
    return String(x.textContent || '').trim(); });
  var body = t.querySelector('tbody');
  if(!body) return;
  var rows = Array.prototype.slice.call(body.querySelectorAll('tr'));
  function cellOf(tr, name){
    var i = head.indexOf(name);
    if(i < 0) return '';
    var td = tr.children[i];
    return td ? String(td.textContent || '').trim() : '';
  }
  function num(v){ var n = parseFloat(String(v).replace(/[^0-9.\-]/g, '')); return isNaN(n) ? null : n; }
  if(g.sort && head.indexOf(g.sort) >= 0){
    rows.sort(function(a, b){
      var x = cellOf(a, g.sort), y = cellOf(b, g.sort);
      var nx = num(x), ny = num(y);
      var r = (nx !== null && ny !== null) ? (nx - ny) : String(x).localeCompare(String(y));
      return g.sortDir === 'desc' ? -r : r;
    });
    rows.forEach(function(tr){ body.appendChild(tr); });
  }
  if(g.sub && head.indexOf(g.sub) >= 0){
    var cnt = {};
    rows.forEach(function(tr){ var k = cellOf(tr, g.sub) || '(빈칸)'; cnt[k] = (cnt[k] || 0) + 1; });
    var box = document.createElement('div');
    box.className = 'note';
    box.style.cssText = 'margin-top:8px;font-size:12.5px';
    box.innerHTML = '<b>소계 — ' + esc(g.sub) + '</b><br>' + Object.keys(cnt).map(function(k){
      return esc(k) + ' <b>' + cnt[k] + '</b>건'; }).join(' · ');
    t.parentNode.appendChild(box);
  }
  if(g.chart){
    var col = -1;
    for(var i = 0; i < head.length; i++){
      var ok = rows.length && rows.every(function(tr){ return num(cellOf(tr, head[i])) !== null; });
      if(ok){ col = i; break; }
    }
    var wrap2 = document.createElement('div');
    wrap2.style.cssText = 'margin-top:10px';
    if(col < 0){
      wrap2.innerHTML = '<div class="note w" style="font-size:12.5px">' +
        '🔴 숫자로 된 칸이 없어 그래프를 그리지 않았습니다.</div>';
    } else {
      var vals = rows.map(function(tr){
        return { k: String(tr.children[0] ? tr.children[0].textContent : '').trim().slice(0, 18),
                 v: num(cellOf(tr, head[col])) || 0 }; }).slice(0, 20);
      var mx = Math.max.apply(null, vals.map(function(x){ return x.v; }).concat([1]));
      wrap2.innerHTML = '<div style="font-size:12px;font-weight:700;margin-bottom:5px">' +
        esc(head[col]) + ' 그래프</div>' + vals.map(function(x){
        return '<div style="display:flex;align-items:center;gap:7px;margin:2px 0;font-size:12px">' +
          '<span style="width:150px;color:var(--t2);overflow:hidden;text-overflow:ellipsis;' +
          'white-space:nowrap">' + esc(x.k) + '</span>' +
          '<span style="flex:1;background:var(--line);border-radius:4px;height:12px;overflow:hidden">' +
          '<span style="display:block;height:12px;width:' + Math.round(x.v * 100 / mx) +
          '%;background:var(--pri,#1B4F8A)"></span></span>' +
          '<b style="width:56px;text-align:right">' + x.v + '</b></div>';
      }).join('');
    }
    t.parentNode.appendChild(wrap2);
  }
}

/* ══ 4-8 호실 파이프라인 ═══════════════════════════════════════════════
   열 = 접수 · 사진 · 광고 · 상담 · 계약. 🔴 새 자료를 만들지 않는다.
   있는 것(매물·사진색인·광고기록·계약)에서 뽑아 그린다. ══ */
var PIPE_COLS = ['접수', '사진', '광고', '상담', '계약'];
function pipeOne(o){
  var out = {};
  out['접수'] = { ok: !!String(o.recvDate || ''), at: String(o.recvDate || '').slice(0, 10),
                  say: String(o.status || '-') };
  var ph = null;
  try{ ph = phCountFor(o); }catch(e){ ph = null; }
  out['사진'] = { ok: !!(ph && ph.doneMinW), at: '',
                  say: ph ? ((ph.done || 0) + '장' + (ph.refOnly ? ' (참고)' : '')) : '?' };
  var ads = [];
  try{ ads = (AD_CH || []).filter(function(c){ return adOn(o, c.key); })
                          .map(function(c){ return c.label; }); }catch(e){ ads = []; }
  var why = null;
  try{ why = adWhyOne(o); }catch(e){ why = null; }
  out['광고'] = { ok: ads.length > 0, at: '',
                  say: ads.length ? ads.join(',') : (why && why.ok ? '올릴 수 있음' : '아직') };
  var cuN = 0;
  try{
    (DB.customers || []).forEach(function(c){
      if(cuMatch(c).some(function(x){ return String(x.l.id) === String(o.id); })) cuN++; });
  }catch(e){}
  out['상담'] = { ok: String(o.status || '') === '상담중' || cuN > 0, at: '',
                  say: (String(o.status || '') === '상담중' ? '상담중 · ' : '') + '맞는 고객 ' + cuN + '명' };
  var ct = null;
  try{
    ct = (DB.contracts || []).filter(function(x){
      return String(x.listingId || x.listing || '') === String(o.id); })[0] || null;
  }catch(e){}
  out['계약'] = { ok: !!ct, at: ct ? String(ct.startDate || ct.date || '').slice(0, 10) : '',
                  say: ct ? '계약 있음' : (String(o.status || '') === '임대중' ? '🔴 임대중인데 계약 없음' : '-') };
  return out;
}
function pipeCell(o, k, st){
  var mark = st.ok ? '<span class="pill p-good">✓</span>' : '<span class="pill p-mute">–</span>';
  var btn = '';

  else if(k === '광고') btn = '<button class="btn sm" onclick="event.stopPropagation();AD_FILT=&#39;why&#39;;AD_SEL=&#39;' +
    esc(String(o.id)) + '&#39;;go(&#39;ad&#39;,&#39;admgr&#39;)">광고</button>';
  else if(k === '상담') btn = '<button class="btn sm" onclick="event.stopPropagation();go(&#39;crm&#39;,&#39;cust&#39;)">고객</button>';
  else if(k === '계약') btn = '<button class="btn sm" onclick="event.stopPropagation();go(&#39;deal&#39;,&#39;contract&#39;)">계약</button>';
  return '<td style="font-size:12px">' + mark + ' ' + esc(st.say) +
    (st.at ? ('<div style="color:var(--t3);font-size:11px">' + esc(st.at) + '</div>') : '') +
    (btn ? ('<div style="margin-top:3px">' + btn + '</div>') : '') + '</td>';
}
function pipeHtml(units){
  if(!units.length) return '<div class="empty" style="padding:16px">이 건물에 매물이 없습니다</div>';
  return '<div class="tblwrap"><table><thead><tr><th>호실</th>' +

    '</tr></thead><tbody>' +
    units.map(function(o){

var CS_ROWS = null, CS_LOADING = false, CS_ERR = '', CS_FORM = null, CS_SAVING = false;

var CS_STATES = ['진행', '완료', '보류'];
async function csLoad(force){
  if(CS_ROWS && !force) return CS_ROWS;
  if(CS_LOADING && !force) return CS_ROWS;
  CS_LOADING = true; CS_ERR = '';
  try{
    var j = await jgetTry({ action:'getAll', type:'consults' });
    CS_ROWS = j.data || j.result || [];
    if(!Array.isArray(CS_ROWS)) CS_ROWS = [];
  }catch(e){ CS_ROWS = null; CS_ERR = String((e && e.message) || e); }
  CS_LOADING = false;
  try{ route(); }catch(e2){}
  return CS_ROWS;
}
function csFor(scope, targetId){
  return (CS_ROWS || []).filter(function(r){
    return String(r.scope || '') === String(scope) && String(r.targetId || '') === String(targetId);
  }).sort(function(a, b){ return String(b.createdAt || '').localeCompare(String(a.createdAt || '')); });
}
function csNewId(){
  var used = {}; (CS_ROWS || []).forEach(function(r){ used[String(r.id || '')] = 1; });
  var n = 1; while(used['CS' + String(n)]) n++;
  return 'CS' + String(n);
}
function csStart(scope, targetId, personId){
  CS_FORM = { id:'', scope:String(scope), targetId:String(targetId), personId:String(personId || ''),
              title:'', body:'', label:CS_LABELS[0], status:'진행', doneAt:'',
              byWho:String(ME.name || '대표') };
  route();
}
function csSet(k, v){ if(CS_FORM) CS_FORM[k] = v; }
function csCancel(){ CS_FORM = null; route(); }
async function csSave(){
  var nl = String.fromCharCode(10);
  if(!CS_FORM || CS_SAVING) return;
  var f = CS_FORM;
  if(!String(f.title || '').trim()){ alert('제목을 적어 주세요.'); return; }
  if(hasSecret(f.title) || hasSecret(f.body)){
    alert('🔴 비밀번호로 보이는 내용이 있습니다 — 저장하지 않습니다.'); return; }
  if(!confirm(['상담이력을 남깁니다 — 이대로 할까요?', '',
    '제목   ' + f.title, '라벨   ' + f.label, '상태   ' + f.status,
    '', '🔴 문자도 광고도 나가지 않습니다.'].join(nl))) return;
  CS_SAVING = true; route();
  try{
    if(!f.id) f.id = csNewId();
    var now = new Date().toISOString();
    var obj = { id:f.id, scope:f.scope, targetId:f.targetId, personId:f.personId,
                title:String(f.title), body:String(f.body || ''), label:f.label,
                status:f.status, doneAt:(f.status === '완료' ? (f.doneAt || todayStr()) : ''),
                byWho:f.byWho, attachId:'', createdAt:(f.createdAt || now), updatedAt:now };
    await erpUpsert('consults', obj);
    await csLoad(true);
    var back = (CS_ROWS || []).filter(function(r){ return String(r.id) === String(f.id); })[0];
    CS_SAVING = false; CS_FORM = null; route();
    alert(back ? '남겼습니다 ✓' : '🔴 저장했다는데 다시 못 찾았습니다 — 확인이 필요합니다');
  }catch(e){
    CS_SAVING = false; route();

/* ══ 4-5 · 4-6 붙여넣기 표 ═════════════════════════════════════════════
   엑셀에서 그대로 붙여 넣는다(탭으로 나뉜 글). 검증을 통과한 줄만 저장한다.
   🔴 한 줄씩 upsert 한다. saveAll 을 쓰지 않는다.
   🔴 검증에서 막힌 줄은 **저장하지 않고 이유를 적는다**(0건 위장 금지). ══ */
var PG = { kind:'매물', raw:'', rows:null, saving:false, done:null, bldg:'', common:{} };
var PG_KINDS = {
  '매물':  { type:'listings',  cols:['건물명', '호실', '주소', '거래유형', '보증금', '월세', '면적', '층'],
             req:['건물명', '호실', '거래유형'] },
  '사람':  { type:'persons',   cols:['이름', '전화', '출처', '메모'], req:['이름'] },
  '건물':  { type:'buildings', cols:['건물명', '주소', '동', '지번', '총층'], req:['건물명', '주소'] }
};
function pgSet(k, v){ PG[k] = v; }
function pgKind(k){ PG.kind = String(k); PG.rows = null; PG.done = null; route(); }
function pgParse(){
  var cfg = PG_KINDS[PG.kind];
  var lines = String(PG.raw || '').split(String.fromCharCode(10))
    .map(function(x){ return x.replace(/\r$/, ''); })
    .filter(function(x){ return x.trim() !== ''; });
  if(!lines.length){ PG.rows = []; route(); return; }
  /* 첫 줄이 머리글이면 건너뛴다 */
  var first = lines[0].split(String.fromCharCode(9)).map(function(x){ return x.trim(); });
  var skip = cfg.cols.some(function(c){ return first.indexOf(c) >= 0; });
  var body = skip ? lines.slice(1) : lines;
  PG.rows = body.map(function(ln, i){
    var cell = ln.split(String.fromCharCode(9));
    var o = {};
    cfg.cols.forEach(function(c, j){ o[c] = String(cell[j] || '').trim(); });
    var bad = [];
    cfg.req.forEach(function(c){ if(!o[c]) bad.push(c + ' 없음'); });
    if(PG.kind === '사람' && o['전화'] && String(o['전화']).replace(/[^0-9]/g, '').length < 9)
      bad.push('전화번호가 짧습니다');
    if(PG.kind === '매물' && o['거래유형'] && ['월세', '전세', '매매'].indexOf(o['거래유형']) < 0)
      bad.push('거래유형은 월세·전세·매매');
    if(hasSecret(ln)) bad.push('🔒 비밀번호로 보이는 내용');
    return { n:i + 1, o:o, bad:bad };
  });
  PG.done = null;
  route();
}
function pgOk(){ return (PG.rows || []).filter(function(r){ return !r.bad.length; }); }
function pgBad(){ return (PG.rows || []).filter(function(r){ return r.bad.length; }); }
async function pgSave(){
  var nl = String.fromCharCode(10);
  if(PG.saving) return;
  var ok = pgOk(), bad = pgBad();
  if(!ok.length){ alert('저장할 수 있는 줄이 없습니다.'); return; }
  var cfg = PG_KINDS[PG.kind];
  if(!confirm(['검증을 통과한 ' + ok.length + '줄을 저장합니다 — 이대로 할까요?', '',
    bad.length ? ('🔴 막힌 줄 ' + bad.length + '개는 저장하지 않습니다.') : '',
    '', '🔴 한 줄씩 저장합니다(전체 덮어쓰기 아님).',
    '🔴 문자도 광고도 나가지 않습니다.'].filter(function(x){ return x !== ''; }).join(nl))) return;
  PG.saving = true; route();
  var made = 0, fail = [];
  for(var i = 0; i < ok.length; i++){
    var o = ok[i].o, obj = {};
    try{
      if(PG.kind === '매물'){
        obj = { id:'', apt:o['건물명'], addr2:o['호실'], addr:o['주소'] || PG.common.addr || '',
                type:o['거래유형'], price:o['보증금'], rentAmt:o['월세'], area:o['면적'],
                floor:o['층'], status:'접수', recvDate:todayStr(),
                updatedAt:new Date().toISOString() };
        obj.id = 'R' + todayStr().slice(2).split('-').join('') + '-' +
                 String(100 + made).slice(1);
      } else if(PG.kind === '사람'){
        obj = { id:perNewId(DB.persons || []), name:o['이름'], phone:o['전화'],
                source:o['출처'] || '일괄입력', note:o['메모'] || '',
                updatedAt:new Date().toISOString() };
      } else {
        obj = { id:'', name:o['건물명'], addr:o['주소'], dong:o['동'], jibun:o['지번'],
                totalFloor:o['총층'], addrKey:colAddrKeyish(o['주소']),
                updatedAt:new Date().toISOString() };
        var usedB = {}; (DB.buildings || []).forEach(function(x){ usedB[String(x.id || '')] = 1; });
        var bn = 1; while(usedB['B-' + ('000' + bn).slice(-4)]) bn++;
        obj.id = 'B-' + ('000' + bn).slice(-4);
      }
      await erpUpsert(cfg.type, obj);
      made++;
    }catch(e){ fail.push('#' + ok[i].n + ' ' + String(e && e.message || e).slice(0, 60)); }
  }
  PG.saving = false;
  PG.done = { made:made, fail:fail, bad:bad.length };
  try{ await loadAll(true); }catch(e){}
  route();
  alert([made + '줄을 저장했습니다 ✓',
    fail.length ? ('🔴 실패 ' + fail.length + '줄' + nl + fail.slice(0, 4).join(nl)) : '',
    bad.length ? ('🔴 검증에서 막힌 ' + bad.length + '줄은 저장하지 않았습니다.') : ''
  ].filter(function(x){ return x !== ''; }).join(nl));
}
/* 주소에서 대충 키를 만든다 — 건물마스터 addrKey 규칙과 같은 뜻(동 지번) */
function colAddrKeyish(addr){
  var t = String(addr || '');
  var dong = '', jib = '';
  t.replace(/[(),]/g, ' ').split(/\s+/).forEach(function(x){
    if(/^[가-힣]{1,6}(동|읍|면|리)$/.test(x)) dong = x;
    if(/^\d+(-\d+)?$/.test(x)) jib = x;
  });
  return (dong + ' ' + jib).trim();
}
function pgGridHtml(){
  var cfg = PG_KINDS[PG.kind];
  var h = '<div style="display:flex;flex-wrap:wrap;gap:5px;margin:0 0 9px">' +
    Object.keys(PG_KINDS).map(function(k){
      return '<button class="btn sm' + (PG.kind === k ? ' pri' : '') +
        '" onclick="pgKind(&#39;' + k + '&#39;)">' + k + '</button>'; }).join('') +
    '<span style="font-size:11.5px;color:var(--t3);align-self:center;margin-left:8px">' +
    '엑셀에서 그대로 복사해 아래에 붙여 넣으세요</span></div>';
  h += '<div class="note" style="font-size:12.5px"><b>칸 순서</b> ' +
    cfg.cols.map(function(c, i){
      return (i + 1) + ') ' + c + (cfg.req.indexOf(c) >= 0 ? ' 🔴' : ''); }).join(' · ') +
    '<br>🔴 표시는 반드시 있어야 하는 칸입니다. 첫 줄이 머리글이면 알아서 건너뜁니다.</div>';
  h += '<textarea rows="8" placeholder="여기에 붙여 넣으세요 (Ctrl+V)" ' +
    'oninput="pgSet(&#39;raw&#39;,this.value)" style="width:100%;margin-top:8px;padding:9px;' +
    'font-size:12.5px;font-family:monospace;border:1px solid var(--line);border-radius:8px">' +
    esc(PG.raw) + '</textarea>';
  h += '<div style="margin-top:7px"><button class="btn pri" onclick="pgParse()">검증</button> ' +
    '<button class="btn" onclick="pgSet(&#39;raw&#39;,&#39;&#39;);PG.rows=null;route()">지우기</button></div>';
  if(PG.rows === null) return h;
  if(!PG.rows.length) return h + '<div class="empty" style="padding:14px">붙여 넣은 줄이 없습니다</div>';
  var ok = pgOk(), bad = pgBad();
  h += '<div class="note ' + (bad.length ? 'w' : 'i') + '" style="margin-top:10px;font-size:12.5px">' +
    '읽은 줄 <b>' + PG.rows.length + '</b> · 저장할 수 있는 줄 <b>' + ok.length + '</b>' +
    (bad.length ? (' · 🔴 막힌 줄 <b>' + bad.length + '</b>') : '') + '</div>';
  h += '<div class="tblwrap" style="margin-top:8px"><table><thead><tr><th>#</th>' +
    cfg.cols.map(function(c){ return '<th>' + esc(c) + '</th>'; }).join('') +
    '<th>검증</th></tr></thead><tbody>' +
    PG.rows.slice(0, 200).map(function(r){
      return '<tr>' + '<td class="mono">' + r.n + '</td>' +
        cfg.cols.map(function(c){
          return '<td style="font-size:12px">' + esc(r.o[c] || '') + '</td>'; }).join('') +
        '<td style="font-size:12px">' + (r.bad.length
          ? ('<span class="pill p-warn">🔴 ' + esc(r.bad.join(' · ')) + '</span>')
          : '<span class="pill p-good">통과</span>') + '</td></tr>';
    }).join('') + '</tbody></table></div>';
  h += '<div style="margin-top:9px">' +
    '<button class="btn pri" onclick="pgSave()"' + (ok.length ? '' : ' disabled style="opacity:.45"') + '>' +
    (PG.saving ? '저장 중…' : ('통과한 ' + ok.length + '줄 저장')) + '</button>' +
    '<span style="font-size:11.5px;color:var(--t3);margin-left:8px">' +
    '🔴 막힌 줄은 저장하지 않습니다 — 고쳐서 다시 붙여 넣으세요</span></div>';
  if(PG.done) h += '<div class="note i" style="margin-top:9px;font-size:12.5px">' +
    '저장 ' + PG.done.made + '줄' + (PG.done.fail.length ? (' · 실패 ' + PG.done.fail.length) : '') +
    (PG.done.bad ? (' · 막힌 줄 ' + PG.done.bad + ' (저장 안 함)') : '') + '</div>';
  return h;
}

/* ── 그룹웨어 ──────────────────────────────────────────────────── */
var APPR = null, APPR_ERR = '', APPR_LOADING = false;
async function loadAppr(){
  if(APPR !== null || APPR_LOADING) return;
  APPR_LOADING = true;
  try{
    var j = await jgetTry({ action:'approvalList' });
    APPR = (j.result && j.result.rows) || j.result || j.data || [];
    if(!Array.isArray(APPR)) APPR = [];
  }catch(e){ APPR = []; APPR_ERR = String((e && e.message) || e); }
  APPR_LOADING = false;
  route();
}
function viewGroup(){
  if(APPR === null){ loadAppr();
    return crumb() + '<div class="h1row"><h1>그룹웨어</h1></div>' +
      '<div class="card"><div class="empty">결재함을 불러오는 중…</div></div>'; }
  var wait = APPR.filter(function(a){ return String(a.status||'') === '대기'; });
  var inb = DB.inbox || [];
