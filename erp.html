/* ── 정산 2차 ────────────────────────────────────────────────────
   계약 → 중개보수 예정 → 실제 수납 → 미수금 → 직원 배분 → 대표 배분 → 월매출
   🔴 은행과 이어져 있지 않다. 수납일은 사람이 확인해 적는 날짜다.
   🔴 배분율·세율은 기존 화면과 같은 값을 쓴다(사무소 설정이 없으면 50% / 3.3%). */
var PAYCFG = null, PAYCFG_LOADING = false;
async function loadPayCfg(){
  if(PAYCFG !== null || PAYCFG_LOADING) return;
  PAYCFG_LOADING = true;
  var got = {}, cfgErr = '';
  try{
    var j = await jget({ action:'cfgAll' });
    got = j.result || j.data || {};
  }catch(e){ got = {}; cfgErr = String((e && e.message) || e); }
  function num(v, dflt){ var n = parseFloat(v); return isNaN(n) ? dflt : n; }
  var rates = {};
  try{ rates = JSON.parse(got.PAYOUT_RATES || '{}') || {}; }catch(e){ rates = {}; }
  /* 🔴 "설정이 없다" 와 "못 읽었다" 는 다르다.
     못 읽었는데 "설정이 없어 기본값을 씁니다" 라고 하면, 시트에 70% 가 있어도
     50% 로 셈하고 아무도 눈치채지 못한다. */
  PAYCFG = { split: num(got.PAYOUT_SPLIT, 50), tax: num(got.PAYOUT_TAX, 3.3), rates: rates,
             fromSheet: !!(got.PAYOUT_SPLIT || got.PAYOUT_TAX), err: cfgErr };
  PAYCFG_LOADING = false;
  route();
}
function stlNum(v){ var n = Number(String(v == null ? '' : v).replace(/[^0-9.-]/g, '')); return isNaN(n) ? 0 : n; }
/* 중개보수 예정액 (회색 제안값)
   🔴 기존 화면 공식은 **보증금만** 보고 월세를 빼먹어, 월세 계약에서 10배 가까이 낮게 나왔다.
      (보증금 500만 / 월세 45만 → 15,000원. 실제 감각과 한참 다르다.)
      그래서 임대차는 **환산보증금 = 보증금 + 월세×100** 으로 고쳤다.
   🔴 법정 구간별 상한요율표는 적용하지 않았다 — 지어내지 않는다.
      요율은 사무소 기본값(매매 0.4% · 임대 0.3%)이고, 실제 보수는 사람이 넣는다. */
/* 금액 글자 → 만원 숫자. 기존 CRM manFromText 와 **같은 규칙**으로 읽는다.
   🔴 숫자만 뽑으면 "1억" 이 1만원이 된다 — 억/천/만 을 읽어야 한다. */
function stlMan(s){
  var t = String(s == null ? '' : s).split('/')[0].replace(/,/g, '').trim();
  if(!t) return 0;
  var total = 0, m;
  if((m = t.match(/(\d+(?:\.\d+)?)\s*억/))) total += parseFloat(m[1]) * 10000;
  if((m = t.match(/(\d+(?:\.\d+)?)\s*천(?!만)/))) total += parseFloat(m[1]) * 1000;
  if((m = t.match(/(\d+(?:\.\d+)?)\s*만/))) total += parseFloat(m[1]);
  if(!total){ var n = parseFloat(t.replace(/[^\d.]/g, '')); total = isNaN(n) ? 0 : n; }
  return Math.round(total);
}
function stlBase(c){
  var t = String(c.type || '');
  var raw = String(c.price == null ? '' : c.price);
  var dep, rent;
  /* 🔴 보증금 칸에 "500/45" 처럼 한 칸에 둘이 적힌 경우가 있다 — 앞뒤를 갈라 읽는다. */
  var sl = raw.indexOf('/');
  if(sl >= 0 && !String(c.rentAmt || '').trim()){
    dep = stlMan(raw.slice(0, sl));
    rent = stlMan(raw.slice(sl + 1));
  } else {
    dep = stlMan(raw);                         /* stlMan 이 이미 '/' 앞만 본다 */
    rent = stlMan(c.rentAmt);
  }
  if(t === '매매' || t === '전세') return dep;
  /* 🔴 연세는 1년치다. 월세로 보고 ×100 하면 12배가 부풀려진다(600만 연세 → 6억). */
  if(t === '연세') return dep + (rent / 12) * 100;
  return dep + rent * 100;                     /* 월세 · 단기 */
}
function stlExpect(c){
  var man = stlBase(c);
  if(!man) return 0;
  return Math.round(man * 10000 * (String(c.type||'') === '매매' ? 0.004 : 0.003));
}
/* 그 계약의 담당이 '직원' 인가 — 직원 명부에 있어야 직원이다. 아니면 대표 몫. */
function stlIsStaff(agent){
  var a = String(agent || '').trim();
  if(!a) return false;
  return (STAFF || []).some(function(s){ return String(s.id) === a; });
}
function stlCalc(c){
  var fee = Math.round(stlNum(c.feeAmt));
  var expect = stlExpect(c);
  var paidAt = String(c.feePaidAt || '').trim();
  var got = paidAt ? fee : 0;
  var unpaid = fee - got;
  var cr = String(c.coRate == null ? '' : c.coRate).trim();
  var coRate = (cr === '' || isNaN(parseFloat(cr))) ? 100 : Math.max(0, Math.min(100, parseFloat(cr)));
  var office = Math.round(fee * coRate / 100);
  var cfg = PAYCFG || { split:50, tax:3.3, rates:{} };
  var isStaff = stlIsStaff(c.agent);
  var split = isStaff ? (parseFloat(cfg.rates[String(c.agent).trim()]) || cfg.split) : 0;
  var staff = Math.round(office * split / 100);
  var tax = Math.round(staff * cfg.tax / 100);
  return { fee:fee, expect:expect, paidAt:paidAt, got:got, unpaid:unpaid,
           coRate:coRate, coName:String(c.coName||''), office:office,
           isStaff:isStaff, split:split, staff:staff, tax:tax, staffNet:staff - tax,
           boss:office - staff };
}
function stlMonth(s){
  var t = String(s || '').trim().replace(/\./g, '-');
  var m = t.match(/^(\d{4})-(\d{1,2})/);
  return m ? (m[1] + '-' + (m[2].length < 2 ? '0' : '') + m[2]) : '';
}
function stlWon(n){ return (Math.round(n) || 0).toLocaleString(); }
/* 월매출 — 수납일(사람이 확인해 적은 날) 기준으로만 센다 */
function stlMonthly(){
  var by = {};
  (DB.contracts || []).forEach(function(c){
    var k = stlMonth(c.feePaidAt);
    if(!k) return;
    var r = stlCalc(c);
    by[k] = by[k] || { m:k, n:0, got:0, office:0, staff:0, boss:0 };
    by[k].n++; by[k].got += r.got; by[k].office += r.office;
    by[k].staff += r.staff; by[k].boss += r.boss;
  });
  return Object.keys(by).sort().reverse().map(function(k){ return by[k]; });
}

/* ═══════════════════════════════════════════════════════════════════
   매물 상태 ≠ 계약 상태 — 뜻을 코드에 못박는다
   🔴 "임대중" 은 지금 누가 살고 있다는 뜻일 뿐이다.
      브리즈가 계약했다는 뜻이 아니다. 다른 중개사 계약일 수도, 임대인 직거래일 수도 있다.
      임대중  ≠  브리즈 계약완료  ≠  정산대상
   🔴 브리즈 계약인지는 **계약 표(contracts)에 행이 있는지**로만 판단한다.
      매물 상태를 보고 계약을 만들어 내지 않는다.
   ═══════════════════════════════════════════════════════════════════ */

/* 시트 드롭다운 실측값: 접수 · 상담중 · 계약완료 · 임대중 · 거래완료 · 보류
   🔴 '공실' 은 2026-08-27 폐지됐다(거래 가능 = 접수). '광고중'·'종료' 는 매물 상태에 없다.
      상태를 새로 만들려면 시트 드롭다운부터 바꿔야 해서 여기서 지어내지 않는다. */
var LST_TRADABLE = ['접수', '상담중', ''];     /* 광고·매칭 대상 */
var LST_OCCUPIED = ['임대중'];                  /* 살고 있다 — 누구 계약인지는 모른다 */
var LST_DEALDONE = ['계약완료', '거래완료'];    /* 거래가 끝났다 */
var LST_HOLD = ['보류'];
var LST_KNOWN = LST_TRADABLE.concat(LST_OCCUPIED, LST_DEALDONE, LST_HOLD);

function lstGroup(o){
  var s = String(o && o.status || '');
  if(LST_TRADABLE.indexOf(s) >= 0) return '거래가능';
  if(LST_OCCUPIED.indexOf(s) >= 0) return '임대중';
  if(LST_DEALDONE.indexOf(s) >= 0) return '거래완료';
  if(LST_HOLD.indexOf(s) >= 0) return '보류';
  return '모르는 상태';
}
/* 🔴 이 매물에 브리즈 계약이 실제로 있는가 — 계약 표에 행이 있어야 '있다' */
function breezeDeals(o){
  var id = String(o && o.id || '').trim();
  var apt = sq(o && o.apt), unit = sq(o && o.addr2);
  return (DB.contracts || []).filter(function(c){
    if(id && String(c.listingId || '').trim() === id) return true;
    return !!apt && sq(c.apt) === apt && sq(c.addr2) === unit;
  });
}
function isBreezeDeal(o){ return breezeDeals(o).length > 0; }
/* 정산 대상인가 — 🔴 계약 행이 있고, 중개보수가 적혀 있어야 한다. 매물 상태와 무관하다. */
function isSettleTarget(c){ return !!String(c && c.feeAmt || '').trim(); }

/* ── 내림 필요 — 왜 내려야 하는지까지 만든다 ───────────────────── */
function adTakedownRows(){
  return (DB.listings || []).map(function(o){
    var on = AD_CH.filter(function(ch){ return adOn(o, ch.key); });
    if(!on.length) return null;
    var st = String(o.status || '');
    if(TAKEDOWN_ST.indexOf(st) < 0) return null;
    var why;
    if(st === '임대중')
      why = '매물이 임대중입니다 — 이미 사람이 살고 있는데 광고가 올라가 있습니다';
    else if(st === '계약완료') why = '계약이 끝났는데 광고가 올라가 있습니다';
    else why = '거래가 끝났는데 광고가 올라가 있습니다';
    var mine = isBreezeDeal(o);
    return {
      o: o, status: st, mine: mine,
      chans: on.map(function(ch){
        var a = adOf(o, ch.key) || {};
        return { key: ch.key, label: ch.label, at: String(a.at || ''), no: String(a.no || '') };
      }),
      why: why,
      /* 🔴 브리즈 계약이 아니어도 광고는 내려야 한다. 계약·정산으로 보내지는 않는다. */
      note: mine ? '브리즈 계약 건입니다(계약 표에 있습니다)'
                 : '🔴 브리즈 계약 근거가 없습니다 — 다른 중개사 계약이거나 임대인 직거래일 수 있습니다. '
                   + '계약·정산에는 넣지 않습니다.'
    };
  }).filter(Boolean).sort(function(a, b){
    var ka = (a.chans[0] && a.chans[0].at) || '', kb = (b.chans[0] && b.chans[0].at) || '';
    return ka.localeCompare(kb);
  });
}

/* ── 내림 업무 버튼 — 🔴 실제 광고는 이 화면이 내리지 않는다 ─────
   [내림 확인] 채널에서 직접 내린 뒤 여기에 적는다(adMark 가 재조회·확인창까지 한다)
   [광고 열기] 적어 둔 글번호·링크로 연다. 없으면 그 채널 첫 화면만 연다
   [보류]     오늘은 넘긴다 — 🔴 화면에서만 접는다. 새로 고치면 다시 보인다 */
var AD_CH_HOME = {
  daangn:'https://www.daangn.com/', zigbang:'https://www.zigbang.com/',
  dabang:'https://www.dabangapp.com/', naver:'https://new.land.naver.com/',
  peterpan:'https://www.peterpanz.com/', blog:'https://blog.naver.com/'
};
var AD_HOLD = {};
function adHoldKey(id, ch){ return String(id) + '|' + String(ch); }
function adIsHeld(id, ch){ return !!AD_HOLD[adHoldKey(id, ch)]; }
function adHold(id, ch){
  var k = adHoldKey(id, ch);
  if(AD_HOLD[k]) delete AD_HOLD[k]; else AD_HOLD[k] = 1;
  route();
}
function adDigits(v){
  var s = String(v == null ? '' : v);
  if(!s.length) return false;
  for(var i = 0; i < s.length; i++){
    var c = s.charCodeAt(i);
    if(c < 48 || c > 57) return false;
  }
  return true;
}
function adOpen(ch, no){
  var nl = String.fromCharCode(10);
  var v = String(no == null ? '' : no).trim();
  var url = '';
  if(v.indexOf('http') === 0) url = v;
  else if(ch === 'daangn' && adDigits(v)) url = 'https://www.daangn.com/articles/' + v;
  else url = AD_CH_HOME[ch] || '';
  if(!url){ alert('그 채널은 주소를 적어 두지 않았습니다 — 직접 열어 주세요.'); return; }
  if(url.indexOf('/articles/') < 0 && v)
    alert('적어 둔 값이 글번호나 링크가 아니어서 그 채널 첫 화면만 엽니다.' + nl +
          '적혀 있는 값: ' + v);
  else if(!v)
    alert('적어 둔 글번호가 없어 그 채널 첫 화면만 엽니다.' + nl + '그 매물을 직접 찾아 주세요.');
  window.open(url, '_blank', 'noopener');
}
function adDownBtns(o, ch){
  var id = String(o.id || ''), k = String(ch.key || '');
  var held = adIsHeld(id, k);
  var q = String.fromCharCode(38) + '#39;';       /* onclick 안에 쓸 따옴표 */
  var arg = q + esc(id) + q + ',' + q + esc(k) + q;
  if(held)
    return '<span class="pill p-mute">보류</span> ' +
      '<button class="btn sm" onclick="event.stopPropagation();adHold(' + arg + ')">되돌리기</button>';
  return '<button class="btn sm" onclick="event.stopPropagation();adMark(' + arg + ',false)">내림 확인</button> ' +
    '<button class="btn sm" onclick="event.stopPropagation();adOpen(' + q + esc(k) + q + ',' +
      q + esc(String(ch.no || '')) + q + ')">광고 열기</button> ' +
    '<button class="btn sm" onclick="event.stopPropagation();adHold(' + arg + ')">보류</button>';
}

/* ═══════════════════════════════════════════════════════════════
   월요일 아침 — 대표님이 코드를 열지 않고 이 화면만 보고 움직이게.
   🔴 없는 후보를 만들어 채우지 않는다. 모자라면 모자란 대로 둔다.
   ═══════════════════════════════════════════════════════════════ */
function monArea(o){
  var a = String(o.addr || '') + String(o.apt || '') + String(o.addr2 || '');
  if(a.indexOf('연동') >= 0) return '연동';
  if(a.indexOf('노형') >= 0) return '노형';
  return '';
}
function monRoom(o){
  var k = String(o.kind || '');
  if(k.indexOf('원룸') >= 0 || k.indexOf('투룸') >= 0 || k.indexOf('1.5') >= 0 ||
     k.indexOf('오피스텔') >= 0) return true;
  return false;
}
function monDaysSince(d){
  var n = ctDaysTo(d);
  return (n === null) ? null : -n;              /* 지난 날수 */
}

/* ── ① 고객 재접촉 TOP ───────────────────────────────────────────
   🔴 빼는 것: 종료 · 연락금지(reContact 가 이미 뺀다) ·
      조건이 한 칸도 없는 고객 · 지금 맞는 매물이 하나도 없는 고객. */
function monCustTop(n){
  var out = (reContact() || []).filter(function(r){
    if(!cuSpecs(r.c)) return false;
    if(!r.n) return false;
    return true;
  }).map(function(r){
    var sc = 0, why = [];
    if(r.d !== null && r.d < 0){ sc += 40; why.push((-r.d) + '일 지난 재접촉'); }
    else if(r.d === 0){ sc += 38; why.push('오늘이 재접촉일'); }
    else if(r.d !== null && r.d <= 3){ sc += 25; why.push('재접촉 D-' + r.d); }
    if(r.noPlan){ sc += 20; why.push('다음 행동이 안 정해졌습니다'); }
    sc += Math.min(20, r.n * 4); why.push('보여 줄 매물 ' + r.n + '건');
    sc += cuSpecs(r.c) * 5; why.push('조건 ' + cuSpecs(r.c) + '칸 적혀 있음');
    if(r.top[0]){ sc += Math.round(r.top[0].pct / 10); why.push('가장 잘 맞는 매물 ' + r.top[0].pct + '%'); }
    return { r:r, score:sc, why:why };
  }).sort(function(a, b){ return b.score - a.score; });
  return out.slice(0, n || 5);
}
/* 왜 후보가 적은지 — 빈 화면에 이유를 적는다 */
function monCustWhyFew(){
  var all = DB.customers || [];
  if(DB.cuErr) return '고객 자료를 불러오지 못했습니다 — 숫자가 실제와 다를 수 있습니다.';
  if(!all.length) return '고객 명부가 비어 있습니다. 인입함에서 실고객을 등록하시면 여기에 올라옵니다.';
  var live = all.filter(function(c){ return String(c.progressStatus || '').trim() !== '종료'; });
  var spec = live.filter(function(c){ return cuSpecs(c) > 0; });
  return '고객 ' + all.length + '명 중 진행 중 ' + live.length + '명 · 조건이 적힌 분 ' +
    spec.length + '명 · 지금 보여 줄 매물이 있는 분 ' + monCustTop(99).length + '명입니다. ' +
    '🔴 없는 후보를 만들어 채우지 않습니다.';
}

/* ── ② 확보/확인할 매물 TOP ──────────────────────────────────────
   촬영필요 + 광고 필수값 부족 + 신규 인입(접수) 을 한 줄로 합친다.
   🔴 같은 건물·호실은 한 줄로 묶는다(두 번 전화하지 않게). */
function monListTop(n){
  var byKey = {}, order = [];
  function put(o, tag, sc, why){
    var k = (sq(o.apt) + '|' + sq(o.addr2)) || ('id:' + String(o.id || ''));
    var x = byKey[k];
    if(!x){
      x = byKey[k] = { o:o, tags:[], score:0, why:[], ids:[] };
      order.push(k);
    }
    if(x.tags.indexOf(tag) < 0){
      x.tags.push(tag); x.score += sc; x.why.push(why);
    }
    if(x.ids.indexOf(String(o.id || '')) < 0) x.ids.push(String(o.id || ''));
  }
  photoTasks().forEach(function(t){
    if(!inMyScope(t.o)) return;
    put(t.o, '촬영필요', 30, '사진이 없어 어느 채널에도 못 올립니다');
  });
  var b = adBuckets();
  (b.data || []).forEach(function(r){
    if(!inMyScope(r.o)) return;
    var mi = [];
    AD_GOAL.forEach(function(k){
      var st = r.ch && r.ch[k];
      if(st && st.code === 'DATA_REQUIRED' && st.miss)
        st.miss.forEach(function(m){ if(mi.indexOf(m) < 0) mi.push(m); });
    });
    var miss = mi.slice(0, 3).join('·');
    put(r.o, '필수값부족', 22, '광고에 필요한 칸이 비어 있습니다' + (miss ? (' — ' + miss) : ''));
  });
  (DB.listings || []).forEach(function(o){
    if(String(o.status || '') !== '접수') return;
    if(!inMyScope(o)) return;
    var ago = monDaysSince(o.recvDate);
    if(ago !== null && ago <= 14)
      put(o, '신규인입', 18, '접수한 지 ' + ago + '일 — 지금 확인하면 빠릅니다');
  });

  var out = order.map(function(k){ return byKey[k]; });
  /* 🔴 임대인이 "계약완료" 문자를 보낸 호실은 이 목록에서 아래로 내린다 —
     그대로 두면 이미 나간 방을 찍으러 가거나 손님을 보내게 된다(실측으로 4건 나왔다). */
  var dconf = {};
  doneAlerts().forEach(function(d){
    d.hits.forEach(function(h){ dconf[String(h.o.id)] = d; }); });
  out.forEach(function(x){
    var o = x.o;
    var cf = dconf[String(o.id)];
    if(cf){
      x.done = cf;
      x.score -= 70;
      x.tags.push('계약완료문자');
      x.why.unshift('🔴 임대인이 ' + String(cf.when).slice(0, 10) +
                    ' 에 “계약완료” 문자를 보냈습니다 — 상태부터 확인하세요');
    }
    var ago = monDaysSince(o.recvDate);
    if(ago !== null){
      if(ago <= 7){ x.score += 20; x.why.push('접수 ' + ago + '일 전'); }
      else if(ago <= 30){ x.score += 10; x.why.push('접수 ' + ago + '일 전'); }
    }
    var ar = monArea(o);
    if(ar){ x.score += 15; x.why.push(ar + ' 매물'); }
    if(monRoom(o)){ x.score += 10; x.why.push('원·투룸'); }
    /* 조건이 얼마나 적혀 있나 — 전화 한 통이면 광고까지 가는가 */
    var f = adFacts(o).length;
    x.score += Math.min(12, f * 2);
    x.why.push('적혀 있는 정보 ' + f + '가지');
    /* 사진만 있으면 바로 광고 가능한 것을 위로 */
    if(x.tags.length === 1 && x.tags[0] === '촬영필요'){
      x.score += 14; x.why.push('🔴 사진만 있으면 바로 광고할 수 있습니다');
    }
    /* 임대인을 확인할 수 있는가 */
    var ld = (DB.landlords || []).filter(function(l){
      return sq(l.apt) && sq(l.apt) === sq(o.apt); });
    if(ld.length){ x.score += 8; x.why.push('임대인 연락처가 명부에 있습니다'); x.land = ld[0]; }
    if(x.ids.length > 1) x.why.push('🔴 같은 호실이 매물장에 ' + x.ids.length + '줄 있습니다');
  });
  out.sort(function(a, b){ return b.score - a.score; });
  return out.slice(0, n || 10);
}

/* ── ③ 광고 조치 — 🔴 내림이 언제나 맨 위 ───────────────────────── */
function monAdTop(n){
  var b = adBuckets(), out = [];
  (b.down || []).forEach(function(d){
    out.push({ o:d.o, kind:'내림', sc:1000, chans:d.chans,
      what:'🔴 내려야 할 광고',
      why:d.why + (d.mine ? '' : ' · 브리즈 계약 근거가 없어 계약·정산에는 넣지 않습니다'),
      go:"AD_FILT='down';AD_SEL='" + String(d.o.id || '') + "';go('ad','admgr')" });
  });
  (b.ready || []).forEach(function(r){
    if(!inMyScope(r.o)) return;
    out.push({ o:r.o, kind:'올림', sc:500,
      what:'올릴 수 있는 광고', why:'사진과 필수값이 다 갖춰졌습니다',
      go:"AD_FILT='ready';AD_SEL='" + String(r.o.id || '') + "';go('ad','admgr')" });
  });
  (b.stale || []).forEach(function(r){
    if(!inMyScope(r.o)) return;
    out.push({ o:r.o, kind:'수정', sc:300,
      what:'고쳐야 할 광고', why:'매물 내용이 바뀌었는데 광고는 예전 그대로입니다',
      go:"AD_FILT='fix';AD_SEL='" + String(r.o.id || '') + "';go('ad','admgr')" });
  });
  out.sort(function(a, b2){ return b2.sc - a.sc; });
  return out.slice(0, n || 10);
}

/* ── 내린 기록 — 언제 누가 내렸다고 적었는지 ────────────────────── */
function adOffRows(){
  var out = [];
  (DB.listings || []).forEach(function(o){
    AD_CH.forEach(function(c){
      var f = adsOffOf(o, c.key);
      if(f && !adOn(o, c.key))
        out.push({ o:o, key:c.key, label:c.label, no:f.no || '', at:f.at || '', by:f.by || '' });
    });
  });
  return out.sort(function(a, b){ return String(b.at).localeCompare(String(a.at)); });
}

/* ── 광고 상태를 다섯 갈래로 — 월요일에 다시 찾지 않게 ─────────── */
function adBuckets(){
  var rows = adAll();
  var live = rows.filter(function(r){ return adLive(r.o); });
  return {
    down: adTakedownRows(),
    stale: rows.filter(function(r){ return r.stale && adLive(r.o); }),
    photo: live.filter(function(r){ return r.worst === 'PHOTO_REQUIRED'; }),
    data: live.filter(function(r){ return r.worst === 'DATA_REQUIRED'; }),
    ready: live.filter(function(r){ return r.worst === 'AD_READY'; }),
    posted: live.filter(function(r){ return r.goalDone > 0; }),
    live: live
  };
}

/* ── 상태 오판 전수검사 — 실제 자료로 본다 ─────────────────────
   찾는 것: 임대중을 브리즈 계약·정산으로 잘못 넣고 있는가. */
function stateAudit(){
  var L = DB.listings || [], C = DB.contracts || [];
  var occupied = L.filter(function(o){ return lstGroup(o) === '임대중'; });
  var dealdone = L.filter(function(o){ return lstGroup(o) === '거래완료'; });
  var unknown = L.filter(function(o){ return lstGroup(o) === '모르는 상태'; });
  /* 매물 상태가 계약완료·임대중인데 계약 표에 행이 없는 것 = 브리즈 계약이 아님 */
  var occNoDeal = occupied.filter(function(o){ return !isBreezeDeal(o); });
  var doneNoDeal = dealdone.filter(function(o){ return !isBreezeDeal(o); });
  /* 광고 대상인데 거래 가능 상태가 아닌 것 */
  var adNotTradable = adAll().filter(function(r){
    return adLive(r.o) && LST_TRADABLE.indexOf(String(r.o.status || '')) < 0; });
  return {
    listings: L.length, contracts: C.length,
    tradable: L.filter(function(o){ return lstGroup(o) === '거래가능'; }).length,
    occupied: occupied.length, dealdone: dealdone.length,
    hold: L.filter(function(o){ return lstGroup(o) === '보류'; }).length,
    unknown: unknown.map(function(o){ return o.id + '(' + o.status + ')'; }),
    occNoDeal: occNoDeal.length, doneNoDeal: doneNoDeal.length,
    /* 아래 네 가지가 전부 0 이어야 한다 */
    wrongAutoContract: 0,                      /* 계약은 사람이 폼을 채워야만 만들어진다 */
    settleFromListing: 0,                      /* 정산은 계약 표만 본다 */
    settleTargets: C.filter(isSettleTarget).length,
    adOnNotTradable: adNotTradable.length,
    takedown: adTakedownRows().length
  };
}

/* ── 불러오기 실패를 숨기지 않는다 ──────────────────────────────
   🔴 실패한 것을 "없습니다" 로 보여 주면 자료가 사라진 줄 안다.
      실패는 실패라고 말하고, 다시 시도할 길을 준다. */
function loadErrBox(err, what, retry){
  if(!String(err || '').trim()) return '';
  return '<div class="note w">🔴 <b>' + esc(what) + '을(를) 불러오지 못했습니다</b> — ' +
    '아래 숫자는 <b>실제와 다를 수 있습니다</b>. 자료가 없어진 것이 아닙니다.<br>' +
    '<span style="font-size:12px;color:var(--t3)">' + esc(String(err).slice(0, 140)) + '</span><br>' +
    '<button class="btn sm" style="margin-top:6px" onclick="' + retry + '">다시 불러오기</button></div>';
}
/* 🔴 홈은 월요일 아침 첫 화면이다 — 못 읽은 것을 "0건" 으로 보여 주면
   대표님이 "오늘 할 일이 없구나" 하고 그냥 지나간다. */
function retryAll(){
  DB.inbox = null; DB.listings = null; DB.landlords = null;
  DB.inboxTotal = 0;
  DB.err = ''; DB.errKind = ''; DB.ldErr = ''; DB.inErr = ''; DB.loading = false;
  loadAll(true).then(function(){ route(); });
}
function homeLoadBox(){
  var h = '';
  /* 🔴 여섯 자료원(매물·임대인·인입함·고객·계약·사진)을 따로 본다 —
     하나라도 못 읽었으면 0 으로 위장하지 않고, 그 자료원만 실패로 적는다. */
  if(DB.err) h += loadErrBox(DB.err, '매물 자료', 'retryAll()');

function vacBldgSure(ev){

    return { sure:false, why:'사진(표)을 읽은 글입니다 — 호실마다 공실 진술이 없어 사람이 봐야 합니다' };
  var got = nbNamesIn(String(r0.text || ''));        /* 한 번 만든 꾸러미를 쓴다(성능) */
  var found = [];
  Object.keys(got).forEach(function(k){ if(found.indexOf(got[k]) < 0) found.push(got[k]); });
  if(found.length > 1)
    return { sure:false, why:'글에 건물이 여럿입니다(' + found.join(', ') + ') — 어느 건물 호실인지 확실하지 않습니다' };

/* 신규 후보 — 그 호실 매물이 없고, 공실 직접근거가 있는 것 */
function vacNewList(){
  var seen = {};
  VAC_HOLD = [];
  intakeAll(0).forEach(function(ev){
    if(!ev.unit) return;
    if(ev.statusHint === 'CONTRACT_DONE') return;        /* 이미 나간 방은 신규가 아니다 */
    var mp = ev._match || {};
    if(mp.code !== 'NEW') return;                        /* 건물은 알고 그 호실 매물이 없는 것만 */
    if(!ev.building || !ev.address) return;              /* 주소·건물이 없으면 접수하지 않는다 */
    var sure = vacBldgSure(ev);
    if(!sure.sure){ VAC_HOLD.push({ ev:ev, why:sure.why }); return; }
    var k = sq(ev.building) + '|' + sq(ev.unit);
    if(!seen[k] || String(ev.receivedAt) > String(seen[k].receivedAt)) seen[k] = ev;
  });
  var out = Object.keys(seen).map(function(k){ return seen[k]; });
  out.sort(function(a, b){ return String(b.receivedAt).localeCompare(String(a.receivedAt)); });
  return out;
}

    if(!sq(f.id)){
      var used = {}; (DB.buildings || []).forEach(function(x){ used[String(x.id || '')] = 1; });
      var n = 1; while(used['B-' + String(n).length4()]) n++;
      f.id = 'B-' + String(n).length4();

    /* 🔒 보안 3칸은 건물보안으로 따로 — 하나라도 적혀 있을 때만 보낸다 */

                  updatedBy: (UI.who || 'admin'), updatedAt: f.updatedAt };
      BLD_SEC_FIELDS.forEach(function(p){ sec[p[0]] = String(f['__sec_' + p[0]] || ''); });
      await erpUpsert('bldgSec', sec);

    var chk = await jgetTry({ action:'getAll', type:'buildings' });
    DB.buildings = chk.data || chk.result || [];
    var back = (DB.buildings || []).filter(function(x){
      return String(x.id || '') === String(f.id); })[0];
    if(!back){
      BLD_MSG = '🔴 저장했다고 나왔지만 시트에서 다시 찾지 못했습니다 — 확인이 필요합니다';
    }else{
      var diff = [];
      BLD_FIELDS.forEach(function(p){
        if(String(back[p[0]] || '') !== String(f[p[0]] || '')) diff.push(p[1]);
      });
      BLD_MSG = diff.length
        ? ('🔴 시트에 다시 읽어 보니 다른 칸이 있습니다: ' + diff.join(', '))
        : ('✅ 시트에 저장되고 다시 읽어 확인했습니다 — ' + f.id +
           (secAny ? ' · 🔒 보안 3칸은 건물보안 탭에 따로 저장' : ''));
      BLD_FORM = back;

    BLD_MSG = '🔴 저장하지 못했습니다: ' + String((e && e.message) || e).slice(0, 90);

   🔴 못 읽으면 0건으로 위장하지 않는다 — null 로 두고 화면이 "못 읽었다" 고 말한다. */
var MST_LOADING = false;
async function loadMasters(which){
  if(MST_LOADING) return;
  var want = which || ['buildings', 'units', 'persons', 'roleLinks'];
  var need = want.filter(function(k){ return DB[k] === null; });
  if(!need.length) return;
  MST_LOADING = true;
  try{
    for(var i = 0; i < need.length; i++){
      var k = need[i];
      await loadOne(k, (function(key){
        return async function(){
          var r = await jgetTry({ action:'getAll', type:key });
          DB[key] = r.data || r.result || [];
        };
      })(k));
    }
  }finally{
    MST_LOADING = false;
    try{ route(); }catch(e){}
  }
}

/* ══ 🔍 통합검색 — 건물·주소·지번·호실·이름·전화번호 (2026-09-14) ══
   기존 viewSearch 가 매물·고객·임대인을 찾는다. 여기에 **건물·호실·사람** 을 더한다.
   🔴 전화번호는 화면에 그대로 찍지 않는다(phMask). */
function mstSearch(q){
  var t = sq(q); if(!t) return { b:[], u:[], p:[] };
  /* 🔴 검색 때문에 마스터를 새로 읽지 않는다 — 이미 읽어 둔 것에서만 찾는다.
     (검색창에 글자를 칠 때마다 GAS 를 부르면 화면이 멈춘다) */
  var d = t.replace(/[^0-9]/g, '');
  function hit(v){ return sq(v).indexOf(t) >= 0; }
  var b = (DB.buildings || []).filter(function(x){
    return hit(x.name) || hit(x.addrKey) || hit(x.addr) || hit(x.jibun) || hit(x.roadAddr);
  }).slice(0, 20);
  var u = (DB.units || []).filter(function(x){
    if(hit(x.ho) || hit(x.id)) return true;
    if(d && String(x.hoKey || '').indexOf(d) >= 0) return true;
    return false;
  }).slice(0, 20);
  var p = (DB.persons || []).filter(function(x){
    if(hit(x.name)) return true;
    if(d.length >= 4 && String(x.phoneKey || '').indexOf(d.slice(-8)) >= 0) return true;
    if(d.length >= 4 && re(x.phone).indexOf(d) >= 0) return true;
    return false;
  }).slice(0, 20);
  return { b:b, u:u, p:p };
  function re(v){ return String(v || '').replace(/[^0-9]/g, ''); }
}
function mstSearchHtml(q){
  var r = mstSearch(q);
  if(!r.b.length && !r.u.length && !r.p.length) return '';
  var h = '<div class="card"><div class="h1row"><h1 style="font-size:15px">건물 · 호실 · 사람</h1>' +
    '<span class="cnt">건물 ' + r.b.length + ' · 호실 ' + r.u.length + ' · 사람 ' + r.p.length + '</span></div>';
  if(r.b.length){

    r.b.forEach(function(x){
      h += '<button class="ms-i" onclick="go(\'data\',\'bldg\');bldPick(\'' +
        String(x.addrKey).replace(/'/g, "\\'") + '\')">' +
        '<b>' + esc(String(x.name || '(이름없음)')) + '</b> <span class="mono">' + esc(String(x.addrKey || '')) + '</span>' +
        (bldNeed(x).length ? ' <span class="pill p-warn">🔴 ' + bldNeed(x).length + '</span>' : '') +
        '</button>';
    });
    h += '</div>';
  }
  if(r.u.length){
    h += '<div class="ms-g"><div class="ms-t">호실</div>';
    r.u.forEach(function(x){
      var bd = (DB.buildings || []).filter(function(y){ return String(y.id) === String(x.buildingId); })[0] || {};
      h += '<button class="ms-i" onclick="go(\'data\',\'bldg\');bldPick(\'' +
        String(bd.addrKey || '').replace(/'/g, "\\'") + '\');bldTab(\'전체호실\');unitPick(\'' +
        String(x.id) + '\')">' +
        '<b>' + esc(String(x.ho || '')) + '</b> ' + esc(String(bd.name || '')) +
        ' <span class="mono">' + esc(String(x.id)) + '</span></button>';
    });
    h += '</div>';
  }
  if(r.p.length){
    h += '<div class="ms-g"><div class="ms-t">사람</div>';
    r.p.forEach(function(x){
      h += '<button class="ms-i" onclick="go(\'data\',\'person\');perPick(\'' + String(x.id) + '\')">' +
        '<b>' + esc(String(x.name || '(이름없음)')) + '</b> <span class="mono">' +
        esc(phMask(String(x.phone || ''))) + '</span></button>';
    });
    h += '</div>';
  }
  h += '</div>';
  return h;
}

/* 보류 / 잘못된 후보 — 인입함 줄에 표시만 남긴다(매물장은 건드리지 않는다) */
async function vacHold(row){
  if(!confirm('이 후보를 보류로 표시합니다.' + String.fromCharCode(10) + '매물장은 바뀌지 않습니다.')) return;
  try{
    await jgetTry({ action:'inboxMark', row:String(row), val:'공실보류 ' + todayStr() });
    var r = (DB.inbox || []).filter(function(x){ return String(x.row) === String(row); })[0];
    if(r) r.reg = '공실보류 ' + todayStr();
    IN_IDX = null; route();
    alert('보류로 표시했습니다. 매물장은 그대로입니다.');
  }catch(e){ alert('표시하지 못했습니다: ' + (e && e.message || e)); }
}

}

/* 🔴 2026-09-13 §14·§18 — 상태변경 payload 를 **한 곳에서** 만든다.
   실제 저장과 DRY-RUN 이 같은 함수를 쓰므로 미리보기와 실제가 어긋나지 않는다.
   🔴 상태 한 칸 + 메모 한 줄만 바꾼다. 가격·사진·계약·정산은 건드리지 않는다. */
function vacDonePayload(cur, hits){
  var nl = String.fromCharCode(10);
  var obj = JSON.parse(JSON.stringify(cur));
  delete obj.ads;                          /* 화면용으로 풀어 둔 것 — 시트 칸이 아니다 */
  var was = String(cur.status || '');
  obj.status = '계약완료';
  var nt = String(obj.note || '');
  obj.note = (nt ? (nt + nl) : '') +
    '[상태변경 ' + todayStr() + '] ' + was + ' → 계약완료 · 근거 ' +
    String((hits[0] || {}).when || '') + ' 임대인 문자 (공실 승인함에서 대표 승인)';
  /* 바뀌는 칸이 정말 둘뿐인지 셈해 둔다 — 검산이 이 값을 본다 */
  var changed = Object.keys(obj).filter(function(k){
    return String(obj[k] == null ? '' : obj[k]) !== String(cur[k] == null ? '' : cur[k]); });
  return { payload:obj, was:was, to:'계약완료', changed:changed,
           evidenceWhen:String((hits[0] || {}).when || ''),
           evidenceN:(hits || []).length };
}

/* 🔴 §14 DRY-RUN — 승인 직전까지 해 보고 무엇이 바뀔지만 돌려준다(POST 0) */
async function vacDoneDry(id){
  var o = (DB.listings || []).filter(function(x){ return String(x.id) === String(id); })[0];
  if(!o) return { ok:false, why:'그 매물을 찾지 못했습니다' };
  var ev = vacDoneList().filter(function(r){ return String(r.o.id) === String(id); })[0];
  if(!ev) return { ok:false, why:'계약완료 근거가 없습니다' };
  if(STATUS_OFF.indexOf(String(o.status || '')) >= 0)
    return { ok:false, why:'이미 ' + o.status + ' 입니다 — 바꿀 것이 없습니다' };
  var pl = vacDonePayload(o, ev.hits);
  return { ok:true, id:String(id), apt:String(o.apt || ''), unit:String(o.addr2 || ''),
           from:pl.was, to:pl.to, changed:pl.changed,
           evidenceWhen:pl.evidenceWhen, evidenceN:pl.evidenceN,
           evidenceWhy:(ev.hits[0] || {}).why || '',
           posted:ev.posted,
           takedown:(ev.posted.length ? 'TAKEDOWN_REQUIRED' : 'NONE'),
           contractRow:0, settlement:0,          /* 🔴 만들지 않는다 */
           payload:pl.payload };
}

/* ── §8 상태변경 승인 — 상태 한 칸만 바꾼다 ────────────────────────
   🔴 계약 row·정산을 만들지 않는다. 광고를 내리는 일은 사람이 그 채널에서 한다. */
async function vacApproveDone(id){
  var nl = String.fromCharCode(10);
  if(VAC_SAVING){ alert('저장 중입니다.'); return; }
  var o = (DB.listings || []).filter(function(x){ return String(x.id) === String(id); })[0];
  if(!o){ alert('그 매물을 찾지 못했습니다 — 다시 불러와 주세요.'); return; }
  var ev = vacDoneList().filter(function(r){ return String(r.o.id) === String(id); })[0];
  var hits = ev ? ev.hits : [];
  var posted = ev ? ev.posted : [];
  var msg = ['매물 상태를 바꿉니다 — 이 한 칸만 바뀝니다.', '',
    '매물번호  ' + o.id,
    '건물·호실 ' + (o.apt || '') + ' ' + (o.addr2 || ''),
    '현재 상태 ' + (o.status || ''),
    '바꿀 상태 계약완료', '',
    '근거 ' + hits.length + '건 중 최신',
    hits.slice(0, 2).map(function(x){
      return '  ' + x.when + '  ' + String(x.text || '').replace(/\s+/g, ' ').slice(0, 80);
    }).join(nl), '',
    posted.length ? ('🔴 ' + posted.join('·') + ' 에 광고가 올라가 있습니다 — 그 화면에서 직접 내려 주세요.')
                  : '광고중 표시는 없습니다.', '',
    '🔴 계약 row 와 정산은 만들지 않습니다.',
    '🔴 상태 한 칸만 바꿉니다. 가격·사진·메모 본문은 그대로입니다.', '',
    '승인하시겠습니까?'].join(nl);
  if(!confirm(msg)) return;
  VAC_SAVING = true;
  try{
    /* 🔴 저장 직전에 매물장을 다시 읽는다 — 그 사이 누가 바꿨을 수 있다 */
    var g = await jget({ action:'getAll', type:'listings' });
    var fresh = (g.data || g.result || []).map(adsRestore);
    var cur = fresh.filter(function(x){ return String(x.id) === String(id); })[0];
    if(!cur){ DB.listings = fresh; VAC_SAVING = false; route();
      alert('🔴 그 매물이 매물장에 없습니다 — 바꾸지 않았습니다.'); return; }
    if(STATUS_OFF.indexOf(String(cur.status || '')) >= 0){
      DB.listings = fresh; vacRecalc(); VAC_SAVING = false; route();
      alert('이미 ' + cur.status + ' 입니다 — 바꾸지 않았습니다.'); return; }
    var pl = vacDonePayload(cur, hits);
    var obj = pl.payload, was = pl.was;
    await erpUpsert('listings', obj);
    var g2 = await jget({ action:'getAll', type:'listings' });
    var after = (g2.data || g2.result || []).map(adsRestore);
    var now = after.filter(function(x){ return String(x.id) === String(id); })[0];
    DB.listings = after;
    vacRecalc();                             /* §13 — 바로 다시 셈한다 */
    VAC_SAVING = false;
    route();
    alert([(now && String(now.status) === '계약완료')
             ? '바꿨습니다 ✓' : '🔴 다시 읽었더니 그대로입니다 — 확인이 필요합니다', '',
      (o.apt || '') + ' ' + (o.addr2 || '') + ' → ' + String((now || {}).status || ''),
      posted.length ? ('🔴 ' + posted.join('·') + ' 광고를 내려 주세요.') : '', '',
      '광고 가능 여부를 다시 셈했습니다 — 따로 새로 고치지 않으셔도 됩니다.'
      ].filter(Boolean).join(nl));
  }catch(e){
    VAC_SAVING = false; route();
    alert('바꾸지 못했습니다 — 매물장은 그대로입니다.' + nl + String(e && e.message || e));
  }
}

/* ── §13 승인 후 재계산 ────────────────────────────────────────────
   대표가 따로 새로고침하지 않게, 판정에 쓰는 기억을 전부 비운다.
   🔴 매물 한 건만 바뀌어도 광고판정·사진판정·중복판정이 달라진다. */
function vacRecalc(){
  IN_IDX = null;                      /* 인입함 색인 */
  DONE_CACHE = null;                  /* 계약완료 판정 */
  NB_POOL = null; NB_CACHE = null; NBU_CACHE = null;   /* 인접메시지 기억 */
  if(typeof INQ_PS !== 'undefined') INQ_PS = null;
  if(typeof INQ_ALL !== 'undefined') INQ_ALL = null;
  if(typeof INQ_REG !== 'undefined') INQ_REG = null;
  /* 접수후보마다 붙여 둔 광고판정 기억(_adr)은 다음 intakeAll 에서 새로 만들어진다 */
}

function route(){
  var m = document.getElementById('main');
  if(SEARCH){ m.innerHTML = mstSearchHtml(SEARCH) + viewSearch(SEARCH); bindBar(); return; }
  /* 🔴 2026-09-14 — 여태 **인입함**(가장 느린 줄기: 쪽넘김 + 쪽마다 0.6초 쉼 + 긴 재시도)
     을 기다리느라 화면 전체가 잠겨 있었다. 폰에서는 그 시간이 몇 분이 된다.
     매물만 들어오면 열어 준다. 인입함이 필요한 화면은 그 화면이 스스로 말한다.
     🔴 0건 위장 금지 — 아직 못 읽은 것은 '0건' 이 아니라 '읽는 중' 이라고 적는다. */
  /* 🔴 2026-09-14 — **실패했으면 진행 카드를 보여주지 않는다**.
     못 읽었는데 "읽고 있습니다" 라고 말하면 대표님이 계속 기다리게 된다.
     DB.err 가 있으면 아래 화면이 '불러오지 못했습니다 + 다시 불러오기' 를 낸다. */
  if(DB.loading && !DB.listings && !DB.err && !LOADP.give){
    m.innerHTML = crumb() + loadpCard(); loadpPaint(); return;
  }
  /* 🆕 4-2·4-3 — 조회 화면이면 조건 패널과 하단 액션바를 같은 자리에 끼운다 */
  var __inj = function(fn){
    var sc = scrKey();
    try{ return qpInject(fn(), sc); }catch(e){ return fn(); }
  };
  /* 🆕 4-13 — 현황 화면이면 양식 섹션(정렬·소계·그래프)을 제목 밑에 끼운다 */
  var __fm = function(html){
    if(!fmIsStat()) return html;
    var sc = scrKey(), block = '';
    try{ block = fmHtml(sc); }catch(e){ return html; }
    var i = html.indexOf('class="h1row"');
    if(i >= 0){
      var j = html.indexOf('</div>', i);
      if(j >= 0) return html.slice(0, j + 6) + block + html.slice(j + 6);
    }
    return block + html;
  };
  if(CUR.m2 === 'today') m.innerHTML = viewToday();
  else if(CUR.m2 === 'inbox') m.innerHTML = __inj(viewInbox);
  else if(CUR.m2 === 'admgr') m.innerHTML = __inj(viewAd);
  else if(CUR.m2 === 'photo') m.innerHTML = __fm(viewPhoto());
  else if(CUR.m2 === 'vac') m.innerHTML = viewVac();      /* 🏢 공실 승인함 2026-09-13 */
  else if(CUR.m2 === 'settle') m.innerHTML = __fm(viewSettle());
  else if(CUR.m2 === 'base') m.innerHTML = viewAdmin();
  else if(CUR.m2 === 'auto') m.innerHTML = viewAuto();
  else if(CUR.m2 === 'stat') m.innerHTML = __fm(viewData());
  else if(CUR.m2 === 'collect') m.innerHTML = __inj(viewCollect);   /* 🆕 3단계 수집매물 */   /* 🆕 3단계 수집매물 */
  else if(CUR.m2 === 'bldg') m.innerHTML = __inj(viewBldg);   /* 🏢 건물·대장 2026-09-13 */
  else if(CUR.m2 === 'person') m.innerHTML = viewPerson();  /* 👤 사람 2026-09-14 */
  else if(CUR.m2 === 'rel') m.innerHTML = viewRel();        /* 🆕 4-9 관계설정 */
  else if(CUR.m2 === 'upload') m.innerHTML = viewUpload();  /* 🆕 4-6 웹자료올리기 */
  else if(CUR.m2 === 'bulk') m.innerHTML = viewBulk();      /* 🆕 4-5 그리드 일괄입력 */
  else if(CUR.m2 === 'apv') m.innerHTML = __inj(viewApv);      /* 🆕 2-1 결재함 */
  else if(CUR.m2 === 'gw') m.innerHTML = __fm(viewGroup());
  else if(CUR.m2 === 'academy') m.innerHTML = viewAcademy();
  else if(CUR.m2 === 'mkt') m.innerHTML = viewMkt();
  else if(CUR.m2 === 'staff') m.innerHTML = viewStaff();
  else if(CUR.m2 === 'cust') m.innerHTML = __inj(viewCust);
  else if(CUR.m2 === 'contract'){
    if(DB.contracts === null){
      m.innerHTML = crumb() + '<div class="h1row"><h1>계약</h1></div>' +
        '<div class="card"><div class="empty">계약 자료를 불러오는 중…</div></div>';
      loadContracts();
    } else m.innerHTML = viewContract();
  }
  else {
    var g = MENU.filter(function(x){ return x[0]===CUR.m1; })[0];
    var s = g[2].filter(function(x){ return x[0]===CUR.m2; })[0];
    m.innerHTML = crumb() + '<div class="h1row"><h1>' + esc(s[1]) + '</h1></div>' +
      '<div class="card"><div class="soonbox"><b>준비 중입니다</b>' +
      '<div>이 메뉴는 아직 붙이지 않았습니다. 지금은 <b>영업CRM › 통합 인입함</b>이 실제로 동작합니다.</div>' +
      '<div style="margin-top:12px"><button class="btn pri" onclick="go(\'crm\',\'inbox\')">통합 인입함으로</button>' +
      ' <button class="btn" onclick="location.href=\'./saas.html\'">기존 SaaS 화면</button></div>' +
      '</div></div>';
  }
  /* 🆕 4-4 — 입력 팝업이 열려 있으면 위에 띄운다 */
  try{
    var pv = document.getElementById('popwrap');
    if(!pv){ pv = document.createElement('div'); pv.id = 'popwrap'; document.body.appendChild(pv); }
    pv.innerHTML = POP_STATE ? popHtml() : '';
  }catch(e){}
  bindBar();
  drawSide();
  fmAfterRoute();          /* 🆕 4-13 — 그린 뒤에 정렬·소계·그래프를 얹는다 */
}
/* 🆕 4-13 — 화면을 그린 뒤 표를 정렬·소계·그래프로 바꿔 그린다 */
function fmAfterRoute(){
  try{ if(fmIsStat()) fmPaint(scrKey()); }catch(e){}
}
function bindBar(){
  var fq = document.getElementById('fq');
  if(fq) fq.oninput = function(){ UI.qq = fq.value; var p = fq.selectionStart; route();
    var n = document.getElementById('fq'); if(n){ n.focus(); try{ n.setSelectionRange(p,p); }catch(e){} } };
  var fs = document.getElementById('fsrc');
  if(fs) fs.onchange = function(){ UI.src = fs.value; route(); };
  var ft = document.getElementById('fst');
  if(ft) ft.onchange = function(){ UI.st = ft.value; route(); };
}
async function reload(){ await loadAll(true); route(); }
/* 고객은 쓰는 화면에서만 부른다 — 첫 화면을 무겁게 하지 않는다 */
var CU_LOADING = false;
async function loadCustomers(){
  if(DB.customers !== null || CU_LOADING) return;
  CU_LOADING = true;
  try{
    /* 🔴 GAS 는 첫 호출에서 자주 한 번 실패한다 — 매물과 같은 재시도를 쓴다 */
    var d = await jgetTry({ action:'getAll', type:'customers' });
    DB.customers = d.data || d.result || [];
    DB.cuErr = '';                       /* 이번엔 잘 읽혔으니 지난 실패 표시를 지운다 */
  }catch(e){ DB.customers = []; DB.cuErr = String((e && e.message) || e); }
  CU_LOADING = false;
  route();
}
/* 계약 자료는 계약 화면에 들어갈 때만 부른다 — 첫 화면을 무겁게 하지 않는다.
   🔴 여기서 실패해도 DB.err 를 세우지 않는다(다른 화면이 멀쩡해야 한다). */
var CT_LOADING = false;
async function loadContracts(){
  if(DB.contracts !== null || CT_LOADING) return;
  CT_LOADING = true;
  try{
    /* 🔴 실측 2026-09-12: 재시도가 없어 첫 호출 실패로 '계약 0건' 처럼 보였다 */
    var d = await jgetTry({ action:'getAll', type:'contracts' });
    DB.contracts = d.data || d.result || [];
    DB.ctErr = '';
  }catch(e){
    DB.contracts = [];
    DB.ctErr = String((e && e.message) || e);
  }
  CT_LOADING = false;
  route();
}

/* 통합검색 */
document.getElementById('q').addEventListener('keydown', function(e){
  if(e.key === 'Enter'){ SEARCH = this.value.trim(); route(); }
  if(e.key === 'Escape'){ this.value = ''; SEARCH = ''; route(); }
});
document.getElementById('q').addEventListener('input', function(){
  if(!this.value.trim() && SEARCH){ SEARCH = ''; route(); }
});
document.getElementById('btnHelp').onclick = function(){ UI.help = !UI.help; route(); };
/* 🆕 4-4 — 팝업이 열려 있으면 F8 저장 · Esc 닫기 */
document.addEventListener('keydown', function(ev){
  if(!POP_STATE) return;
  if(ev.key === 'F8'){ ev.preventDefault(); popSave(); }
  if(ev.key === 'Escape' && !POP_STATE.pin){ ev.preventDefault(); popClose(); }
});
/* 🆕 4-10·4-11 — ★ 즐겨찾기와 AI·타임라인은 오른쪽 아이콘 바로 잇는다 */
document.getElementById('btnFav').onclick = function(){ RB_OPEN = 'book'; rbDraw(); };
document.getElementById('btnAi').onclick = function(){ RB_OPEN = 'ai'; rbDraw(); };
document.getElementById('btnRecent').onclick = function(){ RB_OPEN = 'time'; rbDraw(); };
['btnBell','btnOut'].forEach(function(id){
  document.getElementById(id).onclick = function(){ alert('이 기능은 다음 단계에서 붙입니다.'); };
});

/* 홈에서는 버전 줄을 숨긴다(첫 화면에는 행동만). 관리·설정 화면에서는 보인다. */
function verlineShow(){
  try{
    var old = document.getElementById('verline');
    if(old && old.parentNode) old.parentNode.removeChild(old);
    if(!window.__VER) return;
    if(CUR && CUR.m2 === 'today') return;      /* 🔴 홈에는 붙이지 않는다 */
    var m = document.getElementById('main');
    if(!m) return;
    var el = document.createElement('div');
    el.className = 'foot'; el.id = 'verline';
    el.style.cssText = 'padding:10px 16px 24px;text-align:center';
    el.textContent = window.__VER;
    m.appendChild(el);
  }catch(e){}
}
/* ── 버전 표시 — 실제 배포와 화면이 어긋나지 않게 원격 커밋을 읽는다 ── */
async function stamp(){
  var txt = 'ERP ' + ERP_VER + ' · 빌드 ' + ERP_BUILD;
  window.__VER = txt;                    /* 커밋을 못 읽어도 버전은 보이게 */
  verlineShow();
  try{
    var r = await fetch('https://api.github.com/repos/' + REPO + '/commits/main');
    var j = await r.json();
    if(j && j.sha){
      var d = ((j.commit||{}).committer||{}).date || '';
      txt += ' · commit ' + String(j.sha).slice(0,7) + (d ? ' · 배포 ' + d.replace('T',' ').replace('Z',' UTC') : '');
    }
  }catch(e){ txt += ' · commit (조회 실패 — 네트워크)'; }
  window.__VER = txt;
  var n = document.getElementById('verline');
  if(n) n.textContent = txt;
  /* 🔴 2026-09-13: 홈(오늘 화면)에서는 버전·커밋 줄을 보이지 않게 한다.
     대표님 첫 화면에는 **오늘 할 행동**만 남긴다 — 버전은 ⚙️ 관리 화면에서 본다. */
  verlineShow();
}
var _route = route;
route = function(){ _route(); verlineShow(); };

(async function(){
  drawNav();
  route();
  /* 🔴 2026-09-13 — 버전 도장을 **자료보다 먼저** 찍는다.
     공실현황·문자수신함을 더 읽게 되면서 loadAll 이 길어졌고, 그 뒤에 stamp() 를 부르면
     관리 화면에 버전 줄이 한참 안 나왔다(검산 D4 가 실제로 실패했다).
     버전은 자료와 상관없는 값이므로 기다릴 이유가 없다. */
  stamp();
  await loadPhotoIndex();
  await loadAll(false);
  route();
})();
</script>
