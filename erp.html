<!DOCTYPE html>
<html lang="ko" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>브리즈 ERP</title>
<style>
/* 🔍 통합검색 — 건물·호실·사람 2026-09-14 */
.ms-g{margin:8px 0}
.ms-t{font-size:12px;font-weight:700;color:var(--t2);margin-bottom:5px}
.ms-i{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;
  border-radius:8px;padding:7px 10px;margin-bottom:4px;font-size:13px;cursor:pointer;color:inherit}
.ms-i:hover{background:var(--bg3)}
#per-panel .tabs{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 10px;
  border-bottom:1px solid var(--line);padding-bottom:7px}
#per-panel .tb{border:1px solid var(--line);background:#fff;border-radius:8px;
  font-size:12.5px;font-weight:600;color:var(--t2);padding:5px 11px;cursor:pointer}
#per-panel .tb.on{background:var(--pri,#1B4F8A);border-color:var(--pri,#1B4F8A);color:#fff}
/* 🚪 호실 입력화면 2026-09-14 */
.uf{border:1px solid var(--pri,#1B4F8A);border-radius:10px;padding:12px 14px;margin:12px 0 0}
.uf-h{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.uf-h b{font-size:16px}
.uf-sub{flex:1;font-size:12.5px;color:var(--t3)}
.uf-inh{border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin:4px 0 10px;background:var(--bg3)}
.uf-inht{font-size:12px;color:var(--t2);margin-bottom:7px}
.uf-r{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:5px 0;border-top:1px dashed var(--line)}
.uf-r:first-of-type{border-top:0}
.uf-rl{min-width:52px;font-size:12.5px;font-weight:600}
.uf-seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.uf-b{border:0;background:#fff;font-size:11.5px;padding:4px 9px;cursor:pointer;color:var(--t2)}
.uf-b.on{background:var(--pri,#1B4F8A);color:#fff;font-weight:700}
.uf-base{font-size:12px;color:var(--t3)}
.uf-tag{background:var(--bg3);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:10.5px}
.uf-i{max-width:200px}
.uf-deal{border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin:0 0 10px}
.uf-dl{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px}
.uf-dl2{margin-top:7px;font-size:12.5px;color:var(--t2)}
/* 🔴 확인필요 2026-09-14 */
.bld-todo{border:1px solid var(--warn,#E4A11B);background:#FFF8E7;border-radius:10px;
  padding:10px 12px;margin:2px 0 12px;font-size:13px}
.bld-todo .bt-l{margin-top:6px;font-size:12.5px;line-height:1.6}
.bld-todo .bt-memo{margin:7px 0 0;padding:8px 10px;background:#fff;border:1px solid var(--line);
  border-radius:8px;font-size:12px;white-space:pre-wrap;max-height:120px;overflow:auto}
.bld-todo .bt-a{margin-top:8px}
.bf-need .bf-i{border-color:var(--warn,#E4A11B);background:#FFFDF5}
.bf-needb{font-weight:700;color:#A9741A;font-size:11px}
/* 🏢 건물정보 입력화면 2026-09-14 */
.bf-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:9px 12px;margin:4px 0 12px}
.bf-f{display:flex;flex-direction:column;gap:3px;min-width:0}
.bf-wide{grid-column:1/-1}
.bf-l{font-size:12px;font-weight:600;color:var(--t2)}
.bf-i{border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:13px;
  font-family:inherit;background:#fff;color:inherit;width:100%;box-sizing:border-box}
.bf-i:focus{outline:none;border-color:var(--pri,#1B4F8A)}
.bf-sec{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:2px 0 12px;background:var(--bg3)}
.bf-sech{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px}
.bf-secn{font-weight:400;font-size:12px;color:var(--t3);flex:1}
.bf-hid{font-size:12.5px;color:var(--t3);margin-top:7px;letter-spacing:1px}
.bf-act{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px}
.bf-note{font-size:12px;color:var(--t3)}
/* 🏢 건물·대장 2026-09-14 — 목록 행 선택 · 탭 (읽기 전용 화면) */
.bld-row:hover{background:var(--bg3)}
.bld-row.on{background:var(--navy-l,#EAF0FA);box-shadow:inset 3px 0 0 var(--pri,#1B4F8A)}
#bld-panel{margin-top:12px}
#bld-panel .tabs{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 10px;
  border-bottom:1px solid var(--line);padding-bottom:7px}
#bld-panel .tb{border:1px solid var(--line);background:#fff;border-radius:8px;
  font-size:12.5px;font-weight:600;color:var(--t2);padding:5px 11px;cursor:pointer}
#bld-panel .tb.on{background:var(--pri,#1B4F8A);border-color:var(--pri,#1B4F8A);color:#fff}
/* ── 색 토큰: 흰색 기본 · 다크 · 시스템 ───────────────────────────── */
:root{
  --bg:#F7F8FA; --panel:#FFFFFF; --panel2:#FBFCFD; --line:#E3E7ED; --line2:#EEF1F5;
  --t1:#14181F; --t2:#4A5567; --t3:#8A94A6;
  --brand:#1D4ED8; --brand-bg:#EEF3FF;
  --ok:#0F7B4F; --ok-bg:#E7F6EE;
  --warn:#B45309; --warn-bg:#FDF3E3;
  --bad:#B91C1C; --bad-bg:#FDECEC;
  --mute:#6B7280; --mute-bg:#F1F3F6;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1319; --panel:#161B23; --panel2:#1B212B; --line:#2A323E; --line2:#222933;
    --t1:#E8ECF2; --t2:#AEB8C7; --t3:#7C889A;
    --brand:#7EA6FF; --brand-bg:#1B2740;
    --ok:#5FD39B; --ok-bg:#14301F;
    --warn:#E9B168; --warn-bg:#33250F;
    --bad:#F28B8B; --bad-bg:#3A1A1A;
    --mute:#9AA5B5; --mute-bg:#222A35;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1319; --panel:#161B23; --panel2:#1B212B; --line:#2A323E; --line2:#222933;
  --t1:#E8ECF2; --t2:#AEB8C7; --t3:#7C889A;
  --brand:#7EA6FF; --brand-bg:#1B2740;
  --ok:#5FD39B; --ok-bg:#14301F;
  --warn:#E9B168; --warn-bg:#33250F;
  --bad:#F28B8B; --bad-bg:#3A1A1A;
  --mute:#9AA5B5; --mute-bg:#222A35;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{
  background:var(--bg); color:var(--t1);
  font:15px/1.55 "Pretendard","Malgun Gothic","맑은 고딕",-apple-system,system-ui,sans-serif;
  -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
.mono{font-variant-numeric:tabular-nums}

/* ── 상단 ──────────────────────────────────────────────────────── */
header{position:sticky;top:0;z-index:40;background:var(--panel);border-bottom:1px solid var(--line)}
.top1{display:flex;align-items:center;gap:12px;padding:9px 16px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:-.3px;white-space:nowrap}
.logo i{display:grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--brand);color:#fff;font-style:normal;font-size:14px;font-weight:800}
.gsearch{flex:1;min-width:120px;position:relative}
.gsearch input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--line);border-radius:9px;background:var(--panel2)}
.gsearch svg{position:absolute;left:11px;top:9px;opacity:.5}
.tools{display:flex;align-items:center;gap:4px;flex-shrink:0}
.tbtn{display:grid;place-items:center;min-width:34px;height:34px;padding:0 9px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--t2);cursor:pointer;font-size:13px;white-space:nowrap}
.tbtn:hover{background:var(--mute-bg);color:var(--t1)}
.tbtn.on{background:var(--brand-bg);color:var(--brand);border-color:var(--brand-bg)}
.who{display:flex;align-items:center;gap:7px;padding:4px 9px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font-size:13px}
.who b{font-size:13px}

/* 대분류 */
.top2{display:flex;gap:2px;padding:0 12px;overflow-x:auto;scrollbar-width:none}
.top2::-webkit-scrollbar{display:none}
.m1{padding:9px 14px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--t2);cursor:pointer;white-space:nowrap;font-weight:600;font-size:14.5px}
.m1:hover{color:var(--t1)}
.m1.on{color:var(--brand);border-bottom-color:var(--brand)}
/* 2차 */
.top3{display:flex;gap:4px;padding:7px 14px;background:var(--panel2);border-top:1px solid var(--line2);overflow-x:auto;scrollbar-width:none}
.top3::-webkit-scrollbar{display:none}
.m2{padding:5px 11px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--t2);cursor:pointer;white-space:nowrap;font-size:13.5px}
.m2:hover{border-color:var(--brand);color:var(--brand)}
.m2.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.m2.soon{opacity:.55}

/* ── 뼈대 ──────────────────────────────────────────────────────── */
.wrap{display:grid;grid-template-columns:196px minmax(0,1fr);gap:0;align-items:start}
@media (max-width:900px){ .wrap{grid-template-columns:minmax(0,1fr)} aside{display:none} }
aside{position:sticky;top:104px;padding:14px 10px;border-right:1px solid var(--line);min-height:calc(100vh - 104px)}
.sgrp{margin:0 0 14px}
.sgrp h4{margin:0 0 6px;padding:0 8px;font-size:11.5px;font-weight:700;color:var(--t3);letter-spacing:.4px}
.s1{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;padding:7px 9px;border:0;border-radius:8px;background:transparent;color:var(--t2);cursor:pointer;text-align:left;font-size:13.5px}
.s1:hover{background:var(--mute-bg);color:var(--t1)}
.s1.on{background:var(--brand-bg);color:var(--brand);font-weight:700}
.s1 em{font-style:normal;font-size:11.5px;color:var(--t3);font-variant-numeric:tabular-nums}
main{padding:16px 18px 60px;min-width:0}

/* ── 공통 요소 ─────────────────────────────────────────────────── */
.crumb{font-size:12.5px;color:var(--t3);margin:0 0 6px}
.crumb b{color:var(--t2);font-weight:600}
.h1row{display:flex;align-items:baseline;flex-wrap:wrap;gap:10px;margin:0 0 12px}
h1{margin:0;font-size:21px;letter-spacing:-.4px}
.cnt{font-size:13.5px;color:var(--t2)}
.cnt b{color:var(--t1)}
.cnt .hot{color:var(--warn)}

.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.bar input[type=search],.bar select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.bar input[type=search]{flex:1;min-width:180px}
.btn{padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--t2);cursor:pointer;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.btn.pri:hover{filter:brightness(1.06);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:12.5px}

.monwrap{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 14px;align-items:start}
.monwrap4{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:0 0 14px;align-items:start}
@media(max-width:1000px){.monwrap,.monwrap4{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 14px}
.kpi{padding:12px 13px;border:1px solid var(--line);border-radius:11px;background:var(--panel);box-shadow:var(--shadow);cursor:pointer;text-align:left}
.kpi:hover{border-color:var(--brand)}
.kpi span{display:block;font-size:12.5px;color:var(--t2);margin:0 0 3px}
.kpi b{font-size:24px;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.kpi.w b{color:var(--warn)} .kpi.b b{color:var(--bad)} .kpi.g b{color:var(--ok)}

.card{border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:var(--shadow);overflow:hidden}
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th,td{padding:9px 10px;text-align:left;font-size:13.5px;border-bottom:1px solid var(--line2);vertical-align:top}
th{background:var(--panel2);color:var(--t2);font-weight:600;font-size:12.5px;white-space:nowrap;position:sticky;top:0;z-index:2}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--panel2)}
tbody tr.sel{background:var(--brand-bg)}
td .ell{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)}
.p-warn{background:var(--warn-bg);color:var(--warn)}
.p-bad{background:var(--bad-bg);color:var(--bad)}
.p-mute{background:var(--mute-bg);color:var(--mute)}
.p-brand{background:var(--brand-bg);color:var(--brand)}
.rowacts{display:flex;flex-wrap:wrap;gap:3px}
.rowacts .btn{padding:2px 7px;font-size:11.5px}

/* 상세 패널 */
.split{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.split.open{grid-template-columns:minmax(0,1fr) minmax(320px,430px)}
@media (max-width:1200px){ .split.open{grid-template-columns:minmax(0,1fr)} }
.side{border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:var(--shadow);position:sticky;top:118px;max-height:calc(100vh - 140px);overflow:auto}
.side h3{margin:0;padding:12px 14px;border-bottom:1px solid var(--line);font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:0;background:var(--panel)}
.sbody{padding:12px 14px}
.kv{display:grid;grid-template-columns:86px minmax(0,1fr);gap:5px 10px;font-size:13.5px;margin:0 0 12px}
.kv dt{color:var(--t3)}
.kv dd{margin:0;word-break:break-word}
.sec{margin:0 0 14px;padding:0 0 12px;border-bottom:1px dashed var(--line)}
.sec:last-child{border-bottom:0}
.sec h4{margin:0 0 7px;font-size:12.5px;color:var(--t3);letter-spacing:.3px}
pre.raw{margin:0;padding:10px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;font:12.5px/1.6 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word;max-height:230px;overflow:auto}
.note{padding:9px 11px;border-radius:9px;font-size:13px;margin:0 0 10px}
.note.w{background:var(--warn-bg);color:var(--warn)}
.note.b{background:var(--bad-bg);color:var(--bad)}
.note.g{background:var(--ok-bg);color:var(--ok)}
.note.i{background:var(--brand-bg);color:var(--brand)}
.steps{margin:0;padding:0;list-style:none;font-size:13px}
.steps li{display:flex;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line2)}
.steps li:last-child{border-bottom:0}
.steps i{font-style:normal;flex-shrink:0;width:17px;text-align:center}
.steps span{color:var(--t2)}
.steps b{color:var(--t1)}
.empty{padding:36px 16px;text-align:center;color:var(--t3);font-size:13.5px}
.foot{margin:16px 0 0;font-size:12px;color:var(--t3);text-align:center}
.actbar{position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:6px;padding:9px 12px;background:var(--panel);border-top:1px solid var(--line);margin:0}
.hidden{display:none!important}
.soonbox{padding:34px 18px;text-align:center;color:var(--t2)}
.soonbox b{display:block;font-size:17px;color:var(--t1);margin:0 0 6px}
.chk{width:15px;height:15px;cursor:pointer}
.srchg{margin:0 0 12px}
.srchg h4{margin:0 0 6px;font-size:12.5px;color:var(--t3)}
.srow{padding:7px 10px;border:1px solid var(--line);border-radius:8px;margin:0 0 5px;font-size:13.5px;cursor:pointer;background:var(--panel)}
.srow:hover{border-color:var(--brand)}
</style>
</head>
<body>

<header>
  <div class="top1">
    <div class="logo"><i>B</i><span>브리즈 ERP</span></div>
    <div class="gsearch">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="매물번호 · 건물명 · 주소 · 호실 · 고객명 · 전화번호 · 임대인 통합검색" autocomplete="off">
    </div>
    <div class="tools">
      <button class="tbtn" id="btnAi" title="AI 지원">AI</button>
      <button class="tbtn" id="btnBell" title="알림">🔔</button>
      <button class="tbtn" id="btnRecent" title="최근 업무">최근</button>
      <button class="tbtn" id="btnFav" title="즐겨찾기">★</button>
      <button class="tbtn" id="btnTheme" title="테마 (흰색 → 다크 → 시스템)">◐</button>
      <button class="tbtn" id="btnHelp" title="도움말">?</button>
      <span class="who"><b id="whoName">대표</b><span id="whoRole" style="color:var(--t3)">관리자</span></span>
      <button class="tbtn" id="btnOut" title="로그아웃">↪</button>
    </div>
  </div>
  <nav class="top2" id="nav1"></nav>
  <nav class="top3" id="nav2"></nav>
</header>

<div class="wrap">
  <aside id="side"></aside>
  <main id="main"></main>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   브리즈 ERP 0.1 — 새 화면(별도 파일). index.html · saas.html 은 고치지 않았다.
   데이터는 전부 기존 CRM 시트/GAS 를 그대로 읽는다(action=inboxList · getAll).
   🔴 이 화면은 아직 아무것도 저장하지 않는다(쓰기 0).
   ═══════════════════════════════════════════════════════════════════ */
var ERP_VER = '1.27.0';
var ERP_BUILD = '2026-09-12 18:14';
var REPO = 'eya170823-rgb/crm';

/* ── 저장소 접근(기존 CRM 과 같은 열쇠를 쓴다) ───────────────────── */
function gsUrl(){ try{ return localStorage.getItem('crm_gs_url') || ''; }catch(e){ return ''; } }
function gsTok(){ try{ return localStorage.getItem('crm_gs_token') || ''; }catch(e){ return ''; } }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
function sq(s){ return String(s==null?'':s).replace(/\s+/g,''); }
function nDigit(s){ return String(s==null?'':s).replace(/\D/g,''); }

/* ── 테마 ──────────────────────────────────────────────────────── */
var THEMES = ['light','dark','system'];
function themeGet(){ try{ return localStorage.getItem('erp_theme') || 'system'; }catch(e){ return 'system'; } }
function themeSet(t){
  document.documentElement.setAttribute('data-theme', t);
  try{ localStorage.setItem('erp_theme', t); }catch(e){}
  var b = document.getElementById('btnTheme');
  if(b) b.textContent = t === 'light' ? '☀' : (t === 'dark' ? '☾' : '◐');
  if(b) b.title = '테마: ' + ({light:'흰색',dark:'다크',system:'시스템'})[t] + ' (눌러서 변경)';
}
themeSet(themeGet());
document.getElementById('btnTheme').onclick = function(){
  themeSet(THEMES[(THEMES.indexOf(themeGet()) + 1) % 3]);
};

/* ── 메뉴 (상단 8 대분류 → 2차) ─────────────────────────────────── */

/* 한 번 부를 때 기다리는 최대 시간. GAS 는 3~18초가 보통이라 넉넉히 잡되,
   폰에서 멈춘 요청을 영원히 두지 않을 만큼은 짧게 한다(2026-09-14 실측 기반). */
var GS_TMO = 40000;
async function jget(params, tmo){
  var u = gsUrl(), t = gsTok();
  if(!u || !t) throw new Error('NOKEY');
  var qs = Object.keys(params).map(function(k){
    return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]); }).join('&');
  /* 🔴 2026-09-14 — 여태 fetch 에 **시간 제한이 없었다**.
     PC 에서는 3~18초면 끝나 문제가 안 보였지만, 폰(이동통신)에서는 요청이 그대로
     멈춰 버리는 일이 있다. 멈춘 fetch 는 성공도 실패도 아니라 **영원히 안 끝나고**,
     그래서 아래 jgetTry 의 재시도도 걸리지 않는다 — 화면이 "불러오는 중" 에 갇힌다.
     시간이 지나면 끊어서 **실패로 만들어** 재시도가 돌게 한다. */
  var ac = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  var lim = tmo || GS_TMO;
  var tid = ac ? setTimeout(function(){ try{ ac.abort(); }catch(e){} }, lim) : 0;
  var r;
  try{
    r = await fetch(u + '?' + qs + '&token=' + encodeURIComponent(t) + '&t=' + Date.now(),
                    ac ? { signal: ac.signal } : undefined);
  }catch(eF){
    if(ac && ac.signal.aborted){
      var et = new Error('응답이 ' + Math.round(lim / 1000) + '초 안에 오지 않았습니다');
      et.timeout = true;
      throw et;
    }
    throw eF;
  }finally{ if(tid) clearTimeout(tid); }
  /* 🔴 2026-09-13 §20-3 — 여태 404 를 그냥 r.json() 에 넘겨 'Unexpected token' 으로 뭉갰다.
     그래서 '플랫폼 일시 404' 와 '진짜 오류' 를 구분하지 못했다(실측: 20회 중 7회가 404).
     상태를 오류에 실어 주면 아래 jgetTry 가 404 만 따로 더 버틸 수 있다. */
  if(!r.ok){ var er = new Error('HTTP ' + r.status); er.status = r.status; throw er; }
  /* 🔴 2026-09-14 — index.html gsFetchJson(2647) 의 방어를 그대로 가져온다.
     GAS 는 HTTP 200 을 주면서 JSON 대신 구글 오류 HTML 을 돌려줄 때가 있다
     (index.html 실측 주석: 60여 회 호출 중 6회쯤 "현재 파일을 열 수 없습니다" 페이지).
     r.json() 을 바로 부르면 "Unexpected token '<'" 로 죽어 **재시도할 일인지 판단을 못 한다.**
     먼저 글자로 받아 '{' 로 시작하는지 보고, 아니면 다시 시도할 수 있는 오류로 올린다. */
  var txt = await r.text();
  if(!txt || txt.trim().charAt(0) !== '{'){
    var eh = new Error('서버가 JSON 대신 HTML을 보냈습니다(HTTP ' + r.status + ')');
    eh.status = r.status; eh.html = true;
    throw eh;
  }
  var j;
  try{ j = JSON.parse(txt); }
  catch(ep){
    var e2 = new Error('서버 응답을 읽지 못했습니다(JSON 아님)');
    e2.status = r.status; e2.html = true;
    throw e2;
  }
  if(!j || !j.ok) throw new Error((j && j.error) || '불러오지 못했습니다');
  return j;
}
/* 📊 적재 진행 상태 (2026-09-14) — "불러오는 중" 만 있으면 멈춘 줄 안다.
   몇 번째 자료를 읽는 중인지 · 몇 초 지났는지 · 30초가 넘으면 [다시 시도] 를 보여 준다.
   🔴 무한 대기를 만들지 않는다. */
var LOADP = { on:false, t0:0, idx:0, tot:0, step:'', names:[] };
var LOADP_T = 0;
function loadpStart(names){
  LOADP.on = true; LOADP.t0 = Date.now(); LOADP.idx = 0;
  LOADP.tot = names.length; LOADP.names = names; LOADP.step = names[0] || '';
  if(LOADP_T) clearInterval(LOADP_T);
  LOADP_T = setInterval(loadpPaint, 1000);
}
function loadpStep(name){
  LOADP.idx = Math.min(LOADP.idx + 1, LOADP.tot);
  LOADP.step = name;
  loadpPaint();
}
function loadpEnd(){
  LOADP.on = false;
  if(LOADP_T){ clearInterval(LOADP_T); LOADP_T = 0; }
}
function loadpSec(){ return Math.max(0, Math.round((Date.now() - LOADP.t0) / 1000)); }
/* 화면에 이미 그려 둔 진행 카드의 숫자만 갈아 끼운다(전체를 다시 그리지 않는다) */
function loadpPaint(){
  var a = document.getElementById('lp-sec');
  if(!a) return;
  a.textContent = loadpSec() + '초';
  var b = document.getElementById('lp-step');
  if(b) b.textContent = LOADP.step + ' (' + LOADP.idx + '/' + LOADP.tot + ')';
  var c = document.getElementById('lp-slow');
  if(c) c.style.display = (loadpSec() >= 30) ? '' : 'none';
}
/* 첫 화면이 뜨기 전에 보여 줄 카드 */
function loadpCard(){
  var sec = LOADP.on ? loadpSec() : 0;
  return '<div class="card"><div class="soonbox">' +
    '<b>자료를 읽고 있습니다 — <span id="lp-step">' + esc(LOADP.step) +
      ' (' + LOADP.idx + '/' + LOADP.tot + ')</span></b>' +
    '<div style="margin-top:6px">경과 <b id="lp-sec">' + sec + '초</b>' +
      ' · 구글시트 응답이 늦을 때가 있어 <b>수십 초</b>가 걸리기도 합니다.</div>' +
    '<div id="lp-slow" style="margin-top:12px;display:' + (sec >= 30 ? '' : 'none') + '">' +
      '<div style="color:var(--bad)">🔴 평소보다 느립니다.</div>' +
      '<div style="margin-top:8px">' +
        '<button class="btn pri" onclick="retryAll()">다시 시도</button> ' +
        '<button class="btn" onclick="loadpGiveUp()">기다리지 않고 열기</button></div>' +
      '<div style="margin-top:6px;font-size:12px;color:var(--t3)">' +
        '\'기다리지 않고 열기\' 를 누르면 읽은 것까지만 보여 줍니다 — ' +
        '🔴 <b>숫자가 0 이면 없다는 뜻이 아니라 아직 못 읽은 것</b>입니다.</div>' +
    '</div></div></div>';
}
/* 🔴 0건 위장 금지 — 못 읽은 것은 못 읽었다고 화면이 말한다(homeLoadBox 가 적는다) */
function loadpGiveUp(){ LOADP.give = true; try{ route(); }catch(e){} }
async function loadAll(force){
  if(DB.loading) return;
  if(DB.listings && !force) return;
  DB.loading = true; DB.ready = false; DB.err = ''; DB.ldErr = ''; DB.inErr = ''; LOADP.give = false;
  loadpStart(['매물', '임대인', '인입함', '공실현황', '문자수신함']);
  /* 🔴 2026-09-14 — 여기서 한 번 그려 주지 않으면 진행 카드가 **아예 안 뜬다**.
     route() 는 자료가 하나 들어온 뒤에야 불리기 때문이다(LIVE 실측으로 확인). */
  try{ route(); }catch(e0){}
  DB.inboxState = 'LOADING'; DB.inboxBad = [];
  /* 🔴 자료원마다 따로 읽는다.
     예전에는 하나의 try 로 묶여 있어, 임대인(4,075건)에서 GAS 가 한 번 실패하면
     **인입함까지 통째로 못 읽었다**(2026-09-12 실측). 월요일 아침에 그러면
     화면에 "못 읽었습니다" 밖에 안 남는다. 이제 실패한 자료원만 실패로 적는다. */
  await loadOne('listings', async function(){
    var b = await jgetTry({ action:'getAll', type:'listings' });
    /* 🔴 시트에는 ads 칸이 없다 — adsFlat 한 칸에 눌러 담겨 있다.
       풀어 주지 않으면 이미 올라가 있는 광고가 전부 '미게시'로 보인다. */
    DB.listings = (b.data || b.result || []).map(adsRestore);
  });
  try{ route(); }catch(e0){}            /* 매물만으로도 화면이 쓸모 있다 */
  await loadOne('landlords', async function(){
    var c = await jgetTry({ action:'getAll', type:'landlords' });
    DB.landlords = c.data || c.result || [];
  });
  try{ route(); }catch(e1){}
  /* 200건이면 2주치뿐이라 '계약완료 문자' 대조를 못 한다 — 500건까지 본다 */
  await loadOne('inbox', async function(){
    /* 🔴 쪽넘김으로 **전부** 읽는다. 최신 500줄만 읽으면 그 밖의 문자를
       "없는 것" 으로 보게 되고, 계약완료 판정·중복검사가 틀린다.
       한 쪽 500줄 · 최대 12쪽(6,000줄). 거기서 끊기면 끊겼다고 적는다. */
    var inRaw = [], off = 0, pages = 0, more = true, cut = false, tot = 0;
    var badPages = [];
    while(more){
      /* 🔴 2026-09-13 §20-3 — 쪽 단위로 지킨다.
         종전에는 3쪽 중 마지막 한 쪽이 404 면 통째로 throw 되어
         **이미 받아 둔 앞 쪽까지 버리고** 인입함이 빈 채로 남았다.
         이제 실패한 쪽 번호만 적어 두고, 받은 것은 그대로 쓴다(PARTIAL). */
      var a = null;
      try{
        a = await jgetTry({ action:'inboxList', limit:500, offset:off }, 0, true);
      }catch(ePage){
        badPages.push(pages + 1);
        if(inRaw.length > 0) break;   /* 부분이라도 있으면 지킨다 */
        throw ePage;                  /* 한 쪽도 못 읽었으면 기존대로 실패로 알린다 */
      }
      var R = a.result || {};
      var got = R.rows || [];
      inRaw = inRaw.concat(got);
      tot = R.total || tot;
      pages++;
      more = !!R.more && got.length > 0;
      off += got.length;
      if(more && pages >= 12){ cut = true; break; }
      /* 🔴 GAS 는 연달아 부르면 자주 한 번 실패한다(이 프로젝트의 오래된 문제).
         쪽마다 잠깐 쉬어 준다 — 쉬지 않으면 뒤따르는 다른 자료까지 못 읽는다. */
      if(more) await new Promise(function(r){ setTimeout(r, 600); });
    }
    DB.inbox = inDedup(inRaw);            /* 🔴 같은 문자 여러 줄을 화면에서만 묶는다 */
    DB.inboxRaw = inRaw.length;
    DB.inboxDup = inRaw.length - DB.inbox.length;
    DB.inboxPages = pages;
    DB.inboxCut = cut;                    /* 끊겼으면 화면에 그대로 적는다 */
    DB.inboxTotal = tot || inRaw.length;
    /* 🔴 §20-3 — 다 읽었는지 일부만 읽었는지 구분해 둔다(0건과 헷갈리지 않게) */
    DB.inboxBad = badPages;
    DB.inboxState = badPages.length ? 'PARTIAL' : 'READY';
  });
  /* 🔴 2026-09-13 — 인입함을 읽은 **바로 뒤에** 화면을 다시 그린다.
     종전에는 여기에 route() 가 없어서, 공실현황·문자수신함을 다 읽을 때까지
     홈이 "불러오는 중…" 에 머물렀다(LIVE 실측 53초).
     홈 화면 판단은 DB.inbox 가 들어오면 끝나므로 여기서 그려 주면 된다. */
  try{ route(); }catch(e2){}
  /* 공실현황 (2026-09-13) — 인입함에만 없는 사건이 여기 있다.
     실측: 호실 묶음 48건이 이 탭·MMS 백업에만 있었고 그중 7건이 신규 공실 후보였다. */
  await loadOne('vac', async function(){
    var v = await jgetTry({ action:'vacList', limit:99999 });
    var R = v.result || v.data || {};
    DB.vac = R.rows || [];
    DB.vacTotal = R.total || DB.vac.length;
  });
  try{ route(); }catch(e3){}          /* 공실현황까지 반영해 한 번 더 그린다 */
  /* 🏢 2026-09-14 건물마스터 — 없거나 못 읽어도 다른 화면은 그대로 돈다 */

function srcMerge(){

     종전에는 DB.inbox 가 null(못 읽음)이어도 base=[] 로 시작해
     DB.inbox = [] 가 되었다. 그러면 화면이 '인입 0건' 처럼 보인다 —
     못 읽은 것과 진짜 0건은 다르다(단위검증 E4 가 이것을 잡았다). */

  if(!DB.vac && !DB.smsq){ DB.srcAdded = 0; return; }
  var seen = {};
  base.forEach(function(r){
    var k = srcFp(r.phone, r.text);
    if(k) seen[k] = r;
    r.origins = ['인입함'];
  });

    if(seen[k]){                                    /* 같은 사건 — 출처만 적어 둔다 */
      var o = seen[k];
      if((o.origins || []).indexOf(r.origin) < 0) (o.origins = o.origins || []).push(r.origin);
      dupHit++;

    seen[k] = r;
    r.origins = [r.origin];
    add.push(r);

    push({ row:'VAC:' + x.row, status:String(x.status || ''), when:String(x.when || ''),
           kind:'공실현황', name:'', phone:x.phone, bld:String(x.apt || ''),
           text:String(x.text || ''), reg:String(x.status || ''), origin:'공실현황' });
  });

    push({ row:'SMSQ:' + x.row, status:'', when:String(x.when || ''),
           kind:String(x.kind || 'sms'), name:String(x.name || ''), phone:x.phone, bld:'',

   대표 화면을 막는 구조인지 판단하려면 추측이 아니라 이 수치가 필요하다(3단계 ⑬). */
var GAS_STAT = { calls:[], n:0, fail:0, try4:0, try5:0, msSum:0, msMax:0 };
function gasStat(q, tries, ms, ok, err){
  try{
    var what = String((q && (q.type || q.action)) || '');
    GAS_STAT.n++;
    if(!ok) GAS_STAT.fail++;
    if(tries >= 4) GAS_STAT.try4++;
    if(tries >= 5) GAS_STAT.try5++;
    GAS_STAT.msSum += ms;
    if(ms > GAS_STAT.msMax) GAS_STAT.msMax = ms;
    if(GAS_STAT.calls.length < 60)
      GAS_STAT.calls.push({ what:what, tries:tries, ms:ms, ok:!!ok, err:err || '' });
  }catch(e){}
}
async function jgetTry(q, n, slow){
  var last;

     한참 쉬었다 처음 부르면 GAS 가 큰 응답(임대인 4,075건)에서 한 번 죽는다.
     새 브라우저 프로필 3회 연속 시험: 1회 임대인 실패(120초) · 2·3회 전부 통과(24초).
     🔴 그 뒤 검산을 여러 번 돌리며 실측한 실패: 매물 1회 · 인입함 1회 · 홈 1회.
        세 번으로도 놓쳤다 — 기다리는 시간은 1.5초 → 4초 → 8초 → 15초 → 25초.
     대표님 화면에서도 같은 값이 쓰인다(쉬었다 처음 여는 때가 가장 잘 죽는다). */

     실측(단독 순차 20회): 404 가 **5회 연달아** 나고 3.2분 뒤 저절로 회복했다.
     종전 다섯 번(누적 53.5초)으로는 그 구간을 못 넘겨 인입함이 통째로 비었다.
     404 일 때만 일곱 번(누적 208.5초)까지 버틴다 — 다른 오류는 그대로 다섯 번. */
  var WAIT404 = [1500, 4000, 8000, 15000, 30000, 60000, 90000];
  /* 여러 자료가 동시에 404 를 만나 한꺼번에 재시도하지 않도록 ±15% 로 흩는다 */
  function jit(ms){ return Math.round(ms * (0.85 + Math.random() * 0.3)); }

      gasStat(q, i + 1, Date.now() - t0, true, '');
      return res;
    }
    catch(e){
      last = e;
      if(String(e && e.message || '') === 'NOKEY'){ gasStat(q, i + 1, Date.now() - t0, false, 'NOKEY'); throw e; }
      var st = e && e.status;
      /* 🔴 권한 오류는 기다린다고 낫지 않는다 — 곧바로 알린다(토큰·배포 문제) */
      if(st === 401 || st === 403){ gasStat(q, i + 1, Date.now() - t0, false, 'HTTP ' + st); throw e; }
      /* 🔴 §20-3C — HTML 오류 페이지(200 이어도)도 404 와 같은 일시 오류로 본다 */
      var is404 = (st === 404) || (e && e.html === true);
      /* 🔴 2026-09-14 — 시간초과도 '기다리면 낫는' 오류로 본다(폰에서 흔하다) */
      var isTmo = !!(e && e.timeout);
      /* 🔴 404 는 더 버틴다. 단 **오래 기다려도 되는 자료**(slow=true)만 —
         매물처럼 첫 화면을 좌우하는 자료는 대표님을 3분 기다리게 하지 않는다. */

  throw last;
}

function secretNums(t){

    /* 🔴 '보증금200관리비포함63' — 뒤에 쉼표 숫자가 붙은 것(200,000원)은 아니다 */
    var d1 = s.match(/보증금\s*(\d{2,5})(?!\d*,)/); if(d1){ o.deposit = d1[1]; o.confidence.push('보증금'); } }
  /* 🔴 '보200' · '보 200' — 임대인 속기 (2026-09-13 실측 다수) */
  if(!o.deposit){
    var d2 = s.match(/(?:^|[^가-힣0-9])보\s*(\d{2,5})(?!\d)/);
    if(d2){ o.deposit = d2[1]; o.confidence.push('보증금(보OOO)'); } }
  /* ── 월세 ──────────────────────────────────────────────────────
     🔴 순서가 중요하다. '임대료710,000원' 을 먼저 원(圓) 표기로 읽지 않으면
        '710' 을 월세로 읽어 버린다(2026-09-13 실측 오류). */
  if(!o.rent){
    var rw = s.match(/(\d{2,3}),?(\d{3})\s*원/);
    if(rw){ var vw = parseInt(rw[1] + rw[2], 10);
            if(vw >= 10000){ o.rent = String(Math.round(vw / 10000)); o.confidence.push('월세(원 표기)'); } } }
  if(!o.rent){ var r1 = s.match(/(?:월세|임대료)\s*(\d{2,3})(?!\d|\s*,)/); if(r1){ o.rent = r1[1]; o.confidence.push('월세'); } }
  /* 🔴 '관리비포함63' · '월 관리비포함 57' — 관리비 포함 월액 (실측 다수) */
  if(!o.rent){
    var r2 = s.match(/관리비\s*포함\s*(\d{2,3})(?!\d)/);
    if(r2){ o.rent = r2[1]; o.confidence.push('월세(관리비포함)'); } }
  if(!o.rent){
    var r3 = s.match(/월\s*(?:관리비\s*포함\s*)?(\d{2,3})(?!\d)(?!\s*[일월년])/);
    if(r3){ o.rent = r3[1]; o.confidence.push('월세(월OO)'); } }
  /* 🔴 '46만' · '제니 805호 46만 입주가능' — 숫자+만 은 월세로 본다.
     보증금으로 이미 읽은 숫자는 다시 쓰지 않는다('보300만.임55만' 에서 300). */
  if(!o.rent){
    var re9 = /(?:^|[^0-9,])(\d{2,3})\s*만(?!\s*원?\s*대)/g, m9;
    while((m9 = re9.exec(s))){
      if(m9[1] !== o.deposit){ o.rent = m9[1]; o.confidence.push('월세(OO만)'); break; }
    }
  }
  if(!o.deposit) o.missing.push('보증금');
  if(!o.rent) o.missing.push('월세');
  /* 관리비 포함 여부 · 금액 */
  if(/관리비\s*포함/.test(s)){ o.feeIncluded = true; o.confidence.push('관리비 포함'); }
  /* 🔴 '관8만' · '관리비 8만' — 금액이 적혀 있으면 받는다(2026-09-13) */
  var fm = s.match(/관(?:리비)?\s*(\d{1,3})\s*만/);
  if(fm){ o.fee = fm[1]; o.confidence.push('관리비 금액'); }
  if(!o.feeIncluded && !o.fee){
    if(/관리비/.test(s)) o.missing.push('관리비(금액 불명)');
    else o.missing.push('관리비');
  }
  /* 매물유형 */
  if(/분리형\s*원(룸|인)/.test(s)){ o.kind = '분리형 원룸'; o.confidence.push('매물유형'); }
  else if(/오픈형\s*원룸/.test(s)){ o.kind = '오픈형 원룸'; o.confidence.push('매물유형'); }
  else if(/투룸|1\.5룸/.test(s)){ o.kind = /1\.5/.test(s) ? '1.5룸' : '투룸'; o.confidence.push('매물유형'); }
  else o.missing.push('매물유형');
  /* 퇴실 청소비 */
  var c1 = s.match(/청소비[^0-9]{0,25}?(\d{1,3})\s*만/);
  if(c1){ o.clean = c1[1]; o.confidence.push('퇴실 청소비'); }
  /* 거래유형 */
  if(o.rent) { o.trade = '월세'; o.confidence.push('거래유형'); }
  else if(/전세/.test(s)) o.trade = '전세';
  else if(/매매/.test(s)) o.trade = '매매';
  else o.missing.push('거래유형');
  /* 입주 가능일 — 날짜 꼴이나 "즉시/다음주" 같은 말이 있으면 적는다(없으면 비운다) */
  var mv = s.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일[^0-9]{0,6}(입주|입실)/);
  if(mv) o.moveIn = mv[1] + '월 ' + mv[2] + '일';
  else if(/즉시\s*(입주|입실)|바로\s*(입주|입실|입실됩)/.test(s)) o.moveIn = '즉시';
  else if(/다음\s*주[^0-9]{0,8}(입주|입실)/.test(s)) o.moveIn = '다음 주';
  if(o.moveIn) o.confidence.push('입주 가능일');
  /* 입주가능일·방수·욕실·옵션·주차·반려·전입 — 통화에 없으면 비운다 */
  ['입주가능일','방수','욕실수','옵션','주차','반려동물','전입','외국인'].forEach(function(k){ o.missing.push(k); });
  return o;
}

/* ═══ 건물 대조 — 이름만으로 판단하지 않는다(주소·지번 함께) ═════ */
function bldgTokens(s){
  var t = String(s||'');
  var out = { name:'', jibun:'', dong:'' };
  var j = t.match(/(\d{1,5}-\d{1,4})/); if(j) out.jibun = j[1];
  var d = t.match(/([가-힣]{2,6}(동|리))/); if(d) out.dong = d[1];
  var n = t.replace(/[^가-힣A-Za-z0-9]/g,'');
  out.name = n;
  return out;
}
/* 🔴 2026-09-13 — 인입함 '특정물건'(Q열) 칸을 믿어도 되는 값인가.
   실측 오연결: 한 줄의 Q 칸이 "오피스텔정보 1709행 / 오피스텔정보 1758행 / 노형뜨란채" 였다.
   서버가 후보를 여러 개 적어 둔 진단용 값인데, 그걸 건물 근거로 쓰면
   "제니 512호 45만" 문자가 **노형뜨란채 512호** 로 붙는다(실제로 붙었다).
   → '/' 로 나뉘어 있거나 '행' 이 들어 있으면 쓰지 않는다. */
function bldColOk(v){
  var t = String(v == null ? '' : v);
  if(!t.trim()) return false;
  if(t.indexOf('/') >= 0) return false;
  if(t.indexOf('행') >= 0) return false;
  return true;
}
/* ═══ 🆕 2026-09-14 새 경로 3벌 — 기존 함수를 **지우지 않고 옆에** 둔다 ═══
   왜 옆에 두는가: 기존 matchBuilding/matchProperty 는 지금 실제로 돌고 있다.
   새 경로가 못 찾으면 **곧바로 기존 경로로 떨어지게** 해서, 되던 것이 깨지지 않게 한다.
   🔴 마스터를 아직 안 읽었으면(null) 새 경로는 아무것도 하지 않는다 — 기존 경로 그대로. */

/* GAS vacHoKey_ 와 같은 규칙 — "101-204"(101동 204호) → "101204", "305호" → "305" */
function uHoKey(v){
  var t = String(v == null ? '' : v).trim();
  var dh = t.match(/^(\d+)\s*-\s*(\d+)$/);
  if(dh) return dh[1] + dh[2];
  return t.replace(/[^0-9]/g, '');
}
/* unitId = 건물id + '-' + 호실키 (시트 호실마스터의 id 와 같은 규칙) */
function unitIdOf(bldgId, unit){
  var k = uHoKey(unit);
  if(!bldgId || !k) return '';
  return String(bldgId) + '-' + k;
}

/* ── ② 건물마스터에서 건물 찾기 ────────────────────────────────
   기존 matchBuilding 은 매물장 apt(건물명)·임대인 명부로 찾는다.
   그래서 **매물이 없는 건물**은 못 찾고, 건물명이 '202' 처럼 깨져 있으면 엉뚱한 곳에 붙는다.
   여기서는 건물마스터의 지번을 1순위로 본다.
   🔴 애매하면(후보 2개 이상) null 을 돌려 기존 경로로 넘긴다 — 오연결 0 이 먼저다. */
function matchBuildingMaster(row, ai){
  if(DB.buildings === null) return null;          /* 아직 안 읽음 → 기존 경로 */
  var B = DB.buildings || [];
  if(!B.length) return null;
  function mk(b, how, conf){
    return { id:String(b.id || ''), name:String(b.name || ''), addr:String(b.addr || ''),
             addrKey:String(b.addrKey || ''), jibun:String(b.jibun || ''),
             dong:String(b.dong || ''), how:how, conf:conf };
  }
  var hay = [row && row.name, (row && bldColOk(row.bld) ? row.bld : ''),
             row && row.text, ai && ai.bldg].join(' ');
  var tk = bldgTokens(hay);
  var flat = String(hay).replace(/\s/g, '');
  /* ① 지번 — 가장 강한 근거 */
  if(tk.jibun){
    var byJ = B.filter(function(b){ return String(b.jibun || '') === tk.jibun; });
    if(byJ.length > 1 && tk.dong){
      var byJD = byJ.filter(function(b){ return String(b.dong || '') === tk.dong; });
      if(byJD.length) byJ = byJD;
    }
    if(byJ.length === 1) return mk(byJ[0], tk.dong ? '지번+동' : '지번', 95);
    if(byJ.length > 1) return null;               /* 애매 → 기존 경로 */
  }
  /* 🔴 2026-09-14 — **본문이 발신자 이름을 이긴다.**
     실측 사고: 발신자 이름이 "오피-에코드파리" 인 분이 "유니 1806호 300/50" 을 보냈는데
     이름칸 때문에 **에코 드 파리 1806호**로 붙었다. 본문은 다른 건물을 말하고 있었다.
     규칙: 본문에 "<이름> NNN호" 가 있으면 그 이름을 먼저 본다.
           그 이름이 건물마스터에 없으면 **이름칸으로 대신하지 않는다**(모르는 건물이다). */
  var body = String((row && row.text) || '');
  var bodyName = '';
  var bm2 = body.match(/([가-힣A-Za-z][가-힣A-Za-z0-9]{1,11})\s*(\d{3,4})\s*호/);
  if(bm2) bodyName = sq(bm2[1]);
  if(bodyName && bodyName.length >= 2 && bldNameOk(bodyName)){
    var hitBody = B.filter(function(b){
      var nm = sq(b.name);
      if(!nm) return false;
      return nm === bodyName || nm.indexOf(bodyName) >= 0 || bodyName.indexOf(nm) >= 0;
    });
    if(hitBody.length === 1) return mk(hitBody[0], '본문 건물명', 85);
    if(hitBody.length > 1) return null;
    /* 🔴 본문이 말하는 건물이 우리 자료에 없다 — 발신자 이름으로 대신하지 않는다 */
    return null;
  }
  /* ② 건물명 — 🔴 형태가 이름이 아니면 쓰지 않는다('202' 같은 것은 여기서 걸러진다) */
  var byN = B.filter(function(b){
    var nm = sq(b.name);
    return nm && nm.length >= 2 && bldNameOk(nm) && flat.indexOf(nm) >= 0;
  });
  if(byN.length > 1){
    /* 긴 이름이 이긴다 — '에코' 와 '에코제니' 가 둘 다 걸리면 '에코제니'.
       길이가 같으면 가리지 않는다(애매 → 기존 경로). */
    byN.sort(function(x, y){ return sq(y.name).length - sq(x.name).length; });
    if(sq(byN[0].name).length === sq(byN[1].name).length) return null;
    byN = [byN[0]];
  }
  if(byN.length === 1) return mk(byN[0], '건물명', 80);
  return null;
}

/* ── ① 호실마스터 조회 — 이름 대조가 아니라 **키 조회** ────────────
   🔴 핵심: 그 호실에 지금 매물 행이 없어도(임대중·계약완료) 호실은 대장에 남아 있다.
      예전에는 매물장 addr2 로만 찾아서 그런 문자가 REVIEW 로 빠졌다. */
function matchUnitMaster(bldgId, unit){
  if(DB.units === null) return null;              /* 아직 안 읽음 → 기존 경로 */
  var uid = unitIdOf(bldgId, unit);
  if(!uid) return null;
  var u = (DB.units || []).filter(function(x){ return String(x.id) === uid; })[0];
  if(!u) return null;
  var hit = (DB.listings || []).filter(function(o){ return String(o.unitId || '') === uid; });
  return { unitId:uid, unit:u, listings:hit };
}

/* ── ③ 사람마스터 1인 조회 ────────────────────────────────────
   🔴 없으면 **만들지 않는다**. 후보로만 알린다(자동생성 금지).
   🔴 임대인관리·고객관리·인입함 원본은 읽기만 한다. */
function personByPhone(phone){
  if(DB.persons === null) return null;            /* 아직 안 읽음 */
  var k = phKey(phone);
  if(!k) return null;
  var hit = (DB.persons || []).filter(function(p){
    return String(p.phoneKey || '') === k || phHas(p.phone, phone) || phHas(p.phone2, phone); });
  if(hit.length === 1) return hit[0];
  if(hit.length > 1) return { many:hit };
  return null;
}
/* 이 번호가 지금 어디에 있는지 — 🔴 읽기만 한다. 고치지 않는다. */
function personWhere(phone){
  var out = { person:null, many:null, landlords:[], customers:[] };
  if(!phone) return out;
  var p = personByPhone(phone);
  if(p && p.many) out.many = p.many; else out.person = p;
  out.landlords = (DB.landlords || []).filter(function(L){
    return phHas(L.phone, phone) || phHas(L.phone2, phone); });
  out.customers = (DB.customers || []).filter(function(c){ return phHas(c.phone, phone); });
  return out;
}
function personWhereWord(phone){
  var wr = personWhere(phone), a = [];
  if(wr.person) a.push('사람마스터 ' + wr.person.id + (wr.person.name ? ('(' + wr.person.name + ')') : ''));
  if(wr.many) a.push('🔴 사람마스터에 같은 번호가 ' + wr.many.length + '명');
  if(wr.landlords.length) a.push('임대인관리 ' + wr.landlords.length + '행');
  if(wr.customers.length) a.push('고객관리 ' + wr.customers.length + '행');
  return a.join(' · ');
}
function matchBuilding(row, ai){
  var hay = [row.name, (bldColOk(row.bld) ? row.bld : ''), row.text].join(' ');
  var tk = bldgTokens(hay);
  var res = { bldg:'', addr:'', jibun:tk.jibun, dong:tk.dong, listings:[], landlords:[], how:[] };
  /* ① 임대인 명부에서 지번+건물명으로 */
  (DB.landlords||[]).forEach(function(L){
    var apt = sq(L.apt), addr = sq(L.addr);
    if(!apt && !addr) return;
    var hitJibun = tk.jibun && addr.indexOf(sq(tk.jibun)) >= 0;
    var hitName  = apt && hay.replace(/\s/g,'').indexOf(apt) >= 0;
    if(hitJibun && hitName){ res.landlords.push(L); if(res.how.indexOf('지번+건물명') < 0) res.how.push('지번+건물명'); }
    else if(hitJibun){ res.landlords.push(L); if(res.how.indexOf('지번') < 0) res.how.push('지번'); }
    else if(hitName && apt.length >= 3){ res.landlords.push(L); if(res.how.indexOf('건물명') < 0) res.how.push('건물명'); }
  });
  if(res.landlords.length){
    res.bldg = res.landlords[0].apt || '';
    res.addr = res.landlords[0].addr || '';
  }
  /* ② 매물장에서 같은 건물 */
  (DB.listings||[]).forEach(function(o){
    var apt = sq(o.apt);
    if(!apt) return;
    var byName = res.bldg && apt === sq(res.bldg);
    var byJibun = tk.jibun && sq(o.addr).indexOf(sq(tk.jibun)) >= 0;
    if(byName || byJibun) res.listings.push(o);
  });
  if(!res.bldg && res.listings.length) res.bldg = res.listings[0].apt || '';
  /* 🆕 2026-09-14 — 건물마스터 결과를 **덧붙인다**. 🔴 기존 결과를 덮지 않는다.
     · 기존 경로가 찾았으면: id 만 붙인다(아래 호실 키 조회에 쓴다)
     · 기존 경로가 못 찾았으면: 그때만 건물을 채운다(예전엔 NEW_BUILDING 으로 빠지던 것) */
  var mB = matchBuildingMaster(row, ai);
  if(mB){
    res.master = mB;
    res.bldgId = mB.id;
    if(!res.bldg && !res.landlords.length && !res.listings.length){
      res.bldg = mB.name || res.bldg;
      res.addr = mB.addr || res.addr;
      res.how.push('건물마스터(' + mB.how + ')');
      var pre = String(mB.id) + '-';
      (DB.listings || []).forEach(function(o){
        if(String(o.unitId || '').indexOf(pre) === 0) res.listings.push(o);
      });
    }
  }
  return res;
}
/* ═══ 판정 ═══════════════════════════════════════════════════════ */
function judge(ai, bm){
  var r = { code:'REVIEW_REQUIRED', why:'', unit:ai.unit, hit:null, changes:[] };
  if(!ai.unit){
    r.why = ai.unitCands ? ('호실 후보가 여러 개입니다(' + ai.unitCands.join(', ') + ')') : '호실을 읽지 못했습니다';
    return r;
  }
  if(!bm.bldg && !bm.landlords.length && !bm.listings.length){
    r.code = 'NEW_BUILDING'; r.why = '우리 자료에 이 건물이 없습니다'; return r;
  }
  var hits = bm.listings.filter(function(o){ return sq(o.addr2) === sq(ai.unit); });
  if(hits.length > 1){ r.code = 'REVIEW_REQUIRED'; r.why = '같은 호실이 매물장에 ' + hits.length + '건 있습니다'; return r; }
  if(!hits.length){
    r.code = 'NEW';
    /* 🆕 그 호실이 **대장에는 있는지** 본다 — 임대중·계약완료라 매물 행만 없는 방이다 */
    var mu2 = bm.bldgId ? matchUnitMaster(bm.bldgId, ai.unit) : null;
    if(mu2){
      r.unitId = mu2.unitId;
      r.why = '그 호실은 대장에 있습니다(' + mu2.unitId + ') — 지금 매물 행이 없을 뿐입니다';
    } else {
      r.why = '건물은 우리 자료에 있고(' + (bm.how.join('+') || '대조') + '), 그 호실 매물은 없습니다';
    }
    return r;
  }
  r.hit = hits[0];
  var cmp = [['price', ai.deposit, '보증금'], ['rentAmt', ai.rent, '월세']];
  cmp.forEach(function(c){
    var was = String(r.hit[c[0]] == null ? '' : r.hit[c[0]]).trim();
    var now = String(c[1] || '').trim();
    if(now && was && now !== was) r.changes.push({ f:c[0], label:c[2], from:was, to:now });
  });
  if(r.changes.length){ r.code = 'CHANGE'; r.why = '기존 매물 ' + r.hit.id + ' 과 값이 다릅니다'; }
  else { r.code = 'SAME'; r.why = '기존 매물 ' + r.hit.id + ' 과 같습니다'; }
  return r;
}
/* ═══ 사진 — 드라이브 실측 인덱스(erp-photo-index.json)로 찾는다.

/* 건물 폴더 찾기 — 지번이 가장 강한 근거, 건물명은 보조 */
function photoFindBuilding(bm, r){
  if(!PIDX || !PIDX.index) return null;
  var jib = sq(bm.jibun || '');
  var nm  = sq(bm.bldg || '');
  var hay = sq([r && r.name, r && r.bld, bm.bldg].join(' '));
  var byJibun = [], byName = [];
  Object.keys(PIDX.index).forEach(function(k){
    var v = PIDX.index[k];
    if(jib && sq(v.jibun) === jib) byJibun.push(v);
    else if(v.name && sq(v.name).length >= 3 && (nm === sq(v.name) || hay.indexOf(sq(v.name)) >= 0)) byName.push(v);
  });
  if(byJibun.length === 1) return { hit: byJibun[0], how: '지번' };
  if(byJibun.length > 1) return { multi: byJibun, how: '지번(여러 곳)' };
  if(byName.length === 1) return { hit: byName[0], how: '건물명' };
  if(byName.length > 1) return { multi: byName, how: '건물명(여러 곳)' };
  return null;
}
/* ═══ 사진 출처 판정 (2026-09-13 §10·§11) ═══════════════════════════
   왜 필요한가 — 1단계 실측
     · 기존 EXACT_UNIT 은 "호실이 같은가" 만 본다. 출처는 보지 않았다.
     · 광고에 쓸 수 있는 유일한 워터마크 완료본(일출하우스 202호 4장)이
       **타사 담당자 해시태그가 붙은 2026-04-27 밴드 글**에서 받은 사진이었고,
       그 글의 방향·가격이 현재 매물장과 달랐다(북향↔남향 · 300/800↔500/75).
     · 전체 10,041장 중 band_ 2,553장(293호실) · kakaotalk_ 3,354장(185호실),
       밴드 글 원문이 633호실에 있다.
   규칙
     광고용 사진 = 정확한 호실 + 품질 통과 + **출처 확인** 세 가지를 다 넘어야 한다.
     타사 밴드 글·타사 광고에서 받은 사진은 쓰지 않는다(저작권 + 조건이 다를 위험).
   값
     EXACT_OWN_READY      우리 사진 · 광고 가능
     EXACT_SOURCE_REVIEW  호실은 맞으나 출처를 확인해야 한다(카톡 등)
     PROHIBITED_SOURCE    타사 밴드 글 등 — 광고 사용 불가
     SOURCE_UNKNOWN       출처 단서가 없다(색인에 출처가 없거나 이름 단서 없음) */
var PHOTO_SRC_OK = ['OWN'];
var PHOTO_SRC_BAN = ['BAND'];
function photoSrcJudge(u){
  var o = { code:'SOURCE_UNKNOWN', why:'', src:'', usable:false };
  if(!u) return o;
  var src = String(u.doneSrc || u.src || '');
  o.src = src;
  if(!src){
    o.code = 'SOURCE_UNKNOWN';
    o.why = '사진 출처가 색인에 없습니다 — photo_src_scan.py 를 한 번 돌려야 합니다';
    return o;
  }
  if(PHOTO_SRC_BAN.indexOf(src) >= 0 || u.bandPost === true){
    o.code = 'PROHIBITED_SOURCE';
    o.why = (src === 'BAND' ? '밴드 글에서 받은 사진입니다' : '사진 폴더에 밴드 글 원문이 있습니다') +
            ' — 타사 게시물 사진은 광고에 쓰지 않습니다(저작권·조건 불일치 위험)';
    return o;
  }
  if(PHOTO_SRC_OK.indexOf(src) >= 0){
    o.code = 'EXACT_OWN_READY'; o.usable = true;
    o.why = '우리가 가진 사진입니다(' + (u.srcWhy || src) + ')';
    return o;
  }
  o.code = 'EXACT_SOURCE_REVIEW';
  o.why = (src === 'KAKAO' ? '카톡으로 받은 사진입니다' :
           (src === 'MIXED' ? '출처가 섞여 있습니다(' + (u.srcWhy || '') + ')' :
            '출처가 ' + src + ' 입니다')) +
          ' — 임대인이 주신 것인지 타사 사진인지 확인이 필요합니다';
  return o;
}

function judgePhoto(j, bm, ai, r){
  var p = { code:'PHOTO_REQUIRED', why:'', note:'', unit:null, others:[], common:0, bldFolder:'' };
  if(!PIDX){ p.code = 'REVIEW_REQUIRED'; p.why = '사진 자료를 아직 불러오지 못했습니다'; return p; }
  if(PIDX.error){ p.code = 'REVIEW_REQUIRED'; p.why = '사진 자료를 읽지 못했습니다: ' + PIDX.error; return p; }
  var f = photoFindBuilding(bm, r);
  if(!f){ p.code = 'PHOTO_REQUIRED'; p.why = '사진 보관함에 이 건물 폴더가 없습니다'; return p; }
  if(f.multi){
    p.code = 'REVIEW_REQUIRED';
    p.why = '같은 이름·지번의 건물 폴더가 ' + f.multi.length + '곳입니다 — 사람이 골라야 합니다';
    return p;
  }
  var b = f.hit;
  p.bldFolder = b.kind + ' / ' + b.dong + ' / ' + b.folder;
  p.common = b.common || 0;
  var unitKey = ai.unit ? sq(ai.unit) : '';
  Object.keys(b.units || {}).forEach(function(u){
    /* 🔴 크기(KB)도 같이 넘긴다 — 64×64 썸네일(1~2KB)을 광고에 올리지 않기 위해서다.
       photo_size_scan.py 가 인덱스에 담아 둔 값이고, 없으면 undefined 라 예전처럼 동작한다. */
    var uv = b.units[u];
    if(unitKey && sq(u) === unitKey)
      p.unit = { name:u, raw:uv.raw, done:uv.done,
                 rawMaxKB:uv.rawMaxKB, rawMinKB:uv.rawMinKB,
                 doneMaxKB:uv.doneMaxKB, doneMinKB:uv.doneMinKB,
                 /* 🔴 해상도 — photo_dim_scan.py 가 담는다. 없으면 undefined(예전처럼) */
                 rawMinW:uv.rawMinW, rawMinH:uv.rawMinH,
                 doneMinW:uv.doneMinW, doneMinH:uv.doneMinH,
                 /* 🔴 출처 — photo_src_scan.py 가 담는다(2026-09-13 §10).
                    없으면 undefined → SOURCE_UNKNOWN 으로 다뤄 광고에 쓰지 않는다. */
                 src:uv.src, doneSrc:uv.doneSrc, bandPost:uv.bandPost, srcWhy:uv.srcWhy,
                 /* 🔴 참고사진 — photo_ref_scan.py 가 담는다(2026-09-14).
                    ref=원본 중 '참고_' 장수 · refDone=보정완료 중 장수 · refOnly=전부 참고사진 */
                 ref:uv.ref, refDone:uv.refDone, refOnly:uv.refOnly };
    else p.others.push({ name:u, raw:uv.raw, done:uv.done,
                         rawMaxKB:uv.rawMaxKB, doneMaxKB:uv.doneMaxKB });
  });
  if(!ai.unit){ p.code = 'REVIEW_REQUIRED'; p.why = '호실을 읽지 못해 호실 사진을 찾을 수 없습니다'; return p; }
  if(p.unit){
    /* 동일 건물 + 동일 호실 = EXACT_UNIT */
    if(p.unit.done > 0){
      p.code = 'PHOTO_READY';
      p.why = 'EXACT_UNIT — ' + p.unit.name + ' 보정완료 ' + p.unit.done + '장(광고 사용 가능)';
    } else {
      p.code = 'REVIEW_REQUIRED';
      p.why = 'EXACT_UNIT — ' + p.unit.name + ' 원본 ' + p.unit.raw + '장은 있으나 보정완료(워터마크) 0장입니다';
    }
    return p;
  }
  /* 같은 건물이지만 그 호실 사진은 없다 */
  if(p.common > 0){
    p.code = 'BUILDING_ONLY';
    p.why = '이 건물 공용부·외관 사진 ' + p.common + '장만 있습니다 — ' + ai.unit + ' 내부 사진은 없습니다';
  } else {
    p.code = 'PHOTO_REQUIRED';
    p.why = '이 건물 폴더에 ' + ai.unit + ' 사진이 없습니다' +
      (p.others.length ? (' (있는 호실: ' + p.others.map(function(o){ return o.name + ' ' + (o.raw + o.done) + '장'; }).join(' · ') + ')') : '');
  }
  p.note = '🔴 같은 건물의 다른 호실 사진은 이 호실 광고사진으로 쓰지 않습니다. ' +
           '건물 외관·공용부(BUILDING_ONLY)는 참고용일 뿐 호실 내부사진으로 올리지 않습니다.';
  return p;
}
/* ═══ 광고 — 사진 없으면 게시 차단 ═══ */
function judgeAd(ai, ph){
  var a = { code:'DATA_REQUIRED', why:'', blocked:true };

  if(!ai.deposit) need.push('보증금');
  if(!ai.rent) need.push('월세');

  a.code = 'AD_READY'; a.blocked = false; a.why = '필수정보·사진이 갖춰졌습니다';
  return a;
}

/* ══ 7단계 2026-09-14 — 호실 상태 전환 ══════════════════════════
   [접수 → 광고중 → 상담중 → 임대중]
   🔴 자동 전환 금지. 누르고 확인해야 바뀐다.
   🔴 바꾼 것은 변경이력에 남는다(GAS logChange 가 upsert 때 남긴다). ══ */
var ST_FLOW = ['접수', '광고중', '상담중', '임대중'];
var ST_BUSY = false;
function stNext(cur){
  var i = ST_FLOW.indexOf(String(cur || ''));
  return (i >= 0 && i < ST_FLOW.length - 1) ? ST_FLOW[i + 1] : '';
}
function stPrev(cur){
  var i = ST_FLOW.indexOf(String(cur || ''));
  return (i > 0) ? ST_FLOW[i - 1] : '';
}
function stBarHtml(o){

    '<b>상태</b> ' +
    ST_FLOW.map(function(s){
      var on = (s === cur);
      return '<span class="pill' + (on ? ' p-good' : '') + '"' +
        (on ? '' : ' style="opacity:.45"') + '>' + esc(s) + '</span>';
    }).join(' → ');
  var nx = stNext(cur), pv = stPrev(cur);
  if(nx) h += ' <button class="btn sm pri" onclick="stSet(&#39;' + esc(String(o.id)) +
    '&#39;,&#39;' + esc(nx) + '&#39;)">' + esc(nx) + ' 로</button>';
  if(pv) h += ' <button class="btn sm" onclick="stSet(&#39;' + esc(String(o.id)) +
    '&#39;,&#39;' + esc(pv) + '&#39;)">' + esc(pv) + ' 로 되돌리기</button>';
  if(ST_FLOW.indexOf(cur) < 0)
    h += ' <span style="color:var(--t3)">(' + esc(cur || '상태 없음') + ' — 이 흐름 밖입니다)</span>';
  h += '</div>';
  return h;
}
async function stSet(id, to){
  var nl = String.fromCharCode(10);
  if(ST_BUSY){ alert('저장 중입니다'); return; }
  var o = (DB.listings || []).filter(function(x){ return String(x.id) === String(id); })[0];
  if(!o){ alert('매물을 찾지 못했습니다.'); return; }
  if(ST_FLOW.indexOf(String(to)) < 0){ alert('그 상태로는 바꾸지 않습니다.'); return; }
  /* 🔴 계약완료는 이 버튼으로 만들지 않는다 — 계약은 따로 등록한다 */
  var from = String(o.status || '');
  var warn = '';
  if(to === '임대중') warn = '🔴 임대중으로 바꾸면 광고 대상에서 빠집니다. 광고가 올라가 있으면 먼저 내려 주세요.';
  if(!confirm(['매물 상태를 바꿉니다 — 이대로 할까요?', '',
    '매물   ' + o.id + '  ' + (o.apt || '') + ' ' + (o.addr2 || ''),
    '상태   ' + (from || '(없음)') + '  →  ' + to,
    warn ? ('' + nl + warn) : '',
    '', '🔴 이 버튼은 계약완료로 바꾸지 않습니다. 문자도 나가지 않습니다.',
    '🔴 바꾼 기록은 변경이력에 남습니다.'].filter(function(x){ return x !== ''; }).join(nl))) return;

  ST_BUSY = true;
  try{
    /* 저장 직전에 다시 읽어 그 사이 바뀌었는지 본다 */
    var g = await jget({ action:'getAll', type:'listings' });
    var fresh = (g.data || g.result || []).map(adsRestore);
    var cur = fresh.filter(function(x){ return String(x.id) === String(id); })[0];
    if(!cur){ ST_BUSY = false; alert('매물을 찾지 못했습니다 — 바꾸지 않았습니다.'); return; }
    if(String(cur.status || '') !== from){
      ST_BUSY = false;
      alert('그 사이 상태가 ' + from + ' → ' + (cur.status || '') + ' 로 바뀌었습니다.' + nl +
            '화면을 새로 읽고 다시 하세요.');
      return;
    }
    var obj = JSON.parse(JSON.stringify(cur));
    obj.status = String(to);
    obj.updatedAt = new Date().toISOString();
    adsFlatten(obj); delete obj.ads; delete obj.adsOff;
    await erpUpsert('listings', obj);
    var g2 = await jget({ action:'getAll', type:'listings' });
    DB.listings = (g2.data || g2.result || []).map(adsRestore);
    var now = (DB.listings || []).filter(function(x){ return String(x.id) === String(id); })[0];
    ST_BUSY = false;
    route();
    alert([(now && String(now.status) === String(to)) ? '바꿨습니다 ✓'
           : '🔴 다시 읽었더니 그대로입니다 — 확인이 필요합니다', '',
      o.id + ' · ' + (from || '(없음)') + ' → ' + (now ? now.status : to)].join(nl));
  }catch(e){
    ST_BUSY = false; route();
    alert('바꾸지 못했습니다 — 자료는 그대로입니다.' + nl + String(e && e.message || e));
  }
}

/* ═══════════════════════════════════════════════════════════════════
   매물접수 → 광고준비 (2026-09-12 2단계)
   🔴 새 화면·새 메뉴를 만들지 않는다. 아래는 전부 **값을 돌려주는 함수**다.
   🔴 저장·발송·게시 코드가 없다. 매물 상태를 바꾸지 않는다.
   🔴 이미 있는 aiExtract · matchBuilding · judge · judgePhoto · adMissing 을 그대로 쓴다.
   ═══════════════════════════════════════════════════════════════════ */

/* 🔴 건물 "이름" 이 아니라 건물 "종류" 인 값 — 이것으로 건물을 가리지 않는다.
   임대인 명부 apt 칸에 이렇게 적힌 분이 있다(실측). */
var BLDG_KIND = ['다가구주택', '다가구', '단독주택', '단독', '상가주택', '근린생활시설',
                 '아파트', '오피스텔', '빌라', '연립', '도시형생활주택', '투룸', '원룸',
                 '투룸 임대인', '다세대'];
function bldgIsKind(v){
  var t = sq(v);
  if(!t) return true;
  for(var i = 0; i < BLDG_KIND.length; i++){
    if(t === sq(BLDG_KIND[i])) return true;
  }
  /* 종류어만 이어 붙인 것("단독다가구상가주택")도 이름이 아니다 */
  var rest = t;
  BLDG_KIND.forEach(function(k){ rest = rest.split(sq(k)).join(''); });
  return rest.length === 0;
}

/* 광고에 반드시 있어야 하는 값 / 있으면 좋은 값 — AD_GOAL 채널 규격에서 가져온다 */
var INTAKE_REQ = [['dealType','거래유형'],['deposit','보증금'],['building','건물'],
                  ['unit','호실'],['area','면적'],['roomCount','방 수'],
                  ['bathCount','욕실 수'],['floor','층'],['totalFloor','총 층']];
var INTAKE_OPT = [['maintenance','관리비'],['moveInDate','입주 가능일'],
                  ['rent','월세'],['yearlyRent','연세']];

/* 네 갈래를 한 가지 꼴로 — 원본은 rawText 에 그대로 남긴다 */
function intakeEvent(r, forceUnit){
  var src = srcOf(r.kind, r.text);
  var code = (src === '통화녹음' || src === '부재중전화') ? 'CALL'
           : (src === '메모') ? 'MEMO'
           : (src === 'MMS' || src === '사진접수') ? 'MMS' : 'SMS';
  var ai = aiExtract(r.text);
  /* 🔴 호실을 집어서 들어오면 그 호실만 본다(한 줄에 여럿일 때) */
  if(forceUnit){
    ai = JSON.parse(JSON.stringify(ai));
    ai.unit = String(forceUnit);
    ai.unitCands = null;
    ai.missing = (ai.missing || []).filter(function(m){
      return String(m).indexOf('호실') !== 0; });
  }
  var bm = matchBuilding(r, ai);
  var ev = {
    eventId: code + ':' + String(r.row || '') + ':' + String(r.when || '').slice(0, 19),
    source: code, receivedAt: String(r.when || ''), sender: phMask(r.phone),
    rawText: String(r.text || ''),                       /* 🔴 원본 그대로 보존 */
    building: bm.bldg || '', address: bm.addr || '', jibun: bm.jibun || '',
    unit: ai.unit || '', unitCands: ai.unitCands || null,
    dealType: ai.trade || '', deposit: ai.deposit || '', rent: ai.rent || '',
    yearlyRent: '', maintenance: (ai.feeIncluded ? '포함' : ''),
    area: '', roomCount: '', bathCount: '', floor: '', totalFloor: '',
    moveInDate: ai.moveIn || '', kind: ai.kind || '',
    statusHint: 'UNKNOWN', photoRefs: [],
    landlordId: '', listingId: '',
    parseConfidence: ai.confidence.length,
    matchConfidence: 0, matchHow: '', reviewReason: '',
    approvalStatus: 'PENDING',
    _ai: ai, _bm: bm, _row: r
  };
  /* 🔴 임대인이 건물명을 줄여 쓴다("제니" = 에코제니, "히튼" = 에코힐튼).
     matchBuilding 은 이름 전체가 맞아야 붙으므로 그때 건물을 못 찾는다(실측).
     → 보낸 번호로 임대인을 찾아 그 건물을 보탠다. ERP doneAlerts 가 잇는 방식과 같다.
     🔴 matchBuilding 자체는 건드리지 않는다(기존 화면·검산을 그대로 둔다). */
  if(!(bm.landlords || []).length && r && r.phone){
    var byPh = (DB.landlords || []).filter(function(l){ return phHas(l.phone, r.phone); });
    if(byPh.length === 1 && sq(byPh[0].apt) && !bldgIsKind(byPh[0].apt)){
      bm.landlords = byPh;
      bm.bldg = bm.bldg || String(byPh[0].apt || '');
      bm.addr = bm.addr || String(byPh[0].addr || '');
      if(bm.how.indexOf('보낸 번호') < 0) bm.how.push('보낸 번호');
      /* 그 건물 매물도 다시 모은다 */
      var bb = sq(bm.bldg);
      (DB.listings || []).forEach(function(o){
        if(bb && sq(o.apt) === bb && bm.listings.indexOf(o) < 0) bm.listings.push(o);
      });
    }
  }
  var ld = (bm.landlords || [])[0];
  if(ld) ev.landlordId = String(ld.id || ld.phone || '');
  var mp = matchProperty(ev);
  ev.listingId = mp.listingId; ev.matchConfidence = mp.confidence;
  ev.matchHow = mp.how; ev.reviewReason = mp.why; ev._match = mp;
  /* 🔴 건물 이름은 **매물장** 것을 먼저 쓴다.
     임대인 명부 apt 칸에 건물 종류("다가구주택", "단독 다가구 상가주택")가 적힌 분이 있어,
     지번으로 붙으면 그 값이 건물 이름처럼 나왔다(2026-09-12 실측). */
  var hit1 = (mp.hits || [])[0];
  if(hit1 && sq(hit1.apt)) ev.building = String(hit1.apt);
  else if(bldgIsKind(ev.building)) ev.building = '';
  if(hit1 && sq(hit1.addr)) ev.address = String(hit1.addr);
  /* 호실별 최신상태 — 같은 호실의 다른 문자까지 모아서 본다 */
  if(ev.unit) ev.statusHint = statusHintOf(intakeSameUnitRows(ev), ev.unit).code;
  return ev;
}
/* 🔴 한 줄에 호실이 여럿이면 **호실마다** 접수후보를 만든다.
   "301호는 계약됐구요! 402호는 남아있어요" 한 줄이 후보 2건이 된다.
   종전처럼 하나로 두면 호실을 못 읽어 후보가 0건이 됐다(2026-09-12 실측).
   이게 지시 4 "문장 전체 상태를 한 번에 적용 금지" 를 실제로 지키는 길이다. */
function intakeEventsFrom(r){
  var ai0 = aiExtract(r.text);
  var units = ai0.unit ? [ai0.unit] : (ai0.unitCands || []);
  /* 🔴 §5 (2026-09-13) — 글에 호실이 아예 없으면 같은 발신자의 가까운 글을 본다.
     조건 넷(같은 발신자·같은 건물 근거·2일 안·호실 하나)을 다 만족할 때만 쓴다.
     만족하지 않으면 그대로 호실 없는 후보로 두어 REVIEW 에 남긴다. */
  if(!units.length){
    var nbu = unitFromNeighbors(r);
    if(nbu.unit){
      var evn = intakeEvent(r, nbu.unit);
      evn.unitFrom = '인접메시지';
      evn.unitFromWhy = nbu.why;
      evn.reviewReason = (evn.reviewReason ? (evn.reviewReason + ' · ') : '') +
        '🔴 호실은 글에 없고 인접메시지로 본 것입니다 — 확인하세요';
      return [evn];
    }
    return [intakeEvent(r)];
  }
  if(units.length <= 1) return [intakeEvent(r)];
  return units.map(function(u){
    var ev = intakeEvent(r, u);
    ev.eventId = ev.eventId + '#' + u;
    ev.fromMultiUnit = units.slice();
    return ev;
  });
}
/* 메모도 같은 길로 보낸다 — 저장만 하고 끝나면 접수가 안 된다 */
function intakeMemo(text, when, who){
  return intakeEvent({ row:'memo', when:String(when || todayStr()), kind:'메모',
                       name:String(who || '대표 메모'), phone:'', bld:'',
                       text:String(text || ''), reg:'' });
}
/* 그 호실을 말한 인입함 줄을 모은다(최신상태 판정용) */
/* 🔴 건물 이름으로 써도 되는 값인가 — '202' 처럼 짧거나 숫자만이면 못 쓴다.
   실측: 건물명이 '202' 인 매물이 있어 '202호' 가 적힌 아무 문자나 같은 건물로 보였고,
   다른 건물 202호 계약완료 문자까지 끌어와 상태를 잘못 읽었다(2026-09-12). */
function bldgKeyOk(v){
  var t = sq(v);
  if(t.length < 3) return false;
  if(/^[0-9-]+$/.test(t)) return false;       /* 숫자·하이픈만 */
  return !bldgIsKind(t);
}
/* ── 인입함 인덱스 — 처음 한 번만 훑는다 (2026-09-12 성능 수정) ────────
   🔴 종전에는 매물·후보마다 502줄을 다시 훑어서, 매물 45건 × 후보 154건이면
      수만 번 훑었다(덤프가 300초를 넘겨 회신을 못 했다 — 실측).
   → 호실번호·보낸번호로 미리 갈라 두고, 그 뒤에는 찾아보기만 한다.
      고르는 조건(호실 + 건물이름/보낸번호)은 그대로이므로 결과가 달라지지 않는다. */
/* 🔴 시험으로 넣은 줄은 **판정에 쓰지 않는다**.
   실측 사고(2026-09-12): 메모 기능을 시험하며 넣은 한 줄에 "즉시입주" 가 들어 있어,
   그 호실(에코제니 305호)의 2026-08-05 계약완료 근거를 덮어쓰고 "아직 있다" 로 판정됐다.
   🔴 줄을 지우지는 않는다 — 인입함 목록에는 그대로 보이고, 판정·후보에서만 뺀다. */
var TEST_MARKS = ['[검사용메모', '[검사용', '[TEST]'];
function isTestRow(t){

  return false;
}
var IN_IDX = null;
function inboxIdx(){
  var rows = DB.inbox || [];
  if(IN_IDX && IN_IDX.n === rows.length && IN_IDX.head === (rows[0] && rows[0].row))
    return IN_IDX;
  var byUnit = {}, byPhone = {};
  rows.forEach(function(x){
    var t = String(x.text || '');
    if(isTestRow(t)) return;
    var rec = { when:String(x.when || ''), text:t, ph:phKey(x.phone), sq:sq(t) };
    /* 그 줄이 말한 호실을 한 번만 뽑는다 */
    var seen = {};
    unitSpans(t).forEach(function(u){
      var k = sq(u.u);
      if(seen[k]) return;
      seen[k] = 1;
      (byUnit[k] = byUnit[k] || []).push(rec);
    });
    if(rec.ph) (byPhone[rec.ph] = byPhone[rec.ph] || []).push(rec);
  });

  return IN_IDX;
}
function intakeSameUnitRows(ev){
  if(ev._rows) return ev._rows;
  var out = [{ when:ev.receivedAt, text:ev.rawText }];
  if(!ev.unit){ ev._rows = out; return out; }
  var ix = inboxIdx();
  var bk = bldgKeyOk(ev.building) ? sq(ev.building) : '';
  var myPh = (ev._row && ev._row.phone) ? phKey(ev._row.phone) : '';
  var ldPh = {};
  ((ev._bm && ev._bm.landlords) || []).forEach(function(l){
    phAll(l.phone).forEach(function(d){ ldPh[phKey(d)] = 1; });
  });
  var cand = ix.byUnit[sq(ev.unit)] || [];
  var added = {};
  cand.forEach(function(r){
    /* 🔴 건물이 같다고 확인된 줄만 — 다른 건물 같은 호실을 섞으면 판정이 틀어진다 */
    var same = !!bk && r.sq.indexOf(bk) >= 0;
    if(!same && myPh && r.ph === myPh) same = true;
    if(!same && r.ph && ldPh[r.ph]) same = true;
    if(!same) return;
    var k = r.when + '|' + r.sq.slice(0, 40);
    if(added[k]) return;
    added[k] = 1;
    out.push({ when:r.when, text:r.text });
  });
  ev._rows = out;
  return out;
}

/* ── 매칭 엔진 하나 — 네 갈래가 모두 이것만 쓴다 ───────────────────
   우선순위
     1 listingId 로 바로 연결        (확신 100)
     2 지번(주소) + 호실 정확히 같음 (확신 90)
     3 건물명 + 호실 정확히 같음     (확신 80)
     4 건물만 같음                   → REVIEW_REQUIRED (확신 40)
     5 건물을 못 찾음                → NEW_BUILDING / REVIEW_REQUIRED
   🔴 호실만 같은 것은 **절대** 붙이지 않는다. "301호" 만으로 다른 건물 301호를
      연결하면 살아 있는 방을 죽이거나 남의 방을 광고한다. */
function matchProperty(ev){
  var out = { listingId:'', confidence:0, how:'', why:'', code:'REVIEW_REQUIRED',
              hits:[], building:ev.building || '' };
  var bm = ev._bm || { listings:[], landlords:[], how:[] };
  if(!ev.unit){
    out.why = ev.unitCands ? ('호실 후보가 여러 개입니다(' + ev.unitCands.join(', ') + ')')
                           : '호실을 읽지 못했습니다';
    return out;
  }
  /* 1 — 이미 붙어 있는 매물번호 */
  if(ev._row && ev._row.listingId){
    var d = (DB.listings || []).filter(function(o){
      return String(o.id) === String(ev._row.listingId); })[0];
    if(d){ out.listingId = String(d.id); out.confidence = 100; out.how = '매물번호 직접';

  }
  if(!bm.listings.length && !bm.landlords.length && !bm.bldg){
    out.code = 'NEW_BUILDING'; out.why = '우리 자료에 이 건물이 없습니다'; return out;
  }
  /* 1.5 — 🆕 2026-09-14 호실 키(unitId) 조회. 이름 대조가 아니라 **키**라 가장 정확하다.
     🔴 못 찾으면 아래 기존 경로(지번+호실 · 건물명+호실 · 보낸번호+호실)로 그대로 내려간다. */
  var mu = bm.bldgId ? matchUnitMaster(bm.bldgId, ev.unit) : null;

  /* 2 — 지번 + 호실 */
  var byJibun = (bm.listings || []).filter(function(o){
    return ev.jibun && sq(o.addr).indexOf(sq(ev.jibun)) >= 0 && sq(o.addr2) === u; });
  /* 3 — 건물명 + 호실 */
  var byName = (bm.listings || []).filter(function(o){
    return sq(o.apt) && sq(o.apt) === sq(bm.bldg) && sq(o.addr2) === u; });
  /* 3.5 — 보낸 번호의 임대인이 가진 매물 중 호실이 같은 것
     🔴 임대인이 건물명을 줄여 써서("제니" = 에코제니) 이름으로 못 붙는 일이 있다(실측).
        보낸 번호는 강한 근거다. 다만 지번·건물명보다 낮게 본다(확신 70) —
        확신 80 아래는 광고준비로 못 넘어가므로 사람이 한 번 본다.
     🔴 호실만 같은 것과는 다르다. 번호가 같은 임대인의 매물만 본다. */
  var bySender = [];
  if(ev._row && ev._row.phone){
    bySender = (DB.listings || []).filter(function(o){
      if(sq(o.addr2) !== u) return false;
      var L = ldOfListing(o);
      return L && phHas(L.phone, ev._row.phone);
    });
  }
  var hits = byJibun.length ? byJibun : (byName.length ? byName : bySender);
  var how = byJibun.length ? '지번+호실'
          : (byName.length ? '건물명+호실' : (bySender.length ? '보낸번호+호실' : ''));
  if(hits.length === 1){
    out.listingId = String(hits[0].id);
    out.confidence = byJibun.length ? 90 : (byName.length ? 80 : 70);
    out.how = how; out.code = 'MATCH'; out.hits = hits;
    return out;
  }
  if(hits.length > 1){
    out.confidence = 50; out.how = how; out.hits = hits; out.code = 'REVIEW_REQUIRED';
    out.why = '같은 건물·같은 호실 매물이 ' + hits.length + '건 있습니다 — 사람이 골라야 합니다';
    return out;
  }
  /* 5 — 같은 발신자의 인접 메시지로 건물 근거가 명확한 경우 (2026-09-13 §4-5)
     🔴 임대인은 건물명을 줄여 쓰거나 아예 안 쓴다("1608호 계약 완료입니다").
        그 번호가 보낸 **앞뒤 메시지**에 건물 이름이 한 곳만 나오면 그것을 근거로 본다.
     🔴 두 곳 이상 나오면 쓰지 않는다 — 오연결 0 이 먼저다. */
  if(!hits.length && ev._row && ev._row.phone){
    var nb = matchNeighborBldg(ev._row);
    if(nb.bldg){
      var byNb = (DB.listings || []).filter(function(o){
        return sq(o.addr2) === u && sq(o.apt) === sq(nb.bldg); });
      if(byNb.length === 1){

        out.confidence = 70;              /* 지번·건물명보다 낮게 — 80 아래라 사람이 한 번 본다 */

        out.code = 'REVIEW_REQUIRED';
        out.why = '인접메시지로 건물(' + nb.bldg + ')을 봤지만 같은 호실 매물이 ' +
