<!DOCTYPE html>
<html lang="ko" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>브리즈 ERP</title>
<style>
/* ── 색 토큰: 흰색 기본 · 다크 · 시스템 ───────────────────────────── */
:root{
  --bg:#F7F8FA; --panel:#FFFFFF; --panel2:#FBFCFD; --line:#E3E7ED; --line2:#EEF1F5;
  --t1:#14181F; --t2:#4A5567; --t3:#8A94A6;
  --brand:#1D4ED8; --brand-bg:#EEF3FF;
  --ok:#0F7B4F; --ok-bg:#E7F6EE;
  --warn:#B45309; --warn-bg:#FDF3E3;
  --bad:#B91C1C; --bad-bg:#FDECEC;
  --mute:#6B7280; --mute-bg:#F1F3F6;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1319; --panel:#161B23; --panel2:#1B212B; --line:#2A323E; --line2:#222933;
    --t1:#E8ECF2; --t2:#AEB8C7; --t3:#7C889A;
    --brand:#7EA6FF; --brand-bg:#1B2740;
    --ok:#5FD39B; --ok-bg:#14301F;
    --warn:#E9B168; --warn-bg:#33250F;
    --bad:#F28B8B; --bad-bg:#3A1A1A;
    --mute:#9AA5B5; --mute-bg:#222A35;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1319; --panel:#161B23; --panel2:#1B212B; --line:#2A323E; --line2:#222933;
  --t1:#E8ECF2; --t2:#AEB8C7; --t3:#7C889A;
  --brand:#7EA6FF; --brand-bg:#1B2740;
  --ok:#5FD39B; --ok-bg:#14301F;
  --warn:#E9B168; --warn-bg:#33250F;
  --bad:#F28B8B; --bad-bg:#3A1A1A;
  --mute:#9AA5B5; --mute-bg:#222A35;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{
  background:var(--bg); color:var(--t1);
  font:15px/1.55 "Pretendard","Malgun Gothic","맑은 고딕",-apple-system,system-ui,sans-serif;
  -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
.mono{font-variant-numeric:tabular-nums}

/* ── 상단 ──────────────────────────────────────────────────────── */
header{position:sticky;top:0;z-index:40;background:var(--panel);border-bottom:1px solid var(--line)}
.top1{display:flex;align-items:center;gap:12px;padding:9px 16px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:-.3px;white-space:nowrap}
.logo i{display:grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--brand);color:#fff;font-style:normal;font-size:14px;font-weight:800}
.gsearch{flex:1;min-width:120px;position:relative}
.gsearch input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--line);border-radius:9px;background:var(--panel2)}
.gsearch svg{position:absolute;left:11px;top:9px;opacity:.5}
.tools{display:flex;align-items:center;gap:4px;flex-shrink:0}
.tbtn{display:grid;place-items:center;min-width:34px;height:34px;padding:0 9px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--t2);cursor:pointer;font-size:13px;white-space:nowrap}
.tbtn:hover{background:var(--mute-bg);color:var(--t1)}
.tbtn.on{background:var(--brand-bg);color:var(--brand);border-color:var(--brand-bg)}
.who{display:flex;align-items:center;gap:7px;padding:4px 9px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font-size:13px}
.who b{font-size:13px}

/* 대분류 */
.top2{display:flex;gap:2px;padding:0 12px;overflow-x:auto;scrollbar-width:none}
.top2::-webkit-scrollbar{display:none}
.m1{padding:9px 14px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--t2);cursor:pointer;white-space:nowrap;font-weight:600;font-size:14.5px}
.m1:hover{color:var(--t1)}
.m1.on{color:var(--brand);border-bottom-color:var(--brand)}
/* 2차 */
.top3{display:flex;gap:4px;padding:7px 14px;background:var(--panel2);border-top:1px solid var(--line2);overflow-x:auto;scrollbar-width:none}
.top3::-webkit-scrollbar{display:none}
.m2{padding:5px 11px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--t2);cursor:pointer;white-space:nowrap;font-size:13.5px}
.m2:hover{border-color:var(--brand);color:var(--brand)}
.m2.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.m2.soon{opacity:.55}

/* ── 뼈대 ──────────────────────────────────────────────────────── */
.wrap{display:grid;grid-template-columns:196px minmax(0,1fr);gap:0;align-items:start}
@media (max-width:900px){ .wrap{grid-template-columns:minmax(0,1fr)} aside{display:none} }
aside{position:sticky;top:104px;padding:14px 10px;border-right:1px solid var(--line);min-height:calc(100vh - 104px)}
.sgrp{margin:0 0 14px}
.sgrp h4{margin:0 0 6px;padding:0 8px;font-size:11.5px;font-weight:700;color:var(--t3);letter-spacing:.4px}
.s1{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;padding:7px 9px;border:0;border-radius:8px;background:transparent;color:var(--t2);cursor:pointer;text-align:left;font-size:13.5px}
.s1:hover{background:var(--mute-bg);color:var(--t1)}
.s1.on{background:var(--brand-bg);color:var(--brand);font-weight:700}
.s1 em{font-style:normal;font-size:11.5px;color:var(--t3);font-variant-numeric:tabular-nums}
main{padding:16px 18px 60px;min-width:0}

/* ── 공통 요소 ─────────────────────────────────────────────────── */
.crumb{font-size:12.5px;color:var(--t3);margin:0 0 6px}
.crumb b{color:var(--t2);font-weight:600}
.h1row{display:flex;align-items:baseline;flex-wrap:wrap;gap:10px;margin:0 0 12px}
h1{margin:0;font-size:21px;letter-spacing:-.4px}
.cnt{font-size:13.5px;color:var(--t2)}
.cnt b{color:var(--t1)}
.cnt .hot{color:var(--warn)}

.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.bar input[type=search],.bar select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.bar input[type=search]{flex:1;min-width:180px}
.btn{padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--t2);cursor:pointer;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.btn.pri:hover{filter:brightness(1.06);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:12.5px}

.monwrap{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 14px;align-items:start}
.monwrap4{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:0 0 14px;align-items:start}
@media(max-width:1000px){.monwrap,.monwrap4{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 14px}
.kpi{padding:12px 13px;border:1px solid var(--line);border-radius:11px;background:var(--panel);box-shadow:var(--shadow);cursor:pointer;text-align:left}
.kpi:hover{border-color:var(--brand)}
.kpi span{display:block;font-size:12.5px;color:var(--t2);margin:0 0 3px}
.kpi b{font-size:24px;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.kpi.w b{color:var(--warn)} .kpi.b b{color:var(--bad)} .kpi.g b{color:var(--ok)}

.card{border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:var(--shadow);overflow:hidden}
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th,td{padding:9px 10px;text-align:left;font-size:13.5px;border-bottom:1px solid var(--line2);vertical-align:top}
th{background:var(--panel2);color:var(--t2);font-weight:600;font-size:12.5px;white-space:nowrap;position:sticky;top:0;z-index:2}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--panel2)}
tbody tr.sel{background:var(--brand-bg)}
td .ell{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)}
.p-warn{background:var(--warn-bg);color:var(--warn)}
.p-bad{background:var(--bad-bg);color:var(--bad)}
.p-mute{background:var(--mute-bg);color:var(--mute)}
.p-brand{background:var(--brand-bg);color:var(--brand)}
.rowacts{display:flex;flex-wrap:wrap;gap:3px}
.rowacts .btn{padding:2px 7px;font-size:11.5px}

/* 상세 패널 */
.split{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.split.open{grid-template-columns:minmax(0,1fr) minmax(320px,430px)}
@media (max-width:1200px){ .split.open{grid-template-columns:minmax(0,1fr)} }
.side{border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:var(--shadow);position:sticky;top:118px;max-height:calc(100vh - 140px);overflow:auto}
.side h3{margin:0;padding:12px 14px;border-bottom:1px solid var(--line);font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:0;background:var(--panel)}
.sbody{padding:12px 14px}
.kv{display:grid;grid-template-columns:86px minmax(0,1fr);gap:5px 10px;font-size:13.5px;margin:0 0 12px}
.kv dt{color:var(--t3)}
.kv dd{margin:0;word-break:break-word}
.sec{margin:0 0 14px;padding:0 0 12px;border-bottom:1px dashed var(--line)}
.sec:last-child{border-bottom:0}
.sec h4{margin:0 0 7px;font-size:12.5px;color:var(--t3);letter-spacing:.3px}
pre.raw{margin:0;padding:10px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;font:12.5px/1.6 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word;max-height:230px;overflow:auto}
.note{padding:9px 11px;border-radius:9px;font-size:13px;margin:0 0 10px}
.note.w{background:var(--warn-bg);color:var(--warn)}
.note.b{background:var(--bad-bg);color:var(--bad)}
.note.g{background:var(--ok-bg);color:var(--ok)}
.note.i{background:var(--brand-bg);color:var(--brand)}
.steps{margin:0;padding:0;list-style:none;font-size:13px}
.steps li{display:flex;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line2)}
.steps li:last-child{border-bottom:0}
.steps i{font-style:normal;flex-shrink:0;width:17px;text-align:center}
.steps span{color:var(--t2)}
.steps b{color:var(--t1)}
.empty{padding:36px 16px;text-align:center;color:var(--t3);font-size:13.5px}
.foot{margin:16px 0 0;font-size:12px;color:var(--t3);text-align:center}
.actbar{position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:6px;padding:9px 12px;background:var(--panel);border-top:1px solid var(--line);margin:0}
.hidden{display:none!important}
.soonbox{padding:34px 18px;text-align:center;color:var(--t2)}
.soonbox b{display:block;font-size:17px;color:var(--t1);margin:0 0 6px}
.chk{width:15px;height:15px;cursor:pointer}
.srchg{margin:0 0 12px}
.srchg h4{margin:0 0 6px;font-size:12.5px;color:var(--t3)}
.srow{padding:7px 10px;border:1px solid var(--line);border-radius:8px;margin:0 0 5px;font-size:13.5px;cursor:pointer;background:var(--panel)}
.srow:hover{border-color:var(--brand)}
</style>
</head>
<body>

<header>
  <div class="top1">
    <div class="logo"><i>B</i><span>브리즈 ERP</span></div>
    <div class="gsearch">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="매물번호 · 건물명 · 주소 · 호실 · 고객명 · 전화번호 · 임대인 통합검색" autocomplete="off">
    </div>
    <div class="tools">
      <button class="tbtn" id="btnAi" title="AI 지원">AI</button>
      <button class="tbtn" id="btnBell" title="알림">🔔</button>
      <button class="tbtn" id="btnRecent" title="최근 업무">최근</button>
      <button class="tbtn" id="btnFav" title="즐겨찾기">★</button>
      <button class="tbtn" id="btnTheme" title="테마 (흰색 → 다크 → 시스템)">◐</button>
      <button class="tbtn" id="btnHelp" title="도움말">?</button>
      <span class="who"><b id="whoName">대표</b><span id="whoRole" style="color:var(--t3)">관리자</span></span>
      <button class="tbtn" id="btnOut" title="로그아웃">↪</button>
    </div>
  </div>
  <nav class="top2" id="nav1"></nav>
  <nav class="top3" id="nav2"></nav>
</header>

<div class="wrap">
  <aside id="side"></aside>
  <main id="main"></main>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   브리즈 ERP 0.1 — 새 화면(별도 파일). index.html · saas.html 은 고치지 않았다.
   데이터는 전부 기존 CRM 시트/GAS 를 그대로 읽는다(action=inboxList · getAll).
   🔴 이 화면은 아직 아무것도 저장하지 않는다(쓰기 0).
   ═══════════════════════════════════════════════════════════════════ */
var ERP_VER = '1.9.0';
var ERP_BUILD = '2026-09-12 15:29';
var REPO = 'eya170823-rgb/crm';

/* ── 저장소 접근(기존 CRM 과 같은 열쇠를 쓴다) ───────────────────── */
function gsUrl(){ try{ return localStorage.getItem('crm_gs_url') || ''; }catch(e){ return ''; } }
function gsTok(){ try{ return localStorage.getItem('crm_gs_token') || ''; }catch(e){ return ''; } }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
function sq(s){ return String(s==null?'':s).replace(/\s+/g,''); }
function nDigit(s){ return String(s==null?'':s).replace(/\D/g,''); }

/* ── 테마 ──────────────────────────────────────────────────────── */
var THEMES = ['light','dark','system'];
function themeGet(){ try{ return localStorage.getItem('erp_theme') || 'system'; }catch(e){ return 'system'; } }
function themeSet(t){
  document.documentElement.setAttribute('data-theme', t);
  try{ localStorage.setItem('erp_theme', t); }catch(e){}
  var b = document.getElementById('btnTheme');
  if(b) b.textContent = t === 'light' ? '☀' : (t === 'dark' ? '☾' : '◐');
  if(b) b.title = '테마: ' + ({light:'흰색',dark:'다크',system:'시스템'})[t] + ' (눌러서 변경)';
}
themeSet(themeGet());
document.getElementById('btnTheme').onclick = function(){
  themeSet(THEMES[(THEMES.indexOf(themeGet()) + 1) % 3]);
};

/* ── 메뉴 (상단 8 대분류 → 2차) ─────────────────────────────────── */
var MENU = [
  ['today','오늘업무',[['today','오늘 할 일',1]]],
  ['crm','영업CRM',[['inbox','통합 인입함',1],['cust','고객 명부',1],['lead','상담·리드',0],['visit','임장',0]]],
  ['ops','운영부',[['photo','촬영 필요',1],['listing','매물장',0],['vac','공실 승인함',0],['landlord','임대인 명부',0]]],
  ['ad','광고·마케팅',[['admgr','광고관리',1],['mkt','마케팅',1],['adstat','광고 성과',0]]],
  ['deal','계약·정산',[['contract','계약',1],['settle','수납·정산',1],['doc','공부·서류',0]]],
  ['group','그룹웨어',[['gw','업무·결재',1],['academy','아카데미',1],['board','공지',0]]],
  ['data','데이터센터',[['stat','현황·품질',1],['collect','수집매물',0],['bldg','건물·대장',0]]],
  ['admin','관리부',[['base','기본관리',1],['auto','자동화관리',1],['staff','직원·권한',1],['log','변경이력',0]]]
];
var CUR = { m1:'today', m2:'today' };

function drawNav(){
  document.getElementById('nav1').innerHTML = MENU.map(function(g){
    return '<button class="m1' + (g[0]===CUR.m1?' on':'') + '" data-m1="' + g[0] + '">' + esc(g[1]) + '</button>';
  }).join('');
  var g = MENU.filter(function(x){ return x[0]===CUR.m1; })[0] || MENU[0];
  document.getElementById('nav2').innerHTML = g[2].map(function(s){
    return '<button class="m2' + (s[0]===CUR.m2?' on':'') + (s[2]?'':' soon') + '" data-m2="' + s[0] + '">'
      + esc(s[1]) + (s[2] ? '' : ' <span style="font-size:11px">준비중</span>') + '</button>';
  }).join('');
  document.querySelectorAll('[data-m1]').forEach(function(b){
    b.onclick = function(){
      CUR.m1 = b.getAttribute('data-m1');
      var gg = MENU.filter(function(x){ return x[0]===CUR.m1; })[0];
      CUR.m2 = gg[2][0][0];
      drawNav(); route();
    };
  });
  document.querySelectorAll('[data-m2]').forEach(function(b){
    b.onclick = function(){ CUR.m2 = b.getAttribute('data-m2'); drawNav(); route(); };
  });
  drawSide();
}
function drawSide(){
  var g = MENU.filter(function(x){ return x[0]===CUR.m1; })[0] || MENU[0];
  var n = (DB.inbox||[]).filter(function(r){ return !r.reg; }).length;
  document.getElementById('side').innerHTML =
    '<div class="sgrp"><h4>' + esc(g[1]) + '</h4>' +
    g[2].map(function(s){
      var badge = (s[0]==='inbox' && n) ? '<em>' + n + '</em>' : (s[2] ? '' : '<em>준비중</em>');
      return '<button class="s1' + (s[0]===CUR.m2?' on':'') + '" data-s="' + s[0] + '">'
        + '<span>' + esc(s[1]) + '</span>' + badge + '</button>';
    }).join('') + '</div>' +
    '<div class="sgrp"><h4>바로가기</h4>' +
    '<button class="s1" onclick="location.href=\'./saas.html\'"><span>기존 SaaS 화면</span></button>' +
    '<button class="s1" onclick="location.href=\'./index.html\'"><span>기존 CRM 화면</span></button>' +
    '</div>';
  document.querySelectorAll('[data-s]').forEach(function(b){
    b.onclick = function(){ CUR.m2 = b.getAttribute('data-s'); drawNav(); route(); };
  });
}

/* ── 데이터 ────────────────────────────────────────────────────── */
var DB = { inbox:null, listings:null, landlords:null, contracts:null, customers:null,
           err:'', errKind:'', ldErr:'', inErr:'', loading:false };

async function jget(params){
  var u = gsUrl(), t = gsTok();
  if(!u || !t) throw new Error('NOKEY');
  var qs = Object.keys(params).map(function(k){
    return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]); }).join('&');
  var r = await fetch(u + '?' + qs + '&token=' + encodeURIComponent(t) + '&t=' + Date.now());
  var j = await r.json();
  if(!j || !j.ok) throw new Error((j && j.error) || '불러오지 못했습니다');
  return j;
}
async function loadAll(force){
  if(DB.loading) return;
  if(DB.listings && !force) return;
  DB.loading = true; DB.err = ''; DB.ldErr = ''; DB.inErr = '';
  /* 🔴 자료원마다 따로 읽는다.
     예전에는 하나의 try 로 묶여 있어, 임대인(4,075건)에서 GAS 가 한 번 실패하면
     **인입함까지 통째로 못 읽었다**(2026-09-12 실측). 월요일 아침에 그러면
     화면에 "못 읽었습니다" 밖에 안 남는다. 이제 실패한 자료원만 실패로 적는다. */
  await loadOne('listings', async function(){
    var b = await jgetTry({ action:'getAll', type:'listings' });
    /* 🔴 시트에는 ads 칸이 없다 — adsFlat 한 칸에 눌러 담겨 있다.
       풀어 주지 않으면 이미 올라가 있는 광고가 전부 '미게시'로 보인다. */
    DB.listings = (b.data || b.result || []).map(adsRestore);
  });
  try{ route(); }catch(e0){}            /* 매물만으로도 화면이 쓸모 있다 */
  await loadOne('landlords', async function(){
    var c = await jgetTry({ action:'getAll', type:'landlords' });

  });
  try{ route(); }catch(e1){}
  /* 200건이면 2주치뿐이라 '계약완료 문자' 대조를 못 한다 — 500건까지 본다 */
  await loadOne('inbox', async function(){
    /* 🔴 쪽넘김으로 **전부** 읽는다. 최신 500줄만 읽으면 그 밖의 문자를
       "없는 것" 으로 보게 되고, 계약완료 판정·중복검사가 틀린다.
       한 쪽 500줄 · 최대 12쪽(6,000줄). 거기서 끊기면 끊겼다고 적는다. */
    var inRaw = [], off = 0, pages = 0, more = true, cut = false, tot = 0;
    while(more){
      var a = await jgetTry({ action:'inboxList', limit:500, offset:off });
      var R = a.result || {};
      var got = R.rows || [];
      inRaw = inRaw.concat(got);
      tot = R.total || tot;
      pages++;
      more = !!R.more && got.length > 0;
      off += got.length;
      if(more && pages >= 12){ cut = true; break; }
      /* 🔴 GAS 는 연달아 부르면 자주 한 번 실패한다(이 프로젝트의 오래된 문제).
         쪽마다 잠깐 쉬어 준다 — 쉬지 않으면 뒤따르는 다른 자료까지 못 읽는다. */
      if(more) await new Promise(function(r){ setTimeout(r, 600); });
    }
    DB.inbox = inDedup(inRaw);            /* 🔴 같은 문자 여러 줄을 화면에서만 묶는다 */
    DB.inboxRaw = inRaw.length;
    DB.inboxDup = inRaw.length - DB.inbox.length;
    DB.inboxPages = pages;
    DB.inboxCut = cut;                    /* 끊겼으면 화면에 그대로 적는다 */
    DB.inboxTotal = tot || inRaw.length;
  });
  DB.loading = false;
}
/* 🔴 GAS 는 연달아 부르면 자주 한 번 실패한다(이 프로젝트의 오래된 문제).
   한 번 더 시도해 보고, 그래도 안 되면 그때 실패로 적는다. */
async function jgetTry(q, n){
  var last;
  /* 🔴 세 번까지 물어본다 (2026-09-12 실측으로 늘렸다).
     한참 쉬었다 처음 부르면 GAS 가 큰 응답(임대인 4,075건)에서 한 번 죽는다.
     새 브라우저 프로필 3회 연속 시험: 1회 임대인 실패(120초) · 2·3회 전부 통과(24초).
     두 번으로는 부족했다. 기다리는 시간은 1.5초 → 4초 → 8초 로 늘린다. */
  for(var i = 0; i < (n || 3); i++){
    try{ return await jget(q); }
    catch(e){
      last = e;
      if(String(e && e.message || '') === 'NOKEY') throw e;   /* 토큰 없음은 다시 해도 같다 */
      if(i + 1 >= (n || 3)) break;
      await new Promise(function(r){ setTimeout(r, [1500, 4000, 8000][i] || 8000); });
    }
  }
  throw last;
}
function loadErrWord(e){
  var msg = String((e && e.message) || e || '');
  var kind = (msg === 'NOKEY') ? 'NOKEY'
    : ((msg.indexOf('DOCTYPE') >= 0 || msg.indexOf('valid JSON') >= 0 ||
        msg.indexOf('Unexpected token') >= 0 || msg.indexOf('Failed to fetch') >= 0 ||
        msg.indexOf('NetworkError') >= 0 || msg.indexOf('timeout') >= 0) ? 'SERVER' : 'OTHER');
  var say = (kind === 'NOKEY')
    ? '이 기기에 구글시트 주소·토큰이 없습니다 — 기존 CRM 화면(설정)에서 한 번 넣으면 이 화면도 같이 씁니다.'
    : (kind === 'SERVER')
    ? '구글시트 서버가 지금 응답하지 않습니다. 설정은 그대로입니다 — 잠시 뒤 [다시 불러오기] 를 눌러 주세요.'
    : ('불러오지 못했습니다: ' + msg);
  return { kind: kind, say: say };
}
async function loadOne(what, fn){
  try{ await fn(); }
  catch(e){
    var r = loadErrWord(e);
    if(what === 'listings'){ DB.errKind = r.kind; DB.err = r.say; }
    else if(what === 'landlords') DB.ldErr = r.say;
    else DB.inErr = r.say;
  }
}

/* ═══ 민감정보 가리개 — 비밀번호류는 목록·광고·로그에 내보내지 않는다 ═══ */
var SECRET_RE = [
  /(비\s?밀\s?번\s?호|비번|출입\s?번호|출입\s?코드|현관\s?(비밀)?번호|도어\s?락|도어락)\s*[:은는이가]?\s*([#*0-9][#*0-9\-\s]{2,})/g,
  /공동\s?현관\s*\.?\s*([#*0-9][#*0-9\-\s]{2,})/g
];
/* 🔴 한 번 비밀번호로 잡힌 숫자는 글 **전체**에서 지운다.
   통화는 되묻는다 — "비밀번호 1234입니다 / 1234요?" 뒤쪽이 남으면 가린 뜻이 없다. */
function secretNums(t){
  var s = String(t==null?'':t), nums = {}, m;
  SECRET_RE.forEach(function(re){
    re.lastIndex = 0;
    while((m = re.exec(s))){
      var raw = m[m.length-1] || '';
      var d = raw.replace(/[^0-9]/g,'');
      if(d.length >= 3) nums[d] = 1;
    }
  });
  return Object.keys(nums);
}
function hasSecret(t){ return SECRET_RE.some(function(re){ re.lastIndex=0; return re.test(String(t||'')); }); }
function maskSecret(t){
  var s = String(t==null?'':t);
  SECRET_RE.forEach(function(re){
    re.lastIndex = 0;
    s = s.replace(re, function(m, a, b, c){
      var raw = arguments[arguments.length-3];
      var head = m.slice(0, m.length - String(raw==null?'':raw).length);
      return head + '●●●● [보호됨]';
    });
  });
  /* 같은 숫자가 뒤에서 되풀이돼도 전부 가린다 */
  secretNums(t).forEach(function(d){
    var parts = s.split(d);
    if(parts.length > 1) s = parts.join('●●●●');
  });
  return s;
}
/* 전화번호 — 권한에 따라 가린다(대표는 전체) */
/* 🔴 담당은 이름이 아니라 staffId(listings.agent / customers.agent) 로 다룬다.
   지금 계정은 대표라 id 가 비어 있고, 그때는 전부 다 본다. */
var ME = { role:'admin', name:'대표', id:'' };

/* ═══ 출처 ═══ */
function srcOf(kind, text){
  var k = String(kind||'');
  if(k.indexOf('통화') >= 0) return '통화녹음';
  if(k.indexOf('부재중') >= 0) return '부재중전화';

  if(k.indexOf('백업') >= 0) return 'SMS';

  if(k.indexOf('웹') >= 0) return '웹문의';
  if(k.indexOf('메모') >= 0) return '메모';
  return k || '기타';
}
var SRC_ALL = ['통화녹음','SMS','MMS','메모','웹문의','사진접수','부재중전화','기타'];

/* ═══ AI 추출 — 확신 없으면 비운다(임의값 금지) ═══════════════════ */
function aiExtract(t){
  var s = String(t||'');
  var o = { unit:'', deposit:'', rent:'', feeIncluded:null, kind:'', clean:'', trade:'',
            bldg:'', addr:'', confidence:[], missing:[] };
  var m;
  /* 호실 — 숫자+호 */
  var units = [];
  var re = /(\d{3,4})\s*호/g;
  while((m = re.exec(s))){ if(units.indexOf(m[1] + '호') < 0) units.push(m[1] + '호'); }
  if(units.length === 1){ o.unit = units[0]; o.confidence.push('호실'); }
  else if(units.length > 1){ o.unitCands = units; o.missing.push('호실(여러 개: ' + units.join(',') + ')'); }
  else o.missing.push('호실');
  /* 금액 — "55의 200" = 월세55/보증금200 · "보증금 200" · "월세 55" */
  var mm = s.match(/(\d{2,5})\s*의\s*(\d{2,5})/);
  if(mm){ o.rent = mm[1]; o.deposit = mm[2]; o.confidence.push('보증금·월세'); }
  /* 🔴 대표 메모·임대인 문자에 흔한 "300/55"(보증금/월세) 표기 — 종전엔 못 읽었다(실측).
     먼저 읽은 값은 덮지 않는다. */
  if(!o.deposit && !o.rent){
    var sl = s.match(/(?:^|[^0-9])(\d{2,5})\s*\/\s*(\d{2,5})(?:[^0-9]|$)/);
    if(sl){ o.deposit = sl[1]; o.rent = sl[2]; o.confidence.push('보증금/월세'); }
  }
  if(!o.deposit){ var d1 = s.match(/보증금\s*(\d{2,5})/); if(d1){ o.deposit = d1[1]; o.confidence.push('보증금'); } }
  if(!o.rent){ var r1 = s.match(/(월세|임대료)\s*(\d{2,5})/); if(r1){ o.rent = r1[2]; o.confidence.push('월세'); } }
  if(!o.deposit) o.missing.push('보증금');
  if(!o.rent) o.missing.push('월세');
  /* 관리비 포함 여부 */
  if(/관리비\s*포함/.test(s)){ o.feeIncluded = true; o.confidence.push('관리비 포함'); }
  else if(/관리비/.test(s)) o.missing.push('관리비(금액 불명)');
  else o.missing.push('관리비');
  /* 매물유형 */
  if(/분리형\s*원(룸|인)/.test(s)){ o.kind = '분리형 원룸'; o.confidence.push('매물유형'); }
  else if(/오픈형\s*원룸/.test(s)){ o.kind = '오픈형 원룸'; o.confidence.push('매물유형'); }
  else if(/투룸|1\.5룸/.test(s)){ o.kind = /1\.5/.test(s) ? '1.5룸' : '투룸'; o.confidence.push('매물유형'); }
  else o.missing.push('매물유형');
  /* 퇴실 청소비 */
  var c1 = s.match(/청소비[^0-9]{0,25}?(\d{1,3})\s*만/);
  if(c1){ o.clean = c1[1]; o.confidence.push('퇴실 청소비'); }
  /* 거래유형 */
  if(o.rent) { o.trade = '월세'; o.confidence.push('거래유형'); }
  else if(/전세/.test(s)) o.trade = '전세';
  else if(/매매/.test(s)) o.trade = '매매';
  else o.missing.push('거래유형');
  /* 입주 가능일 — 날짜 꼴이나 "즉시/다음주" 같은 말이 있으면 적는다(없으면 비운다) */
  var mv = s.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일[^0-9]{0,6}(입주|입실)/);
  if(mv) o.moveIn = mv[1] + '월 ' + mv[2] + '일';
  else if(/즉시\s*(입주|입실)|바로\s*(입주|입실|입실됩)/.test(s)) o.moveIn = '즉시';
  else if(/다음\s*주[^0-9]{0,8}(입주|입실)/.test(s)) o.moveIn = '다음 주';
  if(o.moveIn) o.confidence.push('입주 가능일');
  /* 입주가능일·방수·욕실·옵션·주차·반려·전입 — 통화에 없으면 비운다 */
  ['입주가능일','방수','욕실수','옵션','주차','반려동물','전입','외국인'].forEach(function(k){ o.missing.push(k); });
  return o;
}

/* ═══ 건물 대조 — 이름만으로 판단하지 않는다(주소·지번 함께) ═════ */
function bldgTokens(s){
  var t = String(s||'');
  var out = { name:'', jibun:'', dong:'' };
  var j = t.match(/(\d{1,5}-\d{1,4})/); if(j) out.jibun = j[1];
  var d = t.match(/([가-힣]{2,6}(동|리))/); if(d) out.dong = d[1];
  var n = t.replace(/[^가-힣A-Za-z0-9]/g,'');
  out.name = n;
  return out;
}
function matchBuilding(row, ai){
  var hay = [row.name, row.bld, row.text].join(' ');
  var tk = bldgTokens(hay);
  var res = { bldg:'', addr:'', jibun:tk.jibun, dong:tk.dong, listings:[], landlords:[], how:[] };
  /* ① 임대인 명부에서 지번+건물명으로 */
  (DB.landlords||[]).forEach(function(L){
    var apt = sq(L.apt), addr = sq(L.addr);
    if(!apt && !addr) return;
    var hitJibun = tk.jibun && addr.indexOf(sq(tk.jibun)) >= 0;
    var hitName  = apt && hay.replace(/\s/g,'').indexOf(apt) >= 0;
    if(hitJibun && hitName){ res.landlords.push(L); if(res.how.indexOf('지번+건물명') < 0) res.how.push('지번+건물명'); }
    else if(hitJibun){ res.landlords.push(L); if(res.how.indexOf('지번') < 0) res.how.push('지번'); }
    else if(hitName && apt.length >= 3){ res.landlords.push(L); if(res.how.indexOf('건물명') < 0) res.how.push('건물명'); }
  });
  if(res.landlords.length){
    res.bldg = res.landlords[0].apt || '';
    res.addr = res.landlords[0].addr || '';
  }
  /* ② 매물장에서 같은 건물 */
  (DB.listings||[]).forEach(function(o){
    var apt = sq(o.apt);
    if(!apt) return;
    var byName = res.bldg && apt === sq(res.bldg);
    var byJibun = tk.jibun && sq(o.addr).indexOf(sq(tk.jibun)) >= 0;
    if(byName || byJibun) res.listings.push(o);
  });
  if(!res.bldg && res.listings.length) res.bldg = res.listings[0].apt || '';
  return res;
}
/* ═══ 판정 ═══════════════════════════════════════════════════════ */
function judge(ai, bm){
  var r = { code:'REVIEW_REQUIRED', why:'', unit:ai.unit, hit:null, changes:[] };
  if(!ai.unit){
    r.why = ai.unitCands ? ('호실 후보가 여러 개입니다(' + ai.unitCands.join(', ') + ')') : '호실을 읽지 못했습니다';
    return r;
  }
  if(!bm.bldg && !bm.landlords.length && !bm.listings.length){
    r.code = 'NEW_BUILDING'; r.why = '우리 자료에 이 건물이 없습니다'; return r;
  }
  var hits = bm.listings.filter(function(o){ return sq(o.addr2) === sq(ai.unit); });
  if(hits.length > 1){ r.code = 'REVIEW_REQUIRED'; r.why = '같은 호실이 매물장에 ' + hits.length + '건 있습니다'; return r; }
  if(!hits.length){
    r.code = 'NEW';
    r.why = '건물은 우리 자료에 있고(' + (bm.how.join('+') || '대조') + '), 그 호실 매물은 없습니다';
    return r;
  }
  r.hit = hits[0];
  var cmp = [['price', ai.deposit, '보증금'], ['rentAmt', ai.rent, '월세']];
  cmp.forEach(function(c){
    var was = String(r.hit[c[0]] == null ? '' : r.hit[c[0]]).trim();
    var now = String(c[1] || '').trim();
    if(now && was && now !== was) r.changes.push({ f:c[0], label:c[2], from:was, to:now });
  });
  if(r.changes.length){ r.code = 'CHANGE'; r.why = '기존 매물 ' + r.hit.id + ' 과 값이 다릅니다'; }
  else { r.code = 'SAME'; r.why = '기존 매물 ' + r.hit.id + ' 과 같습니다'; }
  return r;
}
/* ═══ 사진 — 드라이브 실측 인덱스(erp-photo-index.json)로 찾는다.
     🔴 같은 건물 다른 호실 사진을 그 호실 사진으로 쓰지 않는다. ═══════ */

/* 🔴 사진 자료를 못 읽었으면 "촬영할 것이 없다" 가 아니라 "못 읽었다" 고 말한다.

/* 건물 폴더 찾기 — 지번이 가장 강한 근거, 건물명은 보조 */
function photoFindBuilding(bm, r){
  if(!PIDX || !PIDX.index) return null;
  var jib = sq(bm.jibun || '');
  var nm  = sq(bm.bldg || '');
  var hay = sq([r && r.name, r && r.bld, bm.bldg].join(' '));
  var byJibun = [], byName = [];
  Object.keys(PIDX.index).forEach(function(k){
    var v = PIDX.index[k];
    if(jib && sq(v.jibun) === jib) byJibun.push(v);
    else if(v.name && sq(v.name).length >= 3 && (nm === sq(v.name) || hay.indexOf(sq(v.name)) >= 0)) byName.push(v);
  });
  if(byJibun.length === 1) return { hit: byJibun[0], how: '지번' };
  if(byJibun.length > 1) return { multi: byJibun, how: '지번(여러 곳)' };
  if(byName.length === 1) return { hit: byName[0], how: '건물명' };
  if(byName.length > 1) return { multi: byName, how: '건물명(여러 곳)' };
  return null;
}
function judgePhoto(j, bm, ai, r){
  var p = { code:'PHOTO_REQUIRED', why:'', note:'', unit:null, others:[], common:0, bldFolder:'' };
  if(!PIDX){ p.code = 'REVIEW_REQUIRED'; p.why = '사진 자료를 아직 불러오지 못했습니다'; return p; }
  if(PIDX.error){ p.code = 'REVIEW_REQUIRED'; p.why = '사진 자료를 읽지 못했습니다: ' + PIDX.error; return p; }
  var f = photoFindBuilding(bm, r);
  if(!f){ p.code = 'PHOTO_REQUIRED'; p.why = '사진 보관함에 이 건물 폴더가 없습니다'; return p; }
  if(f.multi){
    p.code = 'REVIEW_REQUIRED';
    p.why = '같은 이름·지번의 건물 폴더가 ' + f.multi.length + '곳입니다 — 사람이 골라야 합니다';
    return p;
  }
  var b = f.hit;
  p.bldFolder = b.kind + ' / ' + b.dong + ' / ' + b.folder;
  p.common = b.common || 0;
  var unitKey = ai.unit ? sq(ai.unit) : '';
  Object.keys(b.units || {}).forEach(function(u){
    if(unitKey && sq(u) === unitKey) p.unit = { name:u, raw:b.units[u].raw, done:b.units[u].done };
    else p.others.push({ name:u, raw:b.units[u].raw, done:b.units[u].done });
  });
  if(!ai.unit){ p.code = 'REVIEW_REQUIRED'; p.why = '호실을 읽지 못해 호실 사진을 찾을 수 없습니다'; return p; }
  if(p.unit){
    /* 동일 건물 + 동일 호실 = EXACT_UNIT */
    if(p.unit.done > 0){
      p.code = 'PHOTO_READY';
      p.why = 'EXACT_UNIT — ' + p.unit.name + ' 보정완료 ' + p.unit.done + '장(광고 사용 가능)';
    } else {
      p.code = 'REVIEW_REQUIRED';
      p.why = 'EXACT_UNIT — ' + p.unit.name + ' 원본 ' + p.unit.raw + '장은 있으나 보정완료(워터마크) 0장입니다';
    }
    return p;
  }
  /* 같은 건물이지만 그 호실 사진은 없다 */
  if(p.common > 0){
    p.code = 'BUILDING_ONLY';
    p.why = '이 건물 공용부·외관 사진 ' + p.common + '장만 있습니다 — ' + ai.unit + ' 내부 사진은 없습니다';
  } else {
    p.code = 'PHOTO_REQUIRED';
    p.why = '이 건물 폴더에 ' + ai.unit + ' 사진이 없습니다' +
      (p.others.length ? (' (있는 호실: ' + p.others.map(function(o){ return o.name + ' ' + (o.raw + o.done) + '장'; }).join(' · ') + ')') : '');
  }
  p.note = '🔴 같은 건물의 다른 호실 사진은 이 호실 광고사진으로 쓰지 않습니다. ' +
           '건물 외관·공용부(BUILDING_ONLY)는 참고용일 뿐 호실 내부사진으로 올리지 않습니다.';
  return p;
}

/* ═══════════════════════════════════════════════════════════════════
   매물접수 → 광고준비 (2026-09-12 2단계)
   🔴 새 화면·새 메뉴를 만들지 않는다. 아래는 전부 **값을 돌려주는 함수**다.
   🔴 저장·발송·게시 코드가 없다. 매물 상태를 바꾸지 않는다.
   🔴 이미 있는 aiExtract · matchBuilding · judge · judgePhoto · adMissing 을 그대로 쓴다.
   ═══════════════════════════════════════════════════════════════════ */

/* 🔴 건물 "이름" 이 아니라 건물 "종류" 인 값 — 이것으로 건물을 가리지 않는다.
   임대인 명부 apt 칸에 이렇게 적힌 분이 있다(실측). */
var BLDG_KIND = ['다가구주택', '다가구', '단독주택', '단독', '상가주택', '근린생활시설',
                 '아파트', '오피스텔', '빌라', '연립', '도시형생활주택', '투룸', '원룸',
                 '투룸 임대인', '다세대'];
function bldgIsKind(v){
  var t = sq(v);
  if(!t) return true;
  for(var i = 0; i < BLDG_KIND.length; i++){
    if(t === sq(BLDG_KIND[i])) return true;
  }
  /* 종류어만 이어 붙인 것("단독다가구상가주택")도 이름이 아니다 */
  var rest = t;
  BLDG_KIND.forEach(function(k){ rest = rest.split(sq(k)).join(''); });
  return rest.length === 0;
}

/* 광고에 반드시 있어야 하는 값 / 있으면 좋은 값 — AD_GOAL 채널 규격에서 가져온다 */
var INTAKE_REQ = [['dealType','거래유형'],['deposit','보증금'],['building','건물'],
                  ['unit','호실'],['area','면적'],['roomCount','방 수'],
                  ['bathCount','욕실 수'],['floor','층'],['totalFloor','총 층']];
var INTAKE_OPT = [['maintenance','관리비'],['moveInDate','입주 가능일'],
                  ['rent','월세'],['yearlyRent','연세']];

/* 네 갈래를 한 가지 꼴로 — 원본은 rawText 에 그대로 남긴다 */
function intakeEvent(r, forceUnit){
  var src = srcOf(r.kind, r.text);
  var code = (src === '통화녹음' || src === '부재중전화') ? 'CALL'
           : (src === '메모') ? 'MEMO'
           : (src === 'MMS' || src === '사진접수') ? 'MMS' : 'SMS';
  var ai = aiExtract(r.text);
  /* 🔴 호실을 집어서 들어오면 그 호실만 본다(한 줄에 여럿일 때) */
  if(forceUnit){
    ai = JSON.parse(JSON.stringify(ai));
    ai.unit = String(forceUnit);
    ai.unitCands = null;
    ai.missing = (ai.missing || []).filter(function(m){
      return String(m).indexOf('호실') !== 0; });
  }
  var bm = matchBuilding(r, ai);
  var ev = {
    eventId: code + ':' + String(r.row || '') + ':' + String(r.when || '').slice(0, 19),
    source: code, receivedAt: String(r.when || ''), sender: phMask(r.phone),
    rawText: String(r.text || ''),                       /* 🔴 원본 그대로 보존 */
    building: bm.bldg || '', address: bm.addr || '', jibun: bm.jibun || '',
    unit: ai.unit || '', unitCands: ai.unitCands || null,
    dealType: ai.trade || '', deposit: ai.deposit || '', rent: ai.rent || '',
    yearlyRent: '', maintenance: (ai.feeIncluded ? '포함' : ''),
    area: '', roomCount: '', bathCount: '', floor: '', totalFloor: '',
    moveInDate: ai.moveIn || '', kind: ai.kind || '',
    statusHint: 'UNKNOWN', photoRefs: [],
    landlordId: '', listingId: '',
    parseConfidence: ai.confidence.length,
    matchConfidence: 0, matchHow: '', reviewReason: '',
    approvalStatus: 'PENDING',
    _ai: ai, _bm: bm, _row: r
  };
  /* 🔴 임대인이 건물명을 줄여 쓴다("제니" = 에코제니, "히튼" = 에코힐튼).
     matchBuilding 은 이름 전체가 맞아야 붙으므로 그때 건물을 못 찾는다(실측).
     → 보낸 번호로 임대인을 찾아 그 건물을 보탠다. ERP doneAlerts 가 잇는 방식과 같다.
     🔴 matchBuilding 자체는 건드리지 않는다(기존 화면·검산을 그대로 둔다). */
  if(!(bm.landlords || []).length && r && r.phone){
    var byPh = (DB.landlords || []).filter(function(l){ return phHas(l.phone, r.phone); });
    if(byPh.length === 1 && sq(byPh[0].apt) && !bldgIsKind(byPh[0].apt)){
      bm.landlords = byPh;
      bm.bldg = bm.bldg || String(byPh[0].apt || '');
      bm.addr = bm.addr || String(byPh[0].addr || '');
      if(bm.how.indexOf('보낸 번호') < 0) bm.how.push('보낸 번호');
      /* 그 건물 매물도 다시 모은다 */
      var bb = sq(bm.bldg);
      (DB.listings || []).forEach(function(o){
        if(bb && sq(o.apt) === bb && bm.listings.indexOf(o) < 0) bm.listings.push(o);
      });
    }
  }
  var ld = (bm.landlords || [])[0];
  if(ld) ev.landlordId = String(ld.id || ld.phone || '');
  var mp = matchProperty(ev);
  ev.listingId = mp.listingId; ev.matchConfidence = mp.confidence;
  ev.matchHow = mp.how; ev.reviewReason = mp.why; ev._match = mp;
  /* 🔴 건물 이름은 **매물장** 것을 먼저 쓴다.
     임대인 명부 apt 칸에 건물 종류("다가구주택", "단독 다가구 상가주택")가 적힌 분이 있어,
     지번으로 붙으면 그 값이 건물 이름처럼 나왔다(2026-09-12 실측). */
  var hit1 = (mp.hits || [])[0];
  if(hit1 && sq(hit1.apt)) ev.building = String(hit1.apt);
  else if(bldgIsKind(ev.building)) ev.building = '';
  if(hit1 && sq(hit1.addr)) ev.address = String(hit1.addr);
  /* 호실별 최신상태 — 같은 호실의 다른 문자까지 모아서 본다 */
  if(ev.unit) ev.statusHint = statusHintOf(intakeSameUnitRows(ev), ev.unit).code;
  return ev;
}
/* 🔴 한 줄에 호실이 여럿이면 **호실마다** 접수후보를 만든다.
   "301호는 계약됐구요! 402호는 남아있어요" 한 줄이 후보 2건이 된다.
   종전처럼 하나로 두면 호실을 못 읽어 후보가 0건이 됐다(2026-09-12 실측).
   이게 지시 4 "문장 전체 상태를 한 번에 적용 금지" 를 실제로 지키는 길이다. */
function intakeEventsFrom(r){
  var ai0 = aiExtract(r.text);
  var units = ai0.unit ? [ai0.unit] : (ai0.unitCands || []);
  if(units.length <= 1) return [intakeEvent(r)];
  return units.map(function(u){
    var ev = intakeEvent(r, u);
    ev.eventId = ev.eventId + '#' + u;
    ev.fromMultiUnit = units.slice();
    return ev;
  });
}
/* 메모도 같은 길로 보낸다 — 저장만 하고 끝나면 접수가 안 된다 */
function intakeMemo(text, when, who){
  return intakeEvent({ row:'memo', when:String(when || todayStr()), kind:'메모',
                       name:String(who || '대표 메모'), phone:'', bld:'',
                       text:String(text || ''), reg:'' });
}
/* 그 호실을 말한 인입함 줄을 모은다(최신상태 판정용) */
function intakeSameUnitRows(ev){
  var out = [{ when:ev.receivedAt, text:ev.rawText }];
  if(!ev.unit) return out;
  var bk = sq(ev.building);
  (DB.inbox || []).forEach(function(x){
    var t = String(x.text || '');
    if(sq(t).indexOf(sq(ev.unit)) < 0) return;
    /* 🔴 건물이 같다고 확인된 줄만 — 다른 건물 같은 호실을 섞으면 판정이 틀어진다 */
    var same = bk && sq(t).indexOf(bk) >= 0;
    if(!same && ev.landlordId && phMask(x.phone) === ev.sender) same = true;
    if(same) out.push({ when:String(x.when || ''), text:t });
  });
  return out;
}

/* ── 매칭 엔진 하나 — 네 갈래가 모두 이것만 쓴다 ───────────────────
   우선순위
     1 listingId 로 바로 연결        (확신 100)
     2 지번(주소) + 호실 정확히 같음 (확신 90)
     3 건물명 + 호실 정확히 같음     (확신 80)
     4 건물만 같음                   → REVIEW_REQUIRED (확신 40)
     5 건물을 못 찾음                → NEW_BUILDING / REVIEW_REQUIRED
   🔴 호실만 같은 것은 **절대** 붙이지 않는다. "301호" 만으로 다른 건물 301호를
      연결하면 살아 있는 방을 죽이거나 남의 방을 광고한다. */
function matchProperty(ev){
  var out = { listingId:'', confidence:0, how:'', why:'', code:'REVIEW_REQUIRED',
              hits:[], building:ev.building || '' };
  var bm = ev._bm || { listings:[], landlords:[], how:[] };
  if(!ev.unit){
    out.why = ev.unitCands ? ('호실 후보가 여러 개입니다(' + ev.unitCands.join(', ') + ')')
                           : '호실을 읽지 못했습니다';
    return out;
  }
  /* 1 — 이미 붙어 있는 매물번호 */
  if(ev._row && ev._row.listingId){
    var d = (DB.listings || []).filter(function(o){
      return String(o.id) === String(ev._row.listingId); })[0];
    if(d){ out.listingId = String(d.id); out.confidence = 100; out.how = '매물번호 직접';
           out.code = 'MATCH'; out.hits = [d]; return out; }
  }
  if(!bm.listings.length && !bm.landlords.length && !bm.bldg){
    out.code = 'NEW_BUILDING'; out.why = '우리 자료에 이 건물이 없습니다'; return out;
  }
  var u = sq(ev.unit);
  /* 2 — 지번 + 호실 */
  var byJibun = (bm.listings || []).filter(function(o){
    return ev.jibun && sq(o.addr).indexOf(sq(ev.jibun)) >= 0 && sq(o.addr2) === u; });
  /* 3 — 건물명 + 호실 */
  var byName = (bm.listings || []).filter(function(o){
    return sq(o.apt) && sq(o.apt) === sq(bm.bldg) && sq(o.addr2) === u; });
  /* 3.5 — 보낸 번호의 임대인이 가진 매물 중 호실이 같은 것
     🔴 임대인이 건물명을 줄여 써서("제니" = 에코제니) 이름으로 못 붙는 일이 있다(실측).
        보낸 번호는 강한 근거다. 다만 지번·건물명보다 낮게 본다(확신 70) —
        확신 80 아래는 광고준비로 못 넘어가므로 사람이 한 번 본다.
     🔴 호실만 같은 것과는 다르다. 번호가 같은 임대인의 매물만 본다. */
  var bySender = [];
  if(ev._row && ev._row.phone){
    bySender = (DB.listings || []).filter(function(o){
      if(sq(o.addr2) !== u) return false;
      var L = ldOfListing(o);
      return L && phHas(L.phone, ev._row.phone);
    });
  }
  var hits = byJibun.length ? byJibun : (byName.length ? byName : bySender);
  var how = byJibun.length ? '지번+호실'
          : (byName.length ? '건물명+호실' : (bySender.length ? '보낸번호+호실' : ''));
  if(hits.length === 1){
    out.listingId = String(hits[0].id);
    out.confidence = byJibun.length ? 90 : (byName.length ? 80 : 70);
    out.how = how; out.code = 'MATCH'; out.hits = hits;
    return out;
  }
  if(hits.length > 1){
    out.confidence = 50; out.how = how; out.hits = hits; out.code = 'REVIEW_REQUIRED';
    out.why = '같은 건물·같은 호실 매물이 ' + hits.length + '건 있습니다 — 사람이 골라야 합니다';
    return out;
  }
  /* 4 — 건물만 같음 */
  out.confidence = 40; out.how = (bm.how || []).join('+') || '건물';
  out.hits = bm.listings || [];
  out.code = 'NEW';
  out.why = '건물은 우리 자료에 있고(' + out.how + ') 그 호실 매물은 없습니다 — 새 후보';
  return out;
}

/* ── 이미 아는 값은 다시 묻지 않는다 ─────────────────────────────
   접수 문자에서 읽은 값 → 없으면 붙은 매물의 값 → 그래도 없으면 물어본다. */
function intakeNeeds(ev){
  var hit = (ev._match && ev._match.hits && ev._match.hits.length === 1)
            ? ev._match.hits[0] : null;
  var FROM = { dealType:'type', deposit:'price', rent:'rentAmt', building:'apt',
               unit:'addr2', area:'area', roomCount:'rooms', bathCount:'baths',
               floor:'floor', totalFloor:'totalFloor', maintenance:'feeAmt',
               moveInDate:'availDate', yearlyRent:'rentAmt' };
  var known = [], needReq = [], needOpt = [];
  function val(k){
    var v = String(ev[k] == null ? '' : ev[k]).trim();
    if(v) return { v:v, from:'이번 접수' };
    if(hit && FROM[k]){
      var w2 = String(hit[FROM[k]] == null ? '' : hit[FROM[k]]).trim();
      if(w2) return { v:w2, from:'기존 매물 ' + hit.id };
    }
    return null;
  }
  INTAKE_REQ.concat(INTAKE_OPT).forEach(function(f){
    var req = INTAKE_REQ.some(function(x){ return x[0] === f[0]; });
    var g = val(f[0]);
    if(g) known.push({ k:f[0], label:f[1], v:g.v, from:g.from });
    else if(req) needReq.push({ k:f[0], label:f[1] });
    else needOpt.push({ k:f[0], label:f[1] });
  });
  return { known:known, missingRequired:needReq, missingOptional:needOpt,
           askAgain:0, hit:hit };
}

/* ── 중복매물 판정 ──────────────────────────────────────────────── */
function intakeDup(ev){
  var mp = ev._match || {};
  if(mp.code === 'NEW') return { code:'NEW', why:'같은 건물에 그 호실 매물이 없습니다', hit:null };
  if(mp.code === 'NEW_BUILDING') return { code:'NEW_BUILDING', why:mp.why, hit:null };
  if(mp.code !== 'MATCH') return { code:'REVIEW_REQUIRED', why:mp.why || '사람이 봐야 합니다', hit:null };
  var o = (DB.listings || []).filter(function(x){
    return String(x.id) === String(mp.listingId); })[0];
  if(!o) return { code:'REVIEW_REQUIRED', why:'붙인 매물을 다시 찾지 못했습니다', hit:null };
  /* 상태가 달라졌나 — 문자가 말한 최신상태와 매물장 상태 */
  var st = String(o.status || '');
  var tradable = LST_TRADABLE.indexOf(st) >= 0;
  if(ev.statusHint === 'CONTRACT_DONE' && tradable)
    return { code:'STATUS_CHANGE', why:'문자는 계약완료인데 매물장은 ' + st + ' 입니다',
             hit:o, from:st, to:'계약완료' };
  if(ev.statusHint === 'AVAILABLE' && !tradable)
    return { code:'STATUS_CHANGE', why:'문자는 아직 있다는데 매물장은 ' + st + ' 입니다',
             hit:o, from:st, to:'접수' };
  /* 값이 달라졌나 */
  var ch = [];
  [['deposit', 'price', '보증금'], ['rent', 'rentAmt', '월세']].forEach(function(c){
    var now = String(ev[c[0]] || '').trim(), was = String(o[c[1]] == null ? '' : o[c[1]]).trim();
    if(now && was && now !== was) ch.push({ label:c[2], from:was, to:now });
  });
  if(ch.length) return { code:'PRICE_CHANGE', why:'기존 매물과 금액이 다릅니다', hit:o, changes:ch };
  return { code:'SAME', why:'기존 매물 ' + o.id + ' 과 같습니다 — 새로 만들지 않습니다', hit:o };
}

/* ── 사진 세 갈래 ───────────────────────────────────────────────
   EXACT_UNIT            그 호실 사진 — 광고에 쓸 수 있다
   BUILDING_COMMON       건물 공용부 — 공용부로만 쓴다
   OTHER_UNIT_REFERENCE  다른 호실 — 🔴 이 호실 내부사진으로 절대 쓰지 않는다 */
function intakePhoto(ev){
  var ph = judgePhoto(ev._match && ev._match.code === 'MATCH'
             ? { code:'SAME', hit:(ev._match.hits || [])[0] }
             : { code:'NEW', hit:null },
           ev._bm, { unit:ev.unit }, ev._row);
  /* 🔴 judgePhoto 가 돌려주는 칸 이름 그대로 쓴다 — unit.{name,raw,done} · others[].{raw,done}
     광고에 쓸 수 있는 것은 **보정완료(done)** 뿐이다. 원본(raw)만 있으면 아직 못 쓴다. */
  var uDone = (ph.unit && ph.unit.done) ? ph.unit.done : 0;
  var uRaw = (ph.unit && ph.unit.raw) ? ph.unit.raw : 0;
  var others = (ph.others || []).reduce(function(a, x){
    return a + (x.raw || 0) + (x.done || 0); }, 0);
  var out = {
    code: ph.code, why: ph.why || '', note: ph.note || '', folder: ph.bldFolder || '',
    EXACT_UNIT: uDone, EXACT_UNIT_RAW: uRaw, BUILDING_COMMON: ph.common || 0,
    OTHER_UNIT_REFERENCE: others,
    useForAd: uDone > 0 ? 'EXACT_UNIT' : '',
    commonUse: (ph.common || 0) > 0 ? 'BUILDING_COMMON — 공용부·외관으로만' : '',
    blocked: others > 0
      ? ('🔴 같은 건물 다른 호실 사진 ' + others + '장 — 이 호실 광고에 쓰지 않습니다') : '',
    askShoot: (uDone === 0 && uRaw === 0 && !phIdxErr())
  };
  if(phIdxErr()){ out.code = 'REVIEW_REQUIRED'; out.why = phIdxErr(); out.askShoot = false; }
  return out;
}

/* ── 광고준비 판정 ─────────────────────────────────────────────
   DATA_REQUIRED / PHOTO_REQUIRED / REVIEW_REQUIRED / AD_READY_PREVIEW
   🔴 대표 승인 전에는 AD_READY 가 되지 않는다 — PREVIEW 까지만. */
function intakeAd(ev){
  var nd = intakeNeeds(ev), dup = intakeDup(ev), ph = intakePhoto(ev);
  var r = { code:'REVIEW_REQUIRED', why:'', needs:nd, dup:dup, photo:ph, blockers:[] };
  if(ev.statusHint === 'CONTRACT_DONE'){
    r.code = 'REVIEW_REQUIRED';
    r.blockers.push('계약완료 문자가 있습니다 — 광고 대상이 아닙니다');
    r.why = r.blockers[0]; return r;
  }
  if(dup.code === 'REVIEW_REQUIRED' || dup.code === 'NEW_BUILDING'){
    r.code = 'REVIEW_REQUIRED'; r.blockers.push(dup.why); r.why = dup.why; return r;
  }
  if(ev.matchConfidence < 80 && dup.code !== 'NEW'){
    r.code = 'REVIEW_REQUIRED';
    r.blockers.push('매물 연결이 확실하지 않습니다(' + ev.matchConfidence + ')');
    r.why = r.blockers[0]; return r;
  }
  if(nd.missingRequired.length){
    r.code = 'DATA_REQUIRED';
    r.why = '광고 필수값이 비어 있습니다 — ' +
            nd.missingRequired.map(function(x){ return x.label; }).join('·');
    r.blockers.push(r.why); return r;
  }
  if(ph.code === 'REVIEW_REQUIRED'){
    /* 사진 자료를 못 읽었거나, 그 호실 원본은 있는데 보정완료가 0장인 경우 */
    r.code = 'REVIEW_REQUIRED'; r.why = ph.why; r.blockers.push(ph.why); return r;
  }
  if(!ph.EXACT_UNIT){
    r.code = 'PHOTO_REQUIRED';
    r.why = (ph.code === 'BUILDING_ONLY'
             ? '건물 공용부 사진만 있습니다 — 이 호실 내부사진이 없습니다'
             : '이 호실 사진이 없습니다') +
            (ph.OTHER_UNIT_REFERENCE ? (' ' + ph.blocked) : '');
    r.blockers.push(r.why); return r;
  }
  r.code = (ev.approvalStatus === 'APPROVED') ? 'AD_READY' : 'AD_READY_PREVIEW';
  r.why = (r.code === 'AD_READY') ? '광고 가능합니다'
        : '필수값·사진이 갖춰졌습니다 — 🔴 대표 승인을 누르면 광고 가능';
  return r;
}

/* ── 채널별 광고문구 준비 — 🔴 사실만 쓴다. 게시하지 않는다 ────────
   없는 옵션·장점을 지어내지 않고, 허위 희소성("마지막 1실")을 쓰지 않는다. */
function adCopyPrep(ev){
  var ad = intakeAd(ev);
  if(ad.code !== 'AD_READY_PREVIEW' && ad.code !== 'AD_READY')
    return { ok:false, why:'광고준비가 안 됐습니다 — ' + ad.why, drafts:[] };
  var k = {}, nd = ad.needs;
  nd.known.forEach(function(x){ k[x.k] = x.v; });
  var NBSP = ' ', LF = String.fromCharCode(10);   /* 🔴 ERP 에 LF 전역은 없다 */
  /* 단위를 붙인다 — 이미 붙어 있으면 그대로 둔다(값은 지어내지 않는다) */
  function unit1(v, u){
    var t = String(v == null ? '' : v).trim();
    if(!t) return '';
    return (t.indexOf(u) >= 0) ? t : (t + u);
  }
  function money(){
    var d = k.deposit ? ('보증금 ' + unit1(k.deposit, '만')) : '';
    var rr = k.rent ? ('월세 ' + unit1(k.rent, '만')) : '';
    return [d, rr].filter(Boolean).join(' / ');
  }
  var facts = [];
  if(k.area) facts.push('전용 ' + unit1(k.area, '㎡'));
  if(k.roomCount) facts.push('방 ' + unit1(k.roomCount, '개'));
  if(k.bathCount) facts.push('욕실 ' + unit1(k.bathCount, '개'));
  if(k.floor){
    var fl = unit1(k.floor, '층');
    facts.push(k.totalFloor ? (fl + ' (총 ' + unit1(k.totalFloor, '층') + ')') : fl);
  }
  if(k.maintenance) facts.push('관리비 ' +
    (/^[0-9]+$/.test(String(k.maintenance).trim()) ? unit1(k.maintenance, '만') : k.maintenance));
  if(k.moveInDate) facts.push('입주 ' + k.moveInDate);
  var head = (k.building || '') + ' ' + (k.unit || '');
  /* 제목에 "월세 보증금…/월세…" 처럼 겹쳐 적히지 않게 — 금액 문구가 이미 말하면 뺀다 */
  var dealWord = (k.dealType && money().indexOf(k.dealType) < 0) ? k.dealType : '';
  var DR = [
    { ch:'daangn', name:'당근',
      title: (head + ' ' + dealWord + ' ' + money()).split('  ').join(' ').trim(),
      body: head + NBSP + (k.dealType || '') + ' ' + money() + LF + facts.join(' · ') +
            LF + '※ 사진은 해당 호실 실사입니다.' },
    { ch:'zigbang', name:'직방',
      title: ((k.building || '') + ' ' + dealWord + ' ' + money()).split('  ').join(' ').trim(),
      body: facts.join(' / ') + LF + '문의 주시면 방 보는 시간 맞춰 드립니다.' },
    { ch:'dabang', name:'다방',
      title: (dealWord + ' ' + money() + ' ' + (k.building || '')).split('  ').join(' ').trim(),
      body: facts.join(', ') },
    { ch:'naver', name:'네이버',
      title: (k.building || '') + ' ' + (k.unit || '') + ' ' + (k.dealType || ''),
      body: '보증금/월세 ' + money() + LF + facts.join(LF) },
    { ch:'blog', name:'블로그',
      title: (k.building || '') + ' ' + (k.unit || '') + ' 실제 조건 정리',
      body: head + ' ' + (k.dealType || '') + ' ' + money() + LF + facts.join(LF) +
            LF + '사진은 해당 호실에서 직접 찍은 것만 올립니다.' }
  ];
  /* 🔴 지어낸 말이 섞였는지 스스로 본다 */
  var BAN = ['마지막', '단 한', '급매', '최저가', '무조건', '역세권 확정', '곧 마감'];
  var bad = [];
  DR.forEach(function(d){
    BAN.forEach(function(b){
      if((d.title + d.body).indexOf(b) >= 0) bad.push(d.ch + ':' + b);
    });
  });
  return { ok:true, why:'', drafts:DR, banned:bad, facts:facts,
           note:'🔴 복사해서 쓰는 초안입니다. 이 함수는 게시하지 않습니다.' };
}

/* ── 인입함 전체를 접수후보로 — 화면이 아니라 값만 돌려준다 ───────── */
function intakeAll(limit){
  var out = [];
  (DB.inbox || []).forEach(function(r){
    var t = String(r.text || '');
    if(!t) return;
    if(!/\d{3,4}\s*호/.test(t)) return;          /* 호실이 없으면 매물 접수가 아니다 */
    intakeEventsFrom(r).forEach(function(ev){
      ev.ad = intakeAd(ev);
      out.push(ev);
    });
  });
  out.sort(function(a, b){ return String(b.receivedAt).localeCompare(String(a.receivedAt)); });
  return limit ? out.slice(0, limit) : out;
}

/* ── 인입함 중복 줄 묶기 (2026-09-12 실측으로 들어온 수정) ──────────────
   휴대폰 백업 파일 7개가 전부 '전체 백업' 이어서, 회수가 돌 때마다 같은 문자를
   다시 넣었다. 받아온 500줄 중 296줄이 덧줄이고, 한 번호는 122줄이 고유 27줄이었다.
   '더존빌301호는 계약됐구요' 문자는 5개 파일에 있어 인입함에 5줄로 있다.
   🔴 시트는 그대로 두고 **화면에서만** 한 줄로 묶는다. 안 묶으면 같은 방을
      다섯 번 확인하게 되고, 미처리 건수가 2.5배로 보인다.
   묶은 줄수는 r.dup 에 남겨 화면에 그대로 적는다(숨기지 않는다). */
/* 🔴 묶는 열쇠 — 보낸이 + 정확한 시각(초까지) + 접수경로 + 본문 전체.
   분 단위·앞 40자만 쓰면 **서로 다른 문자가 합쳐진다**(같은 사람이 같은 분에
   두 통 보내는 일은 흔하다). 인입함의 when 은 초까지 있다(실측 19자).
   ⚠ 서버가 본문을 400자에서 자르므로, 400자가 넘는 문자는 앞 400자까지만 비교된다.
     같은 사람이 같은 **초**에 앞 400자가 똑같은 긴 문자를 두 통 보낸 경우만
     합쳐질 수 있다 — 실측 0건이고, 그런 일이 생기면 화면에 묶음 수로 드러난다. */
function inKeyOf(r){
  var o = r || {};
  return String(o.when || '') + '|' + phDigits(o.phone) + '|' +
         String(o.kind || '') + '|' + sq(o.text);
}
function inDedup(rows){
  var by = {}, order = [];
  (rows || []).forEach(function(r){
    var k = inKeyOf(r);
    if(!by[k]){ r.dup = 1; by[k] = r; order.push(k); return; }
    var n = (by[k].dup || 1) + 1;
    /* 처리 표시가 있는 줄을 남긴다 — 이미 처리한 일을 다시 시키지 않는다 */
    if(!sq(by[k].reg) && sq(r.reg)) by[k] = r;
    by[k].dup = n;
  });
  var rows = order.map(function(k){ return by[k]; });
  return inPathMerge(rows);
}
/* 🔴 같은 문자 한 통이 실시간(MacroDroid) 과 백업 파일 두 경로로 들어와 두 줄이 된다.
   실측 2026-09-12: 전체 1,052줄 중 27줄이 그런 경우였다(2~4초 차이).
   조건을 좁게 잡는다 — 같은 번호 · 본문이 **전체가** 같다 · 10초 이내 ·
   접수경로가 다르다. 네 가지를 다 만족할 때만 묶는다.
   같은 경로로 두 번 온 것은 묶지 않는다(그건 정말 두 통일 수 있다). */
function inSecs(v){
  var t = String(v || '');
  if(t.length < 19) return null;
  var y = +t.slice(0, 4), mo = +t.slice(5, 7), d = +t.slice(8, 10);
  var hh = +t.slice(11, 13), mi = +t.slice(14, 16), ss = +t.slice(17, 19);
  if(!y || !mo || !d) return null;
  return Date.UTC(y, mo - 1, d, hh, mi, ss) / 1000;
}
function inIsBackup(k){ return String(k || '').indexOf('백업') >= 0; }
function inPathMerge(rows){
  var byBody = {};
  rows.forEach(function(r, i){
    var k = phDigits(r.phone) + '|' + sq(r.text);
    (byBody[k] = byBody[k] || []).push(i);
  });
  var drop = {};
  Object.keys(byBody).forEach(function(k){
    var idx = byBody[k];
    if(idx.length < 2) return;
    for(var a = 0; a < idx.length; a++){
      for(var b = a + 1; b < idx.length; b++){
        var x = rows[idx[a]], y = rows[idx[b]];
        if(drop[idx[a]] || drop[idx[b]]) continue;
        if(inIsBackup(x.kind) === inIsBackup(y.kind)) continue;   /* 경로가 같으면 안 묶는다 */
        var tx = inSecs(x.when), ty = inSecs(y.when);
        if(tx === null || ty === null) continue;
        if(Math.abs(tx - ty) > 10) continue;                      /* 10초 넘으면 안 묶는다 */
        /* 처리 표시가 있는 줄을 남긴다. 둘 다 없으면 실시간 줄을 남긴다(원본 경로). */
        var keepA = sq(x.reg) ? true : (sq(y.reg) ? false : !inIsBackup(x.kind));
        var keep = keepA ? x : y, gone = keepA ? y : x;
        keep.dup = (keep.dup || 1) + (gone.dup || 1);
        keep.dupPath = (keep.dupPath || 0) + 1;
        drop[keepA ? idx[b] : idx[a]] = 1;
      }
    }
  });
  var out = [];
  rows.forEach(function(r, i){ if(!drop[i]) out.push(r); });
  return out;
}

    rows = rows.filter(function(r){

    });

  return rows;
}

      : '<button class="btn" disabled title="신규(NEW) 후보만 접수합니다">매물 접수</button>') +
    '<button class="btn" disabled title="다음 단계">촬영 업무 만들기</button>' +
    '<button class="btn" disabled title="다음 단계">확인필요로 보내기</button>' +
    '</div><div style="margin-top:8px;font-size:12.5px;color:var(--t3)">' +
    (j.code === 'NEW'
      ? '[매물 접수]를 누르면 <b>확인창</b>이 뜨고, 눌러야 매물장에 <b>이 한 건만</b> 새로 등록됩니다. 기존 매물은 손대지 않습니다.'
      : '지금은 신규(NEW) 후보만 접수합니다.') + '</div>';
  if(LASTSAVE) h += '<div class="note g">✅ ' + esc(LASTSAVE.when) + ' 등록 완료 · <b>' +
    esc(LASTSAVE.id) + '</b> · 매물 ' + LASTSAVE.before + ' → ' + LASTSAVE.after + '건 · 같은 호실 ' +
    LASTSAVE.dup + '건</div>';

  /* 원문 */
  h += '<div class="sec"><h4>원문' + (secret ? ' (비밀번호 가림)' : '') + '</h4>' +
    '<pre class="raw">' + esc(maskSecret(r.text)) + '</pre></div>';

  h += '</div></div>';
  return h;
}

/* ═══════════════════════════════════════════════════════════════════
   매물 접수 — 🔴 실제로 저장한다(신규 1건). 기존 매물은 건드리지 않는다.
   · 저장 직전에 시트를 다시 읽어 같은 건물·호실이 이미 있는지 확인한다
   · 사람이 확인창에서 눌러야만 보낸다
   · 단건 upsert 1회만 — 전체 저장(saveAll) 을 쓰지 않는다
   · 🔴 비밀번호 같은 민감정보는 어떤 칸에도 넣지 않는다
   ═══════════════════════════════════════════════════════════════════ */
var KIND_CODE = { '오픈형 원룸':'R', '분리형 원룸':'R', '빌라(투룸 이상)':'B', '아파트':'A',
                  '오피스텔':'R', '주택':'D', '상가':'S', '사무실':'F', '건물':'G',
                  '공장/창고':'C', '토지':'T', '기타':'X' };
var DEAD_ST = ['거래완료', '계약완료'];
var SAVING = false;
var LASTSAVE = null;

function pad2(n){ return (n < 10 ? '0' : '') + n; }
function todayStr(){
  var d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
}
function newListingId(kind, list){
  var p = KIND_CODE[kind] || 'X';
  var d = new Date();
  var ymd = String(d.getFullYear()).slice(2) + pad2(d.getMonth()+1) + pad2(d.getDate());
  var seq = 1, id;
  do { id = p + ymd + '-' + pad2(seq); seq++; }
  while(list.some(function(l){ return String(l.id) === id; }));
  return id;
}
function dupCheck(list, apt, addr2){
  var same = list.filter(function(o){
    return sq(o.apt) === sq(apt) && sq(o.addr2) === sq(addr2); });
  return { all: same, alive: same.filter(function(o){ return DEAD_ST.indexOf(String(o.status||'')) < 0; }) };
}
/* HEADERS 에 있는 칸만 채운다 — 새 DB 칸을 만들지 않는다 */
function buildListing(r, ai, bm, id){
  var nl = String.fromCharCode(10);
  var lines = ['[ERP 접수 ' + todayStr() + '] 출처 통화녹음 · 인입함 행' + r.row +
               ' (' + String(r.when||'').slice(0,16) + ')'];
  if(ai.feeIncluded) lines.push('관리비: 월세에 포함(통화) — 금액 미확인');
  if(ai.clean) lines.push('퇴실 청소비 ' + ai.clean + '만원(통화)');
  lines.push('사진: 이 호실 사진 없음 → 촬영 필요. 같은 건물 다른 호실 사진은 쓰지 않음');
  return {
    id: id,
    apt: bm.bldg || '',
    addr: bm.addr || '',
    addr2: ai.unit || '',
    type: ai.trade || '월세',
    kind: ai.kind || '',
    price: ai.deposit || '',
    rentAmt: ai.rent || '',
    status: '접수',
    recvDate: todayStr(),
    note: lines.join(nl),
    feeType: '', feeAmt: '', area: '', floor: '', totalFloor: '', rooms: '', baths: '',
    direction: '', availDate: '', cname: '', cphone: '', agent: ''
  };
}
async function erpSaveListing(rowId){
  var nl = String.fromCharCode(10);
  if(SAVING){ alert('저장 중입니다'); return; }
  var r = (DB.inbox||[]).filter(function(x){ return x.row === rowId; })[0];
  if(!r){ alert('그 인입 줄을 찾지 못했습니다'); return; }
  var ai = aiExtract(r.text);
  var bm = matchBuilding(r, ai);
  var j = judge(ai, bm);
  if(j.code !== 'NEW'){
    alert('지금은 신규(NEW) 후보만 접수합니다.' + nl + '판정: ' + j.code + ' — ' + j.why);
    return;
  }
  if(!ai.unit || !bm.bldg || !bm.addr){
    alert('건물·주소·호실이 모두 확인돼야 접수합니다.');
    return;
  }
  var fresh;
  try{
    var g = await jget({ action:'getAll', type:'listings' });
    fresh = g.data || g.result || [];
  }catch(e){ alert('매물장을 다시 읽지 못해 저장하지 않습니다: ' + (e && e.message || e)); return; }
  var before = fresh.length;
  var dup = dupCheck(fresh, bm.bldg, ai.unit);
  if(dup.alive.length){
    alert('이미 같은 건물·호실 매물이 있습니다 — 새로 만들지 않습니다.' + nl +
          dup.alive.map(function(o){ return o.id + ' · ' + o.status; }).join(nl));
    DB.listings = fresh; route(); return;
  }
  if(dup.all.length){
    if(!confirm('같은 건물·호실이 과거 자료로 ' + dup.all.length + '건 있습니다(' +
        dup.all.map(function(o){ return o.id + ' ' + o.status; }).join(', ') + ').' + nl +
        '지금은 살아 있는 매물이 아니라 새 회차로 만듭니다. 계속할까요?')) return;
  }
  var id = newListingId(ai.kind, fresh);
  var obj = buildListing(r, ai, bm, id);
  var msg = ['매물장에 새로 등록합니다', '',
    '매물번호  ' + id,
    '건물      ' + obj.apt,
    '주소      ' + obj.addr,
    '호실      ' + obj.addr2,
    '거래      ' + obj.type + ' / ' + (obj.kind || '(미확인)'),
    '보증금    ' + obj.price + '만',
    '월세      ' + obj.rentAmt + '만' + (ai.feeIncluded ? ' (관리비 포함)' : ''),
    '상태      ' + obj.status,
    '', '지금 매물 ' + before + '건 → ' + (before + 1) + '건',
    '🔴 사진이 없어 광고는 나가지 않습니다.',
    '🔴 비밀번호 등 민감정보는 저장하지 않습니다.', '', '이대로 등록할까요?'].join(nl);
  if(!confirm(msg)) return;

  SAVING = true;
  try{
    var u = gsUrl(), t = gsTok();
    var res = await fetch(u, { method:'POST', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({ action:'upsert', type:'listings', data: obj, token: t }) });
    var jj = await res.json();
    if(!jj || !jj.ok) throw new Error((jj && jj.error) || '저장 실패');
    var g2 = await jget({ action:'getAll', type:'listings' });
    var after = g2.data || g2.result || [];
    var made = after.filter(function(o){ return String(o.id) === id; });
    var dup2 = dupCheck(after, bm.bldg, ai.unit);
    DB.listings = after;
    LASTSAVE = { id:id, before:before, after:after.length, made:made.length,
                 dup:dup2.all.length, when:new Date().toTimeString().slice(0,8) };
    SAVING = false;
    route();
    alert(['등록했습니다 ✓', '',
      '매물번호  ' + id,
      '매물 건수 ' + before + ' → ' + after.length,
      '같은 호실 ' + dup2.all.length + '건(방금 만든 것 포함)',
      made.length === 1 ? '다시 읽어 1건 확인했습니다.'
                        : '🔴 다시 읽었더니 ' + made.length + '건입니다 — 확인이 필요합니다.'].join(nl));
  }catch(e){
    SAVING = false;
    route();
    alert('저장 실패 — 매물장은 그대로입니다.' + nl + String(e && e.message || e));
  }
}

    h += '<div class="empty" style="padding:14px">촬영·보정 이력은 아직 쌓이지 않습니다</div>';

  } else {
    h += '<div class="empty" style="padding:14px">공실·계약 이력이 아직 없습니다</div>';

  (DB.landlords||[]).forEach(function(o){ if(o.apt && sq(o.apt).toLowerCase().indexOf(sq(ql)) >= 0) bl[o.apt] = bl[o.apt]||0; });

/* ═══════════════════════════════════════════════════════════════════
   광고자동화 1차 — 🔴 실제 외부 게시는 하지 않는다.
   기존 CRM 규약을 그대로 쓴다(새로 만들지 않는다):
     · PLATFORMS 7채널 · STATUS_OFF_MARKET · ads 필드({on,no,url,at,chk,memo})
     · adSnapshot/adHash → 값이 바뀌면 '수정필요'
     · 당근 필수칸은 DAANGN_HEADERS 실측 규격에서 가져온다
   근거 없는 채널 규칙은 만들지 않고 '확인 전'이라고 적는다.
   ═══════════════════════════════════════════════════════════════════ */
var AD_CH = [
  { key:'daangn',   label:'당근',   dedup:'unit',    validDays:0,  bulk:true  },
  { key:'zigbang',  label:'직방',   dedup:'listing', validDays:30, bulk:false },
  { key:'dabang',   label:'다방',   dedup:'listing', validDays:30, bulk:false },
  { key:'naver',    label:'네이버', dedup:'listing', validDays:90, bulk:false },
  { key:'isj',      label:'이실장', dedup:'listing', validDays:0,  bulk:false },
  { key:'peterpan', label:'피터팬', dedup:'none',    validDays:0,  bulk:false },
  { key:'blog',     label:'블로그', dedup:'none',    validDays:0,  bulk:false }
];
var AD_GOAL = ['daangn','zigbang','dabang','naver'];   /* 진행률 분모가 되는 목표 채널 */
var STATUS_OFF = ['계약완료','임대중','거래완료','보류'];
var TAKEDOWN_ST = ['계약완료','임대중','거래완료'];

function adOf(o, k){ return (o && o.ads && o.ads[k]) || null; }
function adOn(o, k){ var a = adOf(o,k); return !!(a && a.on); }
function adLive(o){ return STATUS_OFF.indexOf(String(o.status||'')) < 0; }
function adSnapshot(o){
  var opt = Array.isArray(o.options) ? o.options.join(',') : String(o.options||'');
  return [o.type,o.price,o.rentAmt,o.area,o.rooms,o.baths,o.floor,o.totalFloor,
          o.feeAmt,o.availDate,opt,o.desc].join('¦');
}
function adHash(s){
  var h = 0; s = String(s==null?'':s);
  for(var i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) | 0;
  return String(h);
}
function adStale(o, k){
  var a = adOf(o,k);
  return !!(a && a.on && a.chk && a.chk !== adHash(adSnapshot(o)));
}
function adExpired(o, k){
  var ch = AD_CH.filter(function(c){ return c.key===k; })[0] || {};
  var a = adOf(o,k);
  if(!a || !a.on || !a.at || !ch.validDays) return false;
  var t = Date.parse(String(a.at).replace(/\./g,'-'));
  if(isNaN(t)) return false;
  return (Date.now() - t) > ch.validDays * 86400000;
}

/* ── 필수항목 — 있는 근거만 쓴다 ───────────────────────────────── */
var NEED_COMMON = [['kind','매물유형'],['type','거래유형'],['price','보증금/매매가'],
                   ['addr','주소'],['addr2','상세주소']];
var NEED_RENT   = [['rentAmt','월세']];
/* 🔴 당근 규격(DAANGN_HEADERS 실측) — 과거 누락 사고가 있던 칸 */
var NEED_DAANGN = [['area','면적'],['rooms','방 수'],['baths','욕실 수'],
                   ['floor','층'],['totalFloor','총 층']];
function adMissing(o, k){
  var need = NEED_COMMON.slice();
  if(['월세','연세','단기','단기임대'].indexOf(String(o.type||'')) >= 0) need = need.concat(NEED_RENT);
  if(k === 'daangn') need = need.concat(NEED_DAANGN);
  var miss = [];
  need.forEach(function(f){
    if(!String(o[f[0]] == null ? '' : o[f[0]]).trim()) miss.push(f[1]);
  });
  return miss;
}
/* 그 매물의 사진 상태(드라이브 실측 인덱스) */
function adPhotoOf(o){
  var bm = { bldg:o.apt, addr:o.addr, jibun:(String(o.addr||'').match(/(\d{1,5}-\d{1,4})/)||[])[1]||'' };
  return judgePhoto({ code:'SAME', hit:o }, bm, { unit:o.addr2 }, { name:o.apt, bld:o.apt, text:o.addr });
}
/* ── 채널 하나의 광고 상태 ─────────────────────────────────────── */
function adState(o, k, ph){
  var a = adOf(o,k);
  if(TAKEDOWN_ST.indexOf(String(o.status||'')) >= 0 && a && a.on)
    return { code:'TAKEDOWN_REQUIRED', why:'매물이 ' + o.status + ' 인데 광고가 올라가 있습니다', miss:[] };
  if(!adLive(o)) return { code:'REVIEW_REQUIRED', why:'광고 대상이 아닌 상태(' + (o.status||'') + ')', miss:[] };
  var miss = adMissing(o, k);
  if(a && a.on){
    if(adStale(o,k)) return { code:'POSTED', sub:'수정필요', why:'광고 올린 뒤 매물 값이 바뀌었습니다', miss:miss };
    if(adExpired(o,k)) return { code:'POSTED', sub:'갱신필요', why:'게시한 지 오래됐습니다', miss:miss };
    return { code:'POSTED', why:'게시 중' + (a.at ? (' · ' + a.at) : ''), miss:miss };
  }
  if(miss.length) return { code:'DATA_REQUIRED', why:'필수항목 부족', miss:miss };
  if(!ph || ph.code !== 'PHOTO_READY')
    return { code:'PHOTO_REQUIRED', why:(ph && ph.why) || '광고에 쓸 이 호실 사진이 없습니다', miss:[] };
  return { code:'AD_READY', why:'필수항목·사진이 갖춰졌습니다', miss:[] };
}
/* 매물 한 건의 채널 전체 */
function adRow(o){
  var ph = adPhotoOf(o);
  var byCh = {};
  AD_CH.forEach(function(c){ byCh[c.key] = adState(o, c.key, ph); });
  var goalDone = AD_GOAL.filter(function(k){ return byCh[k].code === 'POSTED'; }).length;
  var worst = 'AD_READY';
  var rank = { TAKEDOWN_REQUIRED:0, REVIEW_REQUIRED:1, DATA_REQUIRED:2, PHOTO_REQUIRED:3, AD_READY:4, POSTED:5 };
  AD_GOAL.forEach(function(k){ if(rank[byCh[k].code] < rank[worst]) worst = byCh[k].code; });
  return { o:o, ph:ph, ch:byCh, goalDone:goalDone, goalTotal:AD_GOAL.length, worst:worst,
           stale: AD_GOAL.some(function(k){ return byCh[k].sub === '수정필요'; }),
           takedown: AD_GOAL.some(function(k){ return byCh[k].code === 'TAKEDOWN_REQUIRED'; }) };
}
function adAll(){
  return (DB.listings || []).map(adRow);
}

/* ── 광고문구 — 🔴 없는 정보를 만들지 않는다 ───────────────────── */
function adMoney(o){
  var t = String(o.type||'');
  if(t === '매매') return o.price ? (o.price + '만원') : '';
  if(!o.price && !o.rentAmt) return '';
  return (o.price||'?') + '/' + (o.rentAmt||'?');
}
function adFacts(o){
  var f = [];
  if(o.kind) f.push(o.kind);
  if(o.area) f.push('면적 ' + o.area);
  if(o.rooms) f.push('방 ' + o.rooms);
  if(o.baths) f.push('욕실 ' + o.baths);
  if(o.floor) f.push(o.floor + (o.totalFloor ? ('/' + o.totalFloor) : ''));
  if(o.direction) f.push(o.direction);
  if(o.feeAmt) f.push('관리비 ' + o.feeAmt + '만');
  if(o.parking) f.push('주차 ' + o.parking);
  if(o.availDate) f.push('입주 ' + o.availDate);
  return f;
}
function adCopy(o, k){
  var nl = String.fromCharCode(10);
  var money = adMoney(o);
  var head = [o.apt, o.addr2].filter(Boolean).join(' ');
  var facts = adFacts(o);
  var t = String(o.type||'');
  var title, body;
  if(k === 'daangn'){
    title = [head, t, money].filter(Boolean).join(' ');
    body = [head + (o.addr ? (' (' + o.addr + ')') : ''), t + ' ' + money,
            facts.join(' · '), '', '브리즈부동산중개'].filter(Boolean).join(nl);
  } else if(k === 'zigbang' || k === 'dabang'){
    title = [head, o.kind, t, money].filter(Boolean).join(' ');
    body = [head, t + ' ' + money, facts.join(' · '), '',
            '자세한 조건은 문의 주시면 안내드립니다.', '브리즈부동산중개'].filter(Boolean).join(nl);
  } else if(k === 'naver'){
    title = [o.apt, o.kind, t, money].filter(Boolean).join(' ');
    body = [facts.join(' · '), o.addr].filter(Boolean).join(nl);
  } else if(k === 'blog'){
    title = [o.apt, o.addr2, t, money].filter(Boolean).join(' ') + ' 매물 안내';
    body = [head + ' ' + t + ' ' + money, '', facts.map(function(x){ return '· ' + x; }).join(nl),
            '', '문의: 브리즈부동산중개'].filter(Boolean).join(nl);
  } else {
    title = [head, t, money].filter(Boolean).join(' ');
    body = [head, t + ' ' + money, facts.join(' · ')].filter(Boolean).join(nl);
  }
  /* 🔴 민감정보·과장표현은 넣지 않는다 */
  return { title: maskSecret(title), body: maskSecret(body),
           missing: adMissing(o, k) };
}

/* ── 촬영필요 업무 ─────────────────────────────────────────────── */
function photoTasks(){
  return (DB.listings || []).filter(adLive).map(function(o){
    var ph = adPhotoOf(o);
    return { o:o, ph:ph };
  }).filter(function(x){
    return x.ph.code === 'PHOTO_REQUIRED' || x.ph.code === 'BUILDING_ONLY';
  }).sort(function(a, b){
    /* 접수 상태 · 최근 접수 먼저 */
    var pa = (a.o.status === '접수' ? 0 : 1), pb = (b.o.status === '접수' ? 0 : 1);
    if(pa !== pb) return pa - pb;
    return String(b.o.recvDate||'').localeCompare(String(a.o.recvDate||''));
  });
}

/* ═══════════════════════════════════════════════════════════════════
   계약·정산 1차 골격 — 🔴 보기 전용. 저장·계약서 작성·공부 발급 없음.

var CT_SEL = null, CT_TAB = '기본', CT_FILT = '';

/* 필수서류 — 기존 '발급요청(docReqs)'·'계약서류(contractDocuments)' 와 같은 뜻의 목록.
   🔴 여기서 발급을 걸지 않는다. 무엇이 필요한지 보여 주기만 한다. */
var CT_DOCS = [
  ['등기부등본', '계약 직전·잔금 직전 두 번 확인'],
  ['건축물대장', '위반건축물·용도 확인'],

  ['확인설명서', '중개대상물 확인·설명서'],
  ['공제증서', '중개사고 배상'],
  ['계약서', '본계약서']
];
function ctDaysTo(d){
  var s = String(d || '').trim();
  if(!s) return null;
  var t = Date.parse(s.replace(/\./g, '-'));
  if(isNaN(t)) return null;
  return Math.round((t - Date.now()) / 86400000);
}
function ctMoney(v){
  var s = String(v == null ? '' : v).trim();
  return s ? (s + '만') : '';
}
/* 계약 상태 — 날짜와 수납으로만 판단한다. 없는 값을 추측하지 않는다. */
function ctState(c){
  var st = String(c.expStatus || '').trim();
  var dEnd = ctDaysTo(c.end), dBal = ctDaysTo(c.balanceDue);
  var paidBal = String(c.balancePaidAt || '').trim();
  if(st === '종료') return { code:'종료', cls:'p-mute' };
  if(!paidBal && dBal !== null && dBal < 0) return { code:'잔금 지남', cls:'p-bad' };
  if(!paidBal && dBal !== null && dBal <= 7) return { code:'잔금 임박', cls:'p-warn' };
  if(!paidBal && String(c.balanceAmt || '').trim()) return { code:'잔금 대기', cls:'p-warn' };
  if(dEnd !== null && dEnd < 0) return { code:'만기 지남', cls:'p-bad' };
  if(dEnd !== null && dEnd <= 60) return { code:'만기 임박', cls:'p-warn' };
  if(st === '연장') return { code:'연장 확정', cls:'p-ok' };
  return { code:'진행중', cls:'p-ok' };
}
function ctRows(){
  var list = (DB.contracts || []).slice();
  if(CT_FILT === 'bal') list = list.filter(function(c){
    var d = ctDaysTo(c.balanceDue);
    return !String(c.balancePaidAt||'').trim() && d !== null && d <= 7; });
  else if(CT_FILT === 'exp') list = list.filter(function(c){
    var d = ctDaysTo(c.end); return d !== null && d <= 60; });
  else if(CT_FILT === 'fee') list = list.filter(function(c){
    return String(c.feeAmt||'').trim() && !String(c.feePaidAt||'').trim(); });
  return list;
}
function viewContract(){

  var all = DB.contracts || [];
  var ctWarn = loadErrBox(DB.ctErr, '계약 자료', 'retryContracts()');
  var bal = all.filter(function(c){
    var d = ctDaysTo(c.balanceDue);
    return !String(c.balancePaidAt||'').trim() && d !== null && d <= 7; });
  var exp = all.filter(function(c){ var d = ctDaysTo(c.end); return d !== null && d <= 60; });
  var fee = all.filter(function(c){ return String(c.feeAmt||'').trim() && !String(c.feePaidAt||'').trim(); });
  var live = all.filter(function(c){ return ctState(c).code !== '종료'; });

/* ═══════════════════════════════════════════════════════════════════
   계약등록 · 서류/특약 · 잔금·만기 · 회계정산 · 직원관리
   🔴 저장은 전부 단건 upsert(gsUpsertOne 과 같은 경로). saveAll 을 쓰지 않는다.
   🔴 계약 등록은 사람이 확인창을 눌러야 나간다. 문자·알림은 보내지 않는다.
   🔴 기존 contracts / contractDocuments 스키마만 쓴다(새 칸 0).
   ═══════════════════════════════════════════════════════════════════ */
var CT_SAVING = false, CT_LAST = null, CT_FORM = null, CT_DOCSTATE = {}, CT_SPEC = '';

function ctNewId(list){
  var d = new Date();
  var ymd = String(d.getFullYear()).slice(2) + pad2(d.getMonth()+1) + pad2(d.getDate());
  var seq = 1, id;
  do { id = 'C' + ymd + '-' + pad2(seq); seq++; }
  while((list||[]).some(function(c){ return String(c.id) === id; }));
  return id;
}
/* 단건 저장 — 어떤 표에도 같은 길을 쓴다 */
async function erpUpsert(type, obj){
  var u = gsUrl(), t = gsTok();
  if(!u || !t) throw new Error('구글시트 주소·토큰이 없습니다');
  var res = await fetch(u, { method:'POST', headers:{'Content-Type':'text/plain'},
    body: JSON.stringify({ action:'upsert', type:type, data:obj, token:t }) });
  var j = await res.json();
  if(!j || !j.ok) throw new Error((j && j.error) || '저장 실패');
  return j;
}

/* ── 계약 등록 ─────────────────────────────────────────────────── */
function ctOpenNew(listingId){
  var o = (DB.listings||[]).filter(function(x){ return String(x.id) === String(listingId); })[0] || null;
  CT_FORM = {
    listingId: o ? o.id : '', apt: o ? (o.apt||'') : '', addr2: o ? (o.addr2||'') : '',
    type: o ? (o.type||'월세') : '월세', price: o ? (o.price||'') : '', rentAmt: o ? (o.rentAmt||'') : '',
    landlordName:'', landlordPhone:'', tenantName:'', tenantPhone:'',
    start:'', end:'', depositAmt:'', depositDue:'', interimAmt:'', interimDue:'',
    balanceAmt:'', balanceDue:'', feeAmt:'', agent:'', note:''
  };
  /* 임대인 명부에서 그 건물 임대인을 후보로 채워 준다(사람이 고친다) */
  if(o){
    var ld = (DB.landlords||[]).filter(function(L){
      return sq(L.apt) && sq(L.apt) === sq(o.apt); })[0];
    if(ld){ CT_FORM.landlordName = ld.name || ''; CT_FORM.landlordPhone = ld.phone || ''; }
  }
  CT_TAB = '등록';
  route();
}
function ctField(k, v){ if(CT_FORM) CT_FORM[k] = v; }
function ctFormMissing(){
  var f = CT_FORM || {}, miss = [];
  [['apt','건물'],['addr2','호실'],['type','거래유형'],['price','보증금/매매가'],
   ['landlordName','임대인 이름'],['tenantName','임차인 이름'],
   ['start','계약일'],['end','만기일']].forEach(function(x){
    if(!String(f[x[0]]||'').trim()) miss.push(x[1]);
  });
  if(['월세','연세','단기'].indexOf(String(f.type||'')) >= 0 && !String(f.rentAmt||'').trim())
    miss.push('월세');
  return miss;
}
async function ctSave(){
  if(CT_SAVING){ alert('저장 중입니다'); return; }
  var nl = String.fromCharCode(10);
  var miss = ctFormMissing();
  if(miss.length){ alert('아직 못 채운 것이 있습니다:' + nl + miss.join(' · ')); return; }
  /* 🔴 저장 직전에 계약 자료를 다시 읽어 중복을 본다 */
  var fresh;
  try{
    var g = await jget({ action:'getAll', type:'contracts' });
    fresh = g.data || g.result || [];
  }catch(e){ alert('계약 자료를 다시 읽지 못해 저장하지 않습니다: ' + (e && e.message || e)); return; }
  var f = CT_FORM;
  var dup = fresh.filter(function(c){
    return sq(c.apt) === sq(f.apt) && sq(c.addr2) === sq(f.addr2)
        && String(c.expStatus||'') !== '종료'; });
  if(dup.length){
    if(!confirm('같은 건물·호실에 끝나지 않은 계약이 ' + dup.length + '건 있습니다(' +
        dup.map(function(c){ return c.id; }).join(', ') + ').' + nl + '그래도 새로 만들까요?')) return;
  }

/* ── 서류 체크 저장 (contractDocuments 스키마 그대로) ──────────── */
async function ctDocSave(contractId, docType, on){
  var nl = String.fromCharCode(10);
  var c = (DB.contracts||[]).filter(function(x){ return String(x.id) === String(contractId); })[0];
  if(!c){ alert('계약을 찾지 못했습니다'); return; }
  if(!confirm(docType + ' 를 ' + (on ? '받음' : '안 받음') + ' 으로 표시합니다.' + nl + '이대로 저장할까요?')) return;
  var obj = {
    id: 'CD' + String(Date.now()).slice(-10),
    contractId: String(contractId),
    docType: String(docType),
    version: '1',
    body: '',
    source: 'ERP 체크',
    createdAt: todayStr(),
    createdBy: ME.name || '대표',
    status: on ? '받음' : '안 받음',
    note: ''
  };
  try{
    await erpUpsert('contractDocuments', obj);
    CT_DOCSTATE[contractId] = CT_DOCSTATE[contractId] || {};
    CT_DOCSTATE[contractId][docType] = on ? '받음' : '안 받음';
    route();
    alert(docType + ' — ' + obj.status + ' 으로 저장했습니다 ✓');
  }catch(e){
    alert('저장 실패 — 그대로입니다.' + nl + String(e && e.message || e));
  }
}
/* ── 특약 저장 (contracts.note — 기존 칸) ──────────────────────── */
async function ctSpecSave(contractId){
  var nl = String.fromCharCode(10);
  var el = document.getElementById('ct-sp');
  if(!el){ return; }
  var text = String(el.value || '').trim();
  if(!text){ alert('적을 내용이 없습니다'); return; }
  /* 🔴 확실히 틀린 입력은 시트를 읽기 '전에' 막는다 — 굳이 왕복할 필요가 없다 */
  if(hasSecret(text)){
    alert('🔴 비밀번호로 보이는 내용이 있습니다. 특약에는 넣지 않습니다.'); return;
  }
  /* 🔴 제안 초안의 ○○ 를 안 채우면 저장하지 않는다 — 그대로 계약서에 들어가면 사고다 */
  if(text.indexOf('○○') >= 0){
    alert(['🔴 아직 채우지 않은 칸(○○)이 있습니다.', '',
      '제안은 초안입니다. ○○ 를 실제 내용으로 바꾼 뒤 저장해 주세요.'].join(nl)); return;
  }
  /* 🔴 저장 직전에 다시 읽는다 */
  var fresh;
  try{
    var g = await jget({ action:'getAll', type:'contracts' });
    fresh = g.data || g.result || [];
  }catch(e){ alert('계약 자료를 다시 읽지 못해 저장하지 않습니다'); return; }
  var c = fresh.filter(function(x){ return String(x.id) === String(contractId); })[0];
  if(!c){ alert('계약을 찾지 못했습니다'); return; }
  var was = String(c.note || '');
  var next = was ? (was + nl + text) : text;
  if(!confirm(['특약을 덧붙입니다', '', '계약 ' + c.id, '', text, '',
    '🔴 기존 내용은 지우지 않고 아래에 붙입니다.', '이대로 저장할까요?'].join(nl))) return;
  var obj = JSON.parse(JSON.stringify(c));
  obj.note = next;
  try{
    await erpUpsert('contracts', obj);
    var g2 = await jget({ action:'getAll', type:'contracts' });
    DB.contracts = g2.data || g2.result || [];
    CT_SPEC_DRAFT = '';
    route();
    alert('특약을 최종확정으로 저장했습니다 ✓');
  }catch(e){ alert('저장 실패 — 계약 자료는 그대로입니다.' + nl + String(e && e.message || e)); }
}

/* ── 잔금·만기 ─────────────────────────────────────────────────── */
function ctSchedule(){
  var out = [];
  (DB.contracts||[]).forEach(function(c){
    [['계약금', c.depositAmt, c.depositDue, c.depositPaidAt],
     ['중도금', c.interimAmt, c.interimDue, c.interimPaidAt],
     ['잔금',  c.balanceAmt, c.balanceDue, c.balancePaidAt]].forEach(function(p){
      if(!String(p[2]||'').trim()) return;
      out.push({ c:c, kind:p[0], amt:p[1], due:p[2], paid:p[3], d:ctDaysTo(p[2]) });
    });
    if(String(c.end||'').trim())
      out.push({ c:c, kind:'만기', amt:'', due:c.end, paid:'', d:ctDaysTo(c.end) });
  });
  out.sort(function(a,b){ return (a.d===null?9999:a.d) - (b.d===null?9999:b.d); });
  return out;
}

/* ── 자동화 상태 — 실제 자료의 최신 시각으로만 말한다 ─────────── */
function autoMaxWhen(rows, pick){
  var best = '';
  (rows || []).forEach(function(r){
    var v = String(pick(r) || '').trim();
    if(v && v > best) best = v;
  });
  return best;
}
function autoToday(rows, pick){
  var t = todayStr(), n = 0;
  (rows || []).forEach(function(r){ if(String(pick(r) || '').indexOf(t) === 0) n++; });
  return n;
}
function autoList(){

    return b;
  });
  var adOnN = L.filter(function(o){ return AD_CH.some(function(c){ return adOn(o, c.key); }); }).length;
  var un = inb.filter(function(r){ return !r.reg; }).length;
  return [
    { key:'sms', name:'문자수집', run:'폰 → 구글서버 → 인입함',

    { key:'call', name:'통화 AI', run:'통화녹음 → 글자변환 → 인입함',
      last: autoMaxWhen(call, W), today: autoToday(call, W), n: call.length,
      next:'녹음이 올라오면', state: call.length ? 'ok' : 'none',
      note:'PC 가 켜져 있을 때만 (AI 요약 포함)' },
    { key:'vac', name:'공실수집(사진판독)', run:'드라이브 문자사진 → OCR → 공실현황',

      last:'', today: 0, n: un, next:'사람이 확인함', state:'manual',
      note:'미처리 ' + un + '건 — 아직 사람이 고른다(자동 분류 아님)' },
    { key:'ad', name:'광고', run:'매물 → 채널 게시',
      last: adAt, today: 0, n: adOnN, next:'사람이 올림', state: adOnN ? 'ok' : 'none',
      note:'🔴 자동 게시는 검증 전 — 지금은 사람이 각 사이트에서' },
    (function(){

      if(g === null){ loadGather();
        return { key:'web', name:'웹수집(당근·오일장)', run:'수집매물 표에 쌓임',
                 last:'', today:null, n:null, next:'예약(트리거)', state:'unknown',
                 note:'불러오는 중…' }; }
      if(GATHER_ERR || !g.phase)
        return { key:'web', name:'웹수집(당근·오일장)', run:'수집매물 표에 쌓임',
                 last:'', today:null, n:null, next:'예약(트리거)', state:'unknown',
                 note:'🔴 확인 전 — ' + (GATHER_ERR || '상태를 읽지 못했습니다') };
      var c = g.counts || {};

               note: '구역 ' + (g.tile||0) + '/' + (g.tiles||0) + ' · 당근 ' + (c.dg||0) +
                     ' · 오일장 ' + (c.oj||0) + ' · 새 건 ' + (c.sn||0) + ' · 중복 ' + (c.dup||0) };
    })(),

/* ── 데이터 품질 — 실제 자료로만 센다 ──────────────────────────── */
function dqCheck(){
  var L = DB.listings || [], LD = DB.landlords || [], C = DB.customers || [];
  var live = L.filter(adLive);
  var out = { items: [] };
  function add(name, list, why, go2){
    out.items.push({ name:name, n:list.length, rows:list.slice(0, 60), why:why, go:go2 || '' });
  }
  /* 필수값 누락 — 광고에 꼭 필요한 칸 */
  add('매물 필수값 누락', live.filter(function(o){
    return NEED_COMMON.some(function(f){ return !String(o[f[0]]||'').trim(); }); }),
    '건물·주소·호실·거래유형·보증금 중 빈 칸', 'ad');
  /* 중복 가능성 — 같은 건물+호실이 둘 이상 */
  var key = {}, dup = [];
  live.forEach(function(o){
    var k = sq(o.apt) + '|' + sq(o.addr2);
    if(!sq(o.apt) || !sq(o.addr2)) return;
    key[k] = (key[k] || []).concat([o]);
  });
  Object.keys(key).forEach(function(k){ if(key[k].length > 1) dup = dup.concat(key[k]); });
  add('같은 호실이 둘 이상', dup, '건물+호실이 겹치는 살아 있는 매물', '');
  /* 사진 없음 */
  add('사진 없음', live.filter(function(o){
    var p = adPhotoOf(o); return p.code === 'PHOTO_REQUIRED'; }), '그 호실 사진이 없다', 'photo');
  /* 임대인 역할 미확인 */
  add('임대인 역할 미확인', LD.filter(function(o){
    return !String(o.role||'').trim() && String(o.phone||'').trim(); }).slice(0, 400),
    'role 이 비어 있다(소유자인지 확인 안 됨)', '');
  /* 오래된 매물 */
  add('오래 안 건드린 매물(60일+)', live.filter(function(o){
    var d = ctDaysTo(String(o.updatedAt||'').slice(0,10));
    return d !== null && d < -60; }), 'updatedAt 이 60일보다 오래', '');
  /* 주소/건물 불일치 — 매물 주소에 건물 지번이 없음 */
  add('주소에 지번이 없음', live.filter(function(o){

var MK_SEL = null, MK_CH = '블로그';
