<!DOCTYPE html>
<html lang="ko" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>브리즈 ERP</title>
<style>
/* ── 색 토큰: 흰색 기본 · 다크 · 시스템 ───────────────────────────── */
:root{
  --bg:#F7F8FA; --panel:#FFFFFF; --panel2:#FBFCFD; --line:#E3E7ED; --line2:#EEF1F5;
  --t1:#14181F; --t2:#4A5567; --t3:#8A94A6;
  --brand:#1D4ED8; --brand-bg:#EEF3FF;
  --ok:#0F7B4F; --ok-bg:#E7F6EE;
  --warn:#B45309; --warn-bg:#FDF3E3;
  --bad:#B91C1C; --bad-bg:#FDECEC;
  --mute:#6B7280; --mute-bg:#F1F3F6;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1319; --panel:#161B23; --panel2:#1B212B; --line:#2A323E; --line2:#222933;
    --t1:#E8ECF2; --t2:#AEB8C7; --t3:#7C889A;
    --brand:#7EA6FF; --brand-bg:#1B2740;
    --ok:#5FD39B; --ok-bg:#14301F;
    --warn:#E9B168; --warn-bg:#33250F;
    --bad:#F28B8B; --bad-bg:#3A1A1A;
    --mute:#9AA5B5; --mute-bg:#222A35;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1319; --panel:#161B23; --panel2:#1B212B; --line:#2A323E; --line2:#222933;
  --t1:#E8ECF2; --t2:#AEB8C7; --t3:#7C889A;
  --brand:#7EA6FF; --brand-bg:#1B2740;
  --ok:#5FD39B; --ok-bg:#14301F;
  --warn:#E9B168; --warn-bg:#33250F;
  --bad:#F28B8B; --bad-bg:#3A1A1A;
  --mute:#9AA5B5; --mute-bg:#222A35;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{
  background:var(--bg); color:var(--t1);
  font:15px/1.55 "Pretendard","Malgun Gothic","맑은 고딕",-apple-system,system-ui,sans-serif;
  -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
.mono{font-variant-numeric:tabular-nums}

/* ── 상단 ──────────────────────────────────────────────────────── */
header{position:sticky;top:0;z-index:40;background:var(--panel);border-bottom:1px solid var(--line)}
.top1{display:flex;align-items:center;gap:12px;padding:9px 16px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:-.3px;white-space:nowrap}
.logo i{display:grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--brand);color:#fff;font-style:normal;font-size:14px;font-weight:800}
.gsearch{flex:1;min-width:120px;position:relative}
.gsearch input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--line);border-radius:9px;background:var(--panel2)}
.gsearch svg{position:absolute;left:11px;top:9px;opacity:.5}
.tools{display:flex;align-items:center;gap:4px;flex-shrink:0}
.tbtn{display:grid;place-items:center;min-width:34px;height:34px;padding:0 9px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--t2);cursor:pointer;font-size:13px;white-space:nowrap}
.tbtn:hover{background:var(--mute-bg);color:var(--t1)}
.tbtn.on{background:var(--brand-bg);color:var(--brand);border-color:var(--brand-bg)}
.who{display:flex;align-items:center;gap:7px;padding:4px 9px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font-size:13px}
.who b{font-size:13px}

/* 대분류 */
.top2{display:flex;gap:2px;padding:0 12px;overflow-x:auto;scrollbar-width:none}
.top2::-webkit-scrollbar{display:none}
.m1{padding:9px 14px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--t2);cursor:pointer;white-space:nowrap;font-weight:600;font-size:14.5px}
.m1:hover{color:var(--t1)}
.m1.on{color:var(--brand);border-bottom-color:var(--brand)}
/* 2차 */
.top3{display:flex;gap:4px;padding:7px 14px;background:var(--panel2);border-top:1px solid var(--line2);overflow-x:auto;scrollbar-width:none}
.top3::-webkit-scrollbar{display:none}
.m2{padding:5px 11px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--t2);cursor:pointer;white-space:nowrap;font-size:13.5px}
.m2:hover{border-color:var(--brand);color:var(--brand)}
.m2.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.m2.soon{opacity:.55}

/* ── 뼈대 ──────────────────────────────────────────────────────── */
.wrap{display:grid;grid-template-columns:196px minmax(0,1fr);gap:0;align-items:start}
@media (max-width:900px){ .wrap{grid-template-columns:minmax(0,1fr)} aside{display:none} }
aside{position:sticky;top:104px;padding:14px 10px;border-right:1px solid var(--line);min-height:calc(100vh - 104px)}
.sgrp{margin:0 0 14px}
.sgrp h4{margin:0 0 6px;padding:0 8px;font-size:11.5px;font-weight:700;color:var(--t3);letter-spacing:.4px}
.s1{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;padding:7px 9px;border:0;border-radius:8px;background:transparent;color:var(--t2);cursor:pointer;text-align:left;font-size:13.5px}
.s1:hover{background:var(--mute-bg);color:var(--t1)}
.s1.on{background:var(--brand-bg);color:var(--brand);font-weight:700}
.s1 em{font-style:normal;font-size:11.5px;color:var(--t3);font-variant-numeric:tabular-nums}
main{padding:16px 18px 60px;min-width:0}

/* ── 공통 요소 ─────────────────────────────────────────────────── */
.crumb{font-size:12.5px;color:var(--t3);margin:0 0 6px}
.crumb b{color:var(--t2);font-weight:600}
.h1row{display:flex;align-items:baseline;flex-wrap:wrap;gap:10px;margin:0 0 12px}
h1{margin:0;font-size:21px;letter-spacing:-.4px}
.cnt{font-size:13.5px;color:var(--t2)}
.cnt b{color:var(--t1)}
.cnt .hot{color:var(--warn)}

.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.bar input[type=search],.bar select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.bar input[type=search]{flex:1;min-width:180px}
.btn{padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--t2);cursor:pointer;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.btn.pri:hover{filter:brightness(1.06);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:12.5px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 14px}
.kpi{padding:12px 13px;border:1px solid var(--line);border-radius:11px;background:var(--panel);box-shadow:var(--shadow);cursor:pointer;text-align:left}
.kpi:hover{border-color:var(--brand)}
.kpi span{display:block;font-size:12.5px;color:var(--t2);margin:0 0 3px}
.kpi b{font-size:24px;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.kpi.w b{color:var(--warn)} .kpi.b b{color:var(--bad)} .kpi.g b{color:var(--ok)}

.card{border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:var(--shadow);overflow:hidden}
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th,td{padding:9px 10px;text-align:left;font-size:13.5px;border-bottom:1px solid var(--line2);vertical-align:top}
th{background:var(--panel2);color:var(--t2);font-weight:600;font-size:12.5px;white-space:nowrap;position:sticky;top:0;z-index:2}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--panel2)}
tbody tr.sel{background:var(--brand-bg)}
td .ell{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)}
.p-warn{background:var(--warn-bg);color:var(--warn)}
.p-bad{background:var(--bad-bg);color:var(--bad)}
.p-mute{background:var(--mute-bg);color:var(--mute)}
.p-brand{background:var(--brand-bg);color:var(--brand)}
.rowacts{display:flex;flex-wrap:wrap;gap:3px}
.rowacts .btn{padding:2px 7px;font-size:11.5px}

/* 상세 패널 */
.split{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.split.open{grid-template-columns:minmax(0,1fr) minmax(320px,430px)}
@media (max-width:1200px){ .split.open{grid-template-columns:minmax(0,1fr)} }
.side{border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:var(--shadow);position:sticky;top:118px;max-height:calc(100vh - 140px);overflow:auto}
.side h3{margin:0;padding:12px 14px;border-bottom:1px solid var(--line);font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:0;background:var(--panel)}
.sbody{padding:12px 14px}
.kv{display:grid;grid-template-columns:86px minmax(0,1fr);gap:5px 10px;font-size:13.5px;margin:0 0 12px}
.kv dt{color:var(--t3)}
.kv dd{margin:0;word-break:break-word}
.sec{margin:0 0 14px;padding:0 0 12px;border-bottom:1px dashed var(--line)}
.sec:last-child{border-bottom:0}
.sec h4{margin:0 0 7px;font-size:12.5px;color:var(--t3);letter-spacing:.3px}
pre.raw{margin:0;padding:10px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;font:12.5px/1.6 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word;max-height:230px;overflow:auto}
.note{padding:9px 11px;border-radius:9px;font-size:13px;margin:0 0 10px}
.note.w{background:var(--warn-bg);color:var(--warn)}
.note.b{background:var(--bad-bg);color:var(--bad)}
.note.g{background:var(--ok-bg);color:var(--ok)}
.note.i{background:var(--brand-bg);color:var(--brand)}
.steps{margin:0;padding:0;list-style:none;font-size:13px}
.steps li{display:flex;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line2)}
.steps li:last-child{border-bottom:0}
.steps i{font-style:normal;flex-shrink:0;width:17px;text-align:center}
.steps span{color:var(--t2)}
.steps b{color:var(--t1)}
.empty{padding:36px 16px;text-align:center;color:var(--t3);font-size:13.5px}
.foot{margin:16px 0 0;font-size:12px;color:var(--t3);text-align:center}
.actbar{position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:6px;padding:9px 12px;background:var(--panel);border-top:1px solid var(--line);margin:0}
.hidden{display:none!important}
.soonbox{padding:34px 18px;text-align:center;color:var(--t2)}
.soonbox b{display:block;font-size:17px;color:var(--t1);margin:0 0 6px}
.chk{width:15px;height:15px;cursor:pointer}
.srchg{margin:0 0 12px}
.srchg h4{margin:0 0 6px;font-size:12.5px;color:var(--t3)}
.srow{padding:7px 10px;border:1px solid var(--line);border-radius:8px;margin:0 0 5px;font-size:13.5px;cursor:pointer;background:var(--panel)}
.srow:hover{border-color:var(--brand)}
</style>
</head>
<body>

<header>
  <div class="top1">
    <div class="logo"><i>B</i><span>브리즈 ERP</span></div>
    <div class="gsearch">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="매물번호 · 건물명 · 주소 · 호실 · 고객명 · 전화번호 · 임대인 통합검색" autocomplete="off">
    </div>
    <div class="tools">
      <button class="tbtn" id="btnAi" title="AI 지원">AI</button>
      <button class="tbtn" id="btnBell" title="알림">🔔</button>
      <button class="tbtn" id="btnRecent" title="최근 업무">최근</button>
      <button class="tbtn" id="btnFav" title="즐겨찾기">★</button>
      <button class="tbtn" id="btnTheme" title="테마 (흰색 → 다크 → 시스템)">◐</button>
      <button class="tbtn" id="btnHelp" title="도움말">?</button>
      <span class="who"><b id="whoName">대표</b><span id="whoRole" style="color:var(--t3)">관리자</span></span>
      <button class="tbtn" id="btnOut" title="로그아웃">↪</button>
    </div>
  </div>
  <nav class="top2" id="nav1"></nav>
  <nav class="top3" id="nav2"></nav>
</header>

<div class="wrap">
  <aside id="side"></aside>
  <main id="main"></main>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   브리즈 ERP 0.1 — 새 화면(별도 파일). index.html · saas.html 은 고치지 않았다.
   데이터는 전부 기존 CRM 시트/GAS 를 그대로 읽는다(action=inboxList · getAll).
   🔴 이 화면은 아직 아무것도 저장하지 않는다(쓰기 0).
   ═══════════════════════════════════════════════════════════════════ */
var ERP_VER = '0.5';
var ERP_BUILD = '2026-09-11 20:55';
var REPO = 'eya170823-rgb/crm';

/* ── 저장소 접근(기존 CRM 과 같은 열쇠를 쓴다) ───────────────────── */
function gsUrl(){ try{ return localStorage.getItem('crm_gs_url') || ''; }catch(e){ return ''; } }
function gsTok(){ try{ return localStorage.getItem('crm_gs_token') || ''; }catch(e){ return ''; } }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
function sq(s){ return String(s==null?'':s).replace(/\s+/g,''); }
function nDigit(s){ return String(s==null?'':s).replace(/\D/g,''); }

/* ── 테마 ──────────────────────────────────────────────────────── */
var THEMES = ['light','dark','system'];
function themeGet(){ try{ return localStorage.getItem('erp_theme') || 'system'; }catch(e){ return 'system'; } }
function themeSet(t){
  document.documentElement.setAttribute('data-theme', t);
  try{ localStorage.setItem('erp_theme', t); }catch(e){}
  var b = document.getElementById('btnTheme');
  if(b) b.textContent = t === 'light' ? '☀' : (t === 'dark' ? '☾' : '◐');
  if(b) b.title = '테마: ' + ({light:'흰색',dark:'다크',system:'시스템'})[t] + ' (눌러서 변경)';
}
themeSet(themeGet());
document.getElementById('btnTheme').onclick = function(){
  themeSet(THEMES[(THEMES.indexOf(themeGet()) + 1) % 3]);
};

/* ── 메뉴 (상단 8 대분류 → 2차) ─────────────────────────────────── */
var MENU = [
  ['today','오늘업무',[['today','오늘 할 일',1]]],
  ['crm','영업CRM',[['inbox','통합 인입함',1],['cust','고객 명부',0],['lead','상담·리드',0],['visit','임장',0]]],
  ['ops','운영부',[['photo','촬영 필요',1],['listing','매물장',0],['vac','공실 승인함',0],['landlord','임대인 명부',0]]],
  ['ad','광고·마케팅',[['admgr','광고관리',1],['copy','광고문 작성',0],['adstat','광고 성과',0]]],
  ['deal','계약·정산',[['contract','계약',1],['settle','수납·정산',1],['doc','공부·서류',0]]],
  ['group','그룹웨어',[['appr','결재함',0],['sched','일정',0],['board','공지',0]]],
  ['data','데이터센터',[['collect','수집매물',0],['bldg','건물·대장',0],['stat','통계',0]]],
  ['admin','관리부',[['staff','직원·권한',1],['cfg','환경설정',0],['log','변경이력',0]]]
];
var CUR = { m1:'today', m2:'today' };

function drawNav(){
  document.getElementById('nav1').innerHTML = MENU.map(function(g){
    return '<button class="m1' + (g[0]===CUR.m1?' on':'') + '" data-m1="' + g[0] + '">' + esc(g[1]) + '</button>';
  }).join('');
  var g = MENU.filter(function(x){ return x[0]===CUR.m1; })[0] || MENU[0];
  document.getElementById('nav2').innerHTML = g[2].map(function(s){
    return '<button class="m2' + (s[0]===CUR.m2?' on':'') + (s[2]?'':' soon') + '" data-m2="' + s[0] + '">'
      + esc(s[1]) + (s[2] ? '' : ' <span style="font-size:11px">준비중</span>') + '</button>';
  }).join('');
  document.querySelectorAll('[data-m1]').forEach(function(b){
    b.onclick = function(){
      CUR.m1 = b.getAttribute('data-m1');
      var gg = MENU.filter(function(x){ return x[0]===CUR.m1; })[0];
      CUR.m2 = gg[2][0][0];
      drawNav(); route();
    };
  });
  document.querySelectorAll('[data-m2]').forEach(function(b){
    b.onclick = function(){ CUR.m2 = b.getAttribute('data-m2'); drawNav(); route(); };
  });
  drawSide();
}
function drawSide(){
  var g = MENU.filter(function(x){ return x[0]===CUR.m1; })[0] || MENU[0];
  var n = (DB.inbox||[]).filter(function(r){ return !r.reg; }).length;
  document.getElementById('side').innerHTML =
    '<div class="sgrp"><h4>' + esc(g[1]) + '</h4>' +
    g[2].map(function(s){
      var badge = (s[0]==='inbox' && n) ? '<em>' + n + '</em>' : (s[2] ? '' : '<em>준비중</em>');
      return '<button class="s1' + (s[0]===CUR.m2?' on':'') + '" data-s="' + s[0] + '">'
        + '<span>' + esc(s[1]) + '</span>' + badge + '</button>';
    }).join('') + '</div>' +
    '<div class="sgrp"><h4>바로가기</h4>' +
    '<button class="s1" onclick="location.href=\'./saas.html\'"><span>기존 SaaS 화면</span></button>' +
    '<button class="s1" onclick="location.href=\'./index.html\'"><span>기존 CRM 화면</span></button>' +
    '</div>';
  document.querySelectorAll('[data-s]').forEach(function(b){
    b.onclick = function(){ CUR.m2 = b.getAttribute('data-s'); drawNav(); route(); };
  });
}

/* ── 데이터 ────────────────────────────────────────────────────── */
var DB = { inbox:null, listings:null, landlords:null, contracts:null, err:'', loading:false };

async function jget(params){
  var u = gsUrl(), t = gsTok();
  if(!u || !t) throw new Error('NOKEY');
  var qs = Object.keys(params).map(function(k){
    return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]); }).join('&');
  var r = await fetch(u + '?' + qs + '&token=' + encodeURIComponent(t) + '&t=' + Date.now());
  var j = await r.json();
  if(!j || !j.ok) throw new Error((j && j.error) || '불러오지 못했습니다');
  return j;
}
async function loadAll(force){
  if(DB.loading) return;
  if(DB.inbox && !force) return;
  DB.loading = true; DB.err = '';
  try{
    var a = await jget({ action:'inboxList', limit:200 });
    DB.inbox = ((a.result||{}).rows) || [];
    DB.inboxTotal = (a.result||{}).total || DB.inbox.length;
    var b = await jget({ action:'getAll', type:'listings' });
    DB.listings = b.data || b.result || [];
    var c = await jget({ action:'getAll', type:'landlords' });
    DB.landlords = c.data || c.result || [];
  }catch(e){
    DB.err = (e && e.message === 'NOKEY')
      ? '이 기기에 구글시트 주소·토큰이 없습니다 — 기존 CRM 화면(설정)에서 한 번 넣으면 이 화면도 같이 씁니다.'
      : ('불러오지 못했습니다: ' + (e && e.message ? e.message : e));
  }
  DB.loading = false;
}

/* ═══ 민감정보 가리개 — 비밀번호류는 목록·광고·로그에 내보내지 않는다 ═══ */
var SECRET_RE = [
  /(비\s?밀\s?번\s?호|비번|출입\s?번호|출입\s?코드|현관\s?(비밀)?번호|도어\s?락|도어락)\s*[:은는이가]?\s*([#*0-9][#*0-9\-\s]{2,})/g,
  /공동\s?현관\s*\.?\s*([#*0-9][#*0-9\-\s]{2,})/g
];
/* 🔴 한 번 비밀번호로 잡힌 숫자는 글 **전체**에서 지운다.
   통화는 되묻는다 — "비밀번호 1234입니다 / 1234요?" 뒤쪽이 남으면 가린 뜻이 없다. */
function secretNums(t){
  var s = String(t==null?'':t), nums = {}, m;
  SECRET_RE.forEach(function(re){
    re.lastIndex = 0;
    while((m = re.exec(s))){
      var raw = m[m.length-1] || '';
      var d = raw.replace(/[^0-9]/g,'');
      if(d.length >= 3) nums[d] = 1;
    }
  });
  return Object.keys(nums);
}
function hasSecret(t){ return SECRET_RE.some(function(re){ re.lastIndex=0; return re.test(String(t||'')); }); }
function maskSecret(t){
  var s = String(t==null?'':t);
  SECRET_RE.forEach(function(re){
    re.lastIndex = 0;
    s = s.replace(re, function(m, a, b, c){
      var raw = arguments[arguments.length-3];
      var head = m.slice(0, m.length - String(raw==null?'':raw).length);
      return head + '●●●● [보호됨]';
    });
  });
  /* 같은 숫자가 뒤에서 되풀이돼도 전부 가린다 */
  secretNums(t).forEach(function(d){
    var parts = s.split(d);
    if(parts.length > 1) s = parts.join('●●●●');
  });
  return s;
}
/* 전화번호 — 권한에 따라 가린다(대표는 전체) */
var ME = { role:'admin', name:'대표' };
function phoneShow(p){
  var d = nDigit(p);
  if(!d) return '';
  if(ME.role === 'admin') return String(p);
  return d.length >= 8 ? (d.slice(0,3) + '-****-' + d.slice(-4)) : '****';
}

/* ═══ 출처 ═══ */
function srcOf(kind, text){
  var k = String(kind||'');
  if(k.indexOf('통화') >= 0) return '통화녹음';
  if(k.indexOf('부재중') >= 0) return '부재중전화';
  if(k.indexOf('사진') >= 0 || String(text||'').indexOf('사진문자 판독') >= 0) return '사진접수';
  if(k.indexOf('백업') >= 0) return 'SMS';
  if(k === 'sms' || k.indexOf('문자') >= 0) return 'SMS';
  if(k.indexOf('웹') >= 0) return '웹문의';
  if(k.indexOf('메모') >= 0) return '메모';
  return k || '기타';
}
var SRC_ALL = ['통화녹음','SMS','MMS','메모','웹문의','사진접수','부재중전화','기타'];

/* ═══ AI 추출 — 확신 없으면 비운다(임의값 금지) ═══════════════════ */
function aiExtract(t){
  var s = String(t||'');
  var o = { unit:'', deposit:'', rent:'', feeIncluded:null, kind:'', clean:'', trade:'',
            bldg:'', addr:'', confidence:[], missing:[] };
  var m;
  /* 호실 — 숫자+호 */
  var units = [];
  var re = /(\d{3,4})\s*호/g;
  while((m = re.exec(s))){ if(units.indexOf(m[1] + '호') < 0) units.push(m[1] + '호'); }
  if(units.length === 1){ o.unit = units[0]; o.confidence.push('호실'); }
  else if(units.length > 1){ o.unitCands = units; o.missing.push('호실(여러 개: ' + units.join(',') + ')'); }
  else o.missing.push('호실');
  /* 금액 — "55의 200" = 월세55/보증금200 · "보증금 200" · "월세 55" */
  var mm = s.match(/(\d{2,5})\s*의\s*(\d{2,5})/);
  if(mm){ o.rent = mm[1]; o.deposit = mm[2]; o.confidence.push('보증금·월세'); }
  if(!o.deposit){ var d1 = s.match(/보증금\s*(\d{2,5})/); if(d1){ o.deposit = d1[1]; o.confidence.push('보증금'); } }
  if(!o.rent){ var r1 = s.match(/(월세|임대료)\s*(\d{2,5})/); if(r1){ o.rent = r1[2]; o.confidence.push('월세'); } }
  if(!o.deposit) o.missing.push('보증금');
  if(!o.rent) o.missing.push('월세');
  /* 관리비 포함 여부 */
  if(/관리비\s*포함/.test(s)){ o.feeIncluded = true; o.confidence.push('관리비 포함'); }
  else if(/관리비/.test(s)) o.missing.push('관리비(금액 불명)');
  else o.missing.push('관리비');
  /* 매물유형 */
  if(/분리형\s*원(룸|인)/.test(s)){ o.kind = '분리형 원룸'; o.confidence.push('매물유형'); }
  else if(/오픈형\s*원룸/.test(s)){ o.kind = '오픈형 원룸'; o.confidence.push('매물유형'); }
  else if(/투룸|1\.5룸/.test(s)){ o.kind = /1\.5/.test(s) ? '1.5룸' : '투룸'; o.confidence.push('매물유형'); }
  else o.missing.push('매물유형');
  /* 퇴실 청소비 */
  var c1 = s.match(/청소비[^0-9]{0,25}?(\d{1,3})\s*만/);
  if(c1){ o.clean = c1[1]; o.confidence.push('퇴실 청소비'); }
  /* 거래유형 */
  if(o.rent) { o.trade = '월세'; o.confidence.push('거래유형'); }
  else if(/전세/.test(s)) o.trade = '전세';
  else if(/매매/.test(s)) o.trade = '매매';
  else o.missing.push('거래유형');
  /* 입주가능일·방수·욕실·옵션·주차·반려·전입 — 통화에 없으면 비운다 */
  ['입주가능일','방수','욕실수','옵션','주차','반려동물','전입','외국인'].forEach(function(k){ o.missing.push(k); });
  return o;
}

/* ═══ 건물 대조 — 이름만으로 판단하지 않는다(주소·지번 함께) ═════ */
function bldgTokens(s){
  var t = String(s||'');
  var out = { name:'', jibun:'', dong:'' };
  var j = t.match(/(\d{1,5}-\d{1,4})/); if(j) out.jibun = j[1];
  var d = t.match(/([가-힣]{2,6}(동|리))/); if(d) out.dong = d[1];
  var n = t.replace(/[^가-힣A-Za-z0-9]/g,'');
  out.name = n;
  return out;
}
function matchBuilding(row, ai){
  var hay = [row.name, row.bld, row.text].join(' ');
  var tk = bldgTokens(hay);
  var res = { bldg:'', addr:'', jibun:tk.jibun, dong:tk.dong, listings:[], landlords:[], how:[] };
  /* ① 임대인 명부에서 지번+건물명으로 */
  (DB.landlords||[]).forEach(function(L){
    var apt = sq(L.apt), addr = sq(L.addr);
    if(!apt && !addr) return;
    var hitJibun = tk.jibun && addr.indexOf(sq(tk.jibun)) >= 0;
    var hitName  = apt && hay.replace(/\s/g,'').indexOf(apt) >= 0;
    if(hitJibun && hitName){ res.landlords.push(L); if(res.how.indexOf('지번+건물명') < 0) res.how.push('지번+건물명'); }
    else if(hitJibun){ res.landlords.push(L); if(res.how.indexOf('지번') < 0) res.how.push('지번'); }
    else if(hitName && apt.length >= 3){ res.landlords.push(L); if(res.how.indexOf('건물명') < 0) res.how.push('건물명'); }
  });
  if(res.landlords.length){
    res.bldg = res.landlords[0].apt || '';
    res.addr = res.landlords[0].addr || '';
  }
  /* ② 매물장에서 같은 건물 */
  (DB.listings||[]).forEach(function(o){
    var apt = sq(o.apt);
    if(!apt) return;
    var byName = res.bldg && apt === sq(res.bldg);
    var byJibun = tk.jibun && sq(o.addr).indexOf(sq(tk.jibun)) >= 0;
    if(byName || byJibun) res.listings.push(o);
  });
  if(!res.bldg && res.listings.length) res.bldg = res.listings[0].apt || '';
  return res;
}
/* ═══ 판정 ═══════════════════════════════════════════════════════ */
function judge(ai, bm){
  var r = { code:'REVIEW_REQUIRED', why:'', unit:ai.unit, hit:null, changes:[] };
  if(!ai.unit){
    r.why = ai.unitCands ? ('호실 후보가 여러 개입니다(' + ai.unitCands.join(', ') + ')') : '호실을 읽지 못했습니다';
    return r;
  }
  if(!bm.bldg && !bm.landlords.length && !bm.listings.length){
    r.code = 'NEW_BUILDING'; r.why = '우리 자료에 이 건물이 없습니다'; return r;
  }
  var hits = bm.listings.filter(function(o){ return sq(o.addr2) === sq(ai.unit); });
  if(hits.length > 1){ r.code = 'REVIEW_REQUIRED'; r.why = '같은 호실이 매물장에 ' + hits.length + '건 있습니다'; return r; }
  if(!hits.length){
    r.code = 'NEW';
    r.why = '건물은 우리 자료에 있고(' + (bm.how.join('+') || '대조') + '), 그 호실 매물은 없습니다';
    return r;
  }
  r.hit = hits[0];
  var cmp = [['price', ai.deposit, '보증금'], ['rentAmt', ai.rent, '월세']];
  cmp.forEach(function(c){
    var was = String(r.hit[c[0]] == null ? '' : r.hit[c[0]]).trim();
    var now = String(c[1] || '').trim();
    if(now && was && now !== was) r.changes.push({ f:c[0], label:c[2], from:was, to:now });
  });
  if(r.changes.length){ r.code = 'CHANGE'; r.why = '기존 매물 ' + r.hit.id + ' 과 값이 다릅니다'; }
  else { r.code = 'SAME'; r.why = '기존 매물 ' + r.hit.id + ' 과 같습니다'; }
  return r;
}
/* ═══ 사진 — 드라이브 실측 인덱스(erp-photo-index.json)로 찾는다.
     🔴 같은 건물 다른 호실 사진을 그 호실 사진으로 쓰지 않는다. ═══════ */
var PIDX = null;
async function loadPhotoIndex(){
  if(PIDX) return PIDX;
  try{
    var r = await fetch('./erp-photo-index.json?t=' + Date.now());
    PIDX = await r.json();
  }catch(e){ PIDX = { error: String(e && e.message || e), index:{} }; }
  return PIDX;
}
/* 건물 폴더 찾기 — 지번이 가장 강한 근거, 건물명은 보조 */
function photoFindBuilding(bm, r){
  if(!PIDX || !PIDX.index) return null;
  var jib = sq(bm.jibun || '');
  var nm  = sq(bm.bldg || '');
  var hay = sq([r && r.name, r && r.bld, bm.bldg].join(' '));
  var byJibun = [], byName = [];
  Object.keys(PIDX.index).forEach(function(k){
    var v = PIDX.index[k];
    if(jib && sq(v.jibun) === jib) byJibun.push(v);
    else if(v.name && sq(v.name).length >= 3 && (nm === sq(v.name) || hay.indexOf(sq(v.name)) >= 0)) byName.push(v);
  });
  if(byJibun.length === 1) return { hit: byJibun[0], how: '지번' };
  if(byJibun.length > 1) return { multi: byJibun, how: '지번(여러 곳)' };
  if(byName.length === 1) return { hit: byName[0], how: '건물명' };
  if(byName.length > 1) return { multi: byName, how: '건물명(여러 곳)' };
  return null;
}
function judgePhoto(j, bm, ai, r){
  var p = { code:'PHOTO_REQUIRED', why:'', note:'', unit:null, others:[], common:0, bldFolder:'' };
  if(!PIDX){ p.code = 'REVIEW_REQUIRED'; p.why = '사진 자료를 아직 불러오지 못했습니다'; return p; }
  if(PIDX.error){ p.code = 'REVIEW_REQUIRED'; p.why = '사진 자료를 읽지 못했습니다: ' + PIDX.error; return p; }
  var f = photoFindBuilding(bm, r);
  if(!f){ p.code = 'PHOTO_REQUIRED'; p.why = '사진 보관함에 이 건물 폴더가 없습니다'; return p; }
  if(f.multi){
    p.code = 'REVIEW_REQUIRED';
    p.why = '같은 이름·지번의 건물 폴더가 ' + f.multi.length + '곳입니다 — 사람이 골라야 합니다';
    return p;
  }
  var b = f.hit;
  p.bldFolder = b.kind + ' / ' + b.dong + ' / ' + b.folder;
  p.common = b.common || 0;
  var unitKey = ai.unit ? sq(ai.unit) : '';
  Object.keys(b.units || {}).forEach(function(u){
    if(unitKey && sq(u) === unitKey) p.unit = { name:u, raw:b.units[u].raw, done:b.units[u].done };
    else p.others.push({ name:u, raw:b.units[u].raw, done:b.units[u].done });
  });
  if(!ai.unit){ p.code = 'REVIEW_REQUIRED'; p.why = '호실을 읽지 못해 호실 사진을 찾을 수 없습니다'; return p; }
  if(p.unit){
    /* 동일 건물 + 동일 호실 = EXACT_UNIT */
    if(p.unit.done > 0){
      p.code = 'PHOTO_READY';
      p.why = 'EXACT_UNIT — ' + p.unit.name + ' 보정완료 ' + p.unit.done + '장(광고 사용 가능)';
    } else {
      p.code = 'REVIEW_REQUIRED';
      p.why = 'EXACT_UNIT — ' + p.unit.name + ' 원본 ' + p.unit.raw + '장은 있으나 보정완료(워터마크) 0장입니다';
    }
    return p;
  }
  /* 같은 건물이지만 그 호실 사진은 없다 */
  if(p.common > 0){
    p.code = 'BUILDING_ONLY';
    p.why = '이 건물 공용부·외관 사진 ' + p.common + '장만 있습니다 — ' + ai.unit + ' 내부 사진은 없습니다';
  } else {
    p.code = 'PHOTO_REQUIRED';
    p.why = '이 건물 폴더에 ' + ai.unit + ' 사진이 없습니다' +
      (p.others.length ? (' (있는 호실: ' + p.others.map(function(o){ return o.name + ' ' + (o.raw + o.done) + '장'; }).join(' · ') + ')') : '');
  }
  p.note = '🔴 같은 건물의 다른 호실 사진은 이 호실 광고사진으로 쓰지 않습니다. ' +
           '건물 외관·공용부(BUILDING_ONLY)는 참고용일 뿐 호실 내부사진으로 올리지 않습니다.';
  return p;
}
/* ═══ 광고 — 사진 없으면 게시 차단 ═══ */
function judgeAd(ai, ph){
  var a = { code:'DATA_REQUIRED', why:'', blocked:true };
  var need = [];
  if(!ai.deposit) need.push('보증금');
  if(!ai.rent) need.push('월세');
  if(!ai.unit) need.push('호실');
  if(need.length){ a.code = 'DATA_REQUIRED'; a.why = '필수정보 부족: ' + need.join(' · '); return a; }
  if(ph.code !== 'PHOTO_READY'){ a.code = 'PHOTO_REQUIRED'; a.why = '광고에 쓸 수 있는 이 호실 사진이 없습니다'; return a; }
  a.code = 'AD_READY'; a.blocked = false; a.why = '필수정보·사진이 갖춰졌습니다';
  return a;
}

function kpi(label, n, cls, act){
  return '<button class="kpi ' + cls + '"' + (act ? ' onclick="' + act + '"' : ' disabled') + '>' +
    '<span>' + esc(label) + '</span><b>' + n + '</b></button>';
}
function go(m1, m2, src){
  CUR.m1 = m1; CUR.m2 = m2;
  if(src !== undefined) UI.src = src;
  drawNav(); route();
}

/* ── 통합 인입함 ── */
function inboxRows(){
  var rows = (DB.inbox || []).slice();
  if(UI.src) rows = rows.filter(function(r){ return srcOf(r.kind, r.text) === UI.src; });
  if(UI.st === 'un') rows = rows.filter(function(r){ return !r.reg; });
  if(UI.st === 'done') rows = rows.filter(function(r){ return !!r.reg; });
  if(UI.qq){
    var q = UI.qq.toLowerCase();
    rows = rows.filter(function(r){
      return [r.when, r.name, r.phone, r.bld, r.text].join(' ').toLowerCase().indexOf(q) >= 0;
    });
  }
  return rows;
}

/* ═══════════════════════════════════════════════════════════════════
   매물 접수 — 🔴 실제로 저장한다(신규 1건). 기존 매물은 건드리지 않는다.
   · 저장 직전에 시트를 다시 읽어 같은 건물·호실이 이미 있는지 확인한다
   · 사람이 확인창에서 눌러야만 보낸다
   · 단건 upsert 1회만 — 전체 저장(saveAll) 을 쓰지 않는다
   · 🔴 비밀번호 같은 민감정보는 어떤 칸에도 넣지 않는다
   ═══════════════════════════════════════════════════════════════════ */
var KIND_CODE = { '오픈형 원룸':'R', '분리형 원룸':'R', '빌라(투룸 이상)':'B', '아파트':'A',
                  '오피스텔':'R', '주택':'D', '상가':'S', '사무실':'F', '건물':'G',
                  '공장/창고':'C', '토지':'T', '기타':'X' };
var DEAD_ST = ['거래완료', '계약완료'];
var SAVING = false;
var LASTSAVE = null;

function pad2(n){ return (n < 10 ? '0' : '') + n; }
function todayStr(){
  var d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
}
function newListingId(kind, list){
  var p = KIND_CODE[kind] || 'X';
  var d = new Date();
  var ymd = String(d.getFullYear()).slice(2) + pad2(d.getMonth()+1) + pad2(d.getDate());
  var seq = 1, id;
  do { id = p + ymd + '-' + pad2(seq); seq++; }
  while(list.some(function(l){ return String(l.id) === id; }));
  return id;
}
function dupCheck(list, apt, addr2){
  var same = list.filter(function(o){
    return sq(o.apt) === sq(apt) && sq(o.addr2) === sq(addr2); });
  return { all: same, alive: same.filter(function(o){ return DEAD_ST.indexOf(String(o.status||'')) < 0; }) };
}
/* HEADERS 에 있는 칸만 채운다 — 새 DB 칸을 만들지 않는다 */
function buildListing(r, ai, bm, id){
  var nl = String.fromCharCode(10);
  var lines = ['[ERP 접수 ' + todayStr() + '] 출처 통화녹음 · 인입함 행' + r.row +
               ' (' + String(r.when||'').slice(0,16) + ')'];
  if(ai.feeIncluded) lines.push('관리비: 월세에 포함(통화) — 금액 미확인');
  if(ai.clean) lines.push('퇴실 청소비 ' + ai.clean + '만원(통화)');
  lines.push('사진: 이 호실 사진 없음 → 촬영 필요. 같은 건물 다른 호실 사진은 쓰지 않음');
  return {
    id: id,
    apt: bm.bldg || '',
    addr: bm.addr || '',
    addr2: ai.unit || '',
    type: ai.trade || '월세',
    kind: ai.kind || '',
    price: ai.deposit || '',
    rentAmt: ai.rent || '',
    status: '접수',
    recvDate: todayStr(),
    note: lines.join(nl),
    feeType: '', feeAmt: '', area: '', floor: '', totalFloor: '', rooms: '', baths: '',
    direction: '', availDate: '', cname: '', cphone: '', agent: ''
  };
}
async function erpSaveListing(rowId){
  var nl = String.fromCharCode(10);
  if(SAVING){ alert('저장 중입니다'); return; }
  var r = (DB.inbox||[]).filter(function(x){ return x.row === rowId; })[0];
  if(!r){ alert('그 인입 줄을 찾지 못했습니다'); return; }
  var ai = aiExtract(r.text);
  var bm = matchBuilding(r, ai);
  var j = judge(ai, bm);
  if(j.code !== 'NEW'){
    alert('지금은 신규(NEW) 후보만 접수합니다.' + nl + '판정: ' + j.code + ' — ' + j.why);
    return;
  }
  if(!ai.unit || !bm.bldg || !bm.addr){
    alert('건물·주소·호실이 모두 확인돼야 접수합니다.');
    return;
  }
  var fresh;
  try{
    var g = await jget({ action:'getAll', type:'listings' });
    fresh = g.data || g.result || [];
  }catch(e){ alert('매물장을 다시 읽지 못해 저장하지 않습니다: ' + (e && e.message || e)); return; }
  var before = fresh.length;
  var dup = dupCheck(fresh, bm.bldg, ai.unit);
  if(dup.alive.length){
    alert('이미 같은 건물·호실 매물이 있습니다 — 새로 만들지 않습니다.' + nl +
          dup.alive.map(function(o){ return o.id + ' · ' + o.status; }).join(nl));
    DB.listings = fresh; route(); return;
  }
  if(dup.all.length){
    if(!confirm('같은 건물·호실이 과거 자료로 ' + dup.all.length + '건 있습니다(' +
        dup.all.map(function(o){ return o.id + ' ' + o.status; }).join(', ') + ').' + nl +
        '지금은 살아 있는 매물이 아니라 새 회차로 만듭니다. 계속할까요?')) return;
  }
  var id = newListingId(ai.kind, fresh);
  var obj = buildListing(r, ai, bm, id);
  var msg = ['매물장에 새로 등록합니다', '',
    '매물번호  ' + id,
    '건물      ' + obj.apt,
    '주소      ' + obj.addr,
    '호실      ' + obj.addr2,
    '거래      ' + obj.type + ' / ' + (obj.kind || '(미확인)'),
    '보증금    ' + obj.price + '만',
    '월세      ' + obj.rentAmt + '만' + (ai.feeIncluded ? ' (관리비 포함)' : ''),
    '상태      ' + obj.status,
    '', '지금 매물 ' + before + '건 → ' + (before + 1) + '건',
    '🔴 사진이 없어 광고는 나가지 않습니다.',
    '🔴 비밀번호 등 민감정보는 저장하지 않습니다.', '', '이대로 등록할까요?'].join(nl);
  if(!confirm(msg)) return;

  SAVING = true;
  try{
    var u = gsUrl(), t = gsTok();
    var res = await fetch(u, { method:'POST', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({ action:'upsert', type:'listings', data: obj, token: t }) });
    var jj = await res.json();
    if(!jj || !jj.ok) throw new Error((jj && jj.error) || '저장 실패');
    var g2 = await jget({ action:'getAll', type:'listings' });
    var after = g2.data || g2.result || [];
    var made = after.filter(function(o){ return String(o.id) === id; });
    var dup2 = dupCheck(after, bm.bldg, ai.unit);
    DB.listings = after;
    LASTSAVE = { id:id, before:before, after:after.length, made:made.length,
                 dup:dup2.all.length, when:new Date().toTimeString().slice(0,8) };
    SAVING = false;
    route();
    alert(['등록했습니다 ✓', '',
      '매물번호  ' + id,
      '매물 건수 ' + before + ' → ' + after.length,
      '같은 호실 ' + dup2.all.length + '건(방금 만든 것 포함)',
      made.length === 1 ? '다시 읽어 1건 확인했습니다.'
                        : '🔴 다시 읽었더니 ' + made.length + '건입니다 — 확인이 필요합니다.'].join(nl));
  }catch(e){
    SAVING = false;
    route();
    alert('저장 실패 — 매물장은 그대로입니다.' + nl + String(e && e.message || e));
  }
}

/* ═══════════════════════════════════════════════════════════════════
   광고자동화 1차 — 🔴 실제 외부 게시는 하지 않는다.
   기존 CRM 규약을 그대로 쓴다(새로 만들지 않는다):
     · PLATFORMS 7채널 · STATUS_OFF_MARKET · ads 필드({on,no,url,at,chk,memo})
     · adSnapshot/adHash → 값이 바뀌면 '수정필요'
     · 당근 필수칸은 DAANGN_HEADERS 실측 규격에서 가져온다
   근거 없는 채널 규칙은 만들지 않고 '확인 전'이라고 적는다.
   ═══════════════════════════════════════════════════════════════════ */
var AD_CH = [
  { key:'daangn',   label:'당근',   dedup:'unit',    validDays:0,  bulk:true  },
  { key:'zigbang',  label:'직방',   dedup:'listing', validDays:30, bulk:false },
  { key:'dabang',   label:'다방',   dedup:'listing', validDays:30, bulk:false },
  { key:'naver',    label:'네이버', dedup:'listing', validDays:90, bulk:false },
  { key:'isj',      label:'이실장', dedup:'listing', validDays:0,  bulk:false },
  { key:'peterpan', label:'피터팬', dedup:'none',    validDays:0,  bulk:false },
  { key:'blog',     label:'블로그', dedup:'none',    validDays:0,  bulk:false }
];
var AD_GOAL = ['daangn','zigbang','dabang','naver'];   /* 진행률 분모가 되는 목표 채널 */
var STATUS_OFF = ['계약완료','임대중','거래완료','보류'];
var TAKEDOWN_ST = ['계약완료','임대중','거래완료'];

function adOf(o, k){ return (o && o.ads && o.ads[k]) || null; }
function adOn(o, k){ var a = adOf(o,k); return !!(a && a.on); }
function adLive(o){ return STATUS_OFF.indexOf(String(o.status||'')) < 0; }
function adSnapshot(o){
  var opt = Array.isArray(o.options) ? o.options.join(',') : String(o.options||'');
  return [o.type,o.price,o.rentAmt,o.area,o.rooms,o.baths,o.floor,o.totalFloor,
          o.feeAmt,o.availDate,opt,o.desc].join('¦');
}
function adHash(s){
  var h = 0; s = String(s==null?'':s);
  for(var i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) | 0;
  return String(h);
}
function adStale(o, k){
  var a = adOf(o,k);
  return !!(a && a.on && a.chk && a.chk !== adHash(adSnapshot(o)));
}
function adExpired(o, k){
  var ch = AD_CH.filter(function(c){ return c.key===k; })[0] || {};
  var a = adOf(o,k);
  if(!a || !a.on || !a.at || !ch.validDays) return false;
  var t = Date.parse(String(a.at).replace(/\./g,'-'));
  if(isNaN(t)) return false;
  return (Date.now() - t) > ch.validDays * 86400000;
}

/* ── 필수항목 — 있는 근거만 쓴다 ───────────────────────────────── */
var NEED_COMMON = [['kind','매물유형'],['type','거래유형'],['price','보증금/매매가'],
                   ['addr','주소'],['addr2','상세주소']];
var NEED_RENT   = [['rentAmt','월세']];
/* 🔴 당근 규격(DAANGN_HEADERS 실측) — 과거 누락 사고가 있던 칸 */
var NEED_DAANGN = [['area','면적'],['rooms','방 수'],['baths','욕실 수'],
                   ['floor','층'],['totalFloor','총 층']];
function adMissing(o, k){
  var need = NEED_COMMON.slice();
  if(['월세','연세','단기','단기임대'].indexOf(String(o.type||'')) >= 0) need = need.concat(NEED_RENT);
  if(k === 'daangn') need = need.concat(NEED_DAANGN);
  var miss = [];
  need.forEach(function(f){
    if(!String(o[f[0]] == null ? '' : o[f[0]]).trim()) miss.push(f[1]);
  });
  return miss;
}
/* 그 매물의 사진 상태(드라이브 실측 인덱스) */
function adPhotoOf(o){
  var bm = { bldg:o.apt, addr:o.addr, jibun:(String(o.addr||'').match(/(\d{1,5}-\d{1,4})/)||[])[1]||'' };
  return judgePhoto({ code:'SAME', hit:o }, bm, { unit:o.addr2 }, { name:o.apt, bld:o.apt, text:o.addr });
}
/* ── 채널 하나의 광고 상태 ─────────────────────────────────────── */
function adState(o, k, ph){
  var a = adOf(o,k);
  if(TAKEDOWN_ST.indexOf(String(o.status||'')) >= 0 && a && a.on)
    return { code:'TAKEDOWN_REQUIRED', why:'매물이 ' + o.status + ' 인데 광고가 올라가 있습니다', miss:[] };
  if(!adLive(o)) return { code:'REVIEW_REQUIRED', why:'광고 대상이 아닌 상태(' + (o.status||'') + ')', miss:[] };
  var miss = adMissing(o, k);
  if(a && a.on){
    if(adStale(o,k)) return { code:'POSTED', sub:'수정필요', why:'광고 올린 뒤 매물 값이 바뀌었습니다', miss:miss };
    if(adExpired(o,k)) return { code:'POSTED', sub:'갱신필요', why:'게시한 지 오래됐습니다', miss:miss };
    return { code:'POSTED', why:'게시 중' + (a.at ? (' · ' + a.at) : ''), miss:miss };
  }
  if(miss.length) return { code:'DATA_REQUIRED', why:'필수항목 부족', miss:miss };
  if(!ph || ph.code !== 'PHOTO_READY')
    return { code:'PHOTO_REQUIRED', why:(ph && ph.why) || '광고에 쓸 이 호실 사진이 없습니다', miss:[] };
  return { code:'AD_READY', why:'필수항목·사진이 갖춰졌습니다', miss:[] };
}
/* 매물 한 건의 채널 전체 */
function adRow(o){
  var ph = adPhotoOf(o);
  var byCh = {};
  AD_CH.forEach(function(c){ byCh[c.key] = adState(o, c.key, ph); });
  var goalDone = AD_GOAL.filter(function(k){ return byCh[k].code === 'POSTED'; }).length;

function adMoney(o){
  var t = String(o.type||'');
  if(t === '매매') return o.price ? (o.price + '만원') : '';
  if(!o.price && !o.rentAmt) return '';
  return (o.price||'?') + '/' + (o.rentAmt||'?');
}
function adFacts(o){
  var f = [];
  if(o.kind) f.push(o.kind);
  if(o.area) f.push('면적 ' + o.area);
  if(o.rooms) f.push('방 ' + o.rooms);
  if(o.baths) f.push('욕실 ' + o.baths);
  if(o.floor) f.push(o.floor + (o.totalFloor ? ('/' + o.totalFloor) : ''));
  if(o.direction) f.push(o.direction);
  if(o.feeAmt) f.push('관리비 ' + o.feeAmt + '만');
  if(o.parking) f.push('주차 ' + o.parking);
  if(o.availDate) f.push('입주 ' + o.availDate);
  return f;
}
function adCopy(o, k){
  var nl = String.fromCharCode(10);
  var money = adMoney(o);
  var head = [o.apt, o.addr2].filter(Boolean).join(' ');
  var facts = adFacts(o);
  var t = String(o.type||'');
  var title, body;
  if(k === 'daangn'){
    title = [head, t, money].filter(Boolean).join(' ');
    body = [head + (o.addr ? (' (' + o.addr + ')') : ''), t + ' ' + money,
            facts.join(' · '), '', '브리즈부동산중개'].filter(Boolean).join(nl);
  } else if(k === 'zigbang' || k === 'dabang'){
    title = [head, o.kind, t, money].filter(Boolean).join(' ');
    body = [head, t + ' ' + money, facts.join(' · '), '',
            '자세한 조건은 문의 주시면 안내드립니다.', '브리즈부동산중개'].filter(Boolean).join(nl);
  } else if(k === 'naver'){
    title = [o.apt, o.kind, t, money].filter(Boolean).join(' ');
    body = [facts.join(' · '), o.addr].filter(Boolean).join(nl);
  } else if(k === 'blog'){
    title = [o.apt, o.addr2, t, money].filter(Boolean).join(' ') + ' 매물 안내';
    body = [head + ' ' + t + ' ' + money, '', facts.map(function(x){ return '· ' + x; }).join(nl),
            '', '문의: 브리즈부동산중개'].filter(Boolean).join(nl);
  } else {
    title = [head, t, money].filter(Boolean).join(' ');
    body = [head, t + ' ' + money, facts.join(' · ')].filter(Boolean).join(nl);
  }
  /* 🔴 민감정보·과장표현은 넣지 않는다 */
  return { title: maskSecret(title), body: maskSecret(body),
           missing: adMissing(o, k) };
}

function photoTasks(){

   🔴 PaidAt 은 사람이 확인해 적는 날짜다(은행 연동 아님). 빈 칸은 빈 칸으로 둔다.

  ['공제증서', '중개사고 배상'],
  ['계약서', '본계약서']

function ctDaysTo(d){
  var s = String(d || '').trim();
  if(!s) return null;
  var t = Date.parse(s.replace(/\./g, '-'));
  if(isNaN(t)) return null;
  return Math.round((t - Date.now()) / 86400000);
}
function ctMoney(v){
  var s = String(v == null ? '' : v).trim();
  return s ? (s + '만') : '';
}
/* 계약 상태 — 날짜와 수납으로만 판단한다. 없는 값을 추측하지 않는다. */
function ctState(c){
  var st = String(c.expStatus || '').trim();
  var dEnd = ctDaysTo(c.end), dBal = ctDaysTo(c.balanceDue);
  var paidBal = String(c.balancePaidAt || '').trim();
  if(st === '종료') return { code:'종료', cls:'p-mute' };
  if(!paidBal && dBal !== null && dBal < 0) return { code:'잔금 지남', cls:'p-bad' };
  if(!paidBal && dBal !== null && dBal <= 7) return { code:'잔금 임박', cls:'p-warn' };
  if(!paidBal && String(c.balanceAmt || '').trim()) return { code:'잔금 대기', cls:'p-warn' };
  if(dEnd !== null && dEnd < 0) return { code:'만기 지남', cls:'p-bad' };
  if(dEnd !== null && dEnd <= 60) return { code:'만기 임박', cls:'p-warn' };
  if(st === '연장') return { code:'연장 확정', cls:'p-ok' };
  return { code:'진행중', cls:'p-ok' };
}
function ctRows(){
  var list = (DB.contracts || []).slice();
  if(CT_FILT === 'bal') list = list.filter(function(c){
    var d = ctDaysTo(c.balanceDue);
    return !String(c.balancePaidAt||'').trim() && d !== null && d <= 7; });
  else if(CT_FILT === 'exp') list = list.filter(function(c){
    var d = ctDaysTo(c.end); return d !== null && d <= 60; });
  else if(CT_FILT === 'fee') list = list.filter(function(c){
    return String(c.feeAmt||'').trim() && !String(c.feePaidAt||'').trim(); });
  return list;
}

/* ═══════════════════════════════════════════════════════════════════
   계약등록 · 서류/특약 · 잔금·만기 · 회계정산 · 직원관리
   🔴 저장은 전부 단건 upsert(gsUpsertOne 과 같은 경로). saveAll 을 쓰지 않는다.
   🔴 계약 등록은 사람이 확인창을 눌러야 나간다. 문자·알림은 보내지 않는다.
   🔴 기존 contracts / contractDocuments 스키마만 쓴다(새 칸 0).
   ═══════════════════════════════════════════════════════════════════ */
var CT_SAVING = false, CT_LAST = null, CT_FORM = null, CT_DOCSTATE = {}, CT_SPEC = '';

function ctNewId(list){
  var d = new Date();
  var ymd = String(d.getFullYear()).slice(2) + pad2(d.getMonth()+1) + pad2(d.getDate());
  var seq = 1, id;
  do { id = 'C' + ymd + '-' + pad2(seq); seq++; }
  while((list||[]).some(function(c){ return String(c.id) === id; }));
  return id;
}
/* 단건 저장 — 어떤 표에도 같은 길을 쓴다 */
async function erpUpsert(type, obj){
  var u = gsUrl(), t = gsTok();
  if(!u || !t) throw new Error('구글시트 주소·토큰이 없습니다');
  var res = await fetch(u, { method:'POST', headers:{'Content-Type':'text/plain'},
    body: JSON.stringify({ action:'upsert', type:type, data:obj, token:t }) });
  var j = await res.json();
  if(!j || !j.ok) throw new Error((j && j.error) || '저장 실패');
  return j;
}

/* ── 계약 등록 ─────────────────────────────────────────────────── */

    type: o ? (o.type||'월세') : '월세', price: o ? (o.price||'') : '', rentAmt: o ? (o.rentAmt||'') : '',
    landlordName:'', landlordPhone:'', tenantName:'', tenantPhone:'',
    start:'', end:'', depositAmt:'', depositDue:'', interimAmt:'', interimDue:'',
    balanceAmt:'', balanceDue:'', feeAmt:'', agent:'', note:''
  };
  /* 임대인 명부에서 그 건물 임대인을 후보로 채워 준다(사람이 고친다) */

      return sq(L.apt) && sq(L.apt) === sq(o.apt); })[0];

function ctField(k, v){ if(CT_FORM) CT_FORM[k] = v; }
function ctFormMissing(){
  var f = CT_FORM || {}, miss = [];
  [['apt','건물'],['addr2','호실'],['type','거래유형'],['price','보증금/매매가'],
   ['landlordName','임대인 이름'],['tenantName','임차인 이름'],
   ['start','계약일'],['end','만기일']].forEach(function(x){
    if(!String(f[x[0]]||'').trim()) miss.push(x[1]);
  });
  if(['월세','연세','단기'].indexOf(String(f.type||'')) >= 0 && !String(f.rentAmt||'').trim())
    miss.push('월세');
  return miss;
}
async function ctSave(){
  if(CT_SAVING){ alert('저장 중입니다'); return; }
  var nl = String.fromCharCode(10);
  var miss = ctFormMissing();
  if(miss.length){ alert('아직 못 채운 것이 있습니다:' + nl + miss.join(' · ')); return; }
  /* 🔴 저장 직전에 계약 자료를 다시 읽어 중복을 본다 */
  var fresh;
  try{
    var g = await jget({ action:'getAll', type:'contracts' });
    fresh = g.data || g.result || [];
  }catch(e){ alert('계약 자료를 다시 읽지 못해 저장하지 않습니다: ' + (e && e.message || e)); return; }
  var f = CT_FORM;
  var dup = fresh.filter(function(c){
    return sq(c.apt) === sq(f.apt) && sq(c.addr2) === sq(f.addr2)
        && String(c.expStatus||'') !== '종료'; });
  if(dup.length){
    if(!confirm('같은 건물·호실에 끝나지 않은 계약이 ' + dup.length + '건 있습니다(' +
        dup.map(function(c){ return c.id; }).join(', ') + ').' + nl + '그래도 새로 만들까요?')) return;
  }
  var id = ctNewId(fresh);
  var obj = {
    id: id, listingId: f.listingId || '', apt: f.apt, addr2: f.addr2,
    type: f.type, price: f.price, rentAmt: f.rentAmt || '',

  if(!confirm(msg)) return;

  CT_SAVING = true;

    await erpUpsert('contracts', obj);

    var made = after.filter(function(c){ return String(c.id) === id; });

                when:new Date().toTimeString().slice(0,8) };
    CT_FORM = null; CT_SEL = id; CT_TAB = '기본';

    route();
    alert('저장 실패 — 계약 자료는 그대로입니다.' + nl + String(e && e.message || e));
  }
}

/* ── 잔금·만기 ─────────────────────────────────────────────────── */
function ctSchedule(){
  var out = [];
  (DB.contracts||[]).forEach(function(c){
    [['계약금', c.depositAmt, c.depositDue, c.depositPaidAt],
     ['중도금', c.interimAmt, c.interimDue, c.interimPaidAt],
     ['잔금',  c.balanceAmt, c.balanceDue, c.balancePaidAt]].forEach(function(p){
      if(!String(p[2]||'').trim()) return;
      out.push({ c:c, kind:p[0], amt:p[1], due:p[2], paid:p[3], d:ctDaysTo(p[2]) });
    });
    if(String(c.end||'').trim())
      out.push({ c:c, kind:'만기', amt:'', due:c.end, paid:'', d:ctDaysTo(c.end) });
  });
  out.sort(function(a,b){ return (a.d===null?9999:a.d) - (b.d===null?9999:b.d); });
  return out;
}

    CT_FORM.type = o.type || '월세'; CT_FORM.price = o.price || ''; CT_FORM.rentAmt = o.rentAmt || '';
    var ld = (DB.landlords||[]).filter(function(L){ return sq(L.apt) && sq(L.apt) === sq(o.apt); })[0];
    if(ld && !CT_FORM.landlordName){ CT_FORM.landlordName = ld.name || ''; CT_FORM.landlordPhone = ld.phone || ''; }
  }
  route();
}

/* ── 라우팅 ── */
var SEARCH = '';
function route(){
  var m = document.getElementById('main');
  if(SEARCH){ m.innerHTML = viewSearch(SEARCH); bindBar(); return; }
  if(DB.loading && !DB.inbox){ m.innerHTML = crumb() + '<div class="card"><div class="empty">불러오는 중…</div></div>'; return; }
  if(CUR.m2 === 'today') m.innerHTML = viewToday();
  else if(CUR.m2 === 'inbox') m.innerHTML = viewInbox();
  else if(CUR.m2 === 'admgr') m.innerHTML = viewAd();
  else if(CUR.m2 === 'photo') m.innerHTML = viewPhoto();
  else if(CUR.m2 === 'settle') m.innerHTML = viewSettle();
  else if(CUR.m2 === 'staff') m.innerHTML = viewStaff();
  else if(CUR.m2 === 'contract'){
    if(DB.contracts === null){
      m.innerHTML = crumb() + '<div class="h1row"><h1>계약</h1></div>' +
        '<div class="card"><div class="empty">계약 자료를 불러오는 중…</div></div>';
      loadContracts();
    } else m.innerHTML = viewContract();
  }
  else {
    var g = MENU.filter(function(x){ return x[0]===CUR.m1; })[0];
    var s = g[2].filter(function(x){ return x[0]===CUR.m2; })[0];
    m.innerHTML = crumb() + '<div class="h1row"><h1>' + esc(s[1]) + '</h1></div>' +
      '<div class="card"><div class="soonbox"><b>준비 중입니다</b>' +
      '<div>이 메뉴는 아직 붙이지 않았습니다. 지금은 <b>영업CRM › 통합 인입함</b>이 실제로 동작합니다.</div>' +
      '<div style="margin-top:12px"><button class="btn pri" onclick="go(\'crm\',\'inbox\')">통합 인입함으로</button>' +
      ' <button class="btn" onclick="location.href=\'./saas.html\'">기존 SaaS 화면</button></div>' +
      '</div></div>';
  }
  bindBar();
  drawSide();
}
function bindBar(){
  var fq = document.getElementById('fq');
  if(fq) fq.oninput = function(){ UI.qq = fq.value; var p = fq.selectionStart; route();
    var n = document.getElementById('fq'); if(n){ n.focus(); try{ n.setSelectionRange(p,p); }catch(e){} } };
  var fs = document.getElementById('fsrc');
  if(fs) fs.onchange = function(){ UI.src = fs.value; route(); };
  var ft = document.getElementById('fst');
  if(ft) ft.onchange = function(){ UI.st = ft.value; route(); };
}
async function reload(){ await loadAll(true); route(); }
/* 계약 자료는 계약 화면에 들어갈 때만 부른다 — 첫 화면을 무겁게 하지 않는다.
   🔴 여기서 실패해도 DB.err 를 세우지 않는다(다른 화면이 멀쩡해야 한다). */
var CT_LOADING = false;
async function loadContracts(){
  if(DB.contracts !== null || CT_LOADING) return;
  CT_LOADING = true;
  try{
    var d = await jget({ action:'getAll', type:'contracts' });
    DB.contracts = d.data || d.result || [];
  }catch(e){
    DB.contracts = [];
    DB.ctErr = String((e && e.message) || e);
  }
  CT_LOADING = false;
  route();
}

/* 통합검색 */
document.getElementById('q').addEventListener('keydown', function(e){
  if(e.key === 'Enter'){ SEARCH = this.value.trim(); route(); }
  if(e.key === 'Escape'){ this.value = ''; SEARCH = ''; route(); }
});
document.getElementById('q').addEventListener('input', function(){
  if(!this.value.trim() && SEARCH){ SEARCH = ''; route(); }
});
document.getElementById('btnHelp').onclick = function(){ UI.help = !UI.help; route(); };
['btnAi','btnBell','btnRecent','btnFav','btnOut'].forEach(function(id){
  document.getElementById(id).onclick = function(){ alert('이 기능은 다음 단계에서 붙입니다.'); };
});

/* ── 버전 표시 — 실제 배포와 화면이 어긋나지 않게 원격 커밋을 읽는다 ── */
async function stamp(){
  var el = document.createElement('div');
  el.className = 'foot';
  el.id = 'verline';
  el.textContent = 'ERP ' + ERP_VER + ' · 빌드 ' + ERP_BUILD + ' · commit 확인 중…';
  document.getElementById('main').appendChild(el);
  var txt = 'ERP ' + ERP_VER + ' · 빌드 ' + ERP_BUILD;
  try{
    var r = await fetch('https://api.github.com/repos/' + REPO + '/commits/main');
    var j = await r.json();
    if(j && j.sha){
      var d = ((j.commit||{}).committer||{}).date || '';
      txt += ' · commit ' + String(j.sha).slice(0,7) + (d ? ' · 배포 ' + d.replace('T',' ').replace('Z',' UTC') : '');
    }
  }catch(e){ txt += ' · commit (조회 실패 — 네트워크)'; }
  window.__VER = txt;
  var n = document.getElementById('verline');
  if(n) n.textContent = txt;
}
var _route = route;
route = function(){ _route(); if(window.__VER){
  var el = document.createElement('div'); el.className='foot'; el.textContent = window.__VER;
  document.getElementById('main').appendChild(el); } };

(async function(){
  drawNav();
  route();
  await loadPhotoIndex();
  await loadAll(false);
  route();
  stamp();
})();
</script>
